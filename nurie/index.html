<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しゃしんでぬりえ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: 1列。上に絵、すぐ下に色、いちばん下に写真の取り込みと調整。子どもが押すボタンは大きく */
:root{
  --bg:#fdf7e8; --surface:#ffffff; --ink:#2b2a33; --muted:#6a6875; --line:#e3d9bf;
  --accent:#2f6fde; --accent-ink:#ffffff;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1b22; --surface:#27262f; --ink:#f1eee6; --muted:#aba8b8; --line:#3b3946;
    --accent:#7aa5ff; --accent-ink:#10131c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1b22; --surface:#27262f; --ink:#f1eee6; --muted:#aba8b8; --line:#3b3946;
  --accent:#7aa5ff; --accent-ink:#10131c; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;margin:0;line-height:1.3}
p{margin:0}
.lead{color:var(--muted);font-size:.9rem}
.stage{background:#ffffff;border:2px solid var(--line);border-radius:12px;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.swatch{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);padding:0;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button.btn,label.btn{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:1rem;margin:0}
.slider{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted)}
input[type=range]{width:100%}
.cambox{display:flex;flex-direction:column;gap:10px}
video{width:100%;border-radius:10px;background:#000;display:block}
select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:8px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.msg{font-size:.85rem;color:var(--muted);min-height:1.4em}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>しゃしんでぬりえ</h1>
    <p class="lead">紙のぬりえを写真にとると、画面の上でぬれます。色をえらんで、ぬりたいところをタッチ。</p>
  </header>

  <div class="stage"><canvas id="cv" width="800" height="600" aria-label="ぬりえ"></canvas></div>

  <div class="palette" id="palette" role="group" aria-label="いろ"></div>

  <div class="row">
    <button class="btn" id="undo" type="button" disabled>ひとつもどす</button>
    <button class="btn" id="clear" type="button">ぜんぶけす</button>
    <button class="btn" id="save" type="button">ほぞんする</button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>

  <section class="panel">
    <h2>おうちの人へ：写真をとりこむ</h2>
    <div class="row">
      <button class="btn primary" id="camopen" type="button">カメラでとる</button>
      <input class="visually-hidden" id="cam" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
      <label class="btn" for="file">写真をえらぶ<input class="visually-hidden" id="file" type="file" accept="image/*"></label>
      <button class="btn" id="sample" type="button">見本の絵にもどす</button>
    </div>
    <div class="cambox" id="cambox" hidden>
      <video id="video" playsinline muted></video>
      <div class="row">
        <button class="btn primary" id="shoot" type="button">とる</button>
        <button class="btn" id="camclose" type="button">やめる</button>
      </div>
    </div>
    <label class="slider" for="mode">とりこみ方
      <select id="mode">
        <option value="line">ぬりえ・線でかいた絵</option>
        <option value="illust">絵本・色のついたイラスト（線をつくる）</option>
        <option value="photo">ふつうの写真（線をつくる）</option>
      </select>
    </label>
    <label class="slider" for="thr">線のひろい方（色がはみ出すときは右へ、線が太すぎるときは左へ）
      <input id="thr" type="range" min="55" max="95" value="78">
    </label>
    <label class="slider" for="gap">線のすきまをふさぐ（色がもれるときは右へ）
      <input id="gap" type="range" min="0" max="4" value="1">
    </label>
  </section>

  <footer>
    <p>写真はこの端末の中だけで処理します。どこにも送信・保存しません。</p>
    <p>明るい場所で、紙を真上からとるときれいに線がひろえます。</p>
    <p>ふつうの写真は、りんかくから線をつくります。形がはっきりした写真ほどうまくいきます。こまかい模様や暗い写真は苦手です。</p>
    <p>ご自身で用意したぬりえや絵本を、ご家庭で楽しむためにお使いください。とりこんだ絵を配ったり売ったりはできません。</p>
  </footer>
</div>

<script>
/* ---- 画像処理（画面に依存しない関数） ---- */
// 周囲の明るさで割って、影や紙の色を消す。戻り値は 0（線）〜255（紙）
function normalize(lum, w, h) {
  var r = Math.max(8, Math.round(Math.min(w, h) / 24)), W = w + 1;
  var integ = new Float64Array(W * (h + 1));
  for (var y = 0; y < h; y++) {
    var rowSum = 0;
    for (var x = 0; x < w; x++) {
      rowSum += lum[y * w + x];
      integ[(y + 1) * W + x + 1] = integ[y * W + x + 1] + rowSum;
    }
  }
  var out = new Uint8ClampedArray(w * h);
  for (var y2 = 0; y2 < h; y2++) {
    var y0 = Math.max(0, y2 - r), y1 = Math.min(h, y2 + r + 1);
    for (var x2 = 0; x2 < w; x2++) {
      var x0 = Math.max(0, x2 - r), x1 = Math.min(w, x2 + r + 1);
      var sum = integ[y1 * W + x1] - integ[y0 * W + x1] - integ[y1 * W + x0] + integ[y0 * W + x0];
      var mean = sum / ((x1 - x0) * (y1 - y0)) || 1;
      out[y2 * w + x2] = Math.min(255, (lum[y2 * w + x2] / mean) * 255);
    }
  }
  return out;
}
// 線（ぬれない場所）の地図を作る。grow でまわりに太らせて、すきまをふさぐ
function makeBarrier(norm, w, h, thrPct, grow) {
  var t = thrPct * 2.55, b = new Uint8Array(w * h), i;
  for (i = 0; i < b.length; i++) b[i] = norm[i] < t ? 1 : 0;
  for (var g = 0; g < grow; g++) {
    var nb = new Uint8Array(b);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      i = y * w + x;
      if (b[i]) continue;
      if ((x > 0 && b[i - 1]) || (x < w - 1 && b[i + 1]) || (y > 0 && b[i - w]) || (y < h - 1 && b[i + w])) nb[i] = 1;
    }
    b = nb;
  }
  return b;
}
// タッチした場所から、線にぶつかるまで広げる。ぬった画素の番号を返す
function floodRegion(barrier, w, h, sx, sy) {
  var start = sy * w + sx;
  if (sx < 0 || sy < 0 || sx >= w || sy >= h || barrier[start]) return null;
  var seen = new Uint8Array(w * h), stack = [start], out = [];
  seen[start] = 1;
  while (stack.length) {
    var i = stack.pop(), x = i % w;
    out.push(i);
    if (x > 0 && !seen[i - 1] && !barrier[i - 1]) { seen[i - 1] = 1; stack.push(i - 1); }
    if (x < w - 1 && !seen[i + 1] && !barrier[i + 1]) { seen[i + 1] = 1; stack.push(i + 1); }
    if (i >= w && !seen[i - w] && !barrier[i - w]) { seen[i - w] = 1; stack.push(i - w); }
    if (i < w * (h - 1) && !seen[i + w] && !barrier[i + w]) { seen[i + w] = 1; stack.push(i + w); }
  }
  // 線の下にも色をしみこませて、白いふちが残らないようにする
  var edge = out;
  for (var pass = 0; pass < 4; pass++) {
    var next = [];
    for (var k = 0; k < edge.length; k++) {
      var j = edge[k], xx = j % w, n;
      n = j - 1; if (xx > 0 && !seen[n]) { seen[n] = 1; next.push(n); }
      n = j + 1; if (xx < w - 1 && !seen[n]) { seen[n] = 1; next.push(n); }
      n = j - w; if (j >= w && !seen[n]) { seen[n] = 1; next.push(n); }
      n = j + w; if (j < w * (h - 1) && !seen[n]) { seen[n] = 1; next.push(n); }
    }
    for (var m = 0; m < next.length; m++) out.push(next[m]);

}
// ふつうの写真から、りんかくの線を取り出す。戻り値は 0（線）〜255（紙）
function photoToLines(lum, w, h) {
  var r = Math.max(1, Math.round(Math.min(w, h) / 260)), W = w + 1, x, y, i;
  var integ = new Float64Array(W * (h + 1));
  for (y = 0; y < h; y++) { var rs = 0; for (x = 0; x < w; x++) { rs += lum[y * w + x]; integ[(y + 1) * W + x + 1] = integ[y * W + x + 1] + rs; } }
  var bl = new Float32Array(w * h);
  for (y = 0; y < h; y++) { var y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
    for (x = 0; x < w; x++) { var x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
      bl[y * w + x] = (integ[y1 * W + x1] - integ[y0 * W + x1] - integ[y1 * W + x0] + integ[y0 * W + x0]) / ((x1 - x0) * (y1 - y0)); } }
  var mag = new Float32Array(w * h), hist = new Uint32Array(1024);
  for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) {
    i = y * w + x;
    var gx = bl[i - w + 1] + 2 * bl[i + 1] + bl[i + w + 1] - bl[i - w - 1] - 2 * bl[i - 1] - bl[i + w - 1];
    var gy = bl[i + w - 1] + 2 * bl[i + w] + bl[i + w + 1] - bl[i - w - 1] - 2 * bl[i - w] - bl[i - w + 1];
    var m = Math.sqrt(gx * gx + gy * gy); mag[i] = m; hist[Math.min(1023, m | 0)]++;
  }
  // なだらかな明るさの変化は線にしない（下位60%を基準に切り捨て）。上位4%を「はっきりした線」とみなす
  var total = (w - 2) * (h - 2), acc = 0, p60 = 0, p96 = 1023, got60 = false;
  for (i = 0; i < 1024; i++) { acc += hist[i]; if (!got60 && acc >= total * 0.6) { p60 = i; got60 = true; } if (acc >= total * 0.96) { p96 = i; break; } }
  var floor = Math.max(4, p60 * 1.5 + 2), gain = 230 / Math.max(8, p96 - floor), out = new Uint8ClampedArray(w * h).fill(255);
  for (i = 0; i < w * h; i++) out[i] = 255 - Math.max(0, Math.min(255, (mag[i] - floor) * gain));
  return out;
}
// 絵本やイラスト（色がべたぬりの絵）から、色の境目と黒い輪郭を線にする。戻り値は 0（線）〜255（紙）
function illustToLines(rgba, w, h, k) {
  k = k || 10;
  var n = w * h, i, j, c, x, y;
  // 1) 軽くぼかして、紙の細かいざらつきを消す
  var R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    var sr = 0, sg = 0, sb = 0, cnt = 0;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      var q = (yy * w + xx) * 4; sr += rgba[q]; sg += rgba[q + 1]; sb += rgba[q + 2]; cnt++;
    }
    i = y * w + x; R[i] = sr / cnt; G[i] = sg / cnt; B[i] = sb / cnt;
  }
  // 2) 色を k 色にまとめる（k-means。見本の画素だけで中心を決める）
  // はじめの中心は「いちばん離れた色」を順に選ぶ（目立つ小さな色も拾える）
  var step = Math.max(1, Math.floor(n / 20000)), cent = [], samp = [];
  for (i = 0; i < n; i += step) samp.push(i);
  var far = new Float64Array(samp.length).fill(1e18), pick = samp[Math.floor(samp.length / 2)];
  for (c = 0; c < k; c++) {
    var cur = pick; cent.push([R[cur], G[cur], B[cur]]);
    var bestD = -1;
    for (j = 0; j < samp.length; j++) {
      var si = samp[j], f0 = R[si] - R[cur], f1 = G[si] - G[cur], f2 = B[si] - B[cur], fd = f0 * f0 + f1 * f1 + f2 * f2;
      if (fd < far[j]) far[j] = fd;
      if (far[j] > bestD) { bestD = far[j]; pick = si; }
    }
    if (bestD < 30 * 30) break; // もう似た色しか残っていない
  }
  k = cent.length;
  for (var it = 0; it < 10; it++) {
    var acc = []; for (c = 0; c < k; c++) acc.push([0, 0, 0, 0]);
    for (i = 0; i < n; i += step) {
      var best = 0, bd = 1e18;
      for (c = 0; c < k; c++) { var d0 = R[i] - cent[c][0], d1 = G[i] - cent[c][1], d2 = B[i] - cent[c][2], dd = d0 * d0 + d1 * d1 + d2 * d2; if (dd < bd) { bd = dd; best = c; } }
      acc[best][0] += R[i]; acc[best][1] += G[i]; acc[best][2] += B[i]; acc[best][3]++;
    }
    for (c = 0; c < k; c++) if (acc[c][3]) cent[c] = [acc[c][0] / acc[c][3], acc[c][1] / acc[c][3], acc[c][2] / acc[c][3]];
  }
  // 近すぎる色（グラデーションの帯など）は1つにまとめる
  var merged = [];
  cent.forEach(function (cc) {
    for (var m = 0; m < merged.length; m++) { var g0 = cc[0] - merged[m][0], g1 = cc[1] - merged[m][1], g2 = cc[2] - merged[m][2]; if (g0 * g0 + g1 * g1 + g2 * g2 < 42 * 42) return; }
    merged.push(cc);
  });
  cent = merged; k = cent.length;
  var lab = new Uint8Array(n);
  for (i = 0; i < n; i++) {
    var b2 = 0, bd2 = 1e18;
    for (c = 0; c < k; c++) { var e0 = R[i] - cent[c][0], e1 = G[i] - cent[c][1], e2 = B[i] - cent[c][2], ee = e0 * e0 + e1 * e1 + e2 * e2; if (ee < bd2) { bd2 = ee; b2 = c; } }
    lab[i] = b2;
  }
  // 3) まわりで一番多い色にそろえて、小さな点やにじみを消す（2回）
  for (var pass = 0; pass < 2; pass++) {
    var nl = new Uint8Array(lab), cntk = new Uint16Array(k);
    for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) {
      cntk.fill(0);
      for (var ay = -1; ay <= 1; ay++) for (var ax = -1; ax <= 1; ax++) cntk[lab[(y + ay) * w + x + ax]]++;
      var bm = lab[y * w + x], bc = 0; for (c = 0; c < k; c++) if (cntk[c] > bc) { bc = cntk[c]; bm = c; }
      if (bc >= 5) nl[y * w + x] = bm;
    }
    lab = nl;
  }
  // 4) 色の境目と、もともと暗い輪郭を線にする
  var out = new Uint8ClampedArray(n).fill(255);
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    i = y * w + x;
    var lum = 0.299 * R[i] + 0.587 * G[i] + 0.114 * B[i];
    var edge = (x < w - 1 && lab[i] !== lab[i + 1]) || (y < h - 1 && lab[i] !== lab[i + w]);
    if (edge || lum < 60) out[i] = 0;
  }
  return out;
}
// 線の絵かどうかを見分ける（紙の白が大半で、暗い線が少しだけ）
function looksLikeLineArt(norm, lum, rgba) {
  var dark = 0, mid = 0, n = norm.length, i, hist = new Uint32Array(256);
  // 色がたくさん使われている絵は、線の絵ではない（紙が黄ばんだ程度の色は数えない）
  if (rgba) {
    var colorful = 0;
    for (i = 0; i < n; i++) { var q = i * 4, mx = Math.max(rgba[q], rgba[q + 1], rgba[q + 2]), mn = Math.min(rgba[q], rgba[q + 1], rgba[q + 2]); if (mx - mn > 45) colorful++; }
    if (colorful / n > 0.12) return false;
  }
  for (i = 0; i < n; i++) { if (norm[i] < 150) dark++; else if (norm[i] < 235) mid++; hist[Math.min(255, lum[i] | 0)]++; }
  // 紙の明るさ（上位2割）にくらべて暗いのに線ではない場所＝ぬりつぶされた面。多ければ写真
  var acc = 0, bright = 255;
  for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= n * 0.2) { bright = i; break; } }
  var filled = 0;
  for (i = 0; i < n; i++) if (lum[i] < bright * 0.6 && norm[i] > 200) filled++;
  return dark / n < 0.3 && mid / n < 0.3 && filled / n < 0.08;
}
if (typeof module !== 'undefined') module.exports = { normalize: normalize, makeBarrier: makeBarrier, floodRegion: floodRegion, photoToLines: photoToLines, illustToLines: illustToLines, looksLikeLineArt: looksLikeLineArt };

/* ---- 画面 ---- */
if (typeof document !== 'undefined') (function () {
  var COLORS = ['#e53935','#fb8c00','#fdd835','#7cb342','#00897b','#29b6f6','#1e53c6','#8e44ad','#f48fb1','#8d6e63','#f6cfa4','#9e9e9e','#2b2a33','#ffffff'];
  var NAMES = ['あか','オレンジ','きいろ','きみどり','みどり','みずいろ','あお','むらさき','ピンク','ちゃいろ','はだいろ','はいいろ','くろ','しろ（けす）'];
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  var msg = document.getElementById('msg'), thr = document.getElementById('thr'), gap = document.getElementById('gap');
  var undoBtn = document.getElementById('undo');
  var w = 0, h = 0, norm = null, barrier = null, paint = null, history = [], color = COLORS[0];
  var rgbaKeep = null, lumKeep = null, mode = 'line', modeSel = document.getElementById('mode');

  function say(t) { msg.textContent = t; }
  function hexToRgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

  function render() {
    var img = ctx.createImageData(w, h), d = img.data;
    for (var i = 0, p = 0; i < w * h; i++, p += 4) {
      // 線は少し濃く見せる
      var v = norm[i] / 255; v = v > 0.92 ? 1 : v * v;
      d[p] = paint[p] * v; d[p + 1] = paint[p + 1] * v; d[p + 2] = paint[p + 2] * v; d[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function rebuild() { barrier = makeBarrier(norm, w, h, Number(thr.value), Number(gap.value)); }
  function blank() {
    paint = new Uint8ClampedArray(w * h * 4).fill(255);
    history = []; undoBtn.disabled = true;
  }
  function load(source, sw, sh, forceMode) {
    var scale = Math.min(1, 1000 / Math.max(sw, sh));
    w = Math.max(1, Math.round(sw * scale)); h = Math.max(1, Math.round(sh * scale));
    cv.width = w; cv.height = h;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(source, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data, lum = new Float32Array(w * h);
    for (var i = 0, p = 0; i < w * h; i++, p += 4) lum[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    lumKeep = lum; rgbaKeep = new Uint8ClampedArray(d);
    var asLine = normalize(lum, w, h);
    if (forceMode) mode = forceMode; else mode = looksLikeLineArt(asLine, lum, d) ? 'line' : 'illust';
    modeSel.value = mode;
    norm = mode === 'line' ? asLine : makeNorm(mode);
    rebuild(); blank(); render();
  }
  function makeNorm(m) {
    if (m === 'line') return normalize(lumKeep, w, h);
    if (m === 'illust') return illustToLines(rgbaKeep, w, h, 10);
    return photoToLines(lumKeep, w, h);
  }
  function modeMsg() { return mode === 'line' ? 'とりこんだよ。ぬりたいところをタッチしてね。' : mode === 'illust' ? '絵の色の境目から線をつくったよ。ぬりたいところをタッチしてね。' : '写真から線をつくったよ。ぬりたいところをタッチしてね。'; }
  function remode() {
    if (!lumKeep) return;
    mode = modeSel.value;
    norm = makeNorm(mode);
    rebuild(); blank(); render();
    say(modeMsg());
  }
  function drawSample() {
    var c = document.createElement('canvas'); c.width = 800; c.height = 600;
    var g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 800, 600);
    g.strokeStyle = '#111111'; g.lineWidth = 7; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 470); g.quadraticCurveTo(400, 420, 800, 470); g.stroke();            // じめん
    g.strokeRect(250, 290, 300, 175);                                                                 // いえ
    g.beginPath(); g.moveTo(220, 290); g.lineTo(400, 150); g.lineTo(580, 290); g.closePath(); g.stroke(); // やね
    g.strokeRect(370, 360, 60, 105);                                                                  // ドア
    g.strokeRect(280, 325, 60, 55); g.strokeRect(460, 325, 60, 55);                                   // まど
    g.beginPath(); g.arc(660, 110, 55, 0, Math.PI * 2); g.stroke();                                   // たいよう
    for (var a = 0; a < 8; a++) { var t = a * Math.PI / 4; g.beginPath(); g.moveTo(660 + Math.cos(t) * 72, 110 + Math.sin(t) * 72); g.lineTo(660 + Math.cos(t) * 98, 110 + Math.sin(t) * 98); g.stroke(); }
    g.beginPath(); g.arc(120, 120, 34, Math.PI * 0.5, Math.PI * 1.5); g.arc(165, 100, 44, Math.PI, 0); g.arc(215, 120, 34, Math.PI * 1.5, Math.PI * 0.5); g.closePath(); g.stroke(); // くも
    g.beginPath(); g.moveTo(120, 462); g.lineTo(120, 385); g.stroke();                                // はな
    for (var k = 0; k < 5; k++) { var u = k * Math.PI * 2 / 5 - Math.PI / 2; g.beginPath(); g.arc(120 + Math.cos(u) * 27, 355 + Math.sin(u) * 27, 17, 0, Math.PI * 2); g.stroke(); }
    g.beginPath(); g.arc(120, 355, 13, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill(); g.stroke();
    load(c, 800, 600, 'line');
  }

  // いろ
  var pal = document.getElementById('palette');
  COLORS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.id = 'c' + i; b.style.background = c;
    b.setAttribute('aria-label', NAMES[i]); b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', function () {
      color = c;
      Array.prototype.forEach.call(pal.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
    pal.appendChild(b);
  });

  // ぬる
  // 指1本で「トン」とさわったときだけぬる。2本指のズームや、なぞって動かしたときはぬらない
  var touches = {}, tapOk = false, tapStart = null;
  cv.addEventListener('pointerdown', function (e) {
    touches[e.pointerId] = true;
    if (Object.keys(touches).length === 1) { tapOk = true; tapStart = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() }; }
    else tapOk = false;
  });
  cv.addEventListener('pointermove', function (e) {
    if (tapStart && e.pointerId === tapStart.id && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 12) tapOk = false;
  });
  function endTouch(e) { delete touches[e.pointerId]; }
  cv.addEventListener('pointercancel', function (e) { endTouch(e); tapOk = false; });
  cv.addEventListener('pointerleave', function (e) { endTouch(e); });
  cv.addEventListener('pointerup', function (e) {
    endTouch(e);
    var ok = tapOk && tapStart && e.pointerId === tapStart.id && Date.now() - tapStart.t < 600 && Object.keys(touches).length === 0;
    tapOk = false;
    if (!ok) return;
    var r = cv.getBoundingClientRect();
    var x = Math.floor((e.clientX - r.left) * w / r.width), y = Math.floor((e.clientY - r.top) * h / r.height);
    var region = floodRegion(barrier, w, h, x, y);
    if (!region) { say('そこは線のうえだよ。となりをタッチしてみてね。'); return; }
    if (region.length > w * h * 0.9) say('ぜんぶぬれちゃった？ 下の「線のすきまをふさぐ」を右にしてみてね。'); else say('');
    history.push(new Uint8ClampedArray(paint)); if (history.length > 8) history.shift();
    undoBtn.disabled = false;
    var rgb = hexToRgb(color);
    for (var k = 0; k < region.length; k++) { var p = region[k] * 4; paint[p] = rgb[0]; paint[p + 1] = rgb[1]; paint[p + 2] = rgb[2]; }
    render();
  });
  undoBtn.addEventListener('click', function () {
    if (!history.length) return;
    paint = history.pop(); undoBtn.disabled = !history.length; render(); say('');
  });
  document.getElementById('clear').addEventListener('click', function () { blank(); render(); say('ぜんぶけしたよ。'); });
  document.getElementById('save').addEventListener('click', function () {
    cv.toBlob(function (blob) {
      if (!blob) { say('ほぞんできませんでした。絵を長おししてほぞんしてね。'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'nurie.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      say('ほぞんしたよ。できないときは、絵を長おししてね。');
    }, 'image/png');
  });

  // 写真
  function onPick(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () { load(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); say(modeMsg()); };
    img.onerror = function () { URL.revokeObjectURL(url); say('この写真はひらけませんでした。べつの写真でためしてね。'); };
    img.src = url; e.target.value = '';
  }
  document.getElementById('file').addEventListener('change', onPick);
  document.getElementById('cam').addEventListener('change', onPick);
  document.getElementById('sample').addEventListener('click', function () { drawSample(); say(''); });
  function retune() { if (norm) { rebuild(); say('線をひろい直したよ。'); } }
  thr.addEventListener('change', retune); gap.addEventListener('change', retune);
  modeSel.addEventListener('change', remode);

  // カメラ（ページの中で映す）
  var camBox = document.getElementById('cambox'), video = document.getElementById('video'), stream = null;
  function stopCam() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } camBox.hidden = true; }
  document.getElementById('camopen').addEventListener('click', function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { document.getElementById('cam').click(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (st) {
      stream = st; video.srcObject = st; camBox.hidden = false; video.play();
      say('カメラをむけて「とる」をおしてね。');
    }).catch(function () {
      say('カメラをひらけませんでした。ブラウザの設定でカメラをゆるすか、「写真をえらぶ」をつかってね。');
      document.getElementById('cam').click();
    });
  });
  document.getElementById('shoot').addEventListener('click', function () {
    if (!video.videoWidth) { say('カメラのじゅんびちゅうだよ。もういちどおしてね。'); return; }
    load(video, video.videoWidth, video.videoHeight); stopCam();
    say(modeMsg());
    cv.scrollIntoView({ block: 'start' });
  });
  document.getElementById('camclose').addEventListener('click', function () { stopCam(); say(''); });

  drawSample();
})();
</script>
</body>
</html>
