<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bone to Beast</title>
<style>
/* layout: full-screen canvas, side view. Camera follows the hero to the right. HUD on canvas. HTML overlays: title, graft cards, game over. Touch: move buttons bottom-left, jump/attack/skill bottom-right. */
:root{--ink:#f4efe6;--muted:#b9b0c4;--card:#221c2b;--line:#3a3046;--blood:#d6334a;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#15111b;color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
[hidden]{display:none!important}
.dim{background:rgba(12,8,16,.74)}
h1{font-size:clamp(46px,10vw,92px);margin:0;line-height:.95;letter-spacing:2px;color:#f4efe6;text-shadow:0 6px 0 #6b1324,0 0 30px rgba(214,51,74,.45)}
h1 span{color:var(--blood)}
h2{font-size:32px;margin:0}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
.btn{font:inherit;font-weight:900;font-size:20px;border:0;border-radius:14px;padding:14px 34px;min-height:56px;cursor:pointer;background:var(--blood);color:#fff;box-shadow:0 5px 0 #7e1326}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7e1326}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:920px}
.card{width:230px;min-height:260px;border-radius:20px;background:var(--card);border:3px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;cursor:pointer;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--c,#fff);box-shadow:0 0 24px var(--c,#fff)}
.card canvas{position:static;width:150px;height:150px}
.cards canvas{position:static;inset:auto}
.card b{font-size:19px}.card span{font-size:14px;color:var(--muted);line-height:1.4}
.card em{font-style:normal;font-size:12px;font-weight:900;color:var(--c);letter-spacing:1px;text-transform:uppercase}
.keys{font-size:14px}
.tc{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:none;gap:12px}
.tc button{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:900;font-size:22px}
.tc button.red{background:rgba(214,51,74,.6)}
.tc.l{left:16px}.tc.r{right:16px}
@media (pointer:coarse){.tc{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tc l" id="tcl" hidden><button data-k="L" type="button" aria-label="Left">◀</button><button data-k="R" type="button" aria-label="Right">▶</button></div>
<div class="tc r" id="tcr" hidden><button data-k="S" type="button" aria-label="Skill" style="font-size:13px">SKILL</button><button data-k="A" class="red" type="button" aria-label="Attack">⚔</button><button data-k="J" type="button" aria-label="Jump">▲</button></div>
<div class="over dim" id="title">
  <h1>BONE<br>TO <span>BEAST</span></h1>
  <p>You rise as a bare skeleton.<br>Drink the blood of what you defeat — and graft their parts onto your bones.</p>
  <button class="btn" id="start" type="button">Rise</button>
  <p class="keys">Move A/D or ←/→ · Jump W/↑/Space · Attack J · Skill K</p>
  <p id="hi"></p>
</div>
<div class="over dim" id="graft" hidden><h2>The blood calls…</h2><p>Choose a part to graft onto your bones</p><div class="cards" id="cards"></div></div>
<div class="over dim" id="dead" hidden><h2 id="deadT">You fell</h2><p id="deadP"></p><div class="cards" id="deadForm" style="pointer-events:none"></div><button class="btn" id="again" type="button">Rise again</button></div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1,Z=1;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;Z=Math.max(0.9,Math.min(2,H/470));}
addEventListener('resize',fit);fit();
var store={get:function(k,f){try{var v=JSON.parse(localStorage.getItem('b2b2-'+k));return v==null?f:v;}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('b2b2-'+k,JSON.stringify(v));}catch(e){}}};
// ===================== species and parts =====================
var COL={wolf:'#8d96a8',bat:'#8f63d6',golem:'#b9824f',goblin:'#a9bd3f',slime:'#4fcf86',bone:'#e9e4d4'};
var PARTS={
 wolfLegs:{sp:'wolf',slot:'legs',name:'Wolf Legs',desc:'Run fast, jump higher. Skill: Pounce.'},
 wolfHead:{sp:'wolf',slot:'head',name:'Wolf Skull',desc:'Third hit of a combo bites and drains life.'},
 batWings:{sp:'bat',slot:'back',name:'Bat Wings',desc:'Double jump. Hold jump to glide.'},
 batHead:{sp:'bat',slot:'head',name:'Bat Skull',desc:'Skill: Screech — stuns everything in front.'},
 golemArms:{sp:'golem',slot:'arms',name:'Golem Fists',desc:'Slow, huge punches that send foes flying. Skill: Ground Slam.'},
 goblinArms:{sp:'goblin',slot:'arms',name:'Goblin Arms',desc:'Attack throws daggers. Skill: Firebomb.'},
 slimeCore:{sp:'slime',slot:'core',name:'Slime Core',desc:'Slowly regenerate. Land on enemies to bounce.'},
 golemCore:{sp:'golem',slot:'core',name:'Stone Heart',desc:'+60 max HP and take 30% less damage.'}};
var BYSP={};Object.keys(PARTS).forEach(function(k){(BYSP[PARTS[k].sp]=BYSP[PARTS[k].sp]||[]).push(k);});
var ENEMY={slime:{hp:26,spd:60,dmg:8,pts:10,w:30,h:24},wolf:{hp:24,spd:170,dmg:10,pts:15,w:44,h:28},bat:{hp:14,spd:120,dmg:6,pts:12,w:30,h:22,fly:1},goblin:{hp:24,spd:90,dmg:7,pts:18,w:26,h:38},golem:{hp:90,spd:45,dmg:18,pts:40,w:56,h:64}};
// ===================== audio =====================
var AC=null;
function snd(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  var P={hit:[200,90,0.08,0.07,'square'],kill:[300,60,0.2,0.07,'sawtooth'],orb:[700,1150,0.06,0.03,'sine'],hurt:[220,70,0.25,0.1,'sawtooth'],skill:[200,800,0.25,0.06,'triangle'],graft:[180,900,0.7,0.08,'triangle'],swing:[420,220,0.06,0.025,'triangle'],jump:[300,520,0.08,0.03,'sine'],boss:[80,50,0.9,0.12,'sawtooth']}[k];
  o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+P[2]);o.start(t);o.stop(t+P[2]+0.02);}catch(e){}}
// ===================== world =====================
var GROUND=0,GRAV=1900;
// platforms are generated in chunks as the hero goes right
function chunkPlats(ci){var r=ci*7919+13,out=[];function rnd(){r=(r*1664525+1013904223)>>>0;return r/4294967296;}
  var n=ci===0?1:2+Math.floor(rnd()*2);for(var i=0;i<n;i++)out.push({x:ci*900+120+rnd()*600,y:-(90+rnd()*130),w:120+rnd()*120});return out;}
var G=null,keys={},tch={},hi=store.get('hi',0);
function newGame(){G={t:0,state:'play',dist:0,score:0,kills:0,en:[],shots:[],eshots:[],orbs:[],fx:[],texts:[],blood:{},need:5,parts:{},plats:[],chunks:0,cam:{x:0,y:-150},
  wave:0,lock:null,shake:0,flash:0,banner:'',bannerT:0,
  p:{x:80,y:0,vx:0,vy:0,w:24,h:62,face:1,ground:true,jumps:0,hp:80,max:80,inv:0,atkT:0,combo:0,comboT:0,swing:0,cd:0,walk:0,glide:false,dash:0,hit:[]}};
  for(var c=0;c<3;c++)addChunk();setBanner('Walk right →');}
function addChunk(){G.plats=G.plats.concat(chunkPlats(G.chunks));G.chunks++;}
function stat(){var P=G.parts,s={spd:220,jump:700,maxJumps:1,dmg:12,rate:0.32,range:58,kb:240,armor:1,regen:0,ranged:false,heavy:false,bite:false};
  if(P.legs==='wolfLegs'){s.spd=320;s.jump=820;}
  if(P.back==='batWings'){s.maxJumps=2;}
  if(P.arms==='golemArms'){s.dmg=30;s.rate=0.62;s.range=70;s.kb=620;s.heavy=true;}
  if(P.arms==='goblinArms'){s.dmg=14;s.rate=0.36;s.ranged=true;}
  if(P.head==='wolfHead')s.bite=true;
  if(P.core==='slimeCore')s.regen=3;if(P.core==='golemCore')s.armor=0.7;
  var n=Object.keys(P).length;s.dmg*=1+n*0.08;return s;}
function maxHp(){return 80+(G.parts.core==='golemCore'?60:0)+Object.keys(G.parts).length*10;}
// ===================== waves: the screen locks, enemies come, then "GO →" =====================
function startWave(){G.wave++;var w=G.wave,pool=['slime','bat'];if(w>=2)pool.push('wolf');if(w>=3)pool.push('goblin');if(w>=4)pool.push('golem');
  G.lock={x:G.cam.x,q:[],t:0};var boss=w%5===0,n=boss?4:4+Math.floor(w*1.6);
  for(var i=0;i<n;i++)G.lock.q.push({sp:pool[(Math.random()*pool.length)|0],at:0.4+i*Math.max(0.35,1-w*0.05)});
  if(boss){var bs=['golem','wolf','slime','goblin','bat'][(w/5-1)%5];G.lock.q.unshift({sp:bs,at:0.2,boss:true});setBanner('A giant '+name(bs)+'!');snd('boss');}else setBanner('Wave '+w);}
function name(s){return s[0].toUpperCase()+s.slice(1);}
function spawn(q){var E=ENEMY[q.sp],side=Math.random()<0.65?1:-1,vw=W/Z,x=G.lock.x+side*(vw/2+40),hm=1+G.wave*0.12,b=q.boss?2.4:1;
  G.en.push({sp:q.sp,x:x,y:E.fly?-160-Math.random()*80:0,vx:0,vy:0,w:E.w*b,h:E.h*b,hp:E.hp*hm*(q.boss?12:1),max:E.hp*hm*(q.boss?12:1),spd:E.spd*(q.boss?0.7:1),dmg:E.dmg*(1+G.wave*0.05)*(q.boss?1.5:1),boss:!!q.boss,t:Math.random()*3,cd:1+Math.random()*1.5,hit:0,stun:0,face:-side,ground:false});}
// ===================== helpers =====================
function setBanner(t){G.banner=t;G.bannerT=2;}
function overlap(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs((a.y-a.h/2)-(b.y-b.h/2))<(a.h+b.h)/2;}
function hurtEnemy(e,dmg,kx,ky){if(e.dead)return;e.hp-=dmg;e.hit=0.12;e.vx+=kx;e.vy+=ky;if(ky<-100)e.ground=false;G.texts.push({x:e.x,y:e.y-e.h-6,t:Math.round(dmg)+'',l:0.6,c:'#fff'});snd('hit');G.shake=Math.max(G.shake,3);
  G.fx.push({x:e.x,y:e.y-e.h/2,vx:0,vy:0,l:0.12,c:'#fff',s:e.h*0.35});if(e.hp<=0)kill(e);}
function kill(e){e.dead=true;G.kills++;G.score+=Math.round(ENEMY[e.sp].pts*(e.boss?10:1)*(1+G.wave*0.1));snd('kill');G.shake=Math.max(G.shake,e.boss?16:6);
  for(var i=0;i<16;i++)G.fx.push({x:e.x,y:e.y-e.h/2,vx:(Math.random()-0.5)*420,vy:-Math.random()*380,l:0.6,c:i%2?COL[e.sp]:'#d6334a',s:3+Math.random()*4,g:1});
  var n=e.boss?10:1;for(var k=0;k<n;k++)G.orbs.push({sp:e.sp,x:e.x,y:e.y-e.h/2,vx:(Math.random()-0.5)*300,vy:-200-Math.random()*200,t:0});}
function hurtHero(d,fromX){var p=G.p;if(p.inv>0||p.dash>0)return;d*=stat().armor;p.hp-=d;p.inv=0.8;p.vx=(p.x<fromX?-1:1)*300;p.vy=-300;p.ground=false;G.shake=10;G.flash=0.25;snd('hurt');
  if(p.hp<=0){p.hp=0;over();}}
// ===================== hero actions =====================
function jump(){var p=G.p,s=stat();if(p.ground){p.vy=-s.jump;p.ground=false;p.jumps=1;snd('jump');}else if(p.jumps<s.maxJumps){p.vy=-s.jump*0.9;p.jumps++;snd('jump');for(var i=0;i<8;i++)G.fx.push({x:p.x,y:p.y-20,vx:(Math.random()-0.5)*200,vy:Math.random()*120,l:0.3,c:COL.bat,s:3});}}
function attack(){var p=G.p,s=stat();if(p.atkT>0)return;p.atkT=s.rate;p.swing=0.2;
  if(p.comboT>0)p.combo=(p.combo+1)%3;else p.combo=0;p.comboT=0.6;
  if(s.ranged){G.shots.push({x:p.x+p.face*20,y:p.y-p.h*0.62,vx:p.face*620,vy:-30,dmg:s.dmg,l:0.9,r:6,kind:'dagger',hitL:[]});snd('swing');return;}
  snd('swing');var bite=s.bite&&p.combo===2,hx={x:p.x+p.face*(s.range*0.5+10),y:p.y-8,w:s.range+20,h:p.h+10};
  G.en.forEach(function(e){if(overlap(hx,e)){var dm=s.dmg*(bite?1.6:1)*(p.combo===2?1.3:1);hurtEnemy(e,dm,p.face*s.kb*(p.combo===2?1.5:1),s.heavy||p.combo===2?-260:-80);if(bite){p.hp=Math.min(maxHp(),p.hp+dm*0.25);G.texts.push({x:p.x,y:p.y-p.h-14,t:'+'+Math.round(dm*0.25),l:0.6,c:'#ff6b80'});}}});
  G.fx.push({arc:1,x:p.x,y:p.y-p.h*0.55,face:p.face,R:s.range+10,l:0.16,L:0.16,c:s.heavy?'#ffb070':bite?'#ff6b80':'#e9e4d4',w:s.heavy?1.8:1});}
function skill(){var p=G.p,P=G.parts,s=stat();if(p.cd>0||G.state!=='play')return;snd('skill');
  if(P.head==='batHead'){p.cd=6;G.fx.push({cone:1,x:p.x,y:p.y-p.h*0.75,face:p.face,l:0.35,L:0.35});G.en.forEach(function(e){var dx=(e.x-p.x)*p.face;if(dx>0&&dx<340&&Math.abs((e.y-e.h/2)-(p.y-p.h*0.7))<160){e.stun=2.2;hurtEnemy(e,s.dmg*0.6,p.face*120,-60);}});}
  else if(P.arms==='golemArms'){p.cd=5;if(!p.ground){p.vy=1200;p.slam=true;}else slam();}
  else if(P.arms==='goblinArms'){p.cd=4;G.shots.push({x:p.x,y:p.y-p.h*0.7,vx:p.face*460,vy:-420,dmg:s.dmg*3,l:3,r:9,kind:'bomb',hitL:[],g:1});}
  else if(P.legs==='wolfLegs'){p.cd=2.5;p.dash=0.25;p.vx=p.face*1100;p.vy=-120;p.hit=[];}
  else{p.cd=4;for(var i=0;i<5;i++)G.shots.push({x:p.x,y:p.y-p.h*0.7,vx:p.face*(380+i*60),vy:-260+i*80,dmg:s.dmg,l:1.4,r:7,kind:'bone',hitL:[],g:1});}}
function slam(){var p=G.p,s=stat();p.slam=false;G.shake=18;G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:200,l:0.35,L:0.35,c:'#ffb070'});
  G.en.forEach(function(e){if(Math.abs(e.x-p.x)<210&&Math.abs(e.y-p.y)<120){e.stun=1.2;hurtEnemy(e,s.dmg*1.2,(e.x>p.x?1:-1)*380,-420);}});}
// ===================== blood → grafts =====================
function addBlood(sp){G.blood[sp]=(G.blood[sp]||0)+1;var tot=0;for(var k in G.blood)tot+=G.blood[k];if(tot>=G.need&&G.state==='play')offer();}
function offer(){var sps=Object.keys(G.blood).sort(function(a,b){return G.blood[b]-G.blood[a];}),opts=[];
  sps.forEach(function(sp){(BYSP[sp]||[]).forEach(function(k){if(G.parts[PARTS[k].slot]!==k&&opts.length<3&&opts.indexOf(k)<0)opts.push(k);});});
  if(!opts.length){G.blood={};return;}
  G.state='graft';var el=document.getElementById('cards');el.innerHTML='';
  opts.forEach(function(k,i){var Pt=PARTS[k],b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--c',COL[Pt.sp]);
    var c=document.createElement('canvas');c.width=c.height=300;b.appendChild(c);var g=c.getContext('2d'),pp={};for(var s in G.parts)pp[s]=G.parts[s];pp[Pt.slot]=k;
    g.translate(150,250);g.scale(2.8,2.8);drawHero(g,{x:0,y:0,face:1,walk:0.6,swing:0,ground:true,vy:0,h:62},pp,true);
    var cur=G.parts[Pt.slot];b.insertAdjacentHTML('beforeend','<em>'+Pt.slot+(cur?' · replaces '+PARTS[cur].name:'')+'</em><b>'+Pt.name+'</b><span>'+Pt.desc+'</span><em>['+(i+1)+']</em>');
    b.addEventListener('click',function(){graft(k);});el.appendChild(b);});
  document.getElementById('graft').hidden=false;setTimeout(function(){var f=el.querySelector('button');if(f)f.focus();},60);}
function graft(k){var Pt=PARTS[k],p=G.p;G.parts[Pt.slot]=k;G.blood={};G.need=Math.round(G.need*1.3+3);var m=maxHp();p.hp=Math.min(m,p.hp+m*0.3);p.max=m;snd('graft');
  for(var i=0;i<40;i++)G.fx.push({x:p.x,y:p.y-p.h/2,vx:(Math.random()-0.5)*500,vy:(Math.random()-0.5)*500,l:0.8,c:COL[Pt.sp],s:4+Math.random()*4});
  setBanner(Pt.name+' grafted!');document.getElementById('graft').hidden=true;G.state='play';last=performance.now();}
// ===================== update =====================
function update(dt){var p=G.p,s=stat();G.t+=dt;p.max=maxHp();
  var mx=(keys.ArrowLeft||keys.KeyA||tch.L?-1:0)+(keys.ArrowRight||keys.KeyD||tch.R?1:0);
  if(p.dash>0){p.dash-=dt;G.en.forEach(function(e){if(p.hit.indexOf(e)<0&&overlap(p,e)){p.hit.push(e);hurtEnemy(e,s.dmg*2,p.face*500,-300);}});if(Math.random()<0.7)G.fx.push({x:p.x,y:p.y-p.h/2,vx:0,vy:0,l:0.2,c:'rgba(200,210,230,.6)',s:12});}
  else{var acc=p.ground?3000:1800;if(mx){p.vx+=mx*acc*dt;p.face=mx;}else{p.vx*=Math.pow(p.ground?0.0005:0.2,dt);}p.vx=Math.max(-s.spd,Math.min(s.spd,p.vx))+(Math.abs(p.vx)>s.spd?0:0);}
  if(Math.abs(p.vx)>s.spd&&p.dash<=0)p.vx*=Math.pow(0.02,dt);
  var holdJump=keys.ArrowUp||keys.KeyW||keys.Space||tch.J;p.glide=G.parts.back==='batWings'&&holdJump&&p.vy>0&&!p.ground;
  p.vy+=GRAV*dt*(p.glide?0.18:1);if(p.glide)p.vy=Math.min(p.vy,140);
  var oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
  // left wall during a wave, no going back past the start
  var minX=G.lock?G.lock.x-W/Z/2+20:Math.max(20,G.cam.x-W/Z/2+20),maxX=G.lock?G.lock.x+W/Z/2-20:1e9;p.x=Math.max(minX,Math.min(maxX,p.x));
  p.ground=false;if(p.y>=GROUND){p.y=GROUND;if(p.vy>0){if(p.slam)slam();p.vy=0;}p.ground=true;p.jumps=0;}
  G.plats.forEach(function(pl){if(p.vy>=0&&oy<=pl.y&&p.y>=pl.y&&p.x>pl.x&&p.x<pl.x+pl.w&&!(keys.ArrowDown||keys.KeyS)){p.y=pl.y;p.vy=0;p.ground=true;p.jumps=0;if(p.slam)slam();}});
  if(p.inv>0)p.inv-=dt;if(p.cd>0)p.cd-=dt;if(p.atkT>0)p.atkT-=dt;if(p.comboT>0)p.comboT-=dt;if(p.swing>0)p.swing-=dt;
  p.walk+=Math.abs(p.vx)*dt*0.045;if(s.regen)p.hp=Math.min(p.max,p.hp+s.regen*dt);
  if(keys.KeyJ||tch.A)attack();
  // progress: walk right, then a wave locks the screen
  G.dist=Math.max(G.dist,p.x);while(G.chunks*900<p.x+2000)addChunk();
  if(!G.lock&&p.x>G.wave*700+500)startWave();
  if(G.lock){G.lock.t+=dt;while(G.lock.q.length&&G.lock.q[0].at<=G.lock.t)spawn(G.lock.q.shift());if(!G.lock.q.length&&!G.en.length){G.lock=null;p.hp=Math.min(p.max,p.hp+p.max*0.12);setBanner('GO →');}}
  // enemies
  G.en.forEach(function(e){var E=ENEMY[e.sp];e.t+=dt;if(e.hit>0)e.hit-=dt;var dx=p.x-e.x,ad=Math.abs(dx),dir=dx>0?1:-1;

  G.en.forEach(drawEnemy);
  var p=G.p;if(!(p.inv>0&&Math.floor(p.inv*20)%2)){ctx.save();ctx.shadowColor='rgba(255,230,180,.35)';ctx.shadowBlur=12;drawHero(ctx,p,G.parts,false);ctx.restore();}
  G.shots.forEach(function(s){ctx.save();ctx.translate(s.x,s.y);if(s.kind==='bone'){ctx.rotate(G.t*14);bone(ctx,-7,0,7,0,3,'#e9e4d4');}else if(s.kind==='bomb'){ctx.fillStyle='#ff8c3a';ctx.beginPath();ctx.arc(0,0,s.r,0,7);ctx.fill();ctx.fillStyle='#ffd34f';ctx.beginPath();ctx.arc(3,-7,3,0,7);ctx.fill();}else{ctx.rotate(Math.atan2(s.vy,s.vx));ctx.fillStyle='#ddd';ctx.fillRect(-8,-2,16,4);}ctx.restore();});
  G.eshots.forEach(function(s){ctx.fillStyle=s.col;ctx.shadowColor='#ff3b4e';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.shadowBlur=0;});
  G.fx.forEach(function(f){ctx.globalAlpha=Math.max(0,Math.min(1,f.l*3));
    if(f.ring){ctx.strokeStyle=f.c;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r,f.r*0.35,0,0,7);ctx.stroke();}
    else if(f.arc){var k=1-f.l/f.L;ctx.strokeStyle=f.c;ctx.lineWidth=7*f.w;ctx.lineCap='round';ctx.beginPath();if(f.face>0)ctx.arc(f.x,f.y,f.R*0.8,-1.3+k*0.4,0.2+k*1.0);else ctx.arc(f.x,f.y,f.R*0.8,Math.PI-0.2-k*1.0,Math.PI+1.3-k*0.4);ctx.stroke();}
    else if(f.cone){var k2=1-f.l/f.L;ctx.strokeStyle='#c9a6ff';ctx.lineWidth=3;for(var i=0;i<4;i++){var rr2=40+k2*260+i*24;ctx.beginPath();if(f.face>0)ctx.arc(f.x,f.y,rr2,-0.5,0.5);else ctx.arc(f.x,f.y,rr2,Math.PI-0.5,Math.PI+0.5);ctx.stroke();}}
    else{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();}ctx.globalAlpha=1;});
  G.texts.forEach(function(t){ctx.globalAlpha=Math.min(1,t.l*2);ctx.fillStyle=t.c;ctx.font='900 16px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillText(t.t,t.x,t.y);ctx.globalAlpha=1;});
  ctx.restore();
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(G.flash>0){ctx.fillStyle='rgba(214,51,74,'+(G.flash*0.8)+')';ctx.fillRect(0,0,W,H);}
  hud();}
function skillName(){var P=G.parts;return P.head==='batHead'?'Screech':P.arms==='golemArms'?'Ground Slam':P.arms==='goblinArms'?'Firebomb':P.legs==='wolfLegs'?'Pounce':'Bone Toss';}
function hud(){var p=G.p,x=16,y=14;ctx.fillStyle='rgba(20,15,26,.78)';rr(ctx,x,y,320,92,16);ctx.fill();
  ctx.save();ctx.beginPath();rr(ctx,x+8,y+8,76,76,12);ctx.fillStyle='#2a2333';ctx.fill();ctx.clip();drawHero(ctx,{x:x+44,y:y+84,face:1,walk:G.t*2,swing:0,ground:true,h:62},G.parts,true);ctx.restore();
  ctx.textAlign='left';ctx.fillStyle='#f4efe6';ctx.font='900 16px Trebuchet MS,sans-serif';var n=Object.keys(G.parts).length;ctx.fillText(n===0?'Bare Skeleton':n<3?'Bone Chimera':n<5?'Half Beast':'BEAST',x+94,y+24);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(ctx,x+94,y+32,214,14,7);ctx.fill();ctx.fillStyle='#e8445a';rr(ctx,x+94,y+32,214*Math.max(0,p.hp/p.max),14,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText(Math.ceil(p.hp)+' / '+p.max,x+100,y+43);
  var tot=0,bx=x+94,bw=214;for(var k in G.blood)tot+=G.blood[k];ctx.fillStyle='rgba(255,255,255,.12)';rr(ctx,bx,y+54,bw,10,5);ctx.fill();
  var off=0;Object.keys(G.blood).forEach(function(s){var w2=bw*Math.min(1,G.blood[s]/G.need);ctx.fillStyle=COL[s];ctx.fillRect(bx+off,y+54,Math.max(0,Math.min(w2,bw-off)),10);off+=w2;});
  ctx.fillStyle='#c9bdd4';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText('BLOOD '+tot+'/'+G.need,bx,y+80);
  ctx.textAlign='right';ctx.fillStyle=p.cd<=0?'#ffd34f':'#9b90a8';ctx.font='900 13px Trebuchet MS,sans-serif';ctx.fillText((p.cd<=0?'[K] ':'')+skillName()+(p.cd>0?' '+p.cd.toFixed(1)+'s':''),x+308,y+80);
  ctx.fillStyle='#f4efe6';ctx.font='900 22px Trebuchet MS,sans-serif';ctx.fillText('Wave '+G.wave,W-16,36);ctx.fillStyle='#c9bdd4';ctx.font='800 15px Trebuchet MS,sans-serif';ctx.fillText('Score '+G.score,W-16,58);
  if(G.bannerT>0){ctx.globalAlpha=Math.min(1,G.bannerT*1.5);ctx.textAlign='center';ctx.font='900 '+Math.round(Math.min(W,H)*0.065)+'px Trebuchet MS,sans-serif';ctx.fillStyle='#f4efe6';ctx.shadowColor='#d6334a';ctx.shadowBlur=20;ctx.fillText(G.banner,W/2,H*0.3);ctx.shadowBlur=0;ctx.globalAlpha=1;}}
// ===================== flow =====================
function over(){G.state='dead';var n=Object.keys(G.parts).length;if(G.score>hi){hi=G.score;store.set('hi',hi);}
  setTimeout(function(){document.getElementById('deadT').textContent='You fell on wave '+G.wave;document.getElementById('deadP').textContent='Score '+G.score+' · '+G.kills+' defeated'+(G.score>=hi?' · New best!':' · Best '+hi)+' · your final form:';
    var el=document.getElementById('deadForm');el.innerHTML='';var c=document.createElement('canvas');c.width=c.height=300;c.style.cssText='width:180px;height:180px';var g=c.getContext('2d');g.translate(150,260);g.scale(3,3);drawHero(g,{x:0,y:0,face:1,walk:0.6,swing:0,ground:true,h:62},G.parts,true);el.appendChild(c);
    var parts=Object.keys(G.parts).map(function(s){return PARTS[G.parts[s]].name;});el.insertAdjacentHTML('beforeend','<p style="width:100%">'+(parts.length?parts.join(' · '):'Still just bones')+'</p>');
    document.getElementById('dead').hidden=false;['tcl','tcr'].forEach(function(i){document.getElementById(i).hidden=true;});},900);}
var last=performance.now(),acc=0,STEP=1/60;
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;while(acc>=STEP){if(G&&G.state==='play')update(STEP);acc-=STEP;}draw();requestAnimationFrame(frame);}
function start(){newGame();document.getElementById('title').hidden=true;document.getElementById('dead').hidden=true;['tcl','tcr'].forEach(function(i){document.getElementById(i).hidden=false;});last=performance.now();}
// ===================== input =====================
addEventListener('keydown',function(e){if(e.repeat&&e.code!=='KeyJ')return;keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(!G||G.state!=='play'){if(e.code==='Space'&&!document.getElementById('title').hidden)start();
    if(G&&G.state==='graft'&&/^Digit[123]$/.test(e.code)){var b=document.querySelectorAll('#cards button')[+e.code.slice(5)-1];if(b)b.click();}return;}
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')jump();if(e.code==='KeyK')skill();if(e.code==='KeyJ')attack();});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};tch={};});
Array.prototype.forEach.call(document.querySelectorAll('.tc button'),function(b){var k=b.dataset.k;
  b.addEventListener('pointerdown',function(e){e.preventDefault();tch[k]=true;if(!G||G.state!=='play')return;if(k==='J')jump();if(k==='S')skill();if(k==='A')attack();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){b.addEventListener(t,function(){tch[k]=false;});});});
document.getElementById('start').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
document.getElementById('hi').textContent=hi?'Best score: '+hi:'';
requestAnimationFrame(frame);
</script>
</body>
