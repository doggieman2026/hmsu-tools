<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サンタからのメッセージ</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#3b2a1e;--paper:#fff8ec;--red:#c8323c;--gold:#e8b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1430;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Rounded Mplus 1c","Yu Gothic",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.env{position:relative;width:min(88vw,380px);aspect-ratio:1.45;cursor:pointer;transition:transform .6s, opacity .6s;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.env .body{position:absolute;inset:0;background:linear-gradient(#f3e3c4,#e9d2a8);border-radius:10px;border:3px solid #d1b07a}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#ead5ad,#dcc08e);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;border-radius:10px 10px 0 0}
.env .seal{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(#e4545e,#a51f2a);box-shadow:0 3px 0 #7c141d;display:flex;align-items:center;justify-content:center;color:#ffe3a0;font-size:28px;transition:opacity .4s}
.env .to{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-weight:800;font-size:22px;color:#6b4a2a}
.hint{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:1px;animation:blink 1.4s infinite;text-shadow:0 2px 8px #000}
@keyframes blink{50%{opacity:.35}}
.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0}.env.gone{transform:translateY(40vh) scale(.8);opacity:0;pointer-events:none}
.letter{position:fixed;left:50%;top:50%;width:min(92vw,430px);max-height:86vh;overflow:auto;transform:translate(-50%,-40%) scale(.9);opacity:0;pointer-events:none;transition:all .8s cubic-bezier(.2,.8,.2,1);
  background:var(--paper);border-radius:16px;padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);border:6px double #e1c58f}
.letter.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.letter:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(200,50,60,.25);border-radius:10px;pointer-events:none}
.letter h1{margin:0 0 10px;font-size:26px;color:var(--red);text-align:center}
.letter .name{font-size:24px;font-weight:900;margin-bottom:10px}
.letter p{margin:0 0 9px;font-size:18px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;opacity:0;transform:translateY(6px);transition:all .7s}
.letter p.on{opacity:1;transform:none}
.letter .sign{text-align:right;font-weight:900;font-size:20px;color:var(--red);margin-top:12px}
.letter .gift{text-align:center;font-size:34px;margin-top:6px}
.again{display:block;margin:14px auto 0;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:10px 22px;background:var(--red);color:#fff;opacity:0;transition:opacity .6s}
.again.on{opacity:1}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="stage"><div class="env" id="env" role="button" tabindex="0" aria-label="てがみをひらく"><div class="body"></div><div class="flap"></div><div class="seal">★</div><div class="to" id="to"></div></div></div>
<div class="hint" id="hint">てがみを タップしてね</div>
<div class="letter" id="letter" aria-live="polite"><h1>メリークリスマス！</h1><div class="name" id="lname"></div><div id="lines"></div><div class="sign" id="sign">サンタクロースより</div><div class="gift">🎁</div><button class="again" id="again" type="button">もういちど よむ</button></div>
<script>
"use strict";
// ---- data from URL: #d=<base64url(JSON {n,s,g,m})> ----
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}
var q=(location.hash.match(/d=([^&]+)/)||[])[1],D=(q&&dec(q))||{n:'はると',s:'くん',g:'じてんしゃの れんしゅう',m:''};
var NM=(D.n||'')+(D.s||'');
document.getElementById('to').textContent=NM+' へ';document.getElementById('lname').textContent=NM+' へ';
var LINES=['サンタクロースだよ。','ことしも きたのくにから、'+NM+'の ことを みていたよ。',
  D.g?D.g+'、とても がんばったね。サンタは ちゃんと しっているよ。':'まいにち げんきに すごして、えらかったね。',
  D.m||'','クリスマスの よるに、プレゼントを もって あいに いくからね。','あったかくして はやく ねて、まっていてね。'].filter(Boolean);
// ---- sky: stars, snow, moon, sleigh, town ----
var cv=document.getElementById('sky'),g=cv.getContext('2d'),W,H,DPR,stars=[],snow=[],t0=performance.now();
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  stars=[];for(var i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.65,r:Math.random()*1.4+0.3,p:Math.random()*6});
  snow=[];for(var j=0;j<Math.round(W*H/5000);j++)snow.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+0.8,v:20+Math.random()*40,p:Math.random()*6});}
addEventListener('resize',fit);fit();
function sleigh(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(10,16,40,.9)';
  for(var r=0;r<3;r++){var rx=40+r*34;g.beginPath();g.ellipse(rx,0,13,5,0,0,7);g.fill();g.fillRect(rx+8,-9,3,9);g.beginPath();g.moveTo(rx+10,-9);g.lineTo(rx+16,-17);g.lineTo(rx+12,-9);g.fill();
    g.fillRect(rx-9,2,2,8);g.fillRect(rx+6,2,2,8);}
  g.strokeStyle='rgba(10,16,40,.9)';g.lineWidth=1.2;g.beginPath();g.moveTo(18,-2);g.lineTo(110,-4);g.stroke();
  g.beginPath();g.moveTo(-22,6);g.quadraticCurveTo(-26,-6,-14,-10);g.lineTo(16,-10);g.lineTo(18,4);g.closePath();g.fill();
  g.beginPath();g.moveTo(-28,8);g.lineTo(22,8);g.quadraticCurveTo(28,8,26,2);g.lineWidth=2;g.stroke();
  g.beginPath();g.arc(0,-16,7,0,7);g.fill();g.beginPath();g.moveTo(-6,-20);g.lineTo(2,-32);g.lineTo(6,-20);g.fill();g.restore();}
function frame(now){var t=(now-t0)/1000;var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#081028');gr.addColorStop(0.6,'#1b2c5c');gr.addColorStop(1,'#33467a');g.fillStyle=gr;g.fillRect(0,0,W,H);
  stars.forEach(function(s){g.globalAlpha=0.5+0.5*Math.sin(t*2+s.p);g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();});g.globalAlpha=1;
  var mx=W*0.78,my=H*0.17,mr=Math.min(W,H)*0.09;g.fillStyle='#fff6d6';g.shadowColor='#fff3c0';g.shadowBlur=40;g.beginPath();g.arc(mx,my,mr,0,7);g.fill();g.shadowBlur=0;
  var cyc=(t%14)/14,sx=-200+(W+400)*cyc,sy=H*0.3-Math.sin(cyc*Math.PI)*H*0.14;sleigh(sx,sy,Math.min(W,H)/700+0.3);
  g.fillStyle='#e8eefc';g.beginPath();g.moveTo(0,H);for(var x=0;x<=W;x+=20)g.lineTo(x,H*0.86+Math.sin(x*0.01)*14+Math.sin(x*0.033)*6);g.lineTo(W,H);g.fill();
  for(var hx=20;hx<W;hx+=Math.max(90,W/6)){var hh=H*0.86+Math.sin(hx*0.01)*14-2,hw=46;g.fillStyle='#2a2f4f';g.fillRect(hx,hh-34,hw,34);g.beginPath();g.moveTo(hx-6,hh-34);g.lineTo(hx+hw/2,hh-58);g.lineTo(hx+hw+6,hh-34);g.fill();
    g.fillStyle='#fff';g.beginPath();g.moveTo(hx-6,hh-34);g.lineTo(hx+hw/2,hh-58);g.lineTo(hx+hw+6,hh-34);g.lineTo(hx+hw+2,hh-30);g.lineTo(hx+hw/2,hh-52);g.lineTo(hx-2,hh-30);g.fill();
    g.fillStyle='rgba(255,210,110,'+(0.75+0.25*Math.sin(t*3+hx))+')';g.fillRect(hx+8,hh-24,10,10);g.fillRect(hx+28,hh-24,10,10);}
  snow.forEach(function(f){f.y+=f.v/60;f.x+=Math.sin(t+f.p)*0.4;if(f.y>H){f.y=-5;f.x=Math.random()*W;}g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill();});
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// ---- sound: small jingle ----
var AC=null;function bell(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var notes=[659,659,659,0,659,659,659,0,659,784,523,587,659];notes.forEach(function(f,i){if(!f)return;var o=AC.createOscillator(),v=AC.createGain(),st=AC.currentTime+i*0.16;
  o.type='triangle';o.frequency.value=f;o.connect(v);v.connect(AC.destination);v.gain.setValueAtTime(0.0001,st);v.gain.exponentialRampToValueAtTime(0.12,st+0.02);v.gain.exponentialRampToValueAtTime(0.0001,st+0.5);o.start(st);o.stop(st+0.55);});}catch(e){}}
// ---- open ----
var env=document.getElementById('env'),letter=document.getElementById('letter'),box=document.getElementById('lines'),again=document.getElementById('again'),opened=false;
function show(){box.innerHTML='';again.classList.remove('on');LINES.forEach(function(l,i){var p=document.createElement('p');p.textContent=l;box.appendChild(p);setTimeout(function(){p.classList.add('on');},600+i*1100);});
  setTimeout(function(){again.classList.add('on');},600+LINES.length*1100);}
function open(){if(opened)return;opened=true;bell();env.classList.add('open');document.getElementById('hint').style.display='none';setTimeout(function(){env.classList.add('gone');letter.classList.add('show');show();},800);}
env.addEventListener('click',open);env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')open();});
again.addEventListener('click',function(){bell();show();});
</script>
</body>
</html>
