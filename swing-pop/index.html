<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Swing Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#ff9a7a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(40,20,60,.45);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#fff;text-shadow:0 5px 0 #c8346a,0 9px 20px rgba(0,0,0,.35)}
.over h1 small{display:block;font-size:.72em;color:#ffe14a;text-shadow:0 5px 0 #b8701a,0 9px 20px rgba(0,0,0,.35)}
.over p{margin:0;max-width:340px;line-height:1.6;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ff7aa8,#e83a7a);color:#fff;text-shadow:0 2px 0 #8a1a44;box-shadow:0 6px 0 #8a1a44;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1a44}
.btn.sub{font-size:17px;background:linear-gradient(#5ad8ff,#2a86e0);text-shadow:0 2px 0 #1a4a8a;box-shadow:0 5px 0 #1a4a8a}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>SWING<small>POP</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(60px,18vw,100px)">0</h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'おしている間だけ、近くの輪にロープをひっかけてブランコ。<br>はなすと空へビューン！<br>海に落ちないように、どこまでも進もう。',play:'あそぶ',again:'もういちど',best:'ベスト',newb:'ベスト更新！',cont:'▶ 広告を見て続ける',na:'広告を読み込めませんでした',splash:'ドボン！',hold:'おしてつかむ！'}
 :{how:'Hold to hook the nearest ring and swing.<br>Let go to fly through the air!<br>Don\'t fall in the sea — how far can you go?',play:'PLAY',again:'AGAIN',best:'BEST',newb:'New best!',cont:'▶ Watch ad: continue',na:'Ad not available',splash:'SPLASH!',hold:'HOLD TO GRAB!'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('sp-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('sp-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,S,SEA=620;
var P,anchors=[],pads=[],coins=[],camX=0,state='title',t=0,FX=[],holding=false,rope=null,used=false,games=0,dist=0,coinN=0,genX=0,trail=[];
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(H/760,W/560);}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
// ---- world ----
function gen(upto){while(genX<upto){var d=Math.min(1,genX/12000);genX+=230+Math.random()*(110+d*120);var y=90+Math.random()*170;anchors.push({x:genX,y:y});
    if(Math.random()<0.5){var cx=genX+60+Math.random()*80,cy=y+150+Math.random()*120;for(var i=0;i<3;i++)coins.push({x:cx+i*36,y:cy-Math.sin(i/2*Math.PI)*24,got:false});}
    if(genX>1500&&Math.random()<0.18){pads.push({x:genX+120,w:90});}}}
function reset(){anchors=[];pads=[];coins=[];genX=200;anchors.push({x:200,y:150});gen(3000);P={x:20,y:330,vx:260,vy:-120,a:0,va:3};camX=-W/S*0.3;holding=false;rope=null;dist=0;coinN=0;FX=[];trail=[];used=false;state='play';}
function nearest(){var bi=-1,bd=1e9;for(var i=0;i<anchors.length;i++){var a=anchors[i];if(a.x<P.x-60)continue;var d=Math.hypot(a.x-P.x,a.y-P.y);if(d<bd&&d<430){bd=d;bi=i;}if(a.x>P.x+500)break;}return bi;}
function press(){if(state!=='play')return;holding=true;var i=nearest();if(i>=0){var a=anchors[i];rope={a:a,L:Math.max(60,Math.hypot(a.x-P.x,a.y-P.y))};tone(700,0.05,'triangle',0.04,1.4);}}
function release(){holding=false;if(rope){rope=null;tone(420,0.08,'triangle',0.035,1.8);}}
function die(){if(state!=='play')return;state='dead';games++;release();tone(260,0.4,'sine',0.08,0.4);for(var i=0;i<18;i++){var a=-Math.random()*Math.PI;FX.push({x:P.x,y:SEA,vx:Math.cos(a)*200,vy:Math.sin(a)*380,l:0.8,c:'#dff4ff',s:6,gr:1});}
  var sc=Math.floor(dist);var nb=sc>best;if(nb){best=sc;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=sc+'m';$('endP').innerHTML=TX.splash+'<br>'+(nb?TX.newb:TX.best+' '+best+'m')+(coinN?'<br>● '+coinN:'');$('cont').hidden=!(CG&&!used&&sc>=30);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},900);}
$('play').onclick=function(){$('title').hidden=true;reset();};
$('again').onclick=function(){$('end').hidden=true;reset();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;var a=null;for(var i=0;i<anchors.length;i++){if(anchors[i].x>P.x-150){a=anchors[i];break;}}if(!a)a=anchors[anchors.length-1];P.x=a.x-40;P.y=a.y+160;P.vx=200;P.vy=0;state='play';holding=true;rope={a:a,L:165};},function(){b.textContent=TX.na;});};
cv.addEventListener('pointerdown',function(e){e.preventDefault();press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press();}});
addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp')release();});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- draw ----
function wx(x){return (x-camX)*S;}function wy(y){return y*S+H*0.8-SEA*S;}
function hills(par,base,amp,col,seed){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(var x=0;x<=W+20;x+=20){var X=(x/S+camX*par);var y=base+Math.sin(X*0.004+seed)*amp+Math.sin(X*0.011+seed*2)*amp*0.4;g.lineTo(x,wy(y));}g.lineTo(W,H);g.closePath();g.fill();}
function drawChar(x,y,a,sq){g.save();g.translate(x,y);g.rotate(a);var r=22*S;
  g.fillStyle='#ff5a8a';g.beginPath();g.ellipse(-r*0.55,-r*0.85,r*0.32,r*0.4,-0.4,0,7);g.ellipse(r*0.55,-r*0.85,r*0.32,r*0.4,0.4,0,7);g.fill();g.fillStyle='#ffc0d4';g.beginPath();g.ellipse(-r*0.55,-r*0.82,r*0.16,r*0.22,-0.4,0,7);g.ellipse(r*0.55,-r*0.82,r*0.16,r*0.22,0.4,0,7);g.fill();
  g.fillStyle='#ff6a9a';g.beginPath();g.ellipse(0,0,r*(1+sq*0.15),r*(1-sq*0.15),0,0,7);g.fill();g.fillStyle='#ffd0e0';g.beginPath();g.ellipse(0,r*0.35,r*0.6,r*0.45,0,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-r*0.35,-r*0.15,r*0.3,0,7);g.arc(r*0.35,-r*0.15,r*0.3,0,7);g.fill();g.fillStyle='#2a1a3a';g.beginPath();g.arc(-r*0.3,-r*0.12,r*0.16,0,7);g.arc(r*0.4,-r*0.12,r*0.16,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-r*0.25,-r*0.18,r*0.06,0,7);g.arc(r*0.45,-r*0.18,r*0.06,0,7);g.fill();
  g.strokeStyle='#8a2a4a';g.lineWidth=2*S;g.beginPath();g.arc(0,r*0.18,r*0.18,0.2,Math.PI-0.2);g.stroke();
  g.fillStyle='rgba(255,90,120,.5)';g.beginPath();g.arc(-r*0.7,r*0.15,r*0.14,0,7);g.arc(r*0.7,r*0.15,r*0.14,0,7);g.fill();g.restore();}
function draw(){g.setTransform(DPR,0,0,DPR,0,0);var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5a4ab8');gr.addColorStop(0.55,'#ff8a8a');gr.addColorStop(1,'#ffd08a');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,240,200,.9)';g.beginPath();g.arc(W*0.75,wy(330),60*S,0,7);g.fill();
  hills(0.2,470,50,'rgba(120,70,150,.55)',1);hills(0.45,520,40,'rgba(90,50,120,.7)',4);
  if(!P)return;
  // sea
  g.fillStyle='#3a8ad8';g.fillRect(0,wy(SEA),W,H);g.fillStyle='rgba(255,255,255,.35)';for(var x=0;x<W;x+=40){var o=(t*30+x)%40;g.fillRect(x-o+20,wy(SEA)+6+Math.sin(x*0.05+t*2)*3,18,3);}
  // pads
  pads.forEach(function(p){var x=wx(p.x);if(x<-200||x>W+200)return;g.fillStyle='#8a5a3a';g.fillRect(x-4*S,wy(SEA-30),8*S,30*S);g.fillRect(x+p.w*S-4*S,wy(SEA-30),8*S,30*S);g.fillStyle='#ff5a6a';g.beginPath();g.roundRect?g.roundRect(x,wy(SEA-40),p.w*S,14*S,7*S):g.rect(x,wy(SEA-40),p.w*S,14*S);g.fill();g.fillStyle='#fff';g.fillRect(x+10*S,wy(SEA-36),p.w*S-20*S,4*S);});
  // anchors
  var ni=state==='play'&&!rope?nearest():-1;
  anchors.forEach(function(a,i){var x=wx(a.x);if(x<-60||x>W+60)return;var y=wy(a.y);if(i===ni){g.fillStyle='rgba(255,240,120,.35)';g.beginPath();g.arc(x,y,(22+Math.sin(t*8)*3)*S,0,7);g.fill();}g.strokeStyle='#ffd23a';g.lineWidth=6*S;g.beginPath();g.arc(x,y,12*S,0,7);g.stroke();g.strokeStyle='#fff6b0';g.lineWidth=2*S;g.beginPath();g.arc(x,y,12*S,3.6,5.2);g.stroke();});
  coins.forEach(function(c){if(c.got)return;var x=wx(c.x);if(x<-30||x>W+30)return;var w=Math.abs(Math.cos(t*3+c.x))*10*S;g.fillStyle='#ffd23a';g.beginPath();g.ellipse(x,wy(c.y),Math.max(2,w),10*S,0,0,7);g.fill();g.fillStyle='#fff6b0';g.beginPath();g.ellipse(x,wy(c.y),Math.max(1,w*0.4),5*S,0,0,7);g.fill();});
  // trail
  g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=5*S;g.lineCap='round';g.beginPath();trail.forEach(function(p,i){if(i)g.lineTo(wx(p[0]),wy(p[1]));else g.moveTo(wx(p[0]),wy(p[1]));});g.stroke();
  if(rope){g.strokeStyle='#fff';g.lineWidth=3*S;g.beginPath();g.moveTo(wx(rope.a.x),wy(rope.a.y));g.lineTo(wx(P.x),wy(P.y));g.stroke();}
  if(state!=='dead')drawChar(wx(P.x),wy(P.y),P.a,0);
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);if(f.txt){g.font='900 '+Math.round(22*S)+'px Rubik,sans-serif';g.textAlign='center';g.fillStyle='#ffe14a';g.fillText(f.txt,wx(f.x),wy(f.y));}else{g.fillStyle=f.c;g.beginPath();g.arc(wx(f.x),wy(f.y),f.s*S/2,0,7);g.fill();}});g.globalAlpha=1;
  if(state!=='title'){g.textAlign='left';g.font='900 '+Math.round(Math.min(50,W*0.12))+'px Rubik,sans-serif';g.lineWidth=6;g.strokeStyle='rgba(0,0,0,.25)';var top0=Math.max(56,H*0.08);g.strokeText(Math.floor(dist)+'m',18,top0);g.fillStyle='#fff';g.fillText(Math.floor(dist)+'m',18,top0);g.font='800 14px Rubik,sans-serif';g.fillText('★ '+TX.best+' '+best+'m   ● '+coinN,20,top0+22);
    if(state==='play'&&dist<3&&!rope){g.textAlign='center';g.font='900 '+Math.round(26*S)+'px Rubik,sans-serif';g.lineWidth=6;g.strokeText(TX.hold,W/2,H*0.62);g.fillText(TX.hold,W/2,H*0.62);}}}
function step(dt){var G=980;P.vy+=G*dt;
  if(rope){var dx=P.x-rope.a.x,dy=P.y-rope.a.y,d=Math.hypot(dx,dy)||1,tx=-dy/d,ty=dx/d,vt=P.vx*tx+P.vy*ty,push=(vt>=0?1:-1)*260*dt;P.vx+=tx*push;P.vy+=ty*push;}
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(rope){var dx2=P.x-rope.a.x,dy2=P.y-rope.a.y,d2=Math.hypot(dx2,dy2)||1;if(d2>rope.L){var nx=dx2/d2,ny=dy2/d2;P.x=rope.a.x+nx*rope.L;P.y=rope.a.y+ny*rope.L;var vr=P.vx*nx+P.vy*ny;if(vr>0){P.vx-=vr*nx;P.vy-=vr*ny;}}}
  var sp=Math.hypot(P.vx,P.vy);if(sp>1500){P.vx*=1500/sp;P.vy*=1500/sp;}}
function tick(dt){t+=dt;FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.gr)f.vy+=900*dt;});FX=FX.filter(function(f){return f.l>0;});
  if(state!=='play'||!P)return;
  var n=3;for(var i=0;i<n;i++)step(dt/n);
  if(rope){var ta=Math.atan2(rope.a.y-P.y,rope.a.x-P.x)+Math.PI/2,df=Math.atan2(Math.sin(ta-P.a),Math.cos(ta-P.a));P.a+=df*Math.min(1,dt*12);}else P.a+=P.vx*0.006*dt;
  if(P.y<-200){P.vy=Math.max(P.vy,0);}
  pads.forEach(function(p){if(P.vy>0&&P.x>p.x&&P.x<p.x+p.w&&P.y>SEA-62&&P.y<SEA-30){P.vy=-980;P.y=SEA-62;tone(300,0.15,'sine',0.06,2.5);FX.push({x:P.x,y:P.y-30,vx:0,vy:-40,l:0.6,txt:'BOING!'});}});
  coins.forEach(function(c){if(!c.got&&Math.hypot(c.x-P.x,c.y-P.y)<34){c.got=true;coinN++;tone(1100,0.06,'square',0.03,1.4);for(var k=0;k<5;k++){var a=Math.random()*6.283;FX.push({x:c.x,y:c.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,l:0.4,c:'#ffe14a',s:5});}}});
  if(P.y>SEA-10)return die();
  dist=Math.max(dist,P.x/60);
  trail.push([P.x,P.y]);if(trail.length>14)trail.shift();
  var targetCam=P.x-W/S*0.35;camX+=(targetCam-camX)*Math.min(1,dt*5);
  gen(camX+W/S+800);anchors=anchors.filter(function(a){return a.x>camX-400;});coins=coins.filter(function(c){return c.x>camX-200;});pads=pads.filter(function(p){return p.x>camX-300;});}
var last=performance.now();function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;tick(dt);draw();cgSync();requestAnimationFrame(frame);}
fit();reset();state='title';requestAnimationFrame(frame);
</script>
</body>
</html>
