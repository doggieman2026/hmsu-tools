<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AI Game Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1d2e;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:0 0 auto;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:14px;background:#242840}
#mission{flex:0 0 auto;padding:8px 12px;background:#2e3354;font-size:13px;line-height:1.5}
#mission b{color:#ffd84a}
#stage{position:relative;flex:0 0 auto;height:42vh;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#chat{flex:1 1 auto;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.msg{max-width:85%;padding:8px 11px;border-radius:14px;line-height:1.45;white-space:pre-wrap}
.me{align-self:flex-end;background:#3a7ae0;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#2e3354;border-bottom-left-radius:4px}
.code{align-self:flex-start;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0e1020;color:#7ae0a0;padding:8px 11px;border-radius:10px;border-left:3px solid #7ae0a0;max-width:92%;white-space:pre-wrap}
#chips{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#20243a}
.chip{flex:0 0 auto;font:inherit;font-size:13px;font-weight:800;border:2px solid #5a6aa8;background:#2e3354;color:#fff;border-radius:16px;padding:6px 11px;cursor:pointer}
#bar{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#20243a}
#inp{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:2px solid #5a6aa8;background:#14172a;color:#fff;min-width:0}
.btn2{font:inherit;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:10px 14px;color:#fff;cursor:pointer}
#send{background:#3a7ae0}#test{background:#2aa03a}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,15,30,.85);text-align:center;padding:24px;z-index:5}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(46px,13vw,80px);line-height:.95;font-weight:900;font-style:italic;color:#7ae0ff;text-shadow:0 5px 0 #1a4a8a}
.over h1 small{display:block;font-size:.62em;color:#ffd84a;text-shadow:0 4px 0 #8a5010}
.over p{margin:0;max-width:360px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#5ad8ff,#2a7ae0);color:#fff;box-shadow:0 6px 0 #1a3a8a;cursor:pointer;min-width:230px}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);box-shadow:0 5px 0 #9a5010}
</style>
</head>
<body>
<div id="app">
 <div id="top"><span id="studio">🏢 AI Game Studio</span><span id="stars">⭐ 0</span></div>

</div>

<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(36px,10vw,60px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>

 :{how:'You\'re a rookie programmer at a game studio. <b>Tell your AI partner "Cody" what you want in plain words</b> and Cody writes the code and builds the game.<br>Build what each client orders, then playtest and clear it yourself to ship it!',play:'ENTER STUDIO',send:'Send',test:'▶ Test',stop:'■ Edit',ph:'Tell Cody what to build (e.g. "let the player jump")',stars:'⭐',ok:'Shipped!',okP:'The game matches the client\'s order!',next:'Next order',miss:'Something doesn\'t match the order yet:',win:'CLEAR!',lose:'GAME OVER',retry:'Test again',allDone:'All orders shipped!',allP:'You\'re a real AI game creator now. Keep building freely in Free Mode.',free:'Free Mode',hello:'Hi! I\'m Cody. What shall we build? Tap a button below or just tell me.',unk:'Sorry, I didn\'t get that… Try "jump", "10 coins", "faster enemies" or "space".',reqMet:'Order check: ',client:'Client',done:'When it looks right, hit ▶ Test and clear it!'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('send').textContent=TX.send;$('test').textContent=TX.test;$('inp').placeholder=TX.ph;$('again').textContent=TX.next;
var store={get:function(k,f){try{var v=localStorage.getItem('ags-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('ags-'+k,JSON.stringify(v));}catch(e){}}};
var SV=store.get('sv',{m:0,stars:0});
// ---------- game spec (what Cody builds) ----------
function blank(){return {mode:'none',theme:'grid',coins:0,enemies:0,eSpeed:1,flyers:0,spikes:0,goal:false,timer:0,lives:1,gravity:true,hero:'cube',dash:false};}
var spec=blank();
// missions: req = list of checks
var M=[
 {ja:'「ぴょんぴょん跳ねる、かんたんなゲームがほしいな」',en:'"I want a simple game where you jump around."',req:[['mode','plat'],['goal',true]],chips:{ja:['ジャンプできるようにして','ゴールの旗を置いて'],en:['Let the player jump','Add a goal flag']}},
 {ja:'「森の中でコインを5枚集めるゲームを作って！」',en:'"Make a forest game where you collect 5 coins!"',req:[['mode','plat'],['theme','forest'],['coins',5]],chips:{ja:['ジャンプできるようにして','森のステージにして','コインを5枚置いて'],en:['Let the player jump','Make it a forest','Put 5 coins']}},
 {ja:'「敵をよけてゴールする、ドキドキするやつ」',en:'"Dodge enemies and reach the goal — something thrilling."',req:[['mode','plat'],['enemies',3,'>='],['goal',true]],chips:{ja:['ジャンプできるようにして','敵を3体出して','ゴールを置いて'],en:['Let the player jump','Add 3 enemies','Add a goal']}},
 {ja:'「宇宙で、上下左右に動いて星（コイン）を8個あつめたい」',en:'"In space, move in all four directions and collect 8 stars (coins)."',req:[['mode','top'],['theme','space'],['coins',8]],chips:{ja:['上下左右に動けるようにして','宇宙にして','コインを8枚'],en:['Move in 4 directions','Make it space','8 coins']}},
 {ja:'「30秒生きのこるゲーム。敵は速めで！」',en:'"A 30-second survival game. Make the enemies fast!"',req:[['timer',30],['enemies',4,'>='],['eSpeed',1.5,'>=']],chips:{ja:['上下左右に動けるようにして','30秒生きのこったらクリア','敵を5体','敵を速くして'],en:['Move in 4 directions','Survive 30 seconds to win','5 enemies','Faster enemies']}},
 {ja:'「海のステージで、トゲと空とぶ敵がいるアクション」',en:'"An ocean stage action game with spikes and flying enemies."',req:[['mode','plat'],['theme','sea'],['spikes',2,'>='],['flyers',2,'>='],['goal',true]],chips:{ja:['ジャンプできるようにして','海にして','トゲを3つ','空とぶ敵を2体','ゴールを置いて'],en:['Let the player jump','Make it the sea','3 spikes','2 flying enemies','Add a goal']}},
 {ja:'「ネコが主人公で、ライフ3つ。コイン10枚とゴール両方」',en:'"A cat hero with 3 lives. Both 10 coins and a goal."',req:[['hero','cat'],['lives',3],['coins',10],['goal',true]],chips:{ja:['主人公をネコにして','ライフを3つ','コインを10枚','ゴールを置いて','ジャンプできるようにして'],en:['Make the hero a cat','3 lives','10 coins','Add a goal','Let the player jump']}},
 {ja:'「最後の注文：あなたの好きなように、敵5体以上・コイン10枚以上のゲーム！」',en:'"Final order: your own game with 5+ enemies and 10+ coins!"',req:[['enemies',5,'>='],['coins',10,'>=']],chips:{ja:['ジャンプできるようにして','敵を5体','コインを12枚','ダッシュできるようにして','夜の街にして','ゴールを置いて'],en:['Let the player jump','5 enemies','12 coins','Add a dash','Make it a night city','Add a goal']}}];
var mi=Math.min(SV.m,M.length);
function checkReq(m){var bad=[];m.req.forEach(function(r){var k=r[0],v=r[1],op=r[2],s=spec[k],ok=op==='>='?s>=v:s===v;if(k==='coins'&&!op)ok=s===v;if(!ok)bad.push(r);});return bad;}
function reqLabel(r){var k=r[0],v=r[1],ja={mode:{plat:'ジャンプするアクション',top:'上下左右に動く'},theme:{forest:'森',space:'宇宙',sea:'海',city:'夜の街'},hero:{cat:'ネコの主人公'}},en={mode:{plat:'jumping platformer',top:'4-direction movement'},theme:{forest:'forest',space:'space',sea:'sea',city:'night city'},hero:{cat:'cat hero'}};
  if(k==='mode'||k==='theme'||k==='hero')return (JA?ja:en)[k][v];if(k==='goal')return JA?'ゴールの旗':'goal flag';if(k==='coins')return (JA?'コイン':'coins ')+(r[2]?v+'+':v)+(JA?'枚':'');if(k==='enemies')return (JA?'敵':'enemies ')+v+(r[2]?'+':'')+(JA?'体':'');if(k==='flyers')return (JA?'空とぶ敵':'flyers ')+v+'+';if(k==='spikes')return (JA?'トゲ':'spikes ')+v+'+';if(k==='timer')return v+(JA?'秒生きのこる':'s survival');if(k==='eSpeed')return JA?'速い敵':'fast enemies';if(k==='lives')return (JA?'ライフ':'lives ')+v;return k;}
// ---------- Cody: tiny rule-based language parser ----------
function num(s,def){var m=s.match(/(\d+)/);if(m)return parseInt(m[1],10);var kan={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};for(var k in kan)if(s.indexOf(k)>=0)return kan[k];return def;}
function numNear(s,words,def){var best=null,bd=99;words.forEach(function(w){var i=s.indexOf(w);if(i<0)return;var re=/(\d+)|([一二三四五六七八九十])/g,m;while((m=re.exec(s))){var pos=m.index,d=pos>=i?pos-(i+w.length):i-(pos+m[0].length);if(pos>=i)d=Math.max(0,d);else d=d+0.5;if(d<bd&&d<8){bd=d;best=m[1]?parseInt(m[1],10):{'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10}[m[2]];}}});return best==null?def:best;}
function has(s,arr){return arr.some(function(w){return s.indexOf(w)>=0;});}
function cody(raw){var s=raw.toLowerCase(),acts=[],code=[];
  if(has(s,['ジャンプ','跳','とべ','jump','platform'])){spec.mode='plat';spec.gravity=true;acts.push(JA?'ジャンプできるようにしたよ':'Player can jump now');code.push('player.gravity = true;\nplayer.onTap(() => player.jump(12));');}
  if(has(s,['上下左右','4方向','四方向','見下ろし','four','4 dir','all direction','top-down','topdown'])){spec.mode='top';spec.gravity=false;acts.push(JA?'上下左右に動けるようにしたよ':'Player moves in 4 directions');code.push('player.gravity = false;\nplayer.move = joystick.dir;');}
  if(has(s,['重力なし','無重力','no gravity','zero g'])){spec.gravity=false;if(spec.mode==='plat')spec.mode='top';acts.push(JA?'重力をなくしたよ':'Gravity off');code.push('world.gravity = 0;');}
  if(has(s,['コイン','星','coin','star'])&&!has(s,['なし','消して','remove','no coin'])){var n=numNear(s,['コイン','星','coin','star'],5);spec.coins=Math.min(20,n);acts.push((JA?'コインを':'Placed ')+spec.coins+(JA?'枚置いたよ':' coins'));code.push('for (let i = 0; i < '+spec.coins+'; i++) spawn(Coin);');}
  if(has(s,['空とぶ','空飛ぶ','飛ぶ敵','コウモリ','fly','flying','bird'])){var n2=numNear(s,['空とぶ','空飛ぶ','飛ぶ敵','コウモリ','fly','bird'],2);spec.flyers=Math.min(6,n2);acts.push((JA?'空とぶ敵を':'Added ')+spec.flyers+(JA?'体にしたよ':' flying enemies'));code.push('spawn(Flyer, '+spec.flyers+');');}
  else if(has(s,['敵','モンスター','enem','monster'])&&!has(s,['速','おそ','遅','fast','slow'])){var n3=numNear(s,['敵','モンスター','enem','monster'],3);spec.enemies=Math.min(10,n3);acts.push((JA?'敵を':'Added ')+spec.enemies+(JA?'体出したよ':' enemies'));code.push('spawn(Walker, '+spec.enemies+');');}
  if(has(s,['速く','はやく','速い','fast','quick'])){spec.eSpeed=Math.min(2.5,spec.eSpeed+0.6);if(!spec.enemies)spec.enemies=3;acts.push(JA?'敵のスピードを上げたよ':'Enemies are faster');code.push('Walker.speed *= 1.6;');}
  if(has(s,['おそく','遅く','ゆっくり','slow'])){spec.eSpeed=Math.max(0.5,spec.eSpeed-0.4);acts.push(JA?'敵をゆっくりにしたよ':'Enemies slowed down');code.push('Walker.speed *= 0.6;');}
  if(has(s,['トゲ','とげ','針','spike'])){var n4=numNear(s,['トゲ','とげ','針','spike'],3);spec.spikes=Math.min(8,n4);acts.push((JA?'トゲを':'Added ')+spec.spikes+(JA?'つ置いたよ':' spikes'));code.push('spawn(Spike, '+spec.spikes+');');}
  if(has(s,['ゴール','旗','goal','flag','finish'])){spec.goal=true;acts.push(JA?'ゴールの旗を置いたよ':'Goal flag placed');code.push('world.add(GoalFlag, { x: world.end });');}
  if(has(s,['秒','second','sec','survive','生き'])){var n5=numNear(s,['秒','second','sec'],30);spec.timer=Math.min(120,n5);acts.push(n5+(JA?'秒生きのこったらクリアにしたよ':'s survival = win'));code.push('rules.winAfter('+spec.timer+');');}
  if(has(s,['ライフ','残機','life','lives','hp'])){var n6=numNear(s,['ライフ','残機','life','lives','hp'],3);spec.lives=Math.min(9,Math.max(1,n6));acts.push((JA?'ライフを':'Lives set to ')+spec.lives+(JA?'つにしたよ':''));code.push('player.lives = '+spec.lives+';');}
  if(has(s,['ダッシュ','dash'])){spec.dash=true;acts.push(JA?'ダッシュボタンをつけたよ':'Dash button added');code.push('player.onButton("B", () => player.dash(3));');}
  [['森','forest',['森','forest','jungle']],['宇宙','space',['宇宙','space','星空']],['海','sea',['海','sea','ocean','水中']],['夜の街','city',['夜','街','city','night']]].forEach(function(t){if(has(s,t[2])&&!(t[1]==='space'&&has(s,['星を','star'])&&!has(s,['宇宙','space']))){spec.theme=t[1];acts.push((JA?t[0]+'のステージにしたよ':'Theme: '+t[1]));code.push('world.theme = "'+t[1]+'";');}});
  [['ネコ','cat',['ネコ','猫','ねこ','cat']],['ロボ','robot',['ロボ','robot']],['スライム','slime',['スライム','slime']]].forEach(function(h){if(has(s,h[2])){spec.hero=h[1];acts.push((JA?'主人公を'+h[0]+'にしたよ':'Hero is now a '+h[1]));code.push('player.sprite = "'+h[1]+'";');}});
  if(has(s,['むずかし','難し','harder','hard'])){spec.enemies=Math.min(10,spec.enemies+2);spec.eSpeed=Math.min(2.5,spec.eSpeed+0.3);spec.spikes=Math.min(8,spec.spikes+1);acts.push(JA?'敵とトゲを増やして、むずかしくしたよ':'Made it harder');code.push('difficulty++;');}
  if(has(s,['かんたん','簡単','easier','easy'])){spec.enemies=Math.max(0,spec.enemies-2);spec.spikes=Math.max(0,spec.spikes-1);spec.eSpeed=Math.max(0.6,spec.eSpeed-0.3);acts.push(JA?'敵を減らしてかんたんにしたよ':'Made it easier');code.push('difficulty--;');}
  if(has(s,['リセット','最初から','reset','clear all'])){spec=blank();acts.push(JA?'ぜんぶ消して最初からにしたよ':'Reset everything');code.push('world.clear();');}
  if(spec.mode==='none'&&acts.length&&!has(s,['リセット','reset'])){spec.mode='plat';code.unshift('player.gravity = true; // default');}
  return {acts:acts,code:code};}
// ---------- chat UI ----------
function addMsg(cls,text){var d=document.createElement('div');d.className='msg '+cls;if(cls==='code')d.className='code';d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d;}
var typing=Promise.resolve();
function typeCode(text){typing=typing.then(function(){return new Promise(function(res){var d=addMsg('code','');var i=0;var iv=setInterval(function(){i+=3;d.textContent=text.slice(0,i);$('chat').scrollTop=1e9;tone(1500+Math.random()*400,0.01,'square',0.008,1);if(i>=text.length){clearInterval(iv);res();}},18);});});return typing;}
function aiSay(text){typing=typing.then(function(){return new Promise(function(res){setTimeout(function(){addMsg('ai','🤖 '+text);res();},250);});});return typing;}
function send(text){text=(text||'').trim();if(!text||mode2==='test')return;addMsg('me',text);$('inp').value='';var r=cody(text);
  if(!r.acts.length){aiSay(TX.unk);return;}
  aiSay(r.acts.join(JA?'。':'. ')+(JA?'！':'!'));typeCode(r.code.join('\n'));typing.then(function(){buildWorld();if(mi<M.length){var bad=checkReq(M[mi]);var total=M[mi].req.length;aiSay(TX.reqMet+(total-bad.length)+'/'+total+(bad.length?'':(JA?' ✅ '+TX.done:' ✅ '+TX.done)));}renderMission();});}
$('send').onclick=function(){send($('inp').value);};
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'){send($('inp').value);e.preventDefault();}});
function renderMission(){var el=$('mission');if(mi>=M.length){el.innerHTML='🎨 <b>'+TX.free+'</b>';}else{var m=M[mi],bad=checkReq(m);el.innerHTML='📩 <b>'+TX.client+' '+(mi+1)+'/'+M.length+'</b>：'+(JA?m.ja:m.en)+'<br>'+m.req.map(function(r){var ok=bad.indexOf(r)<0;return (ok?'✅':'⬜')+' '+reqLabel(r);}).join('　');}
  $('stars').textContent='⭐ '+SV.stars;var ch=$('chips');ch.innerHTML='';var list=mi<M.length?(JA?M[mi].chips.ja:M[mi].chips.en):(JA?['ジャンプできるようにして','上下左右に動けるようにして','コインを15枚','敵を6体','空とぶ敵を3体','トゲを4つ','ゴールを置いて','60秒生きのこる','宇宙にして','海にして','主人公をスライムに','むずかしくして','リセット']:['Let the player jump','Move in 4 directions','15 coins','6 enemies','3 flying enemies','4 spikes','Add a goal','Survive 60 seconds','Make it space','Make it the sea','Make the hero a slime','Make it harder','Reset']);
  list.forEach(function(c){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=c;b.onclick=function(){send(c);};ch.appendChild(b);});}
// ---------- the mini game engine ----------
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR;
var mode2='edit',state='title',t=0,world=null,pl=null,keys={},btn={l:0,r:0,j:0,d:0},joy=null,games=0,FX=[],msgT=0,msgTxt='';
function fit(){DPR=Math.min(2,devicePixelRatio||1);var r=$('stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',function(){fit();});
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}

var last=performance.now();function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();cgSync();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
</script>
