<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Deck Delve</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1e1830;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,10,25,.75);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#7ad8ff;text-shadow:0 5px 0 #2a4a8a,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.72em;color:#ffd84a;text-shadow:0 5px 0 #8a4a10}
.over p{margin:0;max-width:350px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#5ab0ff,#2a6ae0);color:#fff;text-shadow:0 2px 0 #1a3a8a;box-shadow:0 6px 0 #1a3a8a;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a3a8a}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);text-shadow:0 2px 0 #9a5010;box-shadow:0 5px 0 #9a5010}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>DECK<small>DELVE</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(44px,12vw,72px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'カードで戦うダンジョンRPG。毎ターン⚡3のエネルギーでカードを使おう。<br>敵の頭の上に、次に何をしてくるかが出るよ。<br>勝つとカードが1枚もらえる。10戦目のボスをたおせ！',play:'あそぶ',again:'もういちど',end:'ターン終了',floor:'フロア',pick:'カードを1枚えらぶ',skip:'スキップ',dead:'やられた…',win:'ダンジョン制覇！',cont:'▶ 広告を見て復活',na:'広告を読み込めませんでした',best:'さいこう',energy:'エネルギーがたりない'}
 :{how:'A dungeon RPG fought with cards. Spend ⚡3 energy each turn.<br>The icon over the enemy shows what it will do next.<br>Win to add a card to your deck. Beat the boss on floor 10!',play:'PLAY',again:'TRY AGAIN',end:'END TURN',floor:'Floor',pick:'Pick a card',skip:'Skip',dead:'Defeated…',win:'Dungeon cleared!',cont:'▶ Watch ad: revive',na:'Ad not available',best:'Best',energy:'Not enough energy'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('dd-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('dd-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
// card defs: cost, type a/s, effect
var CARDS={
 strike:{ja:'ストライク',en:'Strike',c:1,t:'a',d:6,txt:{ja:'6ダメージ',en:'Deal 6'}},
 defend:{ja:'ガード',en:'Defend',c:1,t:'s',b:5,txt:{ja:'ブロック5',en:'Block 5'}},
 bash:{ja:'ぶちかまし',en:'Bash',c:2,t:'a',d:8,vul:2,txt:{ja:'8ダメージ 弱体2',en:'Deal 8, Vulnerable 2'}},
 heavy:{ja:'メガトン',en:'Heavy Blow',c:2,t:'a',d:15,txt:{ja:'15ダメージ',en:'Deal 15'}},
 twin:{ja:'二連斬り',en:'Twin Strike',c:1,t:'a',d:4,hits:2,txt:{ja:'4ダメージ×2',en:'Deal 4 ×2'}},
 quick:{ja:'はやわざ',en:'Quick Cut',c:0,t:'a',d:3,draw:1,txt:{ja:'3ダメージ 1枚引く',en:'Deal 3, draw 1'}},
 wall:{ja:'鉄壁',en:'Iron Wall',c:2,t:'s',b:13,txt:{ja:'ブロック13',en:'Block 13'}},
 skin:{ja:'身がまえ',en:'Brace',c:1,t:'s',b:7,draw:1,txt:{ja:'ブロック7 1枚引く',en:'Block 7, draw 1'}},
 poison:{ja:'どくの刃',en:'Venom Blade',c:1,t:'a',d:3,psn:4,txt:{ja:'3ダメージ 毒4',en:'Deal 3, Poison 4'}},
 rage:{ja:'気合い',en:'Focus',c:1,t:'s',str:2,ex:1,txt:{ja:'力+2（戦闘中）消える',en:'+2 Strength. Exhaust'}},
 heal:{ja:'ポーション',en:'Potion',c:1,t:'s',heal:8,ex:1,txt:{ja:'HP8回復 消える',en:'Heal 8. Exhaust'}},
 storm:{ja:'刃の嵐',en:'Blade Storm',c:3,t:'a',d:6,hits:4,txt:{ja:'6ダメージ×4',en:'Deal 6 ×4'}},
 surge:{ja:'ひらめき',en:'Insight',c:0,t:'s',draw:2,en2:1,ex:1,txt:{ja:'2枚引く ⚡+1 消える',en:'Draw 2, +1⚡. Exhaust'}}};
var POOL=['heavy','twin','quick','wall','skin','poison','rage','heal','storm','surge','bash'];
var FOES=[{k:'beetle',ja:'コケ虫',en:'Moss Beetle',hp:26,pat:[['a',7],['b',6],['a',9]]},{k:'wisp',ja:'インク火',en:'Ink Wisp',hp:22,pat:[['a',5],['a',5],['d',2]]},{k:'mimic',ja:'ミミック',en:'Mimic',hp:34,pat:[['b',8],['a',13]]},{k:'knight',ja:'ろうそく騎士',en:'Candle Knight',hp:40,pat:[['a',10],['s',3],['a',8]]},{k:'crab',ja:'水晶ガニ',en:'Crystal Crab',hp:46,pat:[['b',12],['a',9],['a',12]]}];
var BOSS={k:'owl',ja:'ゼンマイフクロウ',en:'Clockwork Owl',hp:120,pat:[['a',12],['s',3],['a',8],['b',15],['a',24]]};
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,U;
var P,foe,deck=[],draw=[],disc=[],hand=[],energy=3,floorN=1,state='title',t=0,FX=[],nums=[],used=false,games=0,reward=null,shake=0,msg='',msgT=0,busy=0,hover=-1;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;U=Math.min(W/390,H/760);}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function nm(o){return JA?o.ja:o.en;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function start(){P={hp:60,max:60,block:0,str:0};deck=['strike','strike','strike','strike','strike','defend','defend','defend','defend','bash'];floorN=1;used=false;FX=[];startFight();state='play';}
function startFight(){var b=floorN===10?BOSS:FOES[Math.min(FOES.length-1,Math.floor((floorN-1)/2)+(Math.random()<0.4?1:0))],sc=floorN===10?1:1+(floorN-1)*0.1;
  foe={b:b,hp:Math.round(b.hp*sc),max:Math.round(b.hp*sc),block:0,vul:0,psn:0,str:0,i:0,hit:0,sc:sc};P.block=0;P.str=0;draw=shuffle(deck.slice());disc=[];hand=[];startTurn();}
function intent(){var p=foe.b.pat[foe.i%foe.b.pat.length];return {k:p[0],v:p[0]==='a'?Math.round(p[1]*foe.sc)+foe.str:p[1]};}
function startTurn(){energy=3;P.block=0;drawN(5);}
function drawN(n){for(var i=0;i<n;i++){if(!draw.length){if(!disc.length)break;draw=shuffle(disc);disc=[];}if(hand.length>=9)break;hand.push(draw.pop());}}
function hitFoe(d){d=d+P.str;if(foe.vul>0)d=Math.floor(d*1.5);var b=Math.min(foe.block,d);foe.block-=b;d-=b;foe.hp-=d;foe.hit=0.3;nums.push({v:d,x:W/2+(Math.random()-0.5)*40*U,y:H*0.3,l:1,c:'#ffd84a'});tone(400+Math.random()*200,0.06,'square',0.05,0.6);for(var k=0;k<6;k++){var a=Math.random()*6.283;FX.push({x:W/2,y:H*0.3,vx:Math.cos(a)*200,vy:Math.sin(a)*200,l:0.4,c:'#fff'});}}
function play(i){if(state!=='play'||busy>0)return;var id=hand[i],c=CARDS[id];if(c.c>energy){msg=TX.energy;msgT=1.2;tone(150,0.08,'square',0.03,0.8);return;}energy-=c.c;hand.splice(i,1);
  if(c.d){for(var h=0;h<(c.hits||1);h++)hitFoe(c.d);}if(c.vul)foe.vul+=c.vul;if(c.psn)foe.psn+=c.psn;if(c.b){P.block+=c.b;tone(300,0.08,'triangle',0.04,1.5);}if(c.str)P.str+=c.str;if(c.heal){P.hp=Math.min(P.max,P.hp+c.heal);nums.push({v:'+'+c.heal,x:W*0.25,y:H*0.55,l:1,c:'#7aff8a'});}if(c.en2)energy+=c.en2;if(c.draw)drawN(c.draw);
  if(!c.ex)disc.push(id);if(c.t==='s'&&!c.d)tone(520,0.06,'triangle',0.035,1.3);
  if(foe.hp<=0){busy=0.8;setTimeout(winFight,700);}}
function endTurn(){if(state!=='play'||busy>0)return;disc=disc.concat(hand);hand=[];busy=1.0;
  setTimeout(function(){if(state!=='play')return;// poison
    if(foe.psn>0){foe.hp-=foe.psn;nums.push({v:foe.psn,x:W/2,y:H*0.25,l:1,c:'#9aff6a'});foe.psn--;if(foe.hp<=0){setTimeout(winFight,400);return;}}
    foe.block=0;var it=intent();if(it.k==='a'){var d=it.v,b=Math.min(P.block,d);P.block-=b;d-=b;P.hp-=d;shake=0.3;nums.push({v:d,x:W*0.25,y:H*0.55,l:1,c:'#ff5a5a'});tone(160,0.15,'square',0.07,0.6);}
    else if(it.k==='b'){foe.block+=it.v;tone(300,0.08,'triangle',0.04,1.5);}else if(it.k==='s'){foe.str+=it.v;tone(700,0.1,'sawtooth',0.03,1.5);}else if(it.k==='d'){P.weak=(P.weak||0)+it.v;P.str-=1;tone(200,0.1,'sine',0.04,0.5);}
    foe.i++;if(foe.vul>0)foe.vul--;if(P.hp<=0){P.hp=0;setTimeout(die,500);return;}startTurn();},450);}
function winFight(){if(state!=='play')return;tone(660,0.1,'square',0.05,1.5);setTimeout(function(){tone(990,0.15,'square',0.05,1.3);},100);if(floorN>best){best=floorN;store.set('best',best);}
  if(floorN===10){state='won';games++;setTimeout(function(){var show=function(){$('endT').textContent=TX.win;$('endP').innerHTML=TX.floor+' 10 · '+deck.length+(JA?'枚のデッキ':' cards');$('cont').hidden=true;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},600);return;}
  P.hp=Math.min(P.max,P.hp+Math.round(P.max*0.12));var opts=shuffle(POOL.slice()).slice(0,3);reward={opts:opts};state='reward';}
function pickReward(i){if(state!=='reward')return;if(i>=0)deck.push(reward.opts[i]);reward=null;floorN++;startFight();state='play';busy=0.3;tone(800,0.08,'square',0.04,1.3);}
function die(){if(state!=='play')return;state='dead';games++;if(floorN>best){best=floorN;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=TX.dead;$('endP').innerHTML=TX.floor+' '+floorN+' · '+TX.best+' '+best;$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},500);}
$('play').onclick=function(){$('title').hidden=true;start();};
$('again').onclick=function(){$('end').hidden=true;start();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;P.hp=Math.round(P.max*0.5);$('end').hidden=true;state='play';busy=0;startTurn();},function(){b.textContent=TX.na;});};
// ---- layout ----
function cardRects(){var n=hand.length,cw=Math.min(92*U,(W-20)/Math.max(4,n)*1.25),ch=cw*1.42,gap=Math.min(cw+6,(W-20-cw)/Math.max(1,n-1)),tot=cw+gap*(n-1),x0=(W-tot)/2,y0=H-ch-16*U;return hand.map(function(_,i){var off=i-(n-1)/2;return {x:x0+i*gap,y:y0+Math.abs(off)*off*0+Math.abs(off)*4*U,w:cw,h:ch,r:off*0.04};});}
function endRect(){return {x:W-118*U,y:H*0.62,w:106*U,h:44*U};}
function rewardRects(){var cw=Math.min(105*U,(W-40)/3),ch=cw*1.42,x0=(W-cw*3-20)/2;return [0,1,2].map(function(i){return {x:x0+i*(cw+10),y:H*0.36,w:cw,h:ch};});}
cv.addEventListener('pointerdown',function(e){e.preventDefault();var x=e.clientX,y=e.clientY;
  if(state==='reward'){var rr2=rewardRects();for(var i=0;i<3;i++){var r=rr2[i];if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h){pickReward(i);return;}}if(y>H*0.36+rr2[0].h+20&&y<H*0.36+rr2[0].h+70)pickReward(-1);return;}
  if(state!=='play')return;var er=endRect();if(x>er.x&&x<er.x+er.w&&y>er.y&&y<er.y+er.h){endTurn();return;}
  var cr=cardRects();for(var j=cr.length-1;j>=0;j--){var c=cr[j];if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){play(j);return;}}});
addEventListener('keydown',function(e){if(state==='play'){var n=parseInt(e.key,10);if(n>=1&&n<=9&&n<=hand.length)play(n-1);if(e.key==='e'||e.key==='Enter')endTurn();}else if(state==='reward'){var m=parseInt(e.key,10);if(m>=1&&m<=3)pickReward(m-1);if(e.key==='0')pickReward(-1);}});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play'||state==='reward';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- art ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function E(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawFoe(k,x,y,s){var bob=Math.sin(t*3)*s*0.03;y+=bob;E(x,y+s*0.55,s*0.55,s*0.1,'rgba(0,0,0,.35)');
  if(k==='beetle'){E(x,y+s*0.1,s*0.55,s*0.42,'#3a6a3a');E(x,y,s*0.5,s*0.36,'#5aa04a');g.strokeStyle='#2a4a2a';g.lineWidth=3*U;g.beginPath();g.moveTo(x,y-s*0.36);g.lineTo(x,y+s*0.36);g.stroke();[[-0.25,-0.1],[0.2,0.05],[-0.1,0.2],[0.3,-0.2]].forEach(function(p){C(x+p[0]*s,y+p[1]*s,s*0.07,'#8ad86a');});E(x,y-s*0.4,s*0.25,s*0.15,'#2a4a2a');C(x-s*0.1,y-s*0.42,s*0.05,'#ffd84a');C(x+s*0.1,y-s*0.42,s*0.05,'#ffd84a');}
  else if(k==='wisp'){for(var i=0;i<5;i++){C(x+Math.sin(t*4+i)*s*0.1,y+s*0.3-i*s*0.15,s*(0.42-i*0.06),i%2?'#4a3aa0':'#6a50c8');}C(x-s*0.12,y-s*0.05,s*0.09,'#fff');C(x+s*0.12,y-s*0.05,s*0.09,'#fff');C(x-s*0.11,y-s*0.04,s*0.045,'#1a1030');C(x+s*0.13,y-s*0.04,s*0.045,'#1a1030');g.fillStyle='#1a1030';g.beginPath();g.arc(x,y+s*0.1,s*0.06,0,3.14);g.fill();}
  else if(k==='mimic'){g.fillStyle='#8a5a32';g.fillRect(x-s*0.5,y-s*0.05,s,s*0.5);var op=(Math.sin(t*2)*0.5+0.5)*0.25;g.save();g.translate(x,y-s*0.05);g.rotate(-op);g.fillStyle='#a86a3a';g.fillRect(-s*0.5,-s*0.3,s,s*0.3);g.fillStyle='#ffd84a';g.fillRect(-s*0.5,-s*0.05,s,s*0.05);g.restore();g.fillStyle='#fff';for(var j=0;j<6;j++){g.beginPath();g.moveTo(x-s*0.45+j*s*0.18,y-s*0.04);g.lineTo(x-s*0.36+j*s*0.18,y+s*0.08);g.lineTo(x-s*0.27+j*s*0.18,y-s*0.04);g.fill();}C(x-s*0.15,y+s*0.2,s*0.06,'#e83a4a');C(x+s*0.15,y+s*0.2,s*0.06,'#e83a4a');}
