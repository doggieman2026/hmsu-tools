<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライム vs おばけ</title>
<style>
  html,body{margin:0;height:100%;background:#1b1340;overflow:hidden;touch-action:none;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;let scale=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);scale=s;const dpr=devicePixelRatio||1;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*dpr;cv.height=H*s*dpr;ctx.setTransform(s*dpr,0,0,s*dpr,0,0);}
addEventListener('resize',resize);resize();

// ---------- sound ----------
let ac=null;
function snd(f,d=0.08,type='square',vol=0.05,slide=0){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

// ---------- data ----------
const COLORS=[{n:'みどり',c:'#5fd16a',d:'#3a9a45'},{n:'あお',c:'#5ab4ff',d:'#2f7fd0'},{n:'ピンク',c:'#ff8ad0',d:'#d0559f'},{n:'きいろ',c:'#ffd84a',d:'#d0a520'}];
let colorIdx=0;
let best=0;try{best=+localStorage.getItem('slimeBest')||0}catch(e){}

let state='title',player,shots,ghosts,ebul,items,parts,stars,wave,score,waveTimer,spawnLeft,boss,msg,msgT,shake,t;
function reset(){
  player={x:W/2,y:H-110,hp:3,inv:0,fire:0,power:1,powerT:0,shield:0,squash:0,tx:W/2,ty:H-110};
  shots=[];ghosts=[];ebul=[];items=[];parts=[];wave=0;score=0;boss=null;shake=0;t=0;
  nextWave();
}
parts=[];msgT=0;t=0;
stars=[];for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5});

function nextWave(){
  wave++;
  if(wave%5===0){spawnLeft=0;boss={x:W/2,y:-80,ty:120,hp:30+wave*6,max:30+wave*6,t:0,hit:0};say('おおきい おばけが きた！');snd(120,0.5,'sawtooth',0.06,-60);}
  else{spawnLeft=6+wave*2;say('ウェーブ '+wave);}
  waveTimer=60;
}
function say(s){msg=s;msgT=100;}

// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key==='Enter')tap(W/2,H/2);});
addEventListener('keyup',e=>{keys[e.key]=0});
let drag=null;
function pos(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/scale,y:(p.clientY-r.top)/scale};}
cv.addEventListener('pointerdown',e=>{const p=pos(e);if(state!=='play'){tap(p.x,p.y);return;}
  drag={sx:p.x,sy:p.y,px:player.tx,py:player.ty};});
cv.addEventListener('pointermove',e=>{if(!drag||state!=='play')return;const p=pos(e);
  player.tx=clamp(drag.px+(p.x-drag.sx)*1.2,24,W-24);player.ty=clamp(drag.py+(p.y-drag.sy)*1.2,140,H-40);});
addEventListener('pointerup',()=>drag=null);
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function tap(x,y){
  if(state==='title'){
    // color buttons
    for(let i=0;i<4;i++){const bx=60+i*80,by=430;if(Math.hypot(x-bx,y-by)<32){colorIdx=i;snd(600+i*100,0.1,'triangle');return;}}
    if(y>480){reset();state='play';snd(500,0.15,'triangle',0.06,300);}
  }else if(state==='over'){if(t>40){state='title';snd(400,0.1,'triangle');}}
}

// ---------- spawn ----------
function spawnGhost(){
  const types=['normal','normal','wavy'];if(wave>=3)types.push('shooter');if(wave>=4)types.push('fast');
  const ty=types[Math.floor(Math.random()*types.length)];
  ghosts.push({x:30+Math.random()*(W-60),y:-30,type:ty,hp:ty==='normal'?1:ty==='fast'?1:2,
    vy:ty==='fast'?2.2:0.8+wave*0.08,t:Math.random()*6,hit:0,fire:60+Math.random()*90,
    col:['#ffffff','#c8f0ff','#ffe0f4','#e8ffd0'][Math.floor(Math.random()*4)]});
}
function burst(x,y,col,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*3+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30,col});}}

// ---------- update ----------
function update(){
  t++;stars.forEach(s=>{s.y+=s.s*(state==='play'?1.5:0.5);if(s.y>H){s.y=0;s.x=Math.random()*W;}});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;return --p.l>0;});
  if(msgT>0)msgT--;if(shake>0)shake--;
  if(state!=='play')return;
  const P=player;
  // keyboard
  const sp=5;if(keys.ArrowLeft||keys.a)P.tx-=sp;if(keys.ArrowRight||keys.d)P.tx+=sp;if(keys.ArrowUp||keys.w)P.ty-=sp;if(keys.ArrowDown||keys.s)P.ty+=sp;
  P.tx=clamp(P.tx,24,W-24);P.ty=clamp(P.ty,140,H-40);
  P.x+=(P.tx-P.x)*0.35;P.y+=(P.ty-P.y)*0.35;
  if(P.inv>0)P.inv--;if(P.squash>0)P.squash--;
  if(P.powerT>0){P.powerT--;if(P.powerT===0)P.power=1;}
  // auto fire
  if(--P.fire<=0){P.fire=11;P.squash=6;snd(880,0.04,'square',0.02);
    const angs=P.power===1?[0]:P.power===2?[-0.15,0.15]:[-0.28,0,0.28];
    angs.forEach(a=>shots.push({x:P.x,y:P.y-22,vx:Math.sin(a)*7,vy:-Math.cos(a)*7}));}
  shots=shots.filter(s=>{s.x+=s.vx;s.y+=s.vy;return s.y>-20&&s.x>-20&&s.x<W+20;});
  // waves
  if(waveTimer>0)waveTimer--;
  else if(spawnLeft>0&&t%Math.max(18,50-wave*3)===0){spawnGhost();spawnLeft--;}
  if(spawnLeft===0&&ghosts.length===0&&!boss&&waveTimer===0){nextWave();}
  // ghosts
  ghosts.forEach(g=>{g.t+=0.05;g.y+=g.vy;if(g.type==='wavy')g.x+=Math.sin(g.t*2)*1.6;
    if(g.hit>0)g.hit--;
    if(g.type==='shooter'&&g.y>0&&--g.fire<=0){g.fire=120;const a=Math.atan2(P.y-g.y,P.x-g.x);
      ebul.push({x:g.x,y:g.y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4});}
  });
  // boss
  if(boss){const b=boss;b.t++;b.y+=(b.ty-b.y)*0.03;b.x=W/2+Math.sin(b.t*0.015)*110;if(b.hit>0)b.hit--;
    if(b.y>60&&b.t%70===0){for(let i=0;i<8;i++){const a=i/8*6.28+b.t*0.01;ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2});}snd(200,0.15,'sawtooth',0.03);}
    if(b.y>60&&b.t%120===60){spawnGhost();}
  }
  ebul=ebul.filter(e=>{e.x+=e.vx;e.y+=e.vy;return e.y<H+20&&e.y>-20&&e.x>-20&&e.x<W+20;});
  // shots vs ghosts
  shots.forEach(s=>{
    ghosts.forEach(g=>{if(!s.dead&&Math.hypot(s.x-g.x,s.y-g.y)<22){s.dead=1;g.hp--;g.hit=6;
      if(g.hp<=0){g.dead=1;score+=10;burst(g.x,g.y,g.col);snd(660,0.1,'triangle',0.05,400);
        if(Math.random()<0.18)items.push({x:g.x,y:g.y,type:Math.random()<0.4?'heart':Math.random()<0.5?'power':'shield',t:0});
        else if(Math.random()<0.5)items.push({x:g.x,y:g.y,type:'star',t:0});}}});
    if(boss&&!s.dead&&Math.abs(s.x-boss.x)<50&&Math.abs(s.y-boss.y)<50){s.dead=1;boss.hp--;boss.hit=4;score+=1;
      if(boss.hp<=0){burst(boss.x,boss.y,'#fff',50);burst(boss.x,boss.y,'#ffd84a',30);score+=200;shake=20;
        snd(300,0.6,'triangle',0.08,600);say('やったね！ おおきいおばけを たおした！');
        items.push({x:boss.x-30,y:boss.y,type:'heart',t:0},{x:boss.x+30,y:boss.y,type:'power',t:0});boss=null;}}
  });
  shots=shots.filter(s=>!s.dead);ghosts=ghosts.filter(g=>!g.dead&&g.y<H+40);
  // items
  items=items.filter(it=>{it.t++;it.y+=1.3;
    if(Math.hypot(it.x-P.x,it.y-P.y)<30){
      if(it.type==='heart'){P.hp=Math.min(5,P.hp+1);say('ハート ゲット！');snd(700,0.2,'triangle',0.06,500);}
      else if(it.type==='power'){P.power=Math.min(3,P.power+1);P.powerT=600;say('パワーアップ！');snd(500,0.3,'triangle',0.06,700);}
      else if(it.type==='shield'){P.shield=1;say('バリア ゲット！');snd(900,0.2,'sine',0.06,300);}
      else{score+=30;snd(1200,0.08,'triangle',0.04,300);}
      return false;}
    return it.y<H+20;});
  // damage
  if(P.inv===0){
    let hit=false;
    ebul.forEach(e=>{if(Math.hypot(e.x-P.x,e.y-P.y)<16){e.dead=1;hit=true;}});
    ghosts.forEach(g=>{if(Math.hypot(g.x-P.x,g.y-P.y)<30){g.dead=1;burst(g.x,g.y,g.col);hit=true;}});
    if(boss&&Math.abs(boss.x-P.x)<55&&Math.abs(boss.y-P.y)<55)hit=true;
    if(hit){
      if(P.shield){P.shield=0;P.inv=60;snd(400,0.2,'sine',0.06,-200);burst(P.x,P.y,'#8ff',16);}
      else{P.hp--;P.inv=100;shake=10;snd(150,0.3,'sawtooth',0.07,-80);burst(P.x,P.y,COLORS[colorIdx].c,20);
        if(P.hp<=0){state='over';t=0;if(score>best){best=score;try{localStorage.setItem('slimeBest',best)}catch(e){}}}}
    }
    ebul=ebul.filter(e=>!e.dead);ghosts=ghosts.filter(g=>!g.dead);
  }
}

// ---------- draw ----------
function slime(x,y,r,col,dark,squash,face=true){
  const sy=1-squash*0.02,sx=1+squash*0.02;
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(0,r*0.75,r*0.9,r*0.2,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-r,r*0.6);
  ctx.quadraticCurveTo(-r*1.05,-r*0.3,0,-r*1.05);ctx.quadraticCurveTo(r*1.05,-r*0.3,r,r*0.6);
  ctx.quadraticCurveTo(0,r*0.85,-r,r*0.6);ctx.fill();
  ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.ellipse(-r*0.45,-r*0.45,r*0.18,r*0.28,-0.5,0,6.28);ctx.fill();
  if(face){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*0.32,0,r*0.13,0,6.28);ctx.arc(r*0.32,0,r*0.13,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.28,-r*0.05,r*0.05,0,6.28);ctx.arc(r*0.36,-r*0.05,r*0.05,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,120,150,0.6)';ctx.beginPath();ctx.ellipse(-r*0.6,r*0.2,r*0.13,r*0.08,0,0,6.28);ctx.ellipse(r*0.6,r*0.2,r*0.13,r*0.08,0,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*0.15,r*0.15,0.2,Math.PI-0.2);ctx.stroke();}
  ctx.restore();
}
function ghost(x,y,r,col,tt,hit,angry){
  ctx.save();ctx.translate(x,y);
  ctx.globalAlpha=0.92;ctx.fillStyle=hit?'#ff6':col;
  ctx.beginPath();ctx.arc(0,-r*0.2,r,Math.PI,0);
  const n=4;ctx.lineTo(r,r*0.7);
  for(let i=0;i<n;i++){const x1=r-(i+0.5)*(2*r/n),x2=r-(i+1)*(2*r/n);ctx.quadraticCurveTo(x1,r*(0.7+0.35*Math.sin(tt*4+i)),x2,r*0.7);}
  ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#7a6fb0';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#333';
  if(angry){ctx.beginPath();ctx.moveTo(-r*0.55,-r*0.45);ctx.lineTo(-r*0.15,-r*0.25);ctx.lineTo(-r*0.55,-r*0.15);ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.55,-r*0.45);ctx.lineTo(r*0.15,-r*0.25);ctx.lineTo(r*0.55,-r*0.15);ctx.fill();}
  else{ctx.beginPath();ctx.ellipse(-r*0.32,-r*0.25,r*0.12,r*0.18,0,0,6.28);ctx.ellipse(r*0.32,-r*0.25,r*0.12,r*0.18,0,0,6.28);ctx.fill();}
  ctx.beginPath();ctx.ellipse(0,r*0.15,r*0.15,r*0.12,0,0,6.28);ctx.fill();
  ctx.restore();
}
function heart(x,y,s,col='#ff5d8f'){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y+s*0.35);
  ctx.bezierCurveTo(x-s,y-s*0.3,x-s*0.4,y-s,x,y-s*0.4);ctx.bezierCurveTo(x+s*0.4,y-s,x+s,y-s*0.3,x,y+s*0.35);ctx.fill();}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.fill();}
function text(s,x,y,size,col='#fff',align='center'){ctx.font='bold '+size+'px "Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=size/5;ctx.strokeStyle='#2a1d5c';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}

function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2b1b66');gr.addColorStop(1,'#5a3a8f');
  ctx.fillStyle=gr;ctx.fillRect(-20,-20,W+40,H+40);
  // moon
  ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(300,70,28,0,6.28);ctx.fill();
  ctx.fillStyle='#2b1b66';ctx.beginPath();ctx.arc(312,62,24,0,6.28);ctx.fill();
  stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(0.4+s.s*0.3)+')';ctx.fillRect(s.x,s.y,s.s*1.5,s.s*1.5);});
  const C=COLORS[colorIdx];

  if(state==='title'){
    text('スライム',W/2,110,46,C.c);text('vs おばけ',W/2,165,40,'#fff');
    slime(W/2-50,280+Math.sin(t*0.08)*6,40,C.c,C.d,0);
    ghost(W/2+70,250+Math.sin(t*0.06)*10,32,'#fff',t*0.05,0,false);
    text('いろを えらんでね',W/2,380,20);
    COLORS.forEach((cc,i)=>{const bx=60+i*80,by=430;
      if(i===colorIdx){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,30,0,6.28);ctx.stroke();}
      slime(bx,by+4,20,cc.c,cc.d,0,true);});
    ctx.fillStyle='#ff8a3d';roundRect(W/2-110,500,220,64,32);ctx.fill();
    text('スタート！',W/2,532,28);
    text('ゆびで スライムを うごかしてね',W/2,592,16,'#ddd');
    if(best)text('さいこう '+best+' てん',W/2,620,14,'#ffd84a');
  }else{
    // items
    items.forEach(it=>{const bob=Math.sin(it.t*0.15)*3;
      if(it.type==='heart')heart(it.x,it.y+bob,16);
      else if(it.type==='power'){ctx.fillStyle='#ffb43a';ctx.beginPath();ctx.arc(it.x,it.y+bob,14,0,6.28);ctx.fill();text('P',it.x,it.y+bob+1,16);}
      else if(it.type==='shield'){ctx.strokeStyle='#8ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(it.x,it.y+bob,13,0,6.28);ctx.stroke();text('B',it.x,it.y+bob+1,14,'#8ff');}
      else star(it.x,it.y+bob,11,'#ffd84a');});
    // shots: bubbles
    shots.forEach(s=>{ctx.fillStyle=C.c;ctx.beginPath();ctx.arc(s.x,s.y,6,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(s.x-2,s.y-2,2,0,6.28);ctx.fill();});
    ghosts.forEach(g=>ghost(g.x,g.y,g.type==='fast'?15:20,g.col,g.t,g.hit,g.type==='shooter'));
    if(boss){ghost(boss.x,boss.y,55,'#d8c8ff',boss.t*0.02,boss.hit,true);
      // crown
      ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.moveTo(boss.x-25,boss.y-62);ctx.lineTo(boss.x-25,boss.y-85);ctx.lineTo(boss.x-12,boss.y-72);
      ctx.lineTo(boss.x,boss.y-90);ctx.lineTo(boss.x+12,boss.y-72);ctx.lineTo(boss.x+25,boss.y-85);ctx.lineTo(boss.x+25,boss.y-62);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.4)';roundRect(60,48,W-120,12,6);ctx.fill();
      ctx.fillStyle='#ff5d8f';roundRect(60,48,(W-120)*boss.hp/boss.max,12,6);ctx.fill();}
    ebul.forEach(e=>{ctx.fillStyle='#b066ff';ctx.beginPath();ctx.arc(e.x,e.y,7,0,6.28);ctx.fill();
      ctx.fillStyle='#f0d0ff';ctx.beginPath();ctx.arc(e.x,e.y,3,0,6.28);ctx.fill();});
    if(state==='play'||t%20<10||state==='over'){
      if(!(player.inv>0&&Math.floor(player.inv/5)%2)){slime(player.x,player.y,24,C.c,C.d,player.squash);}
      if(player.shield){ctx.strokeStyle='rgba(140,255,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,34+Math.sin(t*0.2)*2,0,6.28);ctx.stroke();}
    }
    parts.forEach(p=>{ctx.globalAlpha=p.l/30;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill();});ctx.globalAlpha=1;
    // HUD
    for(let i=0;i<player.hp;i++)heart(22+i*26,24,12);
    text(score+' てん',W-12,24,18,'#fff','right');
    if(player.power>1)text('パワー×'+player.power,W-12,48,13,'#ffb43a','right');
    if(msgT>0){ctx.globalAlpha=Math.min(1,msgT/20);text(msg,W/2,H/2-60,24,'#ffd84a');ctx.globalAlpha=1;}
    if(state==='over'){ctx.fillStyle='rgba(20,10,50,0.7)';ctx.fillRect(0,0,W,H);
      text('ゲームオーバー',W/2,H/2-80,36);
      text(score+' てん',W/2,H/2-20,32,'#ffd84a');
      text('ウェーブ '+wave+' まで いけた！',W/2,H/2+25,20);
      if(score>=best&&score>0)text('しんきろく！',W/2,H/2+65,24,'#ff8ad0');
      if(t>40)text('タップで もどる',W/2,H/2+120,18,'#ddd');}
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
