<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Twin Steps</title>
<style>
/* layout: full-screen canvas scene (world background + two boards). HTML HUD on top (level / moves / par + icon buttons), d-pad at bottom on touch screens. Overlays (title, world map, win) sit above the scene. */
:root{--ink:#2d2a32;--muted:#6f6879;--card:rgba(255,255,255,.92);--line:rgba(45,42,50,.12);--a:#ff7b6b;--b:#33bfae;--gold:#ffbe3d;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe9d6;color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:var(--card);border-radius:14px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;box-shadow:0 3px 0 var(--line);line-height:1.15;text-align:center;min-width:64px}
.pill small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.sp{flex:1}
.ib{width:46px;height:46px;border-radius:14px;border:0;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ib svg{width:24px;height:24px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pad{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:none;justify-content:center;gap:10px}
.pad button{width:66px;height:54px;border-radius:16px;border:0;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:22px;color:var(--ink);cursor:pointer}
@media (pointer:coarse){.pad{display:flex}}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.over[hidden],[hidden]{display:none!important}
.shade{background:rgba(30,26,40,.35);backdrop-filter:blur(3px)}
.card{background:#fffaf2;border-radius:28px;padding:26px 28px;box-shadow:0 10px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;align-items:center;max-width:min(92vw,560px)}
.logo{font-size:clamp(52px,11vw,96px);font-weight:900;margin:0;line-height:1;letter-spacing:1px;color:#fff;-webkit-text-stroke:3px #2d2a32;paint-order:stroke fill;text-shadow:0 6px 0 rgba(45,42,50,.35)}
.logo span{color:var(--a)}.logo i{color:var(--b);font-style:normal}
.tag{font-size:19px;font-weight:900;color:#2d2a32;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;margin:0}
.btn{font:inherit;font-weight:900;font-size:20px;border:0;border-radius:999px;padding:14px 34px;min-height:56px;cursor:pointer;background:var(--a);color:#fff;box-shadow:0 5px 0 #d65a4b}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d65a4b}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.btn.teal{background:var(--b);box-shadow:0 5px 0 #23968a}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
h2{font-size:30px;margin:0}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.stars{font-size:52px;letter-spacing:6px;color:var(--gold);text-shadow:0 3px 0 #d99a16}.stars .off{color:#e6dccd;text-shadow:none}
.map{display:flex;flex-direction:column;gap:12px;max-height:72vh;overflow:auto;padding:4px 6px;width:min(92vw,600px)}
.world{border-radius:22px;padding:12px 14px;color:#fff;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.world h3{margin:0 0 8px;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.world .g{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv{border:0;border-radius:14px;aspect-ratio:1/1;font:inherit;font-weight:900;font-size:17px;background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lv small{font-size:10px;color:#e39a00;letter-spacing:-1px;margin-top:3px;min-height:10px}
.lv.lock{background:rgba(255,255,255,.35);color:rgba(255,255,255,.9);cursor:default}
.toast{position:fixed;top:72px;left:50%;transform:translate(-50%,-8px);background:rgba(45,42,50,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.keys{font-size:13px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud" hidden>
  <button class="ib" id="menuBtn" type="button" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="pill"><small id="lvlLab">Level</small><span id="lvl">1</span></div>
  <div class="pill"><small>Moves</small><span id="mv">0</span></div>
  <div class="pill"><small>Par</small><span id="par">0</span></div>
  <div class="sp"></div>
  <button class="ib" id="hint" type="button" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
  <button class="ib" id="undo" type="button" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="reset" type="button" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button class="ib" id="snd" type="button" aria-label="Sound"></button>
</div>
<div class="pad" id="pad" hidden aria-label="Direction buttons"><button data-d="3" type="button" aria-label="Left">◀</button><button data-d="0" type="button" aria-label="Up">▲</button><button data-d="2" type="button" aria-label="Down">▼</button><button data-d="1" type="button" aria-label="Right">▶</button></div>
<div class="toast" id="toast"></div>

<div class="over" id="title">
  <h1 class="logo">Twin <span>St</span><i>eps</i></h1>
  <p class="tag">One move. Two friends. Same goal.</p>
  <div style="height:24vh"></div>
  <div class="row"><button class="btn" id="play" type="button">Play</button></div>
  <div class="row"><button class="btn teal" id="dailyBtn" type="button">Daily puzzle</button><button class="btn alt" id="mapBtn" type="button">Levels</button></div>
  <p class="keys" id="prog"></p>
</div>
<div class="over shade" id="map" hidden><div class="map" id="mapList"></div><button class="btn alt" id="mapBack" type="button">Back</button></div>
<div class="over" id="win" hidden><div class="card"><h2 id="winT">Solved!</h2><div class="stars" id="winS"></div><p id="winP"></p>
  <div class="row"><button class="btn teal" id="share" type="button" hidden>Share</button><button class="btn" id="next" type="button">Next</button><button class="btn alt" id="retry" type="button">Retry</button></div></div></div>

<script>
"use strict";
// =================== rules (unchanged from v1 so saves and daily puzzles stay the same) ===================
var DX=[0,1,0,-1],DY=[-1,0,1,0];
function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function mv(L,board,pos,d){var n=L.n,x=pos%n,y=(pos/n)|0;
  do{var nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=n||ny>=n||board[ny*n+nx])break;x=nx;y=ny;}while(L.ice);return y*n+x;}
function dB(L,d){return L.mirror&&(d===1||d===3)?4-d:d;}
function solve(L){var n=L.n,N=n*n,dist=new Int16Array(N*N).fill(-1),q=[L.sa*N+L.sb];dist[q[0]]=0;
  for(var h=0;h<q.length;h++){var s=q[h],a=(s/N)|0,b=s%N;if(a===L.ga&&b===L.gb)return dist[s];
    for(var d=0;d<4;d++){var t=mv(L,L.A,a,d)*N+mv(L,L.B,b,dB(L,d));if(dist[t]<0){dist[t]=dist[s]+1;q.push(t);}}}return -1;}
function single(L,board,s,g,mir){var n=L.n,dist=new Int16Array(n*n).fill(-1),q=[s];dist[s]=0;
  for(var h=0;h<q.length;h++){var c=q[h];if(c===g)return dist[c];for(var d=0;d<4;d++){var t=mv(L,board,c,mir?dB(L,d):d);if(dist[t]<0){dist[t]=dist[c]+1;q.push(t);}}}return -1;}
var TOTAL=48;
function spec(i){var t=Math.floor(i/12),j=i%12;
  var n=(t===0&&j<4)?4:[5,5,5,6][t]+(j>=8?1:0);
  var lo=j<2?2+j:[3,4,3,4][t]+Math.floor((j-2)/3),hi=j<2?3+j:[6,7,6,7][t]+Math.floor((j-2)/2);
  return {n:n,mirror:t===1||t===3,ice:t>=2,lo:lo,hi:hi,easy:i<2};}
var cache={};
function level(i){if(cache[i])return cache[i];return (cache[i]=gen(spec(i),(i+1)*2654435761>>>0));}
function gen(sp,seed){var r=rng(seed),n=sp.n,N=n*n;
  for(var tries=0;tries<4000;tries++){
    var dens=sp.ice?0.16+r()*0.1:0.18+r()*0.12,A=[],B=[];for(var k=0;k<N;k++){A.push(r()<dens?1:0);B.push(r()<dens?1:0);}
    var free=function(bd){var f=[];bd.forEach(function(v,k){if(!v)f.push(k);});return f;},fa=free(A),fb=free(B);
    var L={n:n,mirror:sp.mirror,ice:sp.ice,A:A,B:B,sa:fa[(r()*fa.length)|0],ga:fa[(r()*fa.length)|0],sb:fb[(r()*fb.length)|0],gb:fb[(r()*fb.length)|0]};
    if(L.sa===L.ga||L.sb===L.gb)continue;var m=solve(L);if(m<sp.lo||m>sp.hi)continue;
    var s1=single(L,A,L.sa,L.ga,false),s2=single(L,B,L.sb,L.gb,true);if(!sp.easy&&m<=Math.max(s1,s2))continue;
    L.par=m;return L;}
  sp.lo=3;sp.hi=30;return gen(sp,seed+1);}
var DAY0=Date.UTC(2026,9,16);function dayNum(){var d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-DAY0)/864e5)+1;}
function dailyLevel(){var k=dayNum(),m=k%4;if(cache['d'+k])return cache['d'+k];return (cache['d'+k]=gen({n:6,mirror:m===1||m===3,ice:m>=2,lo:6,hi:10},(k*7919+12345)>>>0));}
function pathFrom(L,a,b){var N=L.n*L.n,st=a*N+b,prev=new Int32Array(N*N).fill(-1),pd=new Int8Array(N*N),q=[st],g=L.ga*N+L.gb;prev[st]=st;
  for(var h=0;h<q.length;h++){var c=q[h];if(c===g)break;var x=(c/N)|0,y=c%N;for(var d=0;d<4;d++){var t=mv(L,L.A,x,d)*N+mv(L,L.B,y,dB(L,d));if(prev[t]<0){prev[t]=c;pd[t]=d;q.push(t);}}}
  if(prev[g]<0)return null;var out=[],c2=g;while(c2!==st){out.push(pd[c2]);c2=prev[c2];}return out.reverse();}

// =================== worlds (look + music per group of 12 levels) ===================
var WORLDS=[
 {name:'Meadow',sub:'Both friends move together',sky:['#9fdcff','#d9f4ff'],hill:['#7fcf7a','#5fb85e'],tile:'#f3f8e8',tile2:'#e6f0d6',wall:'#7a6a5a',wallTop:'#9c8a77',frame:'#ffffff',map:'#5fb85e',chord:[0,4,7,11]},
 {name:'Mirror Lake',sub:'The right board moves left/right reversed',sky:['#b9a6ff','#ffd6e8'],hill:['#7d8fd6','#6274c2'],tile:'#f4f0ff',tile2:'#e8e2fb',wall:'#5b5a8a',wallTop:'#7d7bb0',frame:'#ffffff',map:'#7d6fe0',chord:[0,3,7,10]},
 {name:'Ice Cave',sub:'Pieces slide until they hit something',sky:['#7ec8e3','#e0f6ff'],hill:['#a9dcf0','#86c7e3'],tile:'#e8f7ff',tile2:'#d6eefb',wall:'#4f7ea8',wallTop:'#79a6cc',frame:'#f4fbff',map:'#3d9fd1',chord:[0,5,7,12]},
 {name:'Aurora Peak',sub:'Ice and mirror at once',sky:['#1f2a5a','#4b3f86'],hill:['#2e4a7a','#253c66'],tile:'#eef1ff',tile2:'#dfe4fb',wall:'#3c3a66',wallTop:'#5f5c94',frame:'#f6f4ff',map:'#4b3f86',chord:[0,4,7,9]}];
function worldOf(i){return i<0?WORLDS[dayNum()%4]:WORLDS[Math.floor(i/12)];}

// =================== storage ===================
var store={get:function(k,f){try{var v=JSON.parse(localStorage.getItem('twinsteps-'+k));return v==null?f:v;}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('twinsteps-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('stars',{});function unlocked(){var u=0;while(u<TOTAL&&best[u])u++;return Math.min(u,TOTAL-1);}
var muted=store.get('muted',false);

// =================== audio: soft sfx + gentle generated music ===================
var AC=null,master=null,musicGain=null,musicOn=false,nextNote=0,step16=0;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.22;musicGain.connect(master);}catch(e){AC=null;}return AC;}
function note(f,t,d,v,type,dest){var o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+0.02);}
function sfx(kind){if(!audio()||muted)return;var t=AC.currentTime;
  if(kind==='step'){note(520+Math.random()*40,t,0.08,0.06,'sine');note(780,t+0.02,0.06,0.025,'sine');}
  else if(kind==='bump'){note(140,t,0.12,0.08,'triangle');}
  else if(kind==='star'){[784,988,1175].forEach(function(f,k){note(f,t+k*0.05,0.18,0.05,'sine');});}
  else if(kind==='win'){[523,659,784,1047,1319].forEach(function(f,k){note(f,t+k*0.08,0.35,0.07,'triangle');});}
  else if(kind==='undo'){note(400,t,0.08,0.05,'sine');note(300,t+0.05,0.08,0.04,'sine');}
  else if(kind==='click'){note(660,t,0.05,0.04,'sine');}}
var SCALE=[0,2,4,7,9,12,14,16];
function musicTick(){if(!AC||!musicOn)return;var w=worldOf(S.i||0),root=w===WORLDS[3]?196:w===WORLDS[1]?220:261.6,bpm=84,s16=60/bpm/4;
  while(nextNote<AC.currentTime+0.2){var t=nextNote,bar=Math.floor(step16/16)%4,ch=w.chord;
    if(step16%16===0){ch.forEach(function(c){note(root/2*Math.pow(2,(c+[0,5,7,3][bar])/12),t,s16*15,0.05,'sine',musicGain);});}
    if(step16%2===0){var pat=[0,2,1,3,2,4,3,1],c=ch[pat[(step16/2)%8]%ch.length]+[0,5,7,3][bar]+12;if(((step16*7)%5)!==0)note(root*Math.pow(2,c/12),t,s16*1.8,0.035,'triangle',musicGain);}
    nextNote+=s16;step16++;}}
function startMusic(){if(!audio())return;if(AC.state==='suspended')AC.resume();if(!musicOn){musicOn=true;nextNote=AC.currentTime+0.1;}}
setInterval(musicTick,60);
function setMute(m){muted=m;store.set('muted',m);if(master)master.gain.value=m?0:0.9;document.getElementById('snd').innerHTML=m?
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>':
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';}

// =================== game state ===================
var S={i:0,L:null,a:0,b:0,hist:[],moves:0,won:false,P:null,intro:0,tut:null,shake:0};
function mkPiece(pos,n){return {x:pos%n,y:(pos/n)|0,fx:pos%n,fy:(pos/n)|0,t:1,hop:0,bump:0,bdx:0,bdy:0,look:[0,0],blink:2+Math.random()*3,happy:0,jump:0};}
function load(i){S.i=i;S.hints=0;$('toast').classList.remove('on');S.L=i<0?dailyLevel():level(i);S.a=S.L.sa;S.b=S.L.sb;S.hist=[];S.moves=0;S.won=false;var n=S.L.n;
  S.P={a:mkPiece(S.a,n),b:mkPiece(S.b,n)};S.intro=performance.now();parts.length=0;
  ['title','map','win'].forEach(function(k){$(k).hidden=true;});$('hud').hidden=false;$('pad').hidden=false;hud();startMusic();
  S.tut=null;if(i===0&&!store.get('tutDone',false))S.tut={step:0};
  var tip=i<0?'Daily puzzle #'+dayNum()+' · same for everyone today':i%12===0?worldOf(i).name+' — '+worldOf(i).sub:'';if(tip)toast(tip);}
function hud(){$('lvlLab').textContent=S.i<0?'Daily':'Level';$('lvl').textContent=S.i<0?'#'+dayNum():(Math.floor(S.i/12)+1)+'-'+(S.i%12+1);$('mv').textContent=S.moves;$('par').textContent=S.L.par;}
function setPiece(p,pos,n,d,stayed){if(stayed){p.bump=1;p.bdx=DX[d];p.bdy=DY[d];return;}p.fx=p.cx!==undefined?p.cx:p.x;p.fy=p.cy!==undefined?p.cy:p.y;
  p.x=pos%n;p.y=(pos/n)|0;var dist=Math.abs(p.x-p.fx)+Math.abs(p.y-p.fy);p.t=0;p.dur=Math.min(0.42,0.13+dist*0.05);p.look=[DX[d],DY[d]];}
function move(d){if(S.won||!S.L)return;var L=S.L,n=L.n,na=mv(L,L.A,S.a,d),nb=mv(L,L.B,S.b,dB(L,d));
  if(S.tut){S.tut=null;store.set('tutDone',true);}
  if(na===S.a&&nb===S.b){S.P.a.bump=1;S.P.a.bdx=DX[d];S.P.a.bdy=DY[d];S.P.b.bump=1;S.P.b.bdx=DX[dB(L,d)];S.P.b.bdy=DY[dB(L,d)];S.shake=4;sfx('bump');return;}
  setPiece(S.P.a,na,n,d,na===S.a);setPiece(S.P.b,nb,n,dB(L,d),nb===S.b);
  S.hist.push([S.a,S.b]);S.a=na;S.b=nb;S.moves++;sfx('step');hud();
  if(S.a===L.ga&&S.b===L.gb)win();else{if(S.a===L.ga&&S.P.a.happy<=0){S.P.a.happy=1;sfx('star');}if(S.b===L.gb&&S.P.b.happy<=0){S.P.b.happy=1;sfx('star');}}}
function undo(){if(S.won||!S.hist.length)return;var h=S.hist.pop(),n=S.L.n;S.a=h[0];S.b=h[1];S.moves--;S.P.a=mkPiece(S.a,n);S.P.b=mkPiece(S.b,n);hud();sfx('undo');}
function hint(){if(S.won)return;var p=pathFrom(S.L,S.a,S.b);if(!p||!p.length)return;S.hintD=p[0];S.hintT=performance.now();S.hints=(S.hints||0)+1;sfx('click');}
function starsFor(m,p){return m<=p?3:m<=p+3?2:1;}
function win(){S.won=true;var st=starsFor(S.moves,S.L.par);if(S.i<0){var dk='daily-'+dayNum(),pv=store.get(dk,null);if(!pv||S.moves<pv.m)store.set(dk,{m:S.moves,h:S.hints||0,st:st});}
  else if(st>(best[S.i]||0)){best[S.i]=st;store.set('stars',best);}
  setTimeout(function(){sfx('win');S.P.a.jump=1;S.P.b.jump=1;confetti();},380);
  setTimeout(function(){$('winT').textContent=S.i<0?'Daily #'+dayNum()+' solved!':S.i===TOTAL-1?'You beat every world!':(S.i%12===11?worldOf(S.i).name+' complete!':'Level '+(S.i%12+1)+' solved!');
