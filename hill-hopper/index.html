<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>HILL<small>HOPPER</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(40px,11vw,66px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'右の<b>アクセル</b>と左の<b>ブレーキ</b>で山道をどこまでも走ろう。<br>空中ではアクセルで後ろに、ブレーキで前に回転するよ。<br>頭から落ちたり、燃料が切れたらおしまい。⛽を拾ってすすめ！',play:'あそぶ',again:'もういちど',crash:'ひっくり返った！',fuel:'ガス欠！',cont:'▶ 広告を見て つづきから',na:'広告を読み込めませんでした',best:'さいこう',gas:'アクセル',brake:'ブレーキ',flip:'宙返り！'}
 :{how:'Hold <b>GAS</b> (right) and <b>BRAKE</b> (left) to drive the hills as far as you can.<br>In the air, gas tilts you back and brake tilts you forward.<br>Land on your head or run out of fuel and it\'s over. Grab ⛽ to keep going!',play:'PLAY',again:'DRIVE AGAIN',crash:'Flipped over!',fuel:'Out of fuel!',cont:'▶ Watch ad: keep driving',na:'Ad not available',best:'Best',gas:'GAS',brake:'BRAKE',flip:'FLIP!'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('hh-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('hh-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,SC=1;
var state='title',t=0,wl,cam={x:0,y:0},fuel=100,coins=0,items=[],FX=[],used=false,games=0,gas=0,brk=0,keys={},ptrs={},lowT=0,maxX=0,flipAcc=0,lastAng=0,banner=0,bannerTxt='',shake=0;
var GR=700,R=15,L=64,seed=Math.random()*1000;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;SC=Math.min(1.3,Math.max(0.8,Math.min(W/360,H/420)));}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function ter(x){if(x<300)return 0;var d=x-300,a=Math.min(1.3,d/1800),b=Math.min(1.4,d/5000);return 38*Math.sin(d/210+seed)*(0.4+a)+22*Math.sin(d/83+seed*2)*a+70*Math.sin(d/520+seed*3)*b+d*0.01*Math.sin(d/1400)*b;}
function slope(x){return (ter(x+2)-ter(x-2))/4;}
function start(){seed=Math.random()*1000;wl=[{x:60,y:R+1,vx:0,vy:0,on:0,spin:0},{x:60+L,y:R+1,vx:0,vy:0,on:0,spin:0}];fuel=100;coins=0;items=[];FX=[];used=false;lowT=0;maxX=0;flipAcc=0;lastAng=0;
  for(var x=500;x<200000;x+=110+Math.random()*90){if((x/400|0)%6===5&&Math.random()<0.5)continue;var isF=false;items.push({x:x,k:'coin',got:0});if(Math.random()<0.25){for(var i=1;i<4;i++)items.push({x:x+i*28,k:'coin',got:0});x+=100;}}
  for(var fx=3000,gap=3600;fx<200000;fx+=gap,gap=Math.min(8500,gap+350))items.push({x:fx,k:'fuel',got:0});items.sort(function(a,b){return a.x-b.x;});
  state='play';}
function bodyAng(){return Math.atan2(wl[1].y-wl[0].y,wl[1].x-wl[0].x);}
function head(){var a=bodyAng(),mx=(wl[0].x+wl[1].x)/2,my=(wl[0].y+wl[1].y)/2;return {x:mx-Math.sin(a)*34-Math.cos(a)*4,y:my+Math.cos(a)*34-Math.sin(a)*4};}
function step(h){var G=gas||keys.r?1:0,B=brk||keys.l?1:0;if(fuel<=0)G=0;
  wl.forEach(function(w){w.vy-=GR*h;w.x+=w.vx*h;w.y+=w.vy*h;w.on=0;
    var gy=ter(w.x),s=slope(w.x),nl=Math.sqrt(1+s*s),nx=-s/nl,ny=1/nl,dist=(w.y-gy)*ny;// approx distance along normal
    if(dist<R){var pen=R-dist;w.x+=nx*pen;w.y+=ny*pen;var vn=w.vx*nx+w.vy*ny;if(vn<0){w.vx-=vn*nx*1.15;w.vy-=vn*ny*1.15;}w.on=1;
      var tx=ny,ty=-nx,vt=w.vx*tx+w.vy*ty,target=vt;if(G)target=Math.max(vt,430);else if(B)target=Math.min(vt,vt>40?vt-1:-160);var acc=(G?520:B?900:60)*h,dv=Math.max(-acc,Math.min(acc,target-vt));if(!G&&!B)dv=-vt*0.25*h;w.vx+=tx*dv;w.vy+=ty*dv;}});
  // rigid link
  var a=wl[0],b=wl[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,diff=(d-L)/d*0.5;a.x+=dx*diff;a.y+=dy*diff;b.x-=dx*diff;b.y-=dy*diff;
  var ux=dx/d,uy=dy/d,rv=(b.vx-a.vx)*ux+(b.vy-a.vy)*uy;a.vx+=ux*rv*0.5;a.vy+=uy*rv*0.5;b.vx-=ux*rv*0.5;b.vy-=uy*rv*0.5;
  // air control / torque
  var px=-uy,py=ux,tq=(G?1:0)-(B?1:0);if(tq){var k=(a.on||b.on)?120:330;a.vx-=px*tq*k*h;a.vy-=py*tq*k*h;b.vx+=px*tq*k*h;b.vy+=py*tq*k*h;}
  // angular damping
  var av=((b.vx-a.vx)*px+(b.vy-a.vy)*py);a.vx+=px*av*0.02;a.vy+=py*av*0.02;b.vx-=px*av*0.02;b.vy-=py*av*0.02;}
function update(dt){t+=dt;shake=Math.max(0,shake-dt);banner=Math.max(0,banner-dt);FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy-=500*dt;});FX=FX.filter(function(f){return f.l>0;});
  if(!wl)return;if(state==='play'){for(var i=0;i<6;i++)step(dt/6);
    var G=(gas||keys.r)&&fuel>0;fuel-=dt*(G?7.5:3);if(fuel<0)fuel=0;wl.forEach(function(w){w.spin+=((w.vx)/R)*dt;});
    var mx=(wl[0].x+wl[1].x)/2;if(mx>maxX)maxX=mx;
    items.forEach(function(it){if(it.got||Math.abs(it.x-mx)>40)return;var iy=ter(it.x)+(it.k==='fuel'?28:30),my=(wl[0].y+wl[1].y)/2+10;if(Math.abs(iy-my)<55){it.got=1;if(it.k==='coin'){coins++;tone(1300,0.05,'square',0.025,1.3);}else{fuel=100;tone(600,0.15,'triangle',0.05,1.6);banner=0.8;bannerTxt='⛽ FULL';}}});
    // flips
    var ang=bodyAng(),da=ang-lastAng;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;lastAng=ang;var air=!wl[0].on&&!wl[1].on;if(air)flipAcc+=da;else{if(Math.abs(flipAcc)>5.6){var n=Math.floor(Math.abs(flipAcc)/6.0)||1;coins+=5*n;banner=1;bannerTxt=TX.flip+' +'+(5*n);tone(880,0.12,'square',0.05,1.5);}flipAcc=0;}
    var hd=head();if(hd.y<ter(hd.x)+6){crash();}
    var sp=Math.hypot(wl[0].vx,wl[0].vy);if(fuel<=0&&sp<20){lowT+=dt;if(lowT>1.2)endRun(TX.fuel);}else lowT=0;}
  var cx=(wl[0].x+wl[1].x)/2,cy=(wl[0].y+wl[1].y)/2;cam.x+=(cx+W*0.12/SC-cam.x)*Math.min(1,dt*5);cam.y+=(cy-cam.y)*Math.min(1,dt*3);}
function crash(){if(state!=='play')return;shake=0.4;tone(120,0.4,'sawtooth',0.07,0.4);var hd=head();for(var k=0;k<14;k++)FX.push({x:hd.x,y:hd.y,vx:(Math.random()-0.5)*300,vy:Math.random()*300,l:0.7,c:k%2?'#ffd84a':'#fff'});endRun(TX.crash);}
function endRun(why){state='dead';games++;var m=Math.floor(maxX/10);if(m>best){best=m;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=why;$('endP').innerHTML=m+'m · 🪙'+coins+'<br>'+TX.best+' '+best+'m';$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},900);}
$('play').onclick=function(){$('title').hidden=true;start();};
$('again').onclick=function(){$('end').hidden=true;start();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;var x=Math.max(60,maxX-40);wl=[{x:x,y:ter(x)+R+4,vx:0,vy:0,on:0,spin:0},{x:x+L,y:ter(x+L)+R+4,vx:0,vy:0,on:0,spin:0}];lastAng=bodyAng();flipAcc=0;fuel=100;lowT=0;state='play';},function(){b.textContent=TX.na;});};
addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='d'){keys.r=1;e.preventDefault();}if(e.key==='ArrowLeft'||e.key==='a'){keys.l=1;e.preventDefault();}});
addEventListener('keyup',function(e){if(e.key==='ArrowRight'||e.key==='d')keys.r=0;if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;});
function recompute(){gas=0;brk=0;Object.keys(ptrs).forEach(function(id){if(ptrs[id]>W/2)gas=1;else brk=1;});}
cv.addEventListener('pointerdown',function(e){e.preventDefault();ptrs[e.pointerId]=e.clientX;recompute();});
cv.addEventListener('pointermove',function(e){if(ptrs[e.pointerId]!=null){ptrs[e.pointerId]=e.clientX;recompute();}});
function pu(e){delete ptrs[e.pointerId];recompute();}cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);

var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- draw ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0.1,r),0,7);g.fill();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function sx(x){return W/2+(x-cam.x)*SC;}function sy(y){return H*0.62-(y-cam.y)*SC;}
function wheel(w){var x=sx(w.x),y=sy(w.y),r=R*SC;C(x,y,r,'#2a2a3a');C(x,y,r*0.55,'#c8ccd8');g.strokeStyle='#5a5a6a';g.lineWidth=2;for(var i=0;i<3;i++){var a=-w.spin+i*2.09;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*r*0.55,y+Math.sin(a)*r*0.55);g.stroke();}C(x,y,r*0.15,'#5a5a6a');}
function car(){var a=bodyAng(),mx=(wl[0].x+wl[1].x)/2,my=(wl[0].y+wl[1].y)/2,s=SC;g.save();g.translate(sx(mx),sy(my));g.rotate(-a);
  // suspension struts
  g.strokeStyle='#5a5a6a';g.lineWidth=4*s;g.beginPath();g.moveTo(-L/2*s,0);g.lineTo(-L/2*s+4*s,-12*s);g.moveTo(L/2*s,0);g.lineTo(L/2*s-4*s,-12*s);g.stroke();
  // body
  g.fillStyle='#ff7a2a';rr(-44*s,-28*s,88*s,18*s,6*s);g.fill();g.fillStyle='#e8501a';g.fillRect(-44*s,-14*s,88*s,4*s);g.fillStyle='#ffb02a';rr(16*s,-36*s,26*s,10*s,4*s);g.fill();
  // driver: duck in helmet
  g.fillStyle='#ffe04a';g.beginPath();g.ellipse(-6*s,-38*s,11*s,10*s,0,0,7);g.fill();C(-2*s,-52*s,10*s,'#ffe04a');g.fillStyle='#ff9a2a';g.beginPath();g.moveTo(6*s,-53*s);g.lineTo(15*s,-50*s);g.lineTo(6*s,-47*s);g.fill();C(2*s,-55*s,2.2*s,'#1a1a2a');
  g.fillStyle='#3a6ae0';g.beginPath();g.arc(-2*s,-55*s,11*s,Math.PI*1.05,Math.PI*1.95);g.fill();g.fillStyle='#fff';g.fillRect(-8*s,-65*s,10*s,2.5*s);
  // roll bar
  g.strokeStyle='#5a5a6a';g.lineWidth=3*s;g.beginPath();g.moveTo(-26*s,-28*s);g.lineTo(-24*s,-60*s);g.lineTo(-14*s,-62*s);g.stroke();
  g.restore();wheel(wl[0]);wheel(wl[1]);}
function render(){var sh=shake>0?(Math.random()-0.5)*shake*20:0;g.setTransform(DPR,0,0,DPR,sh*DPR,0);var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#6ac0f0');gr.addColorStop(1,'#d8f0ff');g.fillStyle=gr;g.fillRect(-20,0,W+40,H);
  // parallax hills
  g.fillStyle='#a8d898';g.beginPath();g.moveTo(-20,H);for(var x=-20;x<=W+20;x+=16){var wx=(x-W/2)/SC*0.3+cam.x*0.3;g.lineTo(x,H*0.55-60*Math.sin(wx/260)-30*Math.sin(wx/97));}g.lineTo(W+20,H);g.fill();
  g.fillStyle='#88c878';g.beginPath();g.moveTo(-20,H);for(var x2=-20;x2<=W+20;x2+=14){var wx2=(x2-W/2)/SC*0.55+cam.x*0.55;g.lineTo(x2,H*0.66-45*Math.sin(wx2/180+2)-20*Math.sin(wx2/61));}g.lineTo(W+20,H);g.fill();
  if(!wl)return;
  // terrain
  var x0=cam.x-W/2/SC-20,x1=cam.x+W/2/SC+20;g.fillStyle='#8a5a32';g.beginPath();g.moveTo(sx(x0),H+10);for(var x3=x0;x3<=x1;x3+=8)g.lineTo(sx(x3),sy(ter(x3)));g.lineTo(sx(x1),H+10);g.fill();
  g.strokeStyle='#5ab83a';g.lineWidth=12*SC;g.lineJoin='round';g.beginPath();for(var x4=x0;x4<=x1;x4+=8){var Y=sy(ter(x4))+5*SC;if(x4===x0)g.moveTo(sx(x4),Y);else g.lineTo(sx(x4),Y);}g.stroke();
  g.fillStyle='rgba(0,0,0,.08)';for(var x5=Math.floor(x0/60)*60;x5<x1;x5+=60){C(sx(x5+20),sy(ter(x5+20))+30*SC,5*SC,'rgba(0,0,0,.1)');}
  // distance signs every 100m
  for(var m=Math.ceil(x0/1000)*1000;m<x1;m+=1000){var py=sy(ter(m));g.fillStyle='#fff';g.fillRect(sx(m)-2,py-50*SC,4,50*SC);g.fillStyle='#ff5a5a';rr(sx(m)-24*SC,py-66*SC,48*SC,20*SC,4);g.fill();g.fillStyle='#fff';g.font='900 '+Math.round(12*SC)+'px Rubik';g.textAlign='center';g.fillText(m/10+'m',sx(m),py-52*SC);}
  // items
  items.forEach(function(it){if(it.got||it.x<x0||it.x>x1)return;var X=sx(it.x),Y=sy(ter(it.x)+30);if(it.k==='coin'){var sq=Math.abs(Math.cos(t*4+it.x));g.fillStyle='#e8a01a';g.beginPath();g.ellipse(X,Y,10*SC*sq+1,10*SC,0,0,7);g.fill();g.fillStyle='#ffd84a';g.beginPath();g.ellipse(X,Y,7*SC*sq+1,7*SC,0,0,7);g.fill();}
    else{g.fillStyle='#e83a3a';rr(X-11*SC,Y-14*SC,22*SC,28*SC,4*SC);g.fill();g.fillStyle='#fff';g.font='900 '+Math.round(12*SC)+'px Rubik';g.textAlign='center';g.fillText('⛽',X,Y+4*SC);g.fillStyle='#c82a2a';g.fillRect(X+4*SC,Y-19*SC,6*SC,6*SC);}});
  if(state!=='dead'||true)car();
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);C(sx(f.x),sy(f.y),4*SC,f.c);});g.globalAlpha=1;
  // HUD
  g.textAlign='left';g.fillStyle='rgba(0,0,0,.35)';rr(12,12,150,22,11);g.fill();var fc=fuel>30?'#5ad83a':fuel>15?'#ffb02a':'#ff4a4a';g.fillStyle=fc;rr(12,12,Math.max(22,150*fuel/100),22,11);g.fill();g.fillStyle='#fff';g.font='800 13px Rubik';g.fillText('⛽ '+Math.ceil(fuel)+'%',22,28);
  g.font='900 22px Rubik';g.fillStyle='#1a3a5a';g.textAlign='center';g.fillText(Math.floor(maxX/10)+'m',W/2,34);g.font='800 12px Rubik';g.fillText(TX.best+' '+best+'m',W/2,52);g.textAlign='right';g.fillStyle='#8a5010';g.font='900 18px Rubik';g.fillText('🪙 '+coins,W-14,32);
  // pedals
