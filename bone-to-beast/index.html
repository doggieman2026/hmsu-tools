<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bone to Beast</title>
<style>
/* layout: full-screen canvas, side view; camera follows the hero right. HUD on canvas.
   HTML overlays: title (starter choice + bestiary), graft cards, awakening, game over. Touch buttons bottom-left/right. */
:root{--ink:#f4efe6;--muted:#b9b0c4;--card:#221c2b;--line:#3a3046;--blood:#d6334a;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#15111b;color:var(--ink);font-family:var(--font)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;overflow:auto}
[hidden]{display:none!important}
.dim{background:rgba(12,8,16,.78)}
h1{font-size:clamp(40px,8vw,80px);margin:0;line-height:.95;letter-spacing:2px;color:#f4efe6;text-shadow:0 6px 0 #6b1324,0 0 30px rgba(214,51,74,.45)}
h1 span{color:var(--blood)}
h2{font-size:30px;margin:0}
h3{margin:4px 0 0;font-size:15px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.btn{font:inherit;font-weight:900;font-size:20px;border:0;border-radius:14px;padding:14px 34px;min-height:56px;cursor:pointer;background:var(--blood);color:#fff;box-shadow:0 5px 0 #7e1326}
.btn.alt{background:#3a3046;box-shadow:0 5px 0 #231c2b}
.btn:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:980px}
.card{width:200px;min-height:230px;border-radius:18px;background:var(--card);border:3px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px;cursor:pointer;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--c,#fff);box-shadow:0 0 22px var(--c,#fff)}
.card.ult{width:250px;border-color:var(--c)}
.cards canvas{width:130px;height:130px;display:block}
.card b{font-size:18px}.card span{font-size:13px;color:var(--muted);line-height:1.35}
.card em{font-style:normal;font-size:11px;font-weight:900;color:var(--c);letter-spacing:1px;text-transform:uppercase}
.dex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.dex div{width:150px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;font-size:12px;color:var(--muted)}
.dex div b{display:block;color:var(--ink);font-size:14px}
.dex canvas{width:80px;height:80px;display:block;margin:0 auto}
.keys{font-size:13px}
.tc{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));display:none;gap:12px}
.tc button{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:900;font-size:22px}
.tc button.red{background:rgba(214,51,74,.6)}
.tc.l{left:16px}.tc.r{right:16px;align-items:flex-end}.tc button.big{width:84px;height:84px;font-size:30px}.tc button.sk{width:62px;height:62px;font-size:12px}.tc button{opacity:.8}
@media (pointer:coarse){.tc{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tc l" id="tcl" hidden></div>
<div class="tc r" id="tcr" hidden><button data-k="S" type="button" aria-label="Skill" class="sk">SKILL</button><button data-k="J" type="button" aria-label="Jump" class="red big">▲</button></div>
<div class="over dim" id="title">
  <h1>BONE TO <span>BEAST</span></h1>
  <p data-t="intro">Defeat monsters, drink their blood, graft their parts onto your body.<br>Find the right mix and awaken into a legend.</p>
  <button class="btn alt" id="lang" type="button" style="font-size:14px;padding:6px 16px;min-height:36px">日本語 / English</button>
  <h3 data-t="Choose how you rise">Choose how you rise</h3>
  <div class="cards" id="starters"></div>
  <p class="keys" id="keysP"></p>
  <h3><span data-t="Legends discovered">Legends discovered</span> <span id="dexN"></span></h3>
  <div class="dex" id="dex"></div>
  <p id="hi"></p>
</div>
<div class="over dim" id="graft" hidden><h2 id="graftT">The blood calls…</h2><p id="graftP">Choose a part to graft onto your body</p><div class="cards" id="cards"></div></div>
<div class="over dim" id="dead" hidden><h2 id="deadT">You fell</h2><p id="deadP"></p><div class="cards" id="deadForm"></div><div class="cards"><button class="btn" id="again" type="button" data-t="Rise again">Rise again</button><button class="btn alt" id="toTitle" type="button" data-t="Change start">Change start</button></div></div>
<script>

 tree:{name:'Divine Tree',col:'#7ad15a',hint:'Vine Arms + Root Legs + Bloom Crown',desc:'Roots strike from below and it heals. Skill: Sacred Bloom.',cond:function(P){return P.arms==='plantArms'&&P.legs==='plantLegs'&&P.head==='plantHead';}},
 chimera:{name:'Chimera',col:'#d9a441',hint:'Parts from 4 different creatures',desc:'Lion, goat and serpent in one. Skill: Roar.',cond:function(P){var s={};for(var k in P)s[PARTS[P[k]].sp]=1;return Object.keys(s).length>=4;}}};

  golem:{hp:90,spd:45,dmg:18,pts:40,w:50,h:62},plant:{hp:30,spd:30,dmg:8,pts:16,w:30,h:44},drake:{hp:34,spd:140,dmg:11,pts:24,w:34,h:34}};
/*i18n*/
var LANG=store.get('lang',(navigator.language||'').slice(0,2)==='ja'?'ja':'en');
var JA={intro:'モンスターを倒して血を集め、その部位を自分の体に移植しよう。<br>組み合わせ次第で伝説の姿に覚醒する！','Choose how you rise':'はじめの姿をえらぶ','Legends discovered':'発見した伝説','Rise again':'もう一度','Change start':'キャラを変える',
 'Walk right →':'右へ進め →','Wave':'ウェーブ','Score':'スコア','GO →':'進め →','The blood calls…':'血が呼んでいる…','Choose a part to graft onto your body':'体に移植する部位をえらぼう','replaces':'交換：',
 'Your blood awakens…':'血が目覚める…','Your body is ready to become a legend':'伝説の姿に覚醒できる！','Legend':'伝説','[1] Awaken':'[1] 覚醒する','Not yet':'まだしない','Keep grafting parts':'部位の移植を続ける',
 'BLOOD':'血','✦ LEGEND AWAKENED':'✦ 伝説に覚醒','Half Beast':'半獣','Beast':'魔獣','No grafts':'移植なし','New best!':'自己ベスト！','Best':'ベスト','Hint: ':'ヒント：','Best score: ':'ベストスコア：',
 legs:'脚',head:'頭',back:'背中',arms:'腕',core:'胴',
 Screech:'超音波','Fire Breath':'火炎ブレス',Bloom:'開花','Ground Slam':'地面たたき',Firebomb:'火炎ビン',Pounce:'とびかかり',Regrow:'再生','Bone Toss':'ホネ投げ','Meteor Dive':'メテオダイブ','Bat Swarm':'コウモリの群れ','Golden Roll':'黄金ころがり','Sacred Bloom':'聖なる開花',Roar:'咆哮',
 slime:'スライム',wolf:'オオカミ',bat:'コウモリ',goblin:'ゴブリン',golem:'ゴーレム',plant:'人食い花',drake:'ドレイク'};
function L(s){return LANG==='ja'&&JA[s]!=null?JA[s]:s;}
var EN={};
var JADATA={
 S:{bone:['ガイコツ','バランス型。骨のこん棒でなぐる。スキル：ホネ投げ'],goblin:['ゴブリン','すばやい短剣の連続突き。スキル：火炎ビン'],slime:['スライム','タフで自然回復する。スキル：再生'],beast:['ケモノ','四つ足で速く走り、強くかみつく。スキル：とびかかり']},
 P:{wolfLegs:['オオカミの脚','足が速くなり、高く跳べる。スキル：とびかかり'],wolfHead:['オオカミの頭','3撃目がかみつきになり、体力を吸う'],batWings:['コウモリの翼','2段ジャンプ。ジャンプ長押しで滑空'],batHead:['コウモリの頭','スキル：超音波（前の敵をマヒさせる）'],
  golemArms:['ゴーレムの拳','重いパンチ。スキル：地面たたき'],golemCore:['石の心臓','HP+60、受けるダメージ30%減'],goblinArms:['ゴブリンの腕','攻撃が短剣投げになる。スキル：火炎ビン'],slimeCore:['スライムの核','自然回復。敵を踏んで跳ねる'],
  plantArms:['ツタの腕','遠くまで届くムチ攻撃'],plantLegs:['根の脚','止まっていると回復。のけぞらない'],plantHead:['花の冠','スキル：開花（回復して種をまく）'],drakeHead:['ドレイクの頭','スキル：火炎ブレス（前方を焼く）'],drakeScales:['竜のウロコ','HP+40、ダメージ25%減、触れた敵を燃やす']},
 U:{dragon:['ドラゴン','ドレイクの頭＋竜のウロコ＋翼','自由に飛び、火を吐く。スキル：メテオダイブ'],vampire:['バンパイア','コウモリの頭＋コウモリの翼＋もう1部位','血の爪で攻撃すると回復。スキル：コウモリの群れ'],
  orichalcum:['オリハルコンスライム','スライムで開始＋石の心臓＋ゴーレムの拳','黄金のほぼ無敵の体。スキル：黄金ころがり'],tree:['神樹','ツタの腕＋根の脚＋花の冠','地面から根で攻撃し、回復する。スキル：聖なる開花'],chimera:['キメラ','4種類の生き物の部位','獅子・ヤギ・ヘビが一体に。スキル：咆哮']}};
function applyLang(){var k;
  for(k in STARTERS){EN['S'+k]=EN['S'+k]||[STARTERS[k].name,STARTERS[k].desc];var a=LANG==='ja'?JADATA.S[k]:EN['S'+k];STARTERS[k].name=a[0];STARTERS[k].desc=a[1];}

  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(el){var key=el.dataset.t;EN['t'+key]=EN['t'+key]||el.innerHTML;el.innerHTML=LANG==='ja'&&JA[key]?JA[key]:EN['t'+key];});

  document.documentElement.lang=LANG;}
// ======================= audio =======================
var AC=null;
function snd(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  var P={hit:[200,90,0.08,0.07,'square'],kill:[300,60,0.2,0.07,'sawtooth'],orb:[700,1150,0.06,0.03,'sine'],hurt:[220,70,0.25,0.1,'sawtooth'],skill:[200,800,0.25,0.06,'triangle'],graft:[180,900,0.7,0.08,'triangle'],swing:[420,220,0.06,0.025,'triangle'],jump:[300,520,0.08,0.03,'sine'],boss:[80,50,0.9,0.12,'sawtooth'],fire:[120,60,0.25,0.06,'sawtooth'],awaken:[110,880,1.4,0.1,'sawtooth']}[k];
  o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+P[2]);o.start(t);o.stop(t+P[2]+0.02);}catch(e){}}

var GROUND=0,GRAV=1900,G=null,keys={},tch={},hi=store.get('hi',0),dex=store.get('dex',{});
function chunkPlats(ci){var r=ci*7919+13,out=[];function rnd(){r=(r*1664525+1013904223)>>>0;return r/4294967296;}
  var n=ci===0?1:2+Math.floor(rnd()*2);for(var i=0;i<n;i++)out.push({x:ci*900+120+rnd()*600,y:-(90+rnd()*130),w:120+rnd()*120});return out;}
function newGame(st){G={t:0,state:'play',starter:st,ult:null,score:0,kills:0,en:[],shots:[],eshots:[],orbs:[],fx:[],texts:[],blood:{},need:5,parts:{},plats:[],chunks:0,cam:{x:0,y:-150},

function stat(){var P=G.parts,st=G.starter,u=G.ult,s={spd:STARTERS[st].spd,jump:700,maxJumps:1,dmg:12,rate:0.32,range:72,kb:240,armor:1,regen:0,ranged:false,heavy:false,bite:false,kind:'swing',life:0,noKB:false};

  if(st==='beast'){s.dmg=14;s.rate=0.3;s.range=66;s.kind='bite';s.life=0.08;s.jump=760;}

function maxHp(){var m=STARTERS[G.starter].hp+Object.keys(G.parts).length*10;if(G.parts.core==='golemCore')m+=60;if(G.parts.core==='drakeScales')m+=40;

function startWave(){G.wave++;var w=G.wave,pool=['slime','bat','goblin'];if(w>=2)pool.push('wolf','plant');if(w>=3)pool.push('golem');if(w>=4)pool.push('drake');

function cap(s){return s[0].toUpperCase()+s.slice(1);}
function spawn(q){var E=ENEMY[q.sp],side=Math.random()<0.65?1:-1,x=G.lock.x+side*(W/Z/2+40),hm=1+G.wave*0.13,b=q.boss?2.4:1;
  G.en.push({sp:q.sp,x:x,y:E.fly?-160-Math.random()*80:0,vx:0,vy:0,w:E.w*b,h:E.h*b,hp:E.hp*hm*(q.boss?12:1),max:E.hp*hm*(q.boss?12:1),spd:E.spd*(q.boss?0.7:1),dmg:E.dmg*(1+G.wave*0.05)*(q.boss?1.5:1),boss:!!q.boss,t:Math.random()*3,cd:1+Math.random()*1.5,hit:0,stun:0,burn:0,face:-side,ground:false});}
// ======================= combat =======================
function fireLater(e,shots){e.aim=0.5;e.pend=shots;}
function setBanner(t){G.banner=t;G.bannerT=2.2;}
function overlap(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs((a.y-a.h/2)-(b.y-b.h/2))<(a.h+b.h)/2;}
function hurtEnemy(e,dmg,kx,ky,quiet){if(e.dead)return;e.hp-=dmg;e.hit=0.1;e.vx+=kx;e.vy+=ky;if(ky<-100)e.ground=false;if(!quiet){G.texts.push({x:e.x,y:e.y-e.h-6,t:Math.round(dmg)+'',l:0.6,c:'#fff'});snd('hit');}G.shake=Math.max(G.shake,2);
  var s=stat();if(s.life&&!quiet){G.p.hp=Math.min(G.p.max,G.p.hp+dmg*s.life);}if(e.hp<=0)kill(e);}
function kill(e){e.dead=true;G.kills++;G.score+=Math.round(ENEMY[e.sp].pts*(e.boss?10:1)*(1+G.wave*0.1));snd('kill');G.shake=Math.max(G.shake,e.boss?16:6);
  for(var i=0;i<16;i++)G.fx.push({x:e.x,y:e.y-e.h/2,vx:(Math.random()-0.5)*420,vy:-Math.random()*380,l:0.6,c:i%2?COL[e.sp]:'#d6334a',s:3+Math.random()*4,g:1});
  if(G.ult)return; // after awakening, blood only feeds score
  var n=e.boss?10:1;for(var k=0;k<n;k++)G.orbs.push({sp:e.sp,x:e.x,y:e.y-e.h/2,vx:(Math.random()-0.5)*300,vy:-200-Math.random()*200,t:0});}
function hurtHero(d,fromX,src){var p=G.p,s=stat();if(p.inv>0||p.dash>0)return;d*=s.armor;p.hp-=d;p.inv=0.8;if(!s.noKB){p.vx=(p.x<fromX?-1:1)*300;p.vy=-300;p.ground=false;}G.shake=10;G.flash=0.25;snd('hurt');
  if(G.parts.core==='drakeScales'&&src&&!src.dead){src.burn=3;}
  if(p.hp<=0){p.hp=0;over();}}
function heroBox(){var p=G.p,h=G.ult?80:G.starter==='beast'?42:G.starter==='slime'?32:62;return {x:p.x,y:p.y,w:G.ult?40:p.w,h:h};}
// ======================= hero actions =======================
function jump(){var p=G.p,s=stat();if(p.ground){p.vy=-s.jump;p.ground=false;p.jumps=1;snd('jump');}else if(p.jumps<s.maxJumps){p.vy=-s.jump*(G.ult==='dragon'?0.6:0.9);p.jumps++;snd('jump');for(var i=0;i<6;i++)G.fx.push({x:p.x,y:p.y-20,vx:(Math.random()-0.5)*200,vy:Math.random()*120,l:0.3,c:G.ult?ULT[G.ult].col:COL.bat,s:3});}}
function meleeHit(range,dmg,kb,up,hb,col,w){var p=G.p,b={x:p.x+p.face*(range*0.5+10),y:p.y-4,w:range+20,h:hb||heroBox().h+16};
  G.en.forEach(function(e){if(overlap(b,e))hurtEnemy(e,dmg,p.face*kb,up);});G.eshots.forEach(function(sh){if(Math.abs(sh.x-b.x)<b.w/2+sh.r&&Math.abs(sh.y-(b.y-b.h/2))<b.h/2+sh.r)sh.dead=1;});G.fx.push({arc:1,x:p.x,y:p.y-heroBox().h*0.55,face:p.face,R:range+10,l:0.16,L:0.16,c:col,w:w||1});}
function attack(){var p=G.p,s=stat();if(p.atkT>0)return;p.atkT=s.rate;p.swing=0.2;if(p.comboT>0)p.combo=(p.combo+1)%3;else p.combo=0;p.comboT=0.6;var c3=p.combo===2;snd('swing');
  var k=s.kind;
  if(s.ranged){G.shots.push({x:p.x+p.face*20,y:p.y-38,vx:p.face*620,vy:-30,dmg:s.dmg,l:0.9,r:6,kind:'dagger',hitL:[]});return;}
  if(k==='breath'){snd('fire');for(var i=0;i<3;i++)G.shots.push({x:p.x+p.face*36,y:p.y-62,vx:p.face*(420+i*80),vy:(i-1)*60+40,dmg:s.dmg*0.6,l:0.4,r:12,kind:'fire',hitL:[],pierce:3});return;}
  if(k==='roots'){var best=null,bd=s.range;G.en.forEach(function(e){var d=Math.abs(e.x-p.x);if(d<bd&&e.y>-200){bd=d;best=e;}});if(!best){p.atkT=0.1;return;}
    G.fx.push({spike:1,x:best.x,y:GROUND,l:0.4,L:0.4,c:'#7a5a3a'});hurtEnemy(best,s.dmg,0,-520);best.ground=false;return;}
  if(k==='slam'){var R=s.range;G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:R,l:0.25,L:0.25,c:G.ult==='orichalcum'?'#f3c64a':'#4fcf86'});G.en.forEach(function(e){if(Math.abs(e.x-p.x)<R+e.w/2&&Math.abs(e.y-p.y)<80)hurtEnemy(e,s.dmg,(e.x>p.x?1:-1)*s.kb,-200);});return;}
  if(k==='whip'){meleeHit(s.range,s.dmg*(c3?1.3:1),180,-100,40,'#5fae4a',0.7);return;}
  if(k==='claw'||k==='maul'){meleeHit(s.range,s.dmg*(c3?1.5:1),c3?460:200,c3?-300:-80,null,k==='claw'?'#ff3b5c':'#ffb347',1.2);
    if(k==='maul'&&c3){G.fx.push({ring:1,x:p.x+p.face*50,y:p.y-30,r:0,R:90,l:0.3,L:0.3,c:'#ff8c3a'});G.en.forEach(function(e){if(Math.abs(e.x-(p.x+p.face*50))<100)hurtEnemy(e,s.dmg*0.6,p.face*200,-200);});}return;}
  var bite=s.bite&&c3,dm=s.dmg*(bite?1.6:1)*(c3?1.3:1);
  meleeHit(s.range,dm,s.kb*(c3?1.5:1),s.heavy||c3?-260:-80,null,s.heavy?'#ffb070':bite||k==='bite'?'#ff6b80':'#e9e4d4',s.heavy?1.8:1);
  if(bite){p.hp=Math.min(p.max,p.hp+dm*0.25);G.texts.push({x:p.x,y:p.y-80,t:'+'+Math.round(dm*0.25),l:0.6,c:'#ff6b80'});}}
function skillName(){var P=G.parts,u=G.ult,st=G.starter;if(u)return {dragon:'Meteor Dive',vampire:'Bat Swarm',orichalcum:'Golden Roll',tree:'Sacred Bloom',chimera:'Roar'}[u];
  return P.head==='batHead'?'Screech':P.head==='drakeHead'?'Fire Breath':P.head==='plantHead'?'Bloom':P.arms==='golemArms'?'Ground Slam':P.arms==='goblinArms'||st==='goblin'?'Firebomb':P.legs==='wolfLegs'||st==='beast'?'Pounce':st==='slime'?'Regrow':'Bone Toss';}
function skill(){var p=G.p,s=stat();if(p.cd>0||G.state!=='play')return;var n=skillName();snd('skill');
  if(n==='Screech'){p.cd=6;G.fx.push({cone:1,x:p.x,y:p.y-50,face:p.face,l:0.35,L:0.35});G.en.forEach(function(e){var dx=(e.x-p.x)*p.face;if(dx>0&&dx<340&&Math.abs((e.y-e.h/2)-(p.y-45))<160){e.stun=2.2;hurtEnemy(e,s.dmg*0.6,p.face*120,-60);}});}
  else if(n==='Fire Breath'){p.cd=5;snd('fire');for(var i=0;i<14;i++)G.shots.push({x:p.x+p.face*20,y:p.y-52,vx:p.face*(300+Math.random()*300),vy:(Math.random()-0.5)*160,dmg:s.dmg*0.5,l:0.6,r:10,kind:'fire',hitL:[],pierce:4,burn:1});}
  else if(n==='Bloom'){p.cd=8;p.hp=Math.min(p.max,p.hp+p.max*0.3);for(var j=0;j<10;j++)G.shots.push({x:p.x,y:p.y-60,vx:Math.cos(j/10*Math.PI-Math.PI)*-360*(j%2?1:-1),vy:-300+j*40,dmg:s.dmg*0.8,l:1.4,r:6,kind:'seed',hitL:[],g:1});G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:120,l:0.5,L:0.5,c:'#ff9ad5'});}
  else if(n==='Ground Slam'){p.cd=5;if(!p.ground){p.vy=1200;p.slam=true;}else slam(200,1.2,'#ffb070');}
  else if(n==='Firebomb'){p.cd=4;G.shots.push({x:p.x,y:p.y-50,vx:p.face*460,vy:-420,dmg:s.dmg*3,l:3,r:9,kind:'bomb',hitL:[],g:1});}
  else if(n==='Pounce'){p.cd=2.5;p.dash=0.25;p.vx=p.face*1100;p.vy=-120;p.hit=[];}
  else if(n==='Regrow'){p.cd=8;p.hp=Math.min(p.max,p.hp+p.max*0.35);G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:100,l:0.5,L:0.5,c:'#4fcf86'});G.texts.push({x:p.x,y:p.y-80,t:'+HP',l:0.8,c:'#4fcf86'});}
  else if(n==='Bone Toss'){p.cd=4;for(var b=0;b<5;b++)G.shots.push({x:p.x,y:p.y-45,vx:p.face*(380+b*60),vy:-260+b*80,dmg:s.dmg,l:1.4,r:7,kind:'bone',hitL:[],g:1});}
  else if(n==='Meteor Dive'){p.cd=5;if(p.ground){p.vy=-900;p.meteor=true;}else{p.vy=1400;p.slam=true;p.meteor=true;}}
  else if(n==='Bat Swarm'){p.cd=6;for(var v=0;v<12;v++)G.shots.push({x:p.x,y:p.y-60,vx:Math.cos(v/12*6.28)*300,vy:Math.sin(v/12*6.28)*300,dmg:s.dmg*0.8,l:2.5,r:7,kind:'bat',hitL:[],home:1});}
  else if(n==='Golden Roll'){p.cd=3;p.dash=0.45;p.vx=p.face*1000;p.hit=[];}
  else if(n==='Sacred Bloom'){p.cd=9;p.hp=Math.min(p.max,p.hp+p.max*0.4);G.en.forEach(function(e){G.fx.push({spike:1,x:e.x,y:GROUND,l:0.5,L:0.5,c:'#7a5a3a'});hurtEnemy(e,s.dmg*1.4,0,-600);});G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:300,l:0.6,L:0.6,c:'#ff9ad5'});}
  else if(n==='Roar'){p.cd=7;G.shake=20;G.fx.push({ring:1,x:p.x,y:p.y-40,r:0,R:420,l:0.5,L:0.5,c:'#ffb347'});G.en.forEach(function(e){if(Math.abs(e.x-p.x)<500){e.stun=2.5;hurtEnemy(e,s.dmg,(e.x>p.x?1:-1)*300,-200);}});}}
function slam(R,mul,col){var p=G.p,s=stat();p.slam=false;G.shake=18;G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:R,l:0.35,L:0.35,c:col});
  if(p.meteor){p.meteor=false;snd('fire');for(var i=0;i<16;i++)G.fx.push({x:p.x,y:p.y-10,vx:(Math.random()-0.5)*600,vy:-Math.random()*400,l:0.7,c:i%2?'#ff8c3a':'#ffd34f',s:5,g:1});}
  G.en.forEach(function(e){if(Math.abs(e.x-p.x)<R+10&&Math.abs(e.y-p.y)<140){e.stun=1.2;hurtEnemy(e,s.dmg*mul,(e.x>p.x?1:-1)*380,-420);}});}
// ======================= blood → grafts → awakening =======================
function addBlood(sp){G.blood[sp]=(G.blood[sp]||0)+1;var tot=0;for(var k in G.blood)tot+=G.blood[k];if(tot>=G.need&&G.state==='play')offer();}
function offer(){var sps=Object.keys(G.blood).sort(function(a,b){return G.blood[b]-G.blood[a];}),opts=[];
  sps.forEach(function(sp){(BYSP[sp]||[]).forEach(function(k){if(G.parts[PARTS[k].slot]!==k&&opts.length<3&&opts.indexOf(k)<0)opts.push(k);});});
  if(!opts.length){G.blood={};return;}
  G.state='graft';$('graftT').textContent=L('The blood calls…');$('graftP').textContent=L('Choose a part to graft onto your body');var el=$('cards');el.innerHTML='';
  opts.forEach(function(k,i){var Pt=PARTS[k],pp={};for(var s in G.parts)pp[s]=G.parts[s];pp[Pt.slot]=k;
    var b=card(COL[Pt.sp],function(g){drawBody(g,{x:0,y:0,face:1,walk:0.6,swing:0,ground:true,h:62},pp,G.starter,null);},
      '<em>'+L(Pt.slot)+(G.parts[Pt.slot]?' · '+L('replaces')+' '+PARTS[G.parts[Pt.slot]].name:'')+'</em><b>'+Pt.name+'</b><span>'+Pt.desc+'</span>'+hintFor(pp)+'<em>['+(i+1)+']</em>');
    b.addEventListener('click',function(){graft(k);});el.appendChild(b);});
  $('graft').hidden=false;focusFirst(el);}
function hintFor(pp){var u=ultFor(pp,G.starter);return u?'<em style="color:'+ULT[u].col+'">✦ '+(LANG==='ja'?ULT[u].name+'に覚醒できる':'unlocks '+ULT[u].name)+'</em>':'';}
function ultFor(P,st){for(var i=0;i<ULTORDER.length;i++)if(ULT[ULTORDER[i]].cond(P,st))return ULTORDER[i];return null;}
function graft(k){var Pt=PARTS[k],p=G.p;G.parts[Pt.slot]=k;G.history.push(k);G.blood={};G.need=Math.round(G.need*1.3+3);var m=maxHp();p.max=m;p.hp=Math.min(m,p.hp+m*0.3);snd('graft');
  burst(p.x,p.y-30,COL[Pt.sp],40);setBanner(LANG==='ja'?Pt.name+'を移植！':Pt.name+' grafted!');$('graft').hidden=true;
  var u=ultFor(G.parts,G.starter);if(u){offerAwaken(u);return;}G.state='play';last=performance.now();}
function offerAwaken(u){G.state='graft';var U=ULT[u];$('graftT').textContent=L('Your blood awakens…');$('graftP').textContent=L('Your body is ready to become a legend');var el=$('cards');el.innerHTML='';
  var b=card(U.col,function(g){var A=ULTART[u],a=ATLAS[A[0]],f=Math.min(90/A[1],100/(a[2]/a[3]*A[1]));g.scale(f,f);drawUlt(g,{x:0,y:0,face:1,walk:0.5,swing:0,ground:true},u,true);},'<em>'+L('Legend')+'</em><b>'+U.name+'</b><span>'+U.desc+'</span><em>'+L('[1] Awaken')+'</em>');b.classList.add('ult');
  b.addEventListener('click',function(){awaken(u);});el.appendChild(b);
  var n=document.createElement('button');n.type='button';n.className='card';n.style.minHeight='auto';n.innerHTML='<b>'+L('Not yet')+'</b><span>'+L('Keep grafting parts')+'</span><em>[2]</em>';n.addEventListener('click',function(){$('graft').hidden=true;G.state='play';last=performance.now();});el.appendChild(n);
  $('graft').hidden=false;focusFirst(el);}
function awaken(u){G.ult=u;var p=G.p;p.max=maxHp();p.hp=p.max;snd('awaken');dex[u]=1;store.set('dex',dex);G.shake=24;
  for(var i=0;i<4;i++)setTimeout(function(){burst(p.x,p.y-40,ULT[u].col,40);},i*120);G.fx.push({ring:1,x:p.x,y:p.y-40,r:0,R:420,l:0.8,L:0.8,c:ULT[u].col});
  setBanner(LANG==='ja'?ULT[u].name+'に覚醒！':ULT[u].name.toUpperCase()+' AWAKENS');$('graft').hidden=true;G.state='play';last=performance.now();}
function burst(x,y,c,n){for(var i=0;i<n;i++)G.fx.push({x:x,y:y,vx:(Math.random()-0.5)*500,vy:(Math.random()-0.5)*500,l:0.8,c:c,s:4+Math.random()*4});}
function card(col,drawFn,html){var b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--c',col);
  var c=document.createElement('canvas');c.width=c.height=260;b.appendChild(c);var g=c.getContext('2d');g.translate(130,225);g.scale(2.4,2.4);drawFn(g);b.insertAdjacentHTML('beforeend',html);return b;}
function focusFirst(el){setTimeout(function(){var f=el.querySelector('button');if(f)f.focus();},60);}
// ======================= update =======================
function update(dt){var p=G.p,s=stat();G.t+=dt;p.max=maxHp();var hb=heroBox();
  var mx=(keys.ArrowLeft||keys.KeyA||tch.L?-1:0)+(keys.ArrowRight||keys.KeyD||tch.R?1:0);
  if(p.dash>0){p.dash-=dt;G.en.forEach(function(e){if(p.hit.indexOf(e)<0&&overlap(hb,e)){p.hit.push(e);hurtEnemy(e,s.dmg*(G.ult==='orichalcum'?1.5:2),p.face*500,-300);}});if(Math.random()<0.7)G.fx.push({x:p.x,y:p.y-hb.h/2,vx:0,vy:0,l:0.2,c:G.ult==='orichalcum'?'rgba(243,198,74,.7)':'rgba(200,210,230,.6)',s:14});}
  else{var acc=p.ground?3000:1800;if(mx){p.vx+=mx*acc*dt;p.face=mx;}else p.vx*=Math.pow(p.ground?0.0005:0.2,dt);p.vx=Math.max(-s.spd,Math.min(s.spd,p.vx));}
  var holdJump=keys.ArrowUp||keys.KeyW||keys.Space||tch.J,wings=G.parts.back==='batWings'||G.ult==='dragon'||G.ult==='vampire';p.glide=wings&&holdJump&&p.vy>0&&!p.ground;
  p.vy+=GRAV*dt*(p.glide?0.18:1);if(p.glide)p.vy=Math.min(p.vy,G.ult==='dragon'?60:140);
  var oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
  var minX=G.lock?G.lock.x-W/Z/2+20:Math.max(20,G.cam.x-W/Z/2+20),maxX=G.lock?G.lock.x+W/Z/2-(TOUCH?150/Z:20):1e9;p.x=Math.max(minX,Math.min(maxX,p.x));p.y=Math.max(p.y,-H/Z*0.85);
  var landed=false;p.ground=false;if(p.y>=GROUND){p.y=GROUND;if(p.vy>0)landed=true;p.ground=true;}
  G.plats.forEach(function(pl){if(p.vy>=0&&oy<=pl.y&&p.y>=pl.y&&p.x>pl.x&&p.x<pl.x+pl.w&&!(keys.ArrowDown||keys.KeyS)){p.y=pl.y;landed=true;p.ground=true;}});
  if(p.landT>0)p.landT-=dt;if(p.ground&&!p.wasG)p.landT=0.14;p.wasG=p.ground;
  if(p.ground){if(landed&&p.slam)slam(p.meteor?240:200,p.meteor?2:1.2,p.meteor?'#ff8c3a':'#ffb070');p.vy=0;p.jumps=0;}
  if(p.inv>0)p.inv-=dt;if(p.cd>0)p.cd-=dt;if(p.atkT>0)p.atkT-=dt;if(p.comboT>0)p.comboT-=dt;if(p.swing>0)p.swing-=dt;
  p.walk+=Math.abs(p.vx)*dt*0.045;var regen=s.regen+(G.parts.legs==='plantLegs'&&Math.abs(p.vx)<20&&p.ground?6:0);if(regen)p.hp=Math.min(p.max,p.hp+regen*dt);
  if(keys.KeyJ||tch.A)attack();else autoAttack();
  while(G.chunks*900<p.x+2000)addChunk();
  if(!G.lock&&p.x>G.wave*700+500)startWave();
  if(G.lock){G.lock.t+=dt;while(G.lock.q.length&&G.lock.q[0].at<=G.lock.t)spawn(G.lock.q.shift());if(!G.lock.q.length&&!G.en.length){G.lock=null;p.hp=Math.min(p.max,p.hp+p.max*0.12);setBanner(L('GO →'));}}
  // enemies
  G.en.forEach(function(e){var E=ENEMY[e.sp];e.t+=dt;if(e.hit>0)e.hit-=dt;var dx=p.x-e.x,ad=Math.abs(dx),dir=dx>0?1:-1;
    if(e.burn>0){e.burn-=dt;if(Math.random()<dt*4){hurtEnemy(e,3,0,0,true);G.fx.push({x:e.x+(Math.random()-0.5)*e.w,y:e.y-e.h*Math.random(),vx:0,vy:-60,l:0.4,c:'#ff8c3a',s:3});}}
    if(e.aim>0){e.aim-=dt;e.vx*=0.85;if(e.aim<=0){e.aim=0;if(e.stun<=0)G.eshots=G.eshots.concat(e.pend);e.pend=null;}}
    if(e.stun>0){e.stun-=dt;e.aim=0;}
    else if(e.sp==='slime'){if(e.ground&&e.cd<=0){e.cd=1.1;e.vy=-420;e.vx=dir*e.spd*2.2;}}

    for(var x=-400;x<=W+400;x+=40){var wx=x-off,k=Math.floor((x+G.cam.x*Z*L[0])/40);var hgt=L[3]*(0.5+0.5*Math.abs(Math.sin(k*1.7)))+(k%5===0?L[3]*0.6:0);ctx.lineTo(wx,H*L[2]-hgt*Z*0.6);}ctx.lineTo(W,H);ctx.fill();});}
var EART={slime:['eSlime',1.2,0.5,0.98],wolf:['eWolf',1.1,0.5,0.98],bat:['eBat',1.35,0.5,0.5],goblin:['eGoblin',1.1,0.45,0.98],golem:['eGolem',1.1,0.5,0.98],plant:['ePlant',1.15,0.45,0.98],drake:['eDrake',1.15,0.5,0.98]};
function drawEnemy(e){var E=ENEMY[e.sp],A=EART[e.sp],s=e.w/E.w,t=e.t;ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.face*s,s);
  if(!E.fly){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,E.w*0.55,4,0,0,7);ctx.fill();}
  var h=E.h*A[1],sx=1,sy=1,rot=0,y=0;
  if(e.sp==='slime'){var q=e.ground?1+Math.sin(t*8)*0.07:0.88;sx=1/q;sy=q;}
  else if(e.sp==='bat'){y=-E.h/2+Math.sin(t*10)*2;sy=1+Math.sin(t*16)*0.06;}
  else if(e.sp==='golem'){rot=e.slamT>0?-0.15+Math.sin(e.slamT*20)*0.05:Math.sin(t*4)*0.02;}
  else if(e.sp==='plant'){rot=Math.sin(t*3)*0.06;}
  else{var run=e.ground&&Math.abs(e.vx)>20;y=run?-Math.abs(Math.sin(t*12))*2:0;rot=run?Math.sin(t*12)*0.05:0;}
  if(e.aim>0){sx*=1.06;sy*=0.94;}

  ctx.restore();
  if(e.hit>0){ctx.globalAlpha=0.5;ctx.fillStyle='#fff';ctx.fillRect(e.x-e.w/2,e.y-e.h,e.w,e.h);ctx.globalAlpha=1;}
  if(e.burn>0){ctx.fillStyle='rgba(255,140,58,.25)';ctx.fillRect(e.x-e.w/2,e.y-e.h,e.w,e.h);}
  if(e.aim>0){ctx.fillStyle='#ffd34f';ctx.font='900 22px sans-serif';ctx.textAlign='center';ctx.fillText('!',e.x,e.y-e.h-10);}
  if(e.stun>0){ctx.fillStyle='#ffd34f';for(var k2=0;k2<3;k2++){var a2=G.t*5+k2*2.1;ctx.beginPath();ctx.arc(e.x+Math.cos(a2)*e.w*0.5,e.y-e.h-8+Math.sin(a2)*3,3,0,7);ctx.fill();}}
  if(e.hp<e.max){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-e.w/2,e.y-e.h-14,e.w,4);ctx.fillStyle=e.boss?'#ff3b4e':'#ff8a8a';ctx.fillRect(e.x-e.w/2,e.y-e.h-14,e.w*Math.max(0,e.hp/e.max),4);}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);if(!G){ctx.fillStyle='#15111b';ctx.fillRect(0,0,W,H);return;}
  background();ctx.save();var sh=G.shake;if(sh>0.5)ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
  ctx.translate(W/2,H/2);ctx.scale(Z,Z);ctx.translate(-G.cam.x,-G.cam.y);var vl=G.cam.x-W/Z/2-50,vr=G.cam.x+W/Z/2+50;
  ctx.fillStyle='#2b2233';ctx.fillRect(vl,GROUND,vr-vl,H/Z);ctx.fillStyle='#3d3046';ctx.fillRect(vl,GROUND,vr-vl,8);
  for(var x=Math.floor(vl/80)*80;x<vr;x+=80){var hsh=(x*73856093>>>0)%9;if(hsh<2){ctx.fillStyle='#4d405a';rr(ctx,x+10,GROUND-30,20,30,8);ctx.fill();ctx.fillStyle='#3a2f45';ctx.fillRect(x+18,GROUND-24,4,14);ctx.fillRect(x+14,GROUND-20,12,4);}
    else if(hsh===3){ctx.strokeStyle='#3a2f45';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+40,GROUND);ctx.lineTo(x+40,GROUND-60);ctx.moveTo(x+40,GROUND-40);ctx.lineTo(x+56,GROUND-56);ctx.moveTo(x+40,GROUND-30);ctx.lineTo(x+26,GROUND-46);ctx.stroke();}}
  G.plats.forEach(function(pl){if(pl.x+pl.w<vl||pl.x>vr)return;ctx.fillStyle='#4a3d55';rr(ctx,pl.x,pl.y,pl.w,14,6);ctx.fill();ctx.fillStyle='#5e4f6b';rr(ctx,pl.x,pl.y,pl.w,5,3);ctx.fill();});
  if(G.lock){ctx.fillStyle='rgba(214,51,74,.25)';ctx.fillRect(G.lock.x-W/Z/2,GROUND-400,6,400);ctx.fillRect(G.lock.x+W/Z/2-6,GROUND-400,6,400);}
  G.orbs.forEach(function(o){ctx.fillStyle='#d6334a';ctx.shadowColor='#ff4060';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=COL[o.sp];ctx.beginPath();ctx.arc(o.x,o.y,2.2,0,7);ctx.fill();});
  G.en.forEach(drawEnemy);
  var p=G.p;if(!(p.inv>0&&Math.floor(p.inv*20)%2)){ctx.save();ctx.shadowColor=G.ult?ULT[G.ult].col:'rgba(255,230,180,.35)';ctx.shadowBlur=G.ult?18:12;drawBody(ctx,p,G.parts,G.starter,G.ult);ctx.restore();}
  G.shots.forEach(function(s){ctx.save();ctx.translate(s.x,s.y);
    if(s.kind==='bone'){ctx.rotate(G.t*14);spr(ctx,'skClub',0,0,8,0.5,0.5);}
    else if(s.kind==='bomb'){ctx.fillStyle='#ff8c3a';ctx.beginPath();ctx.arc(0,0,s.r,0,7);ctx.fill();ctx.fillStyle='#ffd34f';ctx.beginPath();ctx.arc(3,-7,3,0,7);ctx.fill();}
    else if(s.kind==='fire'){var k=s.l/0.6;ctx.globalAlpha=Math.min(1,k*1.5);ctx.rotate(Math.atan2(s.vy,s.vx));spr(ctx,'fire',0,0,s.r*2.6*(1.4-k*0.5),0.6,0.5,0,-1,1);}
    else if(s.kind==='seed'){ctx.fillStyle='#9be07a';ctx.beginPath();ctx.ellipse(0,0,5,3,Math.atan2(s.vy,s.vx),0,7);ctx.fill();}
    else if(s.kind==='bat'){ctx.fillStyle='#b3203a';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();var fw=Math.sin(G.t*30)*0.6;[-1,1].forEach(function(q){ctx.save();ctx.scale(q,1);ctx.rotate(fw);ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(12,-5);ctx.lineTo(9,3);ctx.fill();ctx.restore();});}
    else{ctx.rotate(Math.atan2(s.vy,s.vx));spr(ctx,'gbKnife',0,0,6,0.5,0.5);}ctx.restore();});
  G.eshots.forEach(function(s){if(s.col==='#ff8c3a'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));spr(ctx,'fire',0,0,s.r*2.6,0.6,0.5,0,-1,1);ctx.restore();return;}ctx.fillStyle=s.col;ctx.shadowColor='#ff3b4e';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.shadowBlur=0;});
  G.fx.forEach(function(f){ctx.globalAlpha=Math.max(0,Math.min(1,f.l*3));
    if(f.ring){ctx.strokeStyle=f.c;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r,f.r*0.35,0,0,7);ctx.stroke();}
    else if(f.arc){var k=1-f.l/f.L;ctx.strokeStyle=f.c;ctx.lineWidth=7*f.w;ctx.lineCap='round';ctx.beginPath();if(f.face>0)ctx.arc(f.x,f.y,f.R*0.8,-1.3+k*0.4,0.2+k*1.0);else ctx.arc(f.x,f.y,f.R*0.8,Math.PI-0.2-k*1.0,Math.PI+1.3-k*0.4);ctx.stroke();}
    else if(f.cone){var k2=1-f.l/f.L;ctx.strokeStyle='#c9a6ff';ctx.lineWidth=3;for(var i=0;i<4;i++){var r2=40+k2*260+i*24;ctx.beginPath();if(f.face>0)ctx.arc(f.x,f.y,r2,-0.5,0.5);else ctx.arc(f.x,f.y,r2,Math.PI-0.5,Math.PI+0.5);ctx.stroke();}}
    else if(f.spike){var k3=Math.sin((1-f.l/f.L)*Math.PI);ctx.fillStyle=f.c;ctx.beginPath();ctx.moveTo(f.x-14,f.y);ctx.lineTo(f.x-4,f.y-70*k3);ctx.lineTo(f.x+2,f.y-40*k3);ctx.lineTo(f.x+8,f.y-80*k3);ctx.lineTo(f.x+16,f.y);ctx.fill();ctx.fillStyle='#6cc552';ctx.beginPath();ctx.arc(f.x+8,f.y-80*k3,4,0,7);ctx.fill();}
    else{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();}ctx.globalAlpha=1;});
  G.texts.forEach(function(t){ctx.globalAlpha=Math.min(1,t.l*2);ctx.fillStyle=t.c;ctx.font='900 16px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillText(t.t,t.x,t.y);ctx.globalAlpha=1;});
  ctx.restore();
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(G.flash>0){ctx.fillStyle='rgba(214,51,74,'+(G.flash*0.8)+')';ctx.fillRect(0,0,W,H);}
  hud();}
function formName(){if(G.ult)return ULT[G.ult].name;var n=Object.keys(G.parts).length,b=STARTERS[G.starter].name;return n===0?b:n<3?(LANG==='ja'?'まざり'+b:b+' Chimera'):n<5?L('Half Beast'):L('Beast');}
function hud(){var p=G.p,x=16,y=14,k=Math.max(0.62,Math.min(1,H/560));ctx.save();ctx.scale(k,k);ctx.fillStyle='rgba(20,15,26,.78)';rr(ctx,x,y,330,92,16);ctx.fill();
  ctx.save();rr(ctx,x+8,y+8,76,76,12);ctx.fillStyle='#2a2333';ctx.fill();ctx.clip();ctx.translate(x+44,y+80);var sc=G.ult?0.62:G.starter==='beast'?0.95:1;ctx.scale(sc,sc);drawBody(ctx,{x:0,y:0,face:1,walk:G.t*2,swing:0,ground:true,h:62},G.parts,G.starter,G.ult);ctx.restore();
  ctx.textAlign='left';ctx.fillStyle=G.ult?ULT[G.ult].col:'#f4efe6';ctx.font='900 16px Trebuchet MS,sans-serif';ctx.fillText(formName(),x+94,y+24);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(ctx,x+94,y+32,224,14,7);ctx.fill();ctx.fillStyle='#e8445a';rr(ctx,x+94,y+32,224*Math.max(0,p.hp/p.max),14,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText(Math.ceil(p.hp)+' / '+p.max,x+100,y+43);
  var bx=x+94,bw=224;if(!G.ult){var tot=0;for(var k in G.blood)tot+=G.blood[k];ctx.fillStyle='rgba(255,255,255,.12)';rr(ctx,bx,y+54,bw,10,5);ctx.fill();
    var off=0;Object.keys(G.blood).forEach(function(s){var w2=bw*Math.min(1,G.blood[s]/G.need);ctx.fillStyle=COL[s];ctx.fillRect(bx+off,y+54,Math.max(0,Math.min(w2,bw-off)),10);off+=w2;});
    ctx.fillStyle='#c9bdd4';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText(L('BLOOD')+' '+tot+'/'+G.need,bx,y+80);}
  else{ctx.fillStyle=ULT[G.ult].col;ctx.font='900 11px Trebuchet MS,sans-serif';ctx.fillText(L('✦ LEGEND AWAKENED'),bx,y+68);}
  ctx.textAlign='right';ctx.fillStyle=p.cd<=0?'#ffd34f':'#9b90a8';ctx.font='900 13px Trebuchet MS,sans-serif';ctx.fillText((p.cd<=0?'[K] ':'')+L(skillName())+(p.cd>0?' '+p.cd.toFixed(1)+'s':''),x+318,y+80);
  ctx.fillStyle='#f4efe6';ctx.font='900 22px Trebuchet MS,sans-serif';ctx.fillText(L('Wave')+' '+G.wave,W/k-16,36);ctx.fillStyle='#c9bdd4';ctx.font='800 15px Trebuchet MS,sans-serif';ctx.fillText(L('Score')+' '+G.score,W/k-16,58);
  ctx.restore();
  if(G.bannerT>0){ctx.globalAlpha=Math.min(1,G.bannerT*1.5);ctx.textAlign='center';ctx.font='900 '+Math.round(Math.min(W,H)*0.065)+'px Trebuchet MS,sans-serif';ctx.fillStyle='#f4efe6';ctx.shadowColor=G.ult?ULT[G.ult].col:'#d6334a';ctx.shadowBlur=20;ctx.fillText(G.banner,W/2,H*0.3);ctx.shadowBlur=0;ctx.globalAlpha=1;}}
// ======================= title / flow =======================
function buildTitle(){var el=$('starters');el.innerHTML='';Object.keys(STARTERS).forEach(function(k,i){var S=STARTERS[k];
    var b=card(k==='bone'?'#e9e4d4':COL[k==='beast'?'wolf':k],function(g){g.scale(k==='beast'?1.15:1,k==='beast'?1.15:1);drawBody(g,{x:0,y:0,face:1,walk:0.6,swing:0,ground:true,h:62},{},k,null);},'<b>'+S.name+'</b><span>'+S.desc+'</span><em>['+(i+1)+']</em>');
    b.addEventListener('click',function(){start(k);});el.appendChild(b);});
  var dx=$('dex');dx.innerHTML='';var n=0;ULTORDER.forEach(function(u){var U=ULT[u],got=!!dex[u];if(got)n++;var d=document.createElement('div'),c=document.createElement('canvas');c.width=c.height=160;var g=c.getContext('2d');g.translate(80,150);g.scale(0.95,0.95);
    if(!got){g.filter='brightness(0)';g.globalAlpha=0.6;}drawUlt(g,{x:0,y:0,face:1,walk:0.5,swing:0,ground:true},u,true);d.appendChild(c);
    d.insertAdjacentHTML('beforeend','<b style="color:'+(got?U.col:'#f4efe6')+'">'+(got?U.name:'???')+'</b>'+(got?U.desc:L('Hint: ')+U.hint));dx.appendChild(d);});
  $('dexN').textContent=n+' / '+ULTORDER.length;$('hi').textContent=hi?L('Best score: ')+hi:'';}
function over(){G.state='dead';if(G.score>hi){hi=G.score;store.set('hi',hi);}
  setTimeout(function(){$('deadT').textContent=LANG==='ja'?'ウェーブ'+G.wave+'で倒れた…':'You fell on wave '+G.wave;$('deadP').textContent=(LANG==='ja'?'スコア '+G.score+' ・ '+G.kills+'体たおした':'Score '+G.score+' · '+G.kills+' defeated')+(G.score>=hi?' · '+L('New best!'):' · '+L('Best')+' '+hi);
    var el=$('deadForm');el.innerHTML='';var b=card(G.ult?ULT[G.ult].col:'#e9e4d4',function(g){if(G.ult){g.scale(0.7,0.7);}drawBody(g,{x:0,y:0,face:1,walk:0.6,swing:0,ground:true,h:62},G.parts,G.starter,G.ult);},
      '<b>'+formName()+'</b><span>'+(G.history.length?G.history.map(function(k){return PARTS[k].name;}).join(' → '):L('No grafts'))+'</span>');b.style.pointerEvents='none';el.appendChild(b);
    $('dead').hidden=false;['tcl','tcr'].forEach(function(i){$(i).hidden=true;});},900);}
var last=performance.now(),acc=0,STEP=1/60;
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;while(acc>=STEP){if(G&&G.state==='play')update(STEP);acc-=STEP;}draw();if(G)drawStick();requestAnimationFrame(frame);}
var lastStarter='bone';
function start(k){lastStarter=k;newGame(k);$('title').hidden=true;$('dead').hidden=true;['tcl','tcr'].forEach(function(i){$(i).hidden=false;});last=performance.now();}
// ======================= input =======================
addEventListener('keydown',function(e){if(e.repeat&&e.code!=='KeyJ')return;keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  var dg=/^Digit[1-4]$/.test(e.code)?+e.code.slice(5):0;
  if(!$('title').hidden&&dg){start(Object.keys(STARTERS)[dg-1]);return;}
  if(G&&G.state==='graft'&&dg){var b=$('cards').querySelectorAll('button')[dg-1];if(b)b.click();return;}
  if(!G||G.state!=='play')return;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')jump();if(e.code==='KeyK')skill();if(e.code==='KeyJ')attack();});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};tch={};});
Array.prototype.forEach.call(document.querySelectorAll('.tc button'),function(b){var k=b.dataset.k;
  b.addEventListener('pointerdown',function(e){e.preventDefault();tch[k]=true;if(!G||G.state!=='play')return;if(k==='J')jump();if(k==='S')skill();if(k==='A')attack();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){b.addEventListener(t,function(){tch[k]=false;});});});
var TOUCH=matchMedia('(pointer:coarse)').matches,stick=null;
cv.addEventListener('pointerdown',function(e){if(!G||G.state!=='play')return;TOUCH=true;if(e.clientX<W*0.6){stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};}});
cv.addEventListener('pointermove',function(e){if(!stick||e.pointerId!==stick.id)return;stick.x=e.clientX;stick.y=e.clientY;var dx=stick.x-stick.x0;if(Math.abs(dx)>60)stick.x0=stick.x-Math.sign(dx)*60;tch.L=dx<-14;tch.R=dx>14;
  if(stick.y0-stick.y>55&&!stick.jumped){stick.jumped=1;jump();}if(stick.y0-stick.y<25)stick.jumped=0;});
['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(e){if(stick&&e.pointerId===stick.id){stick=null;tch.L=tch.R=false;}});});
function autoAttack(){if(!TOUCH||!G||G.state!=='play')return;var p=G.p,s=stat(),r=(s.ranged||s.kind==='breath'?320:s.kind==='roots'?s.range:s.range+30);
  for(var i=0;i<G.en.length;i++){var e=G.en[i],dx=e.x-p.x;if(Math.abs(dx)<r+e.w/2&&Math.abs((e.y-e.h/2)-(p.y-40))<120){if(!(tch.L||tch.R))p.face=dx>0?1:-1;attack();return;}}}
function drawStick(){if(!stick)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=0.35;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.x0,stick.y0,60,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(stick.x0+Math.max(-60,Math.min(60,stick.x-stick.x0)),stick.y0+Math.max(-60,Math.min(60,stick.y-stick.y0)),26,0,7);ctx.fill();ctx.globalAlpha=1;}
$('again').addEventListener('click',function(){start(lastStarter);});$('toTitle').addEventListener('click',function(){$('dead').hidden=true;G=null;buildTitle();$('title').hidden=false;});
$('lang').addEventListener('click',function(){LANG=LANG==='ja'?'en':'ja';store.set('lang',LANG);applyLang();buildTitle();});
applyLang();ART.onload=function(){ARTOK=true;buildTitle();};buildTitle();requestAnimationFrame(frame);
