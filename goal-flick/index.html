<script>

  // stands
  g.fillStyle='#4a4a6a';g.fillRect(-20,HZ-H*0.09,W+40,H*0.09);for(var i=0;i<60;i++){C((i*53+(i%3)*11)%(W+20),HZ-H*0.07+(i%4)*H*0.015,4,['#ff6a6a','#ffd84a','#5ad8ff','#fff'][i%4]);}
