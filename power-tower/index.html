<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

.over[hidden]{display:none}

<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>POWER<small>TOWER</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(44px,12vw,72px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'塔の部屋をタップして勇者を送りこもう。<br><b>自分より弱い敵</b>をたおすと、その強さがまるごと自分のものに！<br>強い敵に挑むとやられる。順番を考えて、全部の部屋を空にしよう。',play:'あそぶ',again:'もういちど',lv:'ステージ',dead:'やられた！',cont:'▶ 広告を見て やり直し',retry:'このステージをやり直す',na:'広告を読み込めませんでした',best:'さいこう',clear:'クリア！',undo:'↺ やり直し'}
 :{how:'Tap a room to send your hero in.<br>Beat an enemy <b>weaker than you</b> and absorb all its power!<br>Challenge a stronger one and you lose. Plan the order and empty every room.',play:'PLAY',again:'TRY AGAIN',lv:'Stage',dead:'Defeated!',cont:'▶ Watch ad: retry stage',retry:'Retry this stage',na:'Ad not available',best:'Best',clear:'CLEAR!',undo:'↺ Retry'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('pt-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('pt-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0),saved=store.get('lv',1);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR;
var state='title',t=0,lv=1,hero,towers,anim=null,FX=[],nums=[],shake=0,used=false,games=0,clearT=0,seed=1;
var KINDS=['frog','shroom','bat','golem','crab','imp'];
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
// generate a stage with a guaranteed solution order
function gen(n){seed=n*7919+13;var nt=n<3?1:n<8?2:3,rooms=Math.min(nt*5,3+Math.floor(n*0.9)),h=ri(5,12)+n,start=h,list=[];
  for(var i=0;i<rooms;i++){var r=rnd(),e;
    if(n>=4&&r<0.12&&i>0&&i<rooms-1){e={k:'x2'};h*=2;}
    else if(n>=3&&r<0.26&&i>0){var v=Math.max(1,Math.floor(h*(0.2+rnd()*0.3)));e={k:'trap',v:v};h-=v;}
    else if(r<0.38&&i<rooms-1){var p=Math.max(2,Math.floor(h*(0.15+rnd()*0.35)));e={k:'gem',v:p};h+=p;}
    else{var lo=Math.max(1,Math.floor(h*0.45)),v2=ri(lo,h-1);e={k:KINDS[ri(0,KINDS.length-1)],v:v2};h+=v2;}
    list.push(e);}
  // last enemy is a boss just under hero power
  var bv=h-ri(1,Math.max(1,Math.floor(h*0.08)));list.push({k:'boss',v:bv});
  // distribute: a random permutation into towers (trap/x2 positions also shuffled)
  for(var j=list.length-1;j>0;j--){var q=Math.floor(rnd()*(j+1)),x=list[j];list[j]=list[q];list[q]=x;}
  // boss always on the top floor of the last tower
  var bi=list.findIndex(function(e){return e.k==='boss';}),bo=list.splice(bi,1)[0];
  var T=[];for(var a=0;a<nt;a++)T.push([]);list.forEach(function(e,i){T[i%nt].push(e);});T[nt-1].push(bo);
  return {hero:start,towers:T};}
function load(n){lv=n;var s=gen(n);hero={p:s.hero,x:0,y:0,face:1};towers=s.towers.map(function(c){return c.map(function(e){return {e:e,alive:1};});});anim=null;FX=[];nums=[];}
function start(n){used=false;load(n||1);state='play';}
// layout
function lay(){var nt=towers.length,maxF=Math.max.apply(null,towers.map(function(c){return c.length;})),top=96,bot=H-30,avail=bot-top,fh=Math.min(110,avail/(maxF+0.6)),hw=Math.min(110,W*0.26),tw=Math.min(130,(W-hw-36-(nt-1)*10)/nt),x0=18+hw+14;
  return {fh:fh,hw:hw,tw:tw,hx:18,ground:bot,cols:towers.map(function(c,i){return {x:x0+i*(tw+10),rooms:c.map(function(r,f){return {x:x0+i*(tw+10),y:bot-(f+1)*fh,w:tw,h:fh};})};})};}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(state!=='play'||anim)return;var x=e.clientX,y=e.clientY,L=lay();
  if(x>W-110&&y<60){tone(300,0.08,'triangle',0.04,0.8);load(lv);return;}
  L.cols.forEach(function(c,i){c.rooms.forEach(function(r,f){var rm=towers[i][f];if(rm.alive&&x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)go(i,f,r);});});});
addEventListener('keydown',function(e){if(e.key==='r'&&state==='play'&&!anim)load(lv);});
function go(i,f,r){var rm=towers[i][f];anim={i:i,f:f,t:0,tx:r.x+r.w*0.3,ty:r.y+r.h,rm:rm};tone(500,0.06,'triangle',0.03,1.3);}
function resolve(){var rm=anim.rm,e=rm.e,L=lay(),r=L.cols[anim.i].rooms[anim.f],cx=r.x+r.w/2,cy=r.y+r.h*0.55;
  if(e.k==='gem'){hero.p+=e.v;rm.alive=0;pop(cx,cy,'+'+e.v,'#7affb0');tone(880,0.1,'triangle',0.05,1.5);}
  else if(e.k==='x2'){pop(cx,cy,'×2','#ffd84a');hero.p*=2;rm.alive=0;tone(660,0.08,'square',0.05,1.5);setTimeout(function(){tone(1320,0.12,'square',0.05,1.2);},90);}
  else if(e.k==='trap'){hero.p-=e.v;rm.alive=0;pop(cx,cy,'-'+e.v,'#ff6a6a');shake=0.2;tone(160,0.15,'sawtooth',0.05,0.6);if(hero.p<=0){hero.p=0;lose();return;}}
  else{if(hero.p>e.v){hero.p+=e.v;rm.alive=0;pop(cx,cy,'+'+e.v,'#ffd84a');burst(cx,cy,e.k==='boss'?'#ff7a3a':'#fff');shake=0.15;tone(e.k==='boss'?200:400,0.12,'square',0.06,2);}else{rm.lost=1;burst(hero.x,hero.y-30,'#ff5a5a');shake=0.35;tone(140,0.3,'sawtooth',0.07,0.4);lose();return;}}
  if(towers.every(function(c){return c.every(function(q){return !q.alive;});})){state='clear';clearT=1.2;tone(660,0.1,'square',0.05,1.5);setTimeout(function(){tone(990,0.15,'square',0.05,1.3);},120);setTimeout(function(){tone(1320,0.2,'square',0.05,1.2);},240);if(lv>best){best=lv;store.set('best',best);}store.set('lv',lv+1);}}
function pop(x,y,v,c){nums.push({x:x,y:y,v:v,c:c,l:1});}
function burst(x,y,c){for(var k=0;k<14;k++){var a=Math.random()*6.283,s=80+Math.random()*200;FX.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.6,c:c});}}
function lose(){state='dead';games++;setTimeout(function(){var show=function(){$('endT').textContent=TX.dead;$('endP').innerHTML=TX.lv+' '+lv+' · '+TX.best+' '+best;$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('again').textContent=TX.retry;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},900);}
$('play').onclick=function(){$('title').hidden=true;start(saved);};
$('again').onclick=function(){$('end').hidden=true;load(lv);state='play';};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;load(lv);state='play';},function(){b.textContent=TX.na;});};

(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();

function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- art ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function E(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}

function eyes(x,y,s,c){C(x-s*0.3,y,s*0.16,'#fff');C(x+s*0.3,y,s*0.16,'#fff');C(x-s*0.27,y+s*0.02,s*0.08,c||'#1a1a2a');C(x+s*0.33,y+s*0.02,s*0.08,c||'#1a1a2a');}
function knight(x,y,s){var b=Math.sin(t*5)*s*0.03;y-=b;E(x,y+s*0.02,s*0.4,s*0.1,'rgba(0,0,0,.25)');g.fillStyle='#3a6ae0';rr(x-s*0.3,y-s*0.62,s*0.6,s*0.6,s*0.15);g.fill();g.fillStyle='#ffd84a';g.fillRect(x-s*0.3,y-s*0.3,s*0.6,s*0.07);
  C(x,y-s*0.85,s*0.3,'#c8ccd8');g.fillStyle='#1a1a2a';g.fillRect(x-s*0.2,y-s*0.9,s*0.4,s*0.07);g.fillStyle='#e8403a';g.beginPath();g.moveTo(x,y-s*1.15);g.quadraticCurveTo(x+s*0.4,y-s*1.25,x+s*0.35,y-s*0.95);g.lineTo(x,y-s*1.08);g.fill();
  g.save();g.translate(x+s*0.38,y-s*0.4);g.rotate(-0.5+Math.sin(t*3)*0.1);g.fillStyle='#e8ecf4';g.fillRect(-s*0.04,-s*0.6,s*0.08,s*0.6);g.fillStyle='#8a5a2a';g.fillRect(-s*0.12,-s*0.02,s*0.24,s*0.06);g.restore();}
function foe(k,x,y,s){var b=Math.abs(Math.sin(t*4+x))*s*0.05;y-=b;E(x,y,s*0.4,s*0.09,'rgba(0,0,0,.25)');
  if(k==='frog'){E(x,y-s*0.35,s*0.42,s*0.35,'#4ab84a');E(x,y-s*0.3,s*0.28,s*0.22,'#c8f0a0');C(x-s*0.2,y-s*0.68,s*0.13,'#4ab84a');C(x+s*0.2,y-s*0.68,s*0.13,'#4ab84a');C(x-s*0.2,y-s*0.7,s*0.08,'#fff');C(x+s*0.2,y-s*0.7,s*0.08,'#fff');C(x-s*0.2,y-s*0.7,s*0.04,'#1a1a2a');C(x+s*0.2,y-s*0.7,s*0.04,'#1a1a2a');g.fillStyle='#8a5a2a';g.fillRect(x+s*0.32,y-s*0.7,s*0.05,s*0.6);g.fillStyle='#c8ccd8';g.beginPath();g.moveTo(x+s*0.345,y-s*0.9);g.lineTo(x+s*0.29,y-s*0.7);g.lineTo(x+s*0.4,y-s*0.7);g.fill();}
  else if(k==='shroom'){g.fillStyle='#f4e8c8';rr(x-s*0.18,y-s*0.45,s*0.36,s*0.45,s*0.1);g.fill();E(x,y-s*0.5,s*0.45,s*0.28,'#e04a5a');C(x-s*0.2,y-s*0.58,s*0.07,'#fff');C(x+s*0.15,y-s*0.65,s*0.06,'#fff');C(x+s*0.28,y-s*0.5,s*0.05,'#fff');eyes(x,y-s*0.25,s*0.5);}
  else if(k==='bat'){var w=Math.sin(t*14)*0.4;[-1,1].forEach(function(d){g.fillStyle='#5a3a8a';g.beginPath();g.moveTo(x+d*s*0.15,y-s*0.5);g.lineTo(x+d*s*0.55,y-s*0.7-w*s*0.2);g.lineTo(x+d*s*0.45,y-s*0.45);g.lineTo(x+d*s*0.3,y-s*0.5);g.fill();});C(x,y-s*0.5,s*0.22,'#7a5aaa');eyes(x,y-s*0.52,s*0.45,'#e04a4a');}
  else if(k==='golem'){g.fillStyle='#8a8a9a';rr(x-s*0.35,y-s*0.7,s*0.7,s*0.7,s*0.12);g.fill();g.fillStyle='#6a6a7a';rr(x-s*0.5,y-s*0.55,s*0.18,s*0.4,s*0.06);g.fill();rr(x+s*0.32,y-s*0.55,s*0.18,s*0.4,s*0.06);g.fill();g.fillStyle='#5ad8a0';g.fillRect(x-s*0.2,y-s*0.52,s*0.12,s*0.06);g.fillRect(x+s*0.08,y-s*0.52,s*0.12,s*0.06);g.fillStyle='#5ab84a';g.fillRect(x-s*0.3,y-s*0.72,s*0.25,s*0.06);}
  else if(k==='crab'){[-1,1].forEach(function(d){C(x+d*s*0.42,y-s*0.5,s*0.12,'#ff7a3a');});E(x,y-s*0.28,s*0.38,s*0.24,'#e8603a');eyes(x,y-s*0.42,s*0.45);}
  else if(k==='imp'){g.fillStyle='#c83a5a';g.beginPath();g.moveTo(x-s*0.25,y-s*0.6);g.lineTo(x-s*0.32,y-s*0.85);g.lineTo(x-s*0.12,y-s*0.65);g.fill();g.beginPath();g.moveTo(x+s*0.25,y-s*0.6);g.lineTo(x+s*0.32,y-s*0.85);g.lineTo(x+s*0.12,y-s*0.65);g.fill();C(x,y-s*0.4,s*0.32,'#e85a7a');eyes(x,y-s*0.45,s*0.5);g.strokeStyle='#c83a5a';g.lineWidth=3;g.beginPath();g.moveTo(x+s*0.28,y-s*0.2);g.quadraticCurveTo(x+s*0.55,y-s*0.1,x+s*0.5,y-s*0.4);g.stroke();}
  else if(k==='boss'){// moon dragon
    var f=Math.sin(t*3)*0.15;[-1,1].forEach(function(d){g.fillStyle='#2a4a8a';g.beginPath();g.moveTo(x+d*s*0.2,y-s*0.6);g.lineTo(x+d*s*0.75,y-s*0.95-f*s*0.2);g.lineTo(x+d*s*0.55,y-s*0.5);g.fill();});E(x,y-s*0.4,s*0.42,s*0.36,'#3a6ac8');E(x,y-s*0.32,s*0.25,s*0.22,'#a8c8f0');C(x,y-s*0.8,s*0.27,'#3a6ac8');g.fillStyle='#ffd84a';g.beginPath();g.moveTo(x-s*0.18,y-s*0.98);g.lineTo(x-s*0.1,y-s*1.2);g.lineTo(x-s*0.04,y-s*0.98);g.moveTo(x+s*0.18,y-s*0.98);g.lineTo(x+s*0.1,y-s*1.2);g.lineTo(x+s*0.04,y-s*0.98);g.fill();eyes(x,y-s*0.82,s*0.45,'#e04a4a');}}
function itemArt(e,x,y,s){if(e.k==='gem'){var b=Math.sin(t*4)*s*0.05;g.fillStyle='#4ae0a0';g.beginPath();g.moveTo(x,y-s*0.75-b);g.lineTo(x+s*0.28,y-s*0.5-b);g.lineTo(x,y-s*0.15-b);g.lineTo(x-s*0.28,y-s*0.5-b);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.moveTo(x,y-s*0.75-b);g.lineTo(x+s*0.1,y-s*0.5-b);g.lineTo(x,y-s*0.4-b);g.lineTo(x-s*0.1,y-s*0.5-b);g.fill();}
  else if(e.k==='x2'){C(x,y-s*0.45,s*0.3,'#ffd84a');C(x,y-s*0.45,s*0.24,'#ffb02a');g.fillStyle='#fff';g.font='900 '+Math.round(s*0.26)+'px Rubik';g.textAlign='center';g.fillText('×2',x,y-s*0.37);}
  else if(e.k==='trap'){g.fillStyle='#6a6a7a';for(var i=0;i<4;i++){var x0=x-s*0.4+i*s*0.2;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+s*0.1,y-s*0.35);g.lineTo(x0+s*0.2,y);g.fill();}g.fillStyle='#c8ccd8';for(var j=0;j<4;j++){var x1=x-s*0.4+j*s*0.2;g.beginPath();g.moveTo(x1+s*0.1,y-s*0.35);g.lineTo(x1+s*0.13,y-s*0.15);g.lineTo(x1+s*0.07,y-s*0.15);g.fill();}}}
function badge(x,y,txt,col){g.font='900 17px Rubik';var w=Math.max(30,g.measureText(txt).width+14);g.fillStyle='rgba(0,0,0,.35)';rr(x-w/2,y-11+2,w,22,11);g.fill();g.fillStyle=col;rr(x-w/2,y-11,w,22,11);g.fill();g.fillStyle='#fff';g.textAlign='center';g.fillText(txt,x,y+6);}
function room(r,top){g.fillStyle='#b88a5a';g.fillRect(r.x,r.y,r.w,r.h);g.fillStyle='#e8d8b8';g.fillRect(r.x+5,r.y+5,r.w-10,r.h-5);g.fillStyle='#d8c098';g.fillRect(r.x+5,r.y+r.h-12,r.w-10,12);if(top){g.fillStyle='#c84a3a';g.beginPath();g.moveTo(r.x-8,r.y);g.lineTo(r.x+r.w/2,r.y-r.h*0.42);g.lineTo(r.x+r.w+8,r.y);g.fill();}}
function render(){var sh=shake>0?(Math.random()-0.5)*shake*24:0;g.setTransform(DPR,0,0,DPR,sh*DPR,0);var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7ac8f0');gr.addColorStop(1,'#c8ecff');g.fillStyle=gr;g.fillRect(-20,0,W+40,H);
  for(var c=0;c<4;c++){var cx=((c*137+t*8)%(W+160))-80,cy=60+c*48;g.fillStyle='rgba(255,255,255,.8)';C(cx,cy,18,'rgba(255,255,255,.8)');C(cx+20,cy-6,22,'rgba(255,255,255,.8)');C(cx+42,cy,16,'rgba(255,255,255,.8)');}
  if(!towers)return;var L=lay();g.fillStyle='#5ab84a';g.fillRect(0,L.ground,W,H-L.ground);g.fillStyle='#4aa03a';g.fillRect(0,L.ground,W,6);
  // hero tower
  var hr={x:L.hx,y:L.ground-L.fh,w:L.hw,h:L.fh};room(hr,true);
  var s=Math.min(L.fh*0.62,L.tw*0.55);
  L.cols.forEach(function(col,i){col.rooms.forEach(function(r,f){room(r,f===col.rooms.length-1);var rm=towers[i][f],e=rm.e,mx=r.x+r.w*0.62,my=r.y+r.h-12;
    if(rm.alive){if(e.k==='gem'||e.k==='x2'||e.k==='trap'){itemArt(e,mx-r.w*0.1,my,s);if(e.k!=='x2')badge(r.x+r.w/2,r.y+16,(e.k==='gem'?'+':'-')+e.v,e.k==='gem'?'#2aa06a':'#c83a3a');}
      else{foe(e.k,mx,my,e.k==='boss'?s*1.15:s);var stronger=e.v>=hero.p;badge(r.x+r.w/2,r.y+16,''+e.v,stronger?'#d83a4a':'#3a8ae0');}}});});
  // hero
  var hx0=hr.x+hr.w/2,hy0=hr.y+hr.h-12;if(anim){var k=Math.min(1,anim.t/0.45),e2=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;hero.x=hx0+(anim.tx-hx0)*e2;hero.y=hy0+(anim.ty-12-hy0)*e2-Math.sin(k*Math.PI)*60;}else{hero.x=hx0;hero.y=hy0;}
  if(state!=='dead'||Math.floor(t*8)%2)knight(hero.x,hero.y,s);badge(hero.x,hero.y-s*1.35,''+hero.p,'#ff9a2a');
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);C(f.x,f.y,4,f.c);});g.globalAlpha=1;
  nums.forEach(function(n){g.globalAlpha=Math.min(1,n.l*2);g.font='900 28px Rubik';g.textAlign='center';g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.5)';var yy=n.y-(1-n.l)*50;g.strokeText(n.v,n.x,yy);g.fillStyle=n.c;g.fillText(n.v,n.x,yy);});g.globalAlpha=1;
  // HUD
  g.textAlign='left';g.fillStyle='#1a3a6a';g.font="900 24px Rubik,'M PLUS Rounded 1c'";g.fillText(TX.lv+' '+lv,16,40);g.font='800 13px Rubik';g.fillText(TX.best+' '+best,16,60);
  g.fillStyle='rgba(255,255,255,.85)';rr(W-104,16,90,34,17);g.fill();g.fillStyle='#1a3a6a';g.textAlign='center';g.font="800 15px Rubik,'M PLUS Rounded 1c'";g.fillText(TX.undo,W-59,38);
  if(state==='clear'){g.globalAlpha=Math.min(1,(1.2-clearT)*3);g.textAlign='center';g.font='900 54px Rubik';g.lineWidth=7;g.strokeStyle='#fff';g.strokeText(TX.clear,W/2,H*0.32);g.fillStyle='#ff9a2a';g.fillText(TX.clear,W/2,H*0.32);g.globalAlpha=1;}}
function update(dt){t+=dt;shake=Math.max(0,shake-dt);nums.forEach(function(n){n.l-=dt*0.9;});nums=nums.filter(function(n){return n.l>0;});FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;});FX=FX.filter(function(f){return f.l>0;});
  if(anim&&state==='play'){anim.t+=dt;if(anim.t>=0.45&&!anim.done){anim.done=1;resolve();}if(anim&&anim.t>=0.85&&state==='play')anim=null;}
  if(state==='clear'){clearT-=dt;if(clearT<=0){load(lv+1);state='play';}}}
var last=performance.now();function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();cgSync();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
</script>
