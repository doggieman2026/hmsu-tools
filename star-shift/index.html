<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Star Shift</title>
<style>
/* layout: full-screen canvas game. HUD and overlays are drawn on top of the canvas as HTML. */
:root{--bg:#07060f;--ink:#f3f0ff;--muted:#a9a3c7;--accent:#ff4fd8;--accent2:#39e6ff;--card:#151229;--line:#2c2650;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;font-weight:800;text-shadow:0 0 8px rgba(0,0,0,.8)}
.hud .big{font-size:26px;font-variant-numeric:tabular-nums}
.hud .lab{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.hp{display:flex;gap:4px;margin-top:4px}.hp i{width:18px;height:8px;border-radius:3px;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}.hp i.off{background:var(--line);box-shadow:none}
.hud .r{text-align:right}
.hud[hidden]{display:none}
.icons{position:fixed;right:12px;bottom:12px;display:flex;gap:8px}
.icons button{min-height:40px;padding:6px 12px;font-size:14px}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(7,6,15,.82)}
.over[hidden]{display:none}
h1{font-size:clamp(40px,8vw,72px);margin:0;letter-spacing:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,79,216,.45))}
h2{font-size:34px;margin:0}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:12px 26px;min-height:50px;cursor:pointer;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#120b22}
button.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.picks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:820px}
.pick{width:220px;min-height:150px;border-radius:18px;background:var(--card);border:2px solid var(--line);color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:16px;text-align:center}
.pick b{font-size:19px}.pick span{font-size:14px;color:var(--muted);font-weight:600;line-height:1.4}.pick em{font-style:normal;font-size:28px}
.pick:hover,.pick:focus-visible{border-color:var(--accent2);box-shadow:0 0 20px rgba(57,230,255,.35)}
.keys{font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud" hidden>
  <div><div class="lab">Score</div><div class="big" id="score">0</div><div class="hp" id="hp"></div></div>
  <div class="r"><div class="lab" id="waveLab">Wave</div><div class="big" id="wave">1</div><div class="lab" id="combo"></div></div>
</div>
<div class="icons"><button class="sub" id="pauseBtn" type="button" hidden>Pause</button><button class="sub" id="snd" type="button">Sound: On</button></div>
<div class="over" id="menu">
  <h1>STAR SHIFT</h1>
  <p>Survive the waves. Beat the boss every 5th wave.<br>Pick a new power after each wave and build your ship.</p>
  <button id="start" type="button">Play</button>
  <p class="keys">Move the mouse or drag to steer · ship fires on its own<br>Keyboard: arrows or WASD · Shift = slow focus · P = pause</p>
  <p id="hi"></p>
</div>
<div class="over" id="upg" hidden><h2 id="upgTitle">Wave clear!</h2><p>Choose one upgrade</p><div class="picks" id="picks"></div></div>
<div class="over" id="pause" hidden><h2>Paused</h2><div style="display:flex;gap:10px"><button id="resume" type="button">Resume</button><button class="sub" id="quit" type="button">Quit</button></div></div>
<div class="over" id="over" hidden><h2>Game over</h2><p id="final"></p><p id="build"></p><button id="again" type="button">Play again</button></div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1,U=1; // U = unit (1/100 of short side)
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);U=Math.min(W,H)/100;}
window.addEventListener('resize',fit);fit();
var store={get:function(k,f){try{var v=JSON.parse(localStorage.getItem('starshift-'+k));return v==null?f:v;}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('starshift-'+k,JSON.stringify(v));}catch(e){}}};
// ---------- audio ----------
var AC=null,sound=store.get('sound',true);
function sfx(type){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  var P={shot:[880,440,0.05,0.012,'square'],hit:[220,120,0.06,0.03,'square'],boom:[160,40,0.35,0.09,'sawtooth'],hurt:[300,60,0.4,0.12,'sawtooth'],pick:[520,1040,0.18,0.07,'triangle'],boss:[90,60,0.8,0.1,'sawtooth'],pow:[660,1320,0.12,0.06,'triangle']}[type];
  o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+P[2]);o.start(t);o.stop(t+P[2]+0.02);}catch(e){}}
// ---------- state ----------
var G,keys={},pointer=null,hi=store.get('hi',0);
function newGame(){G={t:0,score:0,wave:0,combo:0,comboT:0,shake:0,flash:0,state:'play',bullets:[],ebullets:[],enemies:[],parts:[],pickups:[],stars:G&&G.stars||makeStars(),
  queue:[],spawnT:0,boss:null,
  p:{x:W/2,y:H*0.8,hp:5,max:5,inv:0,fireT:0,
     rate:0.16,dmg:1,spread:1,speed:1,pierce:0,magnet:0,drones:0,shield:0,shieldT:0,crit:0,bomb:0,droneA:0},
  taken:{}};}
function makeStars(){var s=[];for(var i=0;i<140;i++)s.push({x:Math.random(),y:Math.random(),z:Math.random()*0.9+0.1});return s;}
// ---------- upgrades ----------
var UPG=[
 {id:'rate',e:'⚡',n:'Rapid Fire',d:'Shoot 20% faster',f:function(p){p.rate*=0.8;}},
 {id:'spread',e:'✦',n:'Spread Shot',d:'+1 bullet in a fan',max:5,f:function(p){p.spread++;}},
 {id:'dmg',e:'💥',n:'Heavy Rounds',d:'+40% damage',f:function(p){p.dmg*=1.4;}},
 {id:'pierce',e:'➶',n:'Piercing',d:'Bullets pass through 1 more enemy',max:3,f:function(p){p.pierce++;}},
 {id:'drones',e:'◈',n:'Wing Drone',d:'A drone orbits you and shoots',max:3,f:function(p){p.drones++;}},
 {id:'shield',e:'⬡',n:'Shield',d:'Blocks 1 hit, recharges every 12s',max:1,f:function(p){p.shield=1;p.shieldT=0;}},
 {id:'heal',e:'✚',n:'Repair',d:'+1 max HP and full heal',f:function(p){p.max++;p.hp=p.max;}},
 {id:'crit',e:'🎯',n:'Critical',d:'15% chance for triple damage',max:4,f:function(p){p.crit+=0.15;}},
 {id:'magnet',e:'🧲',n:'Magnet',d:'Pull score gems from far away',max:2,f:function(p){p.magnet++;}},
 {id:'bomb',e:'☄',n:'Nova',d:'Getting hit blasts nearby enemies',max:1,f:function(p){p.bomb=1;}},
 {id:'speed',e:'»',n:'Thrusters',d:'Move 25% faster',max:3,f:function(p){p.speed*=1.25;}}];
function offer(){var pool=UPG.filter(function(u){return !u.max||(G.taken[u.id]||0)<u.max;}),out=[];
  while(out.length<3&&pool.length){out.push(pool.splice((Math.random()*pool.length)|0,1)[0]);}return out;}
function showUpgrades(){G.state='upg';var el=document.getElementById('picks');el.innerHTML='';
  document.getElementById('upgTitle').textContent=G.wave%5===0?'Boss down!':'Wave '+G.wave+' clear!';
  offer().forEach(function(u,i){var b=document.createElement('button');b.type='button';b.className='pick';
    b.innerHTML='<em>'+u.e+'</em><b>'+u.n+(G.taken[u.id]?' +'+G.taken[u.id]:'')+'</b><span>'+u.d+'</span><span style="font-size:12px">['+(i+1)+']</span>';
    b.addEventListener('click',function(){u.f(G.p);G.taken[u.id]=(G.taken[u.id]||0)+1;sfx('pick');document.getElementById('upg').hidden=true;nextWave();});el.appendChild(b);});
  document.getElementById('upg').hidden=false;setTimeout(function(){var f=el.querySelector('button');if(f)f.focus();},50);}
// ---------- enemies ----------
// kinds: drone (straight), weaver (sine), gunner (stops & shoots), dasher (aims at you), tank (slow, many hp)
var KIND={
 drone:{r:3.2,hp:2,sp:22,col:'#39e6ff',pts:10},
 weaver:{r:3.4,hp:3,sp:18,col:'#8cff6b',pts:15},
 gunner:{r:4.2,hp:6,sp:14,col:'#ffb13b',pts:30},
 dasher:{r:3,hp:2,sp:55,col:'#ff4f6b',pts:20},
 tank:{r:6,hp:22,sp:8,col:'#b48cff',pts:60}};
function nextWave(){G.wave++;G.state='play';G.queue=[];var w=G.wave,hpMul=1+w*0.12;
  if(w%5===0){spawnBoss(w);return;}
  var count=6+w*2,types=['drone'];if(w>=2)types.push('weaver');if(w>=3)types.push('gunner');if(w>=4)types.push('dasher');if(w>=6)types.push('tank');
  for(var i=0;i<count;i++){var k=types[(Math.random()*types.length)|0];G.queue.push({k:k,at:i*Math.max(0.25,0.9-w*0.04),hp:hpMul});}
  G.spawnT=0;banner('Wave '+w);}
function spawn(q){var K=KIND[q.k],e={k:q.k,x:(0.1+Math.random()*0.8)*W,y:-6*U,r:K.r*U,hp:K.hp*q.hp,max:K.hp*q.hp,t:0,fire:1+Math.random(),ph:Math.random()*6,vx:0,vy:K.sp*U*0.45,hitT:0};
  if(q.k==='dasher'){var a=Math.atan2(G.p.y-e.y,G.p.x-e.x);e.vx=Math.cos(a)*K.sp*U*0.45;e.vy=Math.sin(a)*K.sp*U*0.45;}
  G.enemies.push(e);}
function spawnBoss(w){var lvl=w/5,hp=160*lvl*(1+lvl*0.4);G.boss={x:W/2,y:-20*U,ty:H*0.2,r:12*U,hp:hp,max:hp,t:0,pat:0,patT:0,hitT:0,lvl:lvl};sfx('boss');banner('BOSS');G.shake=12;}
// ---------- helpers ----------
var bannerT=0,bannerText='';function banner(t){bannerText=t;bannerT=1.6;}
function burst(x,y,col,n,sp){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=(0.3+Math.random())*sp*U;G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0.4+Math.random()*0.5,c:col,s:(0.4+Math.random()*0.8)*U});}}
function ring(x,y,col,r){G.parts.push({ring:1,x:x,y:y,r:0,R:r,l:0.35,L:0.35,c:col});}
function dist2(a,b){var dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}
function fireBullet(x,y,a,dmg){G.bullets.push({x:x,y:y,vx:Math.sin(a)*120*U,vy:-Math.cos(a)*120*U,dmg:dmg,pierce:G.p.pierce,hit:[]});}
function ebullet(x,y,a,sp,col){G.ebullets.push({x:x,y:y,vx:Math.cos(a)*sp*U,vy:Math.sin(a)*sp*U,r:1.4*U,c:col||'#ff6bd6'});}
function killEnemy(e,col){var K=KIND[e.k];G.combo++;G.comboT=2.2;var mult=1+Math.min(G.combo,50)*0.04;G.score+=Math.round(K.pts*mult);
  burst(e.x,e.y,col,18,40);ring(e.x,e.y,col,e.r*3);G.shake=Math.max(G.shake,e.k==='tank'?8:3);sfx('boom');
  var gems=e.k==='tank'?6:e.k==='gunner'?3:1;for(var i=0;i<gems;i++)G.pickups.push({x:e.x+(Math.random()-0.5)*e.r,y:e.y,vy:-10*U*Math.random(),t:0,heal:false});
  if(Math.random()<0.04)G.pickups.push({x:e.x,y:e.y,vy:0,t:0,heal:true});}
function hurt(){var p=G.p;if(p.inv>0)return;if(p.shield&&p.shieldT<=0){p.shieldT=12;ring(p.x,p.y,'#39e6ff',14*U);sfx('pow');p.inv=0.6;return;}
  p.hp--;p.inv=1.4;G.shake=14;G.flash=0.35;G.combo=0;sfx('hurt');burst(p.x,p.y,'#ffffff',26,50);
  if(p.bomb){ring(p.x,p.y,'#ff4fd8',40*U);G.enemies.forEach(function(e){if(dist2(e,p)<1600*U*U)e.hp-=30;});G.ebullets=[];}
  if(p.hp<=0)gameOver();}
function gameOver(){G.state='over';if(G.score>hi){hi=G.score;store.set('hi',hi);}
  document.getElementById('final').textContent='Score '+G.score+' · Wave '+G.wave+(G.score>=hi?' · New best!':' · Best '+hi);
  var b=Object.keys(G.taken).map(function(k){var u=UPG.find(function(x){return x.id===k;});return u.e+' '+u.n+(G.taken[k]>1?' ×'+G.taken[k]:'');}).join('  ');
  document.getElementById('build').textContent=b?'Build: '+b:'';
  setTimeout(function(){document.getElementById('over').hidden=false;document.getElementById('hud').hidden=true;document.getElementById('pauseBtn').hidden=true;},700);}
// ---------- update ----------
function update(dt){var p=G.p;G.t+=dt;
  // move
  var sp=70*U*p.speed*((keys.ShiftLeft||keys.ShiftRight)?0.45:1),mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA)mx--;if(keys.ArrowRight||keys.KeyD)mx++;if(keys.ArrowUp||keys.KeyW)my--;if(keys.ArrowDown||keys.KeyS)my++;
  if(mx||my){var l=Math.hypot(mx,my);p.x+=mx/l*sp*dt;p.y+=my/l*sp*dt;}
  if(mx||my)mouseFollow=null;
  var tgt=pointer?{x:pointer.x+pointer.ox,y:pointer.y+pointer.oy}:mouseFollow;
  if(tgt){var k=Math.min(1,dt*(pointer?18:12));p.x+=(tgt.x-p.x)*k;p.y+=(tgt.y-p.y)*k;}
  p.x=Math.max(3*U,Math.min(W-3*U,p.x));p.y=Math.max(8*U,Math.min(H-3*U,p.y));
  if(p.inv>0)p.inv-=dt;if(p.shieldT>0)p.shieldT-=dt;
  // fire
  p.fireT-=dt;if(p.fireT<=0&&G.state==='play'){p.fireT=p.rate;var n=p.spread,fan=0.09;
    for(var i=0;i<n;i++){var a=(i-(n-1)/2)*fan,d=p.dmg*(Math.random()<p.crit?3:1);fireBullet(p.x+(i-(n-1)/2)*1.2*U,p.y-3*U,a,d);}
    for(var j=0;j<p.drones;j++){var da=G.t*2.4+j*6.283/p.drones,dx=p.x+Math.cos(da)*9*U,dy=p.y+Math.sin(da)*5*U;fireBullet(dx,dy,0,p.dmg*0.6);}
    if(G.t%0.3<p.rate)sfx('shot');}
  // spawn queue
  if(G.queue.length){G.spawnT+=dt;while(G.queue.length&&G.queue[0].at<=G.spawnT)spawn(G.queue.shift());}
  // bullets
  G.bullets.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;});G.bullets=G.bullets.filter(function(b){return b.y>-5*U&&b.x>-5*U&&b.x<W+5*U&&!b.dead;});
  // enemies
  G.enemies.forEach(function(e){e.t+=dt;if(e.hitT>0)e.hitT-=dt;
    if(e.k==='weaver'){e.x+=Math.sin(e.t*3+e.ph)*30*U*dt;}
    if(e.k==='gunner'){if(e.y<H*0.3)e.y+=e.vy*dt;else{e.fire-=dt;if(e.fire<=0){e.fire=1.6;var a=Math.atan2(p.y-e.y,p.x-e.x);for(var i=-1;i<=1;i++)ebullet(e.x,e.y,a+i*0.22,32,'#ffb13b');}if(e.t>9)e.y+=e.vy*2*dt;}}
    else if(e.k==='tank'){e.y+=e.vy*dt;e.fire-=dt;if(e.fire<=0){e.fire=2.2;for(var k=0;k<10;k++)ebullet(e.x,e.y,k/10*6.283+e.t,22,'#b48cff');}}
    else{e.x+=e.vx*dt;e.y+=e.vy*dt;}
    if(dist2(e,p)<Math.pow(e.r+1.6*U,2)){e.hp=0;e.deadByBody=1;hurt();}});
  // bullet hits
  G.bullets.forEach(function(b){var targets=G.enemies.slice();if(G.boss)targets.push(G.boss);
    for(var i=0;i<targets.length;i++){var e=targets[i];if(e.hp<=0||b.hit.indexOf(e)>=0)continue;
      if(dist2(b,e)<e.r*e.r){e.hp-=b.dmg;e.hitT=0.06;b.hit.push(e);G.parts.push({x:b.x,y:b.y,vx:0,vy:-20*U,l:0.12,c:'#fff',s:1.2*U});
        if(b.dmg>G.p.dmg*1.5)G.parts.push({txt:'CRIT',x:b.x,y:b.y,vx:0,vy:-25*U,l:0.5,c:'#ffd34f',s:3*U});
        if(b.pierce--<=0){b.dead=1;break;}}}});
  G.enemies.forEach(function(e){if(e.hp<=0&&!e.gone){e.gone=1;killEnemy(e,KIND[e.k].col);}});
  G.enemies=G.enemies.filter(function(e){return !e.gone&&e.y<H+10*U&&e.x>-15*U&&e.x<W+15*U;});
  // boss
  var B=G.boss;if(B){B.t+=dt;B.patT+=dt;if(B.hitT>0)B.hitT-=dt;B.y+=(B.ty-B.y)*Math.min(1,dt*1.5);B.x=W/2+Math.sin(B.t*0.7)*W*0.28;
    var enr=B.hp<B.max*0.4?1.5:1;
    if(B.patT>3.2/enr){B.patT=0;B.pat=(B.pat+1)%3;}
    B.fireT=(B.fireT||0)-dt;
    if(B.fireT<=0){if(B.pat===0){B.fireT=0.12/enr;ebullet(B.x,B.y,B.t*3,26,'#ff4fd8');ebullet(B.x,B.y,B.t*3+3.1416,26,'#ff4fd8');}
      else if(B.pat===1){B.fireT=0.9/enr;var a=Math.atan2(p.y-B.y,p.x-B.x);for(var i=-3;i<=3;i++)ebullet(B.x,B.y,a+i*0.13,38,'#ffd34f');}
      else{B.fireT=1.1/enr;for(var k=0;k<18+B.lvl*4;k++)ebullet(B.x,B.y,k/(18+B.lvl*4)*6.283+B.t,20,'#39e6ff');}}
    if(dist2(B,p)<Math.pow(B.r,2))hurt();
    if(B.hp<=0){G.score+=500*B.lvl;for(var q=0;q<5;q++)burst(B.x+(Math.random()-0.5)*B.r*2,B.y+(Math.random()-0.5)*B.r*2,['#ff4fd8','#39e6ff','#ffd34f'][q%3],30,70);
      ring(B.x,B.y,'#ffffff',60*U);G.shake=25;G.flash=0.5;sfx('boom');for(var g=0;g<20;g++)G.pickups.push({x:B.x+(Math.random()-0.5)*B.r*2,y:B.y,vy:-20*U*Math.random(),t:0,heal:g<2});G.boss=null;G.ebullets=[];}}
  // enemy bullets
  G.ebullets.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;if(dist2(b,p)<Math.pow(b.r+1.1*U,2)){b.dead=1;hurt();}});
  G.ebullets=G.ebullets.filter(function(b){return !b.dead&&b.y>-10*U&&b.y<H+10*U&&b.x>-10*U&&b.x<W+10*U;});
  // pickups
  var mag=(10+p.magnet*25)*U;G.pickups.forEach(function(g){g.t+=dt;var d=Math.sqrt(dist2(g,p));
    if(d<mag||G.state!=='play'&&!G.queue.length&&!G.enemies.length){var a=Math.atan2(p.y-g.y,p.x-g.x),s=90*U;g.x+=Math.cos(a)*s*dt;g.y+=Math.sin(a)*s*dt;}
    else{g.vy+=30*U*dt;g.y+=Math.min(g.vy,25*U)*dt;}
    if(d<4*U){g.dead=1;if(g.heal){p.hp=Math.min(p.max,p.hp+1);sfx('pow');}else{G.score+=5;}}});
  G.pickups=G.pickups.filter(function(g){return !g.dead&&g.y<H+5*U;});
  // particles
  G.parts.forEach(function(q){q.l-=dt;if(q.ring){q.r=q.R*(1-q.l/q.L);}else{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.94;q.vy*=0.94;}});G.parts=G.parts.filter(function(q){return q.l>0;});
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  G.shake*=Math.pow(0.002,dt);G.flash=Math.max(0,G.flash-dt);if(bannerT>0)bannerT-=dt;
  // wave end
  if(G.state==='play'&&!G.queue.length&&!G.enemies.length&&!G.boss&&G.wave>0){G.state='clearing';G.ebullets=[];setTimeout(function(){if(G.state==='clearing')showUpgrades();},900);}
  hud();}
// ---------- draw ----------
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function draw(){ctx.save();ctx.fillStyle='#07060f';ctx.fillRect(0,0,W,H);
  if(G.shake>0.3)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  // stars
  G.stars.forEach(function(s){s.y+=s.z*0.0016*(G.boss?2:1);if(s.y>1)s.y-=1;ctx.fillStyle='rgba(200,190,255,'+(s.z*0.8)+')';ctx.fillRect(s.x*W,s.y*H,s.z*2,s.z*2+(s.z>0.7?3:0));});
  ctx.globalCompositeOperation='lighter';
  // pickups
  G.pickups.forEach(function(g){var c=g.heal?'#8cff6b':'#39e6ff';glow(c,10);ctx.fillStyle=c;ctx.beginPath();var r=(g.heal?1.8:1)*U;
    ctx.moveTo(g.x,g.y-r*1.4);ctx.lineTo(g.x+r,g.y);ctx.lineTo(g.x,g.y+r*1.4);ctx.lineTo(g.x-r,g.y);ctx.fill();});
  // bullets
  glow('#39e6ff',8);ctx.fillStyle='#bff7ff';G.bullets.forEach(function(b){ctx.fillRect(b.x-0.35*U,b.y-2*U,0.7*U,4*U);});
  G.ebullets.forEach(function(b){glow(b.c,10);ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.45,0,7);ctx.fill();});
  // enemies
  G.enemies.forEach(function(e){var K=KIND[e.k],c=e.hitT>0?'#ffffff':K.col;glow(K.col,14);ctx.strokeStyle=c;ctx.lineWidth=0.6*U;ctx.beginPath();
    var r=e.r,sides={drone:3,weaver:4,gunner:6,dasher:3,tank:8}[e.k],rot=e.k==='dasher'?Math.atan2(e.vy,e.vx)+Math.PI/2:e.t*(e.k==='weaver'?2:0.6);
    for(var i=0;i<=sides;i++){var a=rot+i/sides*6.283+(e.k==='drone'?Math.PI:0);ctx.lineTo(e.x+Math.sin(a)*r,e.y+Math.cos(a)*r);}ctx.stroke();
    ctx.fillStyle=c;ctx.globalAlpha=0.25;ctx.fill();ctx.globalAlpha=1;
    if(e.max>4&&e.hp<e.max){ctx.fillStyle=K.col;ctx.fillRect(e.x-r,e.y-r-1.5*U,2*r*e.hp/e.max,0.5*U);}});
  // boss
  var B=G.boss;if(B){var c=B.hitT>0?'#fff':'#ff4fd8';glow('#ff4fd8',24);ctx.lineWidth=0.8*U;ctx.strokeStyle=c;
    for(var ring2=0;ring2<3;ring2++){ctx.beginPath();var rr=B.r*(1-ring2*0.28),sd=6+ring2*2;for(var i=0;i<=sd;i++){var a=B.t*(ring2%2?-1:1)*(0.6+ring2*0.4)+i/sd*6.283;ctx.lineTo(B.x+Math.cos(a)*rr,B.y+Math.sin(a)*rr);}ctx.stroke();}
    ctx.fillStyle='#ffd34f';glow('#ffd34f',20);ctx.beginPath();ctx.arc(B.x,B.y,B.r*0.18,0,7);ctx.fill();}
  // player + drones
  var p=G.p;if(G.state!=='over'&&!(p.inv>0&&Math.floor(p.inv*20)%2)){
    for(var j=0;j<p.drones;j++){var da=G.t*2.4+j*6.283/p.drones;glow('#8cff6b',10);ctx.fillStyle='#8cff6b';ctx.beginPath();ctx.arc(p.x+Math.cos(da)*9*U,p.y+Math.sin(da)*5*U,1*U,0,7);ctx.fill();}
    glow('#39e6ff',18);ctx.strokeStyle='#bff7ff';ctx.lineWidth=0.6*U;ctx.beginPath();var s=3.2*U;
    ctx.moveTo(p.x,p.y-s*1.3);ctx.lineTo(p.x+s,p.y+s);ctx.lineTo(p.x,p.y+s*0.45);ctx.lineTo(p.x-s,p.y+s);ctx.closePath();ctx.stroke();ctx.fillStyle='rgba(57,230,255,.3)';ctx.fill();
    glow('#ff4fd8',14);ctx.fillStyle='#ff4fd8';ctx.beginPath();ctx.arc(p.x,p.y+s*1.05,(0.5+Math.random()*0.4)*U,0,7);ctx.fill();
    if(p.shield&&p.shieldT<=0){glow('#39e6ff',12);ctx.strokeStyle='rgba(57,230,255,.6)';ctx.lineWidth=0.3*U;ctx.beginPath();ctx.arc(p.x,p.y,5.5*U,0,7);ctx.stroke();}
    if(keys.ShiftLeft||keys.ShiftRight){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,0.9*U,0,7);ctx.fill();}}
  // particles
  G.parts.forEach(function(q){glow(q.c,8);if(q.ring){ctx.strokeStyle=q.c;ctx.globalAlpha=q.l/q.L;ctx.lineWidth=0.6*U;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.stroke();ctx.globalAlpha=1;}
    else if(q.txt){ctx.fillStyle=q.c;ctx.globalAlpha=Math.min(1,q.l*3);ctx.font='800 '+q.s+'px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);ctx.globalAlpha=1;}
    else{ctx.fillStyle=q.c;ctx.globalAlpha=Math.min(1,q.l*2);ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);ctx.globalAlpha=1;}});
  ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  // boss bar
  if(B){var bw=Math.min(W*0.6,500);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W/2-bw/2,64,bw,8);ctx.fillStyle='#ff4fd8';ctx.fillRect(W/2-bw/2,64,bw*Math.max(0,B.hp)/B.max,8);}
  // banner
  if(bannerT>0){ctx.globalAlpha=Math.min(1,bannerT*2);ctx.fillStyle='#fff';ctx.font='900 '+Math.round(9*U)+'px Trebuchet MS,sans-serif';ctx.textAlign='center';glow('#ff4fd8',24);ctx.fillText(bannerText,W/2,H*0.42);ctx.globalAlpha=1;ctx.shadowBlur=0;}
  ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,60,90,'+(G.flash*0.6)+')';ctx.fillRect(0,0,W,H);}}
// ---------- hud ----------
var lastHud='';function hud(){var p=G.p,k=G.score+'|'+p.hp+'|'+p.max+'|'+G.wave+'|'+G.combo;if(k===lastHud)return;lastHud=k;
  document.getElementById('score').textContent=G.score;document.getElementById('wave').textContent=G.wave;
  document.getElementById('combo').textContent=G.combo>=5?'Combo ×'+G.combo:'';
  var h='';for(var i=0;i<p.max;i++)h+='<i class="'+(i<p.hp?'':'off')+'"></i>';document.getElementById('hp').innerHTML=h;}
// ---------- loop ----------
var last=performance.now();
var acc=0,STEP=1/60;
// fixed time step: game speed stays the same on slow and fast screens
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=STEP){if(G&&(G.state==='play'||G.state==='clearing'))update(STEP);acc-=STEP;}
  if(G)draw();requestAnimationFrame(frame);}
// ---------- input ----------
window.addEventListener('keydown',function(e){keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(G&&G.state==='upg'&&/^Digit[123]$/.test(e.code)){var b=document.querySelectorAll('#picks button')[Number(e.code.slice(5))-1];if(b)b.click();}});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};if(G&&G.state==='play')togglePause();});
// touch: relative drag (the ship keeps its distance from the finger so it stays visible)
// mouse: the ship follows the cursor, no click needed
var mouseFollow=null;
cv.addEventListener('pointerdown',function(e){if(!G||G.state!=='play'||e.pointerType==='mouse')return;cv.setPointerCapture(e.pointerId);
  pointer={x:e.clientX,y:e.clientY,ox:G.p.x-e.clientX,oy:G.p.y-e.clientY};});
cv.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){mouseFollow={x:e.clientX,y:e.clientY};return;}if(pointer){pointer.x=e.clientX;pointer.y=e.clientY;}});
['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(){pointer=null;});});
function togglePause(){if(!G)return;if(G.state==='play'){G.state='paused';document.getElementById('pause').hidden=false;}else if(G.state==='paused'){G.state='play';document.getElementById('pause').hidden=true;last=performance.now();}}
// ---------- buttons ----------
function start(){newGame();['menu','over','upg','pause'].forEach(function(k){document.getElementById(k).hidden=true;});document.getElementById('hud').hidden=false;document.getElementById('pauseBtn').hidden=false;lastHud='';nextWave();}
document.getElementById('start').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
document.getElementById('resume').addEventListener('click',togglePause);document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('quit').addEventListener('click',function(){G.state='menu';document.getElementById('pause').hidden=true;document.getElementById('hud').hidden=true;document.getElementById('pauseBtn').hidden=true;showMenu();});
var sndBtn=document.getElementById('snd');function sndLabel(){sndBtn.textContent='Sound: '+(sound?'On':'Off');}sndLabel();
sndBtn.addEventListener('click',function(){sound=!sound;store.set('sound',sound);sndLabel();});
function showMenu(){document.getElementById('hi').textContent=hi?'Best score: '+hi:'';document.getElementById('menu').hidden=false;}
newGame();G.state='menu';showMenu();requestAnimationFrame(frame);
</script>
</body>
