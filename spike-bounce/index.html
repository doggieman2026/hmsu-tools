<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spike Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#f0ece4;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(40,30,50,.72);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#ff6a9a;text-shadow:0 5px 0 #8a1a4a,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.8em;color:#fff;text-shadow:0 5px 0 #8a1a4a}
.over p{margin:0;max-width:350px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ff8aaa,#e04a7a);color:#fff;text-shadow:0 2px 0 #8a1a4a;box-shadow:0 6px 0 #8a1a4a;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1a4a}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);text-shadow:0 2px 0 #9a5010;box-shadow:0 5px 0 #9a5010}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>SPIKE<small>BOUNCE</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(44px,12vw,72px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'タップではばたこう！<br>かべにタッチすると1点、向きが変わって反対のかべにトゲが出るよ。<br>トゲにさわったらおしまい。🍬を取ると色が変わる！',play:'あそぶ',again:'もういちど',dead:'チクッ！',cont:'▶ 広告を見て つづきから',na:'広告を読み込めませんでした',best:'さいこう',tap:'タップ！'}
 :{how:'Tap to flap!<br>Touch a wall for a point — you turn around and new spikes pop up on the other wall.<br>Touch a spike and it\'s over. Grab 🍬 to change colors!',play:'PLAY',again:'TRY AGAIN',dead:'OUCH!',cont:'▶ Watch ad: keep going',na:'Ad not available',best:'Best',tap:'TAP!'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('sb-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('sb-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0),candies=store.get('candy',0);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,AW,AH,AX,AY;// arena
var state='title',t=0,P,score=0,spikesL=[],spikesR=[],ROWS=11,candy=null,FX=[],used=false,games=0,shake=0,started=false,themeI=0;
var THEMES=[['#f0ece4','#5a5a6a','#ff6a9a'],['#e4f0ec','#3a6a5a','#ff9a3a'],['#e8e4f4','#4a3a7a','#3ac8a0'],['#f4ece0','#7a4a2a','#3a8ae0'],['#2a2a3a','#c8ccd8','#ffd84a'],['#ffe8e8','#a83a4a','#7a5aff']];
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;AW=Math.min(W,H*0.62);AH=Math.min(H,AW*1.6);AX=(W-AW)/2;AY=(H-AH)/2;}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
// world: 360 x 576 units
var WW=360,WH=576,R=17,SP=26;
function sc(){return AW/WW;}
function start(){P={x:WW/2,y:WH/2,vx:150,vy:0,flap:0};score=0;spikesL=[];spikesR=[];candy=null;FX=[];used=false;started=false;themeI=0;makeSpikes('R');state='play';}
function nSpikes(){return Math.min(7,2+Math.floor(score/4));}
function makeSpikes(side){var arr=[],n=nSpikes(),rows=[];for(var i=1;i<ROWS-1;i++)rows.push(i);rows.sort(function(){return Math.random()-0.5;});
  // keep a safe gap of 2 consecutive rows
  var safe=1+Math.floor(Math.random()*(ROWS-4));var pool=rows.filter(function(r){return r!==safe&&r!==safe+1;});for(var k=0;k<n&&k<pool.length;k++)arr.push({r:pool[k],o:0});
  if(side==='R'){spikesR=arr;spikesL.forEach(function(s){s.out=1;});}else{spikesL=arr;spikesR.forEach(function(s){s.out=1;});}}
function rowY(r){var top=SP*0.9,bot=WH-SP*0.9,h=(bot-top)/ROWS;return top+(r+0.5)*h;}
function rowH(){return (WH-SP*1.8)/ROWS;}
function flap(){if(state!=='play')return;started=true;P.vy=-330;P.flap=0.2;tone(620,0.05,'triangle',0.035,1.5);}
function update(dt){t+=dt;shake=Math.max(0,shake-dt);FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=500*dt;});FX=FX.filter(function(f){return f.l>0;});
  [spikesL,spikesR].forEach(function(a){a.forEach(function(s){s.o=s.out?Math.max(0,s.o-dt*6):Math.min(1,s.o+dt*6);});});spikesL=spikesL.filter(function(s){return !(s.out&&s.o<=0);});spikesR=spikesR.filter(function(s){return !(s.out&&s.o<=0);});
  if(state!=='play'||!P)return;P.flap=Math.max(0,P.flap-dt);if(!started){P.y=WH/2+Math.sin(t*4)*10;return;}
  var sp=150+Math.min(90,score*3);P.vx=Math.sign(P.vx)*sp;P.vy+=900*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(P.x>WW-R){P.x=WW-R;P.vx=-sp;wall('R');}else if(P.x<R){P.x=R;P.vx=sp;wall('L');}
  // top/bottom spikes
  if(P.y-R<SP*0.9||P.y+R>WH-SP*0.9){die();return;}
  // side spikes
  var arr=P.x>WW/2?spikesR:spikesL,near=P.x>WW-R-SP*0.75||P.x<R+SP*0.75;if(near)arr.forEach(function(s){if(s.o>0.6&&!s.out&&Math.abs(rowY(s.r)-P.y)<rowH()*0.36+R*0.4)die();});
  if(candy&&Math.hypot(candy.x-P.x,candy.y-P.y)<R+12){candy=null;candies++;store.set('candy',candies);themeI=(themeI+1)%THEMES.length;tone(1200,0.1,'square',0.04,1.4);for(var k=0;k<10;k++)FX.push({x:P.x,y:P.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,l:0.5,c:THEMES[themeI][2]});}}
function wall(side){score++;tone(880,0.05,'square',0.035,1.2);makeSpikes(side==='R'?'L':'R');for(var k=0;k<6;k++)FX.push({x:P.x,y:P.y,vx:(side==='R'?-1:1)*Math.random()*160,vy:(Math.random()-0.5)*160,l:0.35,c:'#fff'});
  if(!candy&&Math.random()<0.35)candy={x:WW*0.3+Math.random()*WW*0.4,y:WH*0.25+Math.random()*WH*0.5};}
function die(){if(state!=='play')return;state='dead';shake=0.35;games++;tone(150,0.35,'sawtooth',0.07,0.4);for(var k=0;k<18;k++)FX.push({x:P.x,y:P.y,vx:(Math.random()-0.5)*400,vy:(Math.random()-0.7)*400,l:0.8,c:k%2?THEMES[themeI][2]:'#fff'});if(score>best){best=score;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=TX.dead;$('endP').innerHTML='<b style="font-size:40px">'+score+'</b><br>'+TX.best+' '+best+' · 🍬'+candies;$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},700);}
$('play').onclick=function(){$('title').hidden=true;start();};
$('again').onclick=function(){$('end').hidden=true;start();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;P.x=WW/2;P.y=WH/2;P.vy=0;started=false;spikesL=[];spikesR=[];makeSpikes(P.vx>0?'R':'L');state='play';},function(){b.textContent=TX.na;});};
cv.addEventListener('pointerdown',function(e){e.preventDefault();flap();});
addEventListener('keydown',function(e){if(e.key===' '||e.key==='ArrowUp'){flap();e.preventDefault();}});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc0=document.createElement('script');sc0.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc0.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc0);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- draw ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0.1,r),0,7);g.fill();}
function X(x){return AX+x*sc();}function Y(y){return AY+y*sc();}
function spikeTri(x,y,dir,len,w,col){g.fillStyle=col;g.beginPath();if(dir==='L'){g.moveTo(x,y-w/2);g.lineTo(x+len,y);g.lineTo(x,y+w/2);}else if(dir==='R'){g.moveTo(x,y-w/2);g.lineTo(x-len,y);g.lineTo(x,y+w/2);}else if(dir==='T'){g.moveTo(x-w/2,y);g.lineTo(x,y+len);g.lineTo(x+w/2,y);}else{g.moveTo(x-w/2,y);g.lineTo(x,y-len);g.lineTo(x+w/2,y);}g.closePath();g.fill();}
function render(){var th=THEMES[themeI],s=sc(),sh=shake>0?(Math.random()-0.5)*shake*24:0;g.setTransform(DPR,0,0,DPR,sh*DPR,0);g.fillStyle=th[0];g.fillRect(-20,0,W+40,H);
  // big score in bg
  g.fillStyle='rgba(0,0,0,.06)';C(W/2,Y(WH/2),AW*0.32,'rgba(255,255,255,.55)');g.fillStyle=th[0]==='#2a2a3a'?'rgba(255,255,255,.18)':'rgba(0,0,0,.12)';g.textAlign='center';g.font='900 '+Math.round(AW*0.3)+'px Rubik';g.fillText(state==='title'?'':score,W/2,Y(WH/2)+AW*0.1);
  // borders
  g.fillStyle=th[1];g.fillRect(X(0)-4,Y(0),4,AH);g.fillRect(X(WW),Y(0),4,AH);
  var n=Math.floor(WW/SP);for(var i=0;i<n;i++){var cx=X((i+0.5)*WW/n);spikeTri(cx,Y(0),'T',SP*0.85*s,WW/n*s*0.9,th[1]);spikeTri(cx,Y(WH),'B',SP*0.85*s,WW/n*s*0.9,th[1]);}
  g.fillStyle=th[1];g.fillRect(X(0),Y(0)-6,AW,6);g.fillRect(X(0),Y(WH),AW,6);
  spikesL.forEach(function(sp){spikeTri(X(0),Y(rowY(sp.r)),'L',SP*s*sp.o,rowH()*s*0.9,th[1]);});spikesR.forEach(function(sp){spikeTri(X(WW),Y(rowY(sp.r)),'R',SP*s*sp.o,rowH()*s*0.9,th[1]);});
  if(candy){var cy=Y(candy.y)+Math.sin(t*4)*4;C(X(candy.x),cy,11*s,th[2]);g.fillStyle='#fff';g.font=Math.round(14*s)+'px sans-serif';g.fillText('🍬',X(candy.x),cy+5*s);}
  if(P&&state!=='dead'){var px=X(P.x),py=Y(P.y),r=R*s,d=P.vx>0?1:-1;g.save();g.translate(px,py);g.scale(d,1);
    // jellybean flyer with wings
    var wf=P.flap>0?-0.9:Math.sin(t*10)*0.3;g.fillStyle='rgba(255,255,255,.85)';g.save();g.rotate(wf);g.beginPath();g.ellipse(-r*0.4,-r*0.6,r*0.35,r*0.6,-0.6,0,7);g.fill();g.restore();
    g.fillStyle=th[2];g.beginPath();g.ellipse(0,0,r*1.05,r*0.9,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-r*0.3,-r*0.35,r*0.35,r*0.2,-0.4,0,7);g.fill();
    C(r*0.35,-r*0.15,r*0.24,'#fff');C(r*0.42,-r*0.13,r*0.12,'#1a1a2a');g.fillStyle='#ffb02a';g.beginPath();g.moveTo(r*0.85,0);g.lineTo(r*1.3,r*0.12);g.lineTo(r*0.85,r*0.25);g.fill();C(r*0.15,r*0.3,r*0.12,'rgba(255,120,150,.5)');g.restore();}
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);C(X(f.x),Y(f.y),4,f.c);});g.globalAlpha=1;
  g.fillStyle=th[1];g.font='800 13px Rubik';g.textAlign='left';g.fillText('🍬 '+candies,X(0)+10,Y(0)+SP*s+18);g.textAlign='right';g.fillText(TX.best+' '+best,X(WW)-10,Y(0)+SP*s+18);
  if(state==='play'&&!started){g.textAlign='center';g.font="900 26px Rubik,'M PLUS Rounded 1c'";g.fillStyle=th[1];g.globalAlpha=0.5+Math.sin(t*5)*0.3;g.fillText(TX.tap,W/2,Y(WH*0.68));g.globalAlpha=1;}}
var last=performance.now();function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);render();cgSync();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
