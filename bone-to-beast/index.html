<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bone to Beast</title>
<style>
/* layout: full-screen canvas arena with camera on the player. HUD drawn on canvas. HTML overlays: title, evolve choice cards, game over. Touch: left-half virtual stick, ability button bottom-right. */
:root{--ink:#f4efe6;--muted:#b9b0c4;--card:#221c2b;--line:#3a3046;--blood:#d6334a;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#15111b;color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
[hidden]{display:none!important}
.dim{background:rgba(12,8,16,.72)}
h1{font-size:clamp(46px,10vw,92px);margin:0;line-height:.95;letter-spacing:2px;color:#f4efe6;text-shadow:0 6px 0 #6b1324,0 0 30px rgba(214,51,74,.45)}
h1 span{color:var(--blood)}
h2{font-size:34px;margin:0}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
.btn{font:inherit;font-weight:900;font-size:20px;border:0;border-radius:14px;padding:14px 34px;min-height:56px;cursor:pointer;background:var(--blood);color:#fff;box-shadow:0 5px 0 #7e1326}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7e1326}
.btn.alt{background:#3a3046;box-shadow:0 5px 0 #231c2b}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px}
.card{width:220px;min-height:250px;border-radius:20px;background:var(--card);border:3px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;cursor:pointer;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--c,#fff);box-shadow:0 0 24px var(--c,#fff)}
.card canvas{position:static;width:110px;height:110px}
.card b{font-size:20px}.card span{font-size:14px;color:var(--muted);line-height:1.4}
.card em{font-style:normal;font-size:13px;font-weight:800;color:var(--c)}
.path{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800;font-size:16px}
.path i{font-style:normal;color:var(--muted)}
.keys{font-size:14px}
.abil{position:fixed;right:22px;bottom:max(22px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:4px solid rgba(255,255,255,.5);background:rgba(214,51,74,.55);color:#fff;font:inherit;font-weight:900;font-size:14px;display:none}
@media (pointer:coarse){.abil{display:block}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="abil" id="abilBtn" type="button" aria-label="Ability" hidden>SKILL</button>
<div class="over dim" id="title">
  <h1>BONE<br>TO <span>BEAST</span></h1>
  <p>You rise as a lonely skeleton.<br>Drink the blood of what you defeat — and become it.</p>
  <button class="btn" id="start" type="button">Rise</button>
  <p class="keys">Move: WASD / arrows · Attacks are automatic · Skill: Space<br>Touch: drag on the left side to move · tap SKILL</p>
  <p id="hi"></p>
</div>
<div class="over dim" id="evolve" hidden><h2>The blood calls…</h2><p>Choose what you become</p><div class="cards" id="cards"></div></div>
<div class="over dim" id="dead" hidden><h2 id="deadT">You fell</h2><p id="deadP"></p><div class="path" id="path"></div><button class="btn" id="again" type="button">Rise again</button></div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;if(typeof zoom==='function')zoom();}
addEventListener('resize',fit);fit();
var store={get:function(k,f){try{var v=JSON.parse(localStorage.getItem('b2b-'+k));return v==null?f:v;}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('b2b-'+k,JSON.stringify(v));}catch(e){}}};
// ===================== species / forms =====================
// each species is both an enemy type and a form you can take
var SP={
 skeleton:{name:'Skeleton',col:'#e9e4d4',hp:70,spd:150,r:16,atk:{kind:'swing',dmg:14,rate:0.5,range:58},skill:{name:'Bone Storm',cd:6,desc:'Spin and fling bones all around'},desc:'Balanced. Swings a bone club.'},
 slime:{name:'Slime',col:'#58d68d',hp:110,spd:125,r:18,atk:{kind:'slam',dmg:12,rate:0.7,range:70},skill:{name:'Regrow',cd:9,desc:'Heal 35% of your HP'},desc:'Tough and squishy. Slams everything near.'},
 wolf:{name:'Wolf',col:'#9aa3b5',hp:85,spd:240,r:16,atk:{kind:'bite',dmg:18,rate:0.35,range:46},skill:{name:'Pounce',cd:3.5,desc:'Dash through enemies, untouchable'},desc:'Fast. Rapid bites up close.'},
 bat:{name:'Bat',col:'#a879e8',hp:60,spd:210,r:14,atk:{kind:'sonic',dmg:10,rate:0.4,range:300},skill:{name:'Night Swarm',cd:7,desc:'Release 12 sonic waves'},desc:'Fragile. Ranged waves that steal life.'},
 goblin:{name:'Goblin',col:'#b8c94a',hp:75,spd:175,r:15,atk:{kind:'dagger',dmg:13,rate:0.45,range:260},skill:{name:'Firebomb',cd:5,desc:'Throw a bomb that explodes'},desc:'Tricky. Throws daggers from afar.'},
 golem:{name:'Golem',col:'#c08a5a',hp:190,spd:105,r:22,atk:{kind:'punch',dmg:30,rate:0.9,range:62},skill:{name:'Quake',cd:8,desc:'Smash the ground, stun nearby foes'},desc:'Slow giant. Heavy punches.'}};
var ENEMY={slime:{hp:22,spd:60,dmg:8,pts:10},wolf:{hp:18,spd:150,dmg:9,pts:15},bat:{hp:12,spd:120,dmg:6,pts:12},goblin:{hp:20,spd:90,dmg:7,pts:18},golem:{hp:70,spd:45,dmg:16,pts:40},skeleton:{hp:20,spd:80,dmg:8,pts:12}};
var ARENA={w:1800,h:1200};
// ===================== audio =====================
var AC=null,muted=store.get('muted',false);
function snd(k){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  var P={hit:[180,90,0.08,0.06,'square'],kill:[300,60,0.18,0.07,'sawtooth'],orb:[700,1100,0.06,0.03,'sine'],hurt:[220,70,0.25,0.1,'sawtooth'],skill:[200,800,0.25,0.06,'triangle'],evolve:[220,880,0.6,0.08,'triangle'],swing:[400,200,0.07,0.025,'triangle'],boss:[80,50,0.9,0.12,'sawtooth']}[k];
  o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+P[2]);o.start(t);o.stop(t+P[2]+0.02);}catch(e){}}
// ===================== state =====================
var G=null,keys={},stick=null,hi=store.get('hi',0),Z=1;function zoom(){Z=Math.max(1.25,Math.min(2.4,Math.min(W,H)/400));}
var rocks=[];(function(){var r=1234567;function rnd(){r=(r*1664525+1013904223)>>>0;return r/4294967296;}for(var i=0;i<16;i++)rocks.push({x:150+rnd()*(ARENA.w-300),y:150+rnd()*(ARENA.h-300),r:18+rnd()*26,t:rnd()<0.5?'stone':'grave'});})();
function newGame(){G={t:0,state:'play',wave:0,score:0,kills:0,p:null,en:[],shots:[],eshots:[],orbs:[],fx:[],texts:[],blood:{},bloodNeed:6,path:['skeleton'],spawnQ:[],spawnT:0,shake:0,slow:1,cam:{x:ARENA.w/2,y:ARENA.h/2},betweenT:0};
  becomeForm('skeleton',1,true);G.p.x=ARENA.w/2;G.p.y=ARENA.h/2;nextWave();}
function becomeForm(sp,tier,first){var F=SP[sp],old=G.p,mult=1+(tier-1)*0.35;
  G.p={x:old?old.x:0,y:old?old.y:0,sp:sp,tier:tier,max:Math.round(F.hp*mult),hp:Math.round(F.hp*mult),spd:F.spd*(1+(tier-1)*0.08),r:F.r,atkT:0,cd:0,inv:first?0:1.2,face:0,dash:0,anim:0,mult:mult};
  if(old&&!first)G.p.hp=Math.round(G.p.max*Math.max(0.6,old.hp/old.max));}
// ===================== waves =====================
function nextWave(){G.wave++;var w=G.wave,pool=['slime','bat'];if(w>=2)pool.push('wolf');if(w>=3)pool.push('goblin');if(w>=4)pool.push('golem');if(w>=6)pool.push('skeleton');
  if(w%5===0){var bs=['golem','wolf','slime','bat','goblin'][(w/5-1)%5];G.spawnQ.push({sp:bs,boss:true,at:0.5});banner('A giant '+SP[bs].name+' appears!');snd('boss');}
  var n=8+Math.floor(w*2.5);for(var i=0;i<n;i++)G.spawnQ.push({sp:pool[(Math.random()*pool.length)|0],at:0.2+i*Math.max(0.2,0.7-w*0.04)});
  G.spawnT=0;if(w%5)banner('Wave '+w);}
function spawn(q){var a=Math.random()*6.283,d=Math.max(W,H)/2/Z+70,x=G.p.x+Math.cos(a)*d,y=G.p.y+Math.sin(a)*d;x=Math.max(30,Math.min(ARENA.w-30,x));y=Math.max(30,Math.min(ARENA.h-30,y));
  var E=ENEMY[q.sp],hm=1+G.wave*0.11,boss=!!q.boss;G.en.push({sp:q.sp,x:x,y:y,r:SP[q.sp].r*(boss?2.3:1),hp:E.hp*hm*(boss?14:1),max:E.hp*hm*(boss?14:1),spd:E.spd*(boss?0.75:1),dmg:E.dmg*(1+G.wave*0.05)*(boss?1.6:1),boss:boss,t:Math.random()*3,cd:1+Math.random(),vx:0,vy:0,hit:0,stun:0,anim:0,face:0});}
// ===================== combat helpers =====================
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function nearest(range){var best=null,bd=range;G.en.forEach(function(e){var d=dist(e,G.p)-e.r;if(d<bd){bd=d;best=e;}});return best;}
function hurtEnemy(e,dmg,kx,ky){if(e.dead)return;e.hp-=dmg;e.hit=0.12;e.vx+=kx||0;e.vy+=ky||0;G.texts.push({x:e.x,y:e.y-e.r,t:Math.round(dmg)+'',l:0.6,c:'#fff'});snd('hit');
  if(G.p.sp==='bat'){G.p.hp=Math.min(G.p.max,G.p.hp+dmg*0.15);}
  if(e.hp<=0)kill(e);}
function kill(e){e.dead=true;G.kills++;G.score+=Math.round(ENEMY[e.sp].pts*(e.boss?10:1)*(1+G.wave*0.1));snd('kill');G.shake=Math.max(G.shake,e.boss?16:4);
  for(var i=0;i<14;i++)G.fx.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,l:0.5,c:i%2?SP[e.sp].col:'#d6334a',s:3+Math.random()*4});
  var n=e.boss?12:1;for(var k=0;k<n;k++)G.orbs.push({sp:e.sp,x:e.x+(Math.random()-0.5)*e.r,y:e.y+(Math.random()-0.5)*e.r,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,t:0});
  G.fx.push({ring:1,x:e.x,y:e.y,r:0,R:e.r*3,l:0.3,L:0.3,c:SP[e.sp].col});}
function hurtPlayer(d){var p=G.p;if(p.inv>0||p.dash>0)return;if(p.sp==='golem')d*=0.75;p.hp-=d;p.inv=0.6;G.shake=Math.max(G.shake,8);snd('hurt');G.flash=0.25;
  if(p.hp<=0){p.hp=0;gameOver();}}
function aoe(x,y,R,dmg,stun,col){G.fx.push({ring:1,x:x,y:y,r:0,R:R,l:0.35,L:0.35,c:col||'#fff'});G.en.forEach(function(e){var d=Math.hypot(e.x-x,e.y-y);if(d<R+e.r){var a=Math.atan2(e.y-y,e.x-x);hurtEnemy(e,dmg,Math.cos(a)*260,Math.sin(a)*260);if(stun)e.stun=stun;}});}
function shoot(x,y,a,spd,dmg,col,r,pierce,kind){G.shots.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:dmg,col:col,r:r||6,l:1.4,pierce:pierce||0,hitL:[],kind:kind});}
function attack(){var p=G.p,F=SP[p.sp],A=F.atk,dm=A.dmg*p.mult,t=nearest(A.range+40);if(!t)return false;var a=Math.atan2(t.y-p.y,t.x-p.x);p.face=a;p.anim=0.25;
  if(A.kind==='swing'||A.kind==='bite'||A.kind==='punch'){snd('swing');G.fx.push({arc:1,x:p.x,y:p.y,a:a,R:A.range+p.r,l:0.18,L:0.18,c:A.kind==='bite'?'#ffffff':A.kind==='punch'?'#ffb070':'#e9e4d4',w:A.kind==='punch'?1.6:1.2});
    G.en.forEach(function(e){var d=dist(e,p),ea=Math.atan2(e.y-p.y,e.x-p.x),da=Math.abs(((ea-a+Math.PI*3)%(Math.PI*2))-Math.PI);if(d<A.range+p.r+e.r&&da<(A.kind==='punch'?1.0:0.9))hurtEnemy(e,dm,Math.cos(ea)*(A.kind==='punch'?420:200),Math.sin(ea)*(A.kind==='punch'?420:200));});}
  else if(A.kind==='slam'){aoe(p.x,p.y,A.range+p.r,dm,0,'#58d68d');}
  else if(A.kind==='sonic'){shoot(p.x,p.y,a,420,dm,'#c9a6ff',9,1,'sonic');}
  else if(A.kind==='dagger'){shoot(p.x,p.y,a,520,dm,'#e8e8e8',5,0,'dagger');shoot(p.x,p.y,a+0.15,520,dm*0.7,'#e8e8e8',5,0,'dagger');}
  return true;}
function skill(){var p=G.p;if(G.state!=='play'||p.cd>0)return;var F=SP[p.sp],dm=SP[p.sp].atk.dmg*p.mult;p.cd=F.skill.cd;snd('skill');
  if(p.sp==='skeleton'){for(var i=0;i<12;i++)shoot(p.x,p.y,i/12*6.283,380,dm*0.9,'#e9e4d4',7,1,'bone');}
  else if(p.sp==='slime'){p.hp=Math.min(p.max,p.hp+p.max*0.35);G.fx.push({ring:1,x:p.x,y:p.y,r:0,R:90,l:0.5,L:0.5,c:'#58d68d'});G.texts.push({x:p.x,y:p.y-30,t:'+HP',l:0.8,c:'#58d68d'});}
  else if(p.sp==='wolf'){var mx=0,my=0;if(keys.x||keys.y){mx=keys.x;my=keys.y;}else{var t=nearest(400);if(t){mx=t.x-p.x;my=t.y-p.y;}else{mx=Math.cos(p.face);my=Math.sin(p.face);}}var l=Math.hypot(mx,my)||1;p.dash=0.22;p.dvx=mx/l*900;p.dvy=my/l*900;p.dashHit=[];}
  else if(p.sp==='bat'){for(var k=0;k<12;k++)shoot(p.x,p.y,k/12*6.283,360,dm,'#c9a6ff',9,2,'sonic');}
  else if(p.sp==='goblin'){var tg=nearest(500),ang=tg?Math.atan2(tg.y-p.y,tg.x-p.x):p.face;G.shots.push({x:p.x,y:p.y,vx:Math.cos(ang)*380,vy:Math.sin(ang)*380,bomb:1,l:0.7,dmg:dm*2.6,r:9,col:'#ff8c3a',hitL:[]});}
  else if(p.sp==='golem'){aoe(p.x,p.y,190,dm*1.2,1.6,'#ffb070');G.shake=18;}}
// ===================== blood / evolution =====================
function addBlood(sp){G.blood[sp]=(G.blood[sp]||0)+1;var tot=0;for(var k in G.blood)tot+=G.blood[k];if(tot>=G.bloodNeed&&G.state==='play')offerEvolve();}
function offerEvolve(){G.state='evolve';var list=Object.keys(G.blood).sort(function(a,b){return G.blood[b]-G.blood[a];}).slice(0,3);
  if(list.indexOf(G.p.sp)<0&&list.length<3)list.push(G.p.sp);
  var el=document.getElementById('cards');el.innerHTML='';
  list.forEach(function(sp,i){var F=SP[sp],same=sp===G.p.sp,tier=same?G.p.tier+1:1,b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--c',F.col);
    var c=document.createElement('canvas');c.width=c.height=220;b.appendChild(c);var g=c.getContext('2d');g.translate(110,120);g.scale(3.2,3.2);drawCreature(g,sp,0,0,F.r,0,0,false,tier,true);
    b.insertAdjacentHTML('beforeend','<b>'+F.name+(tier>1?' '+roman(tier):'')+'</b><em>'+(same?'Grow stronger':'Blood: '+(G.blood[sp]||0))+'</em><span>'+F.desc+'<br>Skill: '+F.skill.name+' — '+F.skill.desc+'</span><em>['+(i+1)+']</em>');
    b.addEventListener('click',function(){choose(sp,tier);});el.appendChild(b);});
  document.getElementById('evolve').hidden=false;setTimeout(function(){var f=el.querySelector('button');if(f)f.focus();},60);}
function choose(sp,tier){becomeForm(sp,tier,false);G.path.push(sp+(tier>1?':'+tier:''));G.blood={};G.bloodNeed=Math.round(G.bloodNeed*1.35+3);snd('evolve');
  for(var i=0;i<40;i++)G.fx.push({x:G.p.x,y:G.p.y,vx:(Math.random()-0.5)*500,vy:(Math.random()-0.5)*500,l:0.8,c:SP[sp].col,s:4+Math.random()*4});
  G.fx.push({ring:1,x:G.p.x,y:G.p.y,r:0,R:220,l:0.5,L:0.5,c:SP[sp].col});banner('You became a '+SP[sp].name+(tier>1?' '+roman(tier):'')+'!');
  document.getElementById('evolve').hidden=true;G.state='play';last=performance.now();}
function roman(n){return ['','I','II','III','IV','V','VI'][n]||n;}
// ===================== update =====================
function banner(t){G.banner=t;G.bannerT=2;}
function update(dt){var p=G.p;G.t+=dt;
  // input
  var mx=0,my=0;if(keys.ArrowLeft||keys.KeyA)mx--;if(keys.ArrowRight||keys.KeyD)mx++;if(keys.ArrowUp||keys.KeyW)my--;if(keys.ArrowDown||keys.KeyS)my++;
  if(stick&&stick.on){var sx=stick.x-stick.ox,sy=stick.y-stick.oy,sl=Math.hypot(sx,sy);if(sl>8){mx=sx/Math.max(sl,50);my=sy/Math.max(sl,50);}}
  var ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}keys.x=mx;keys.y=my;
  if(p.dash>0){p.dash-=dt;p.x+=p.dvx*dt;p.y+=p.dvy*dt;G.en.forEach(function(e){if(dist(e,p)<e.r+p.r+10&&p.dashHit.indexOf(e)<0){p.dashHit.push(e);hurtEnemy(e,SP.wolf.atk.dmg*p.mult*2,p.dvx*0.3,p.dvy*0.3);}});
    if(Math.random()<0.8)G.fx.push({x:p.x,y:p.y,vx:0,vy:0,l:0.25,c:'rgba(200,210,230,.6)',s:p.r*0.8});}
  else{p.x+=mx*p.spd*dt;p.y+=my*p.spd*dt;if(ml>0.1)p.face=Math.atan2(my,mx);}
  p.x=Math.max(p.r,Math.min(ARENA.w-p.r,p.x));p.y=Math.max(p.r,Math.min(ARENA.h-p.r,p.y));
  rocks.forEach(function(r){var d=Math.hypot(p.x-r.x,p.y-r.y),m=r.r+p.r;if(d<m&&d>0){p.x=r.x+(p.x-r.x)/d*m;p.y=r.y+(p.y-r.y)/d*m;}});
  p.walk=(p.walk||0)+ml*dt*10;if(p.inv>0)p.inv-=dt;if(p.cd>0)p.cd-=dt;if(p.anim>0)p.anim-=dt;
  p.atkT-=dt;if(p.atkT<=0){if(attack())p.atkT=SP[p.sp].atk.rate;}
  // spawns
  if(G.spawnQ.length){G.spawnT+=dt;while(G.spawnQ.length&&G.spawnQ[0].at<=G.spawnT)spawn(G.spawnQ.shift());}
  // enemies
  G.en.forEach(function(e){e.t+=dt;if(e.hit>0)e.hit-=dt;e.vx*=Math.pow(0.02,dt);e.vy*=Math.pow(0.02,dt);if(e.anim>0)e.anim-=dt;
    if(e.stun>0){e.stun-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;return;}
    var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,s=e.spd;e.face=Math.atan2(dy,dx);
    if(e.sp==='slime'){var hop=(Math.sin(e.t*4)>0)?1:0.15;s*=hop;}
    else if(e.sp==='bat'){ux+=Math.sin(e.t*5)*0.8;uy+=Math.cos(e.t*4)*0.8;}
    else if(e.sp==='wolf'){if(d<220&&e.cd<=0){e.cd=2.2;e.vx+=ux*520;e.vy+=uy*520;e.anim=0.3;}}

  ctx.save();ctx.beginPath();ctx.arc(x+43,y+43,32,0,7);ctx.fillStyle='#2a2333';ctx.fill();ctx.clip();drawCreature(ctx,p.sp,x+43,y+46,F.r*1.3,0,G.t*3,false,p.tier);ctx.restore();
  ctx.fillStyle='#f4efe6';ctx.font='900 17px Trebuchet MS,sans-serif';ctx.textAlign='left';ctx.fillText(F.name+(p.tier>1?' '+roman(p.tier):''),x+86,y+26);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(x+86,y+34,198,14,7);ctx.fill();ctx.fillStyle='#e8445a';rr(x+86,y+34,198*Math.max(0,p.hp/p.max),14,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText(Math.ceil(p.hp)+' / '+p.max,x+92,y+45);
  // blood meter: stacked colors by species
  var tot=0,bx=x+86,bw=198;for(var k in G.blood)tot+=G.blood[k];ctx.fillStyle='rgba(255,255,255,.12)';rr(bx,y+56,bw,12,6);ctx.fill();
  var off=0;Object.keys(G.blood).forEach(function(s){var w=bw*Math.min(1,G.blood[s]/G.bloodNeed);ctx.fillStyle=SP[s].col;ctx.fillRect(bx+off,y+56,Math.min(w,bw-off),12);off+=w;});
  ctx.fillStyle='#c9bdd4';ctx.font='800 11px Trebuchet MS,sans-serif';ctx.fillText('BLOOD '+tot+' / '+G.bloodNeed,bx,y+82);
  // skill
  var sk=F.skill,ready=p.cd<=0;ctx.textAlign='right';ctx.fillStyle=ready?'#ffd34f':'#9b90a8';ctx.font='900 14px Trebuchet MS,sans-serif';ctx.fillText((ready?'[SPACE] ':'')+sk.name+(ready?'':' '+p.cd.toFixed(1)+'s'),x+284,y+82);
  // wave / score
  ctx.textAlign='right';ctx.fillStyle='#f4efe6';ctx.font='900 22px Trebuchet MS,sans-serif';ctx.fillText('Wave '+G.wave,W-16,36);ctx.font='800 15px Trebuchet MS,sans-serif';ctx.fillStyle='#c9bdd4';ctx.fillText('Score '+G.score,W-16,58);
  if(G.bannerT>0){ctx.globalAlpha=Math.min(1,G.bannerT*1.5);ctx.textAlign='center';ctx.font='900 '+Math.round(Math.min(W,H)*0.06)+'px Trebuchet MS,sans-serif';ctx.fillStyle='#f4efe6';ctx.shadowColor='#d6334a';ctx.shadowBlur=20;ctx.fillText(G.banner,W/2,H*0.3);ctx.shadowBlur=0;ctx.globalAlpha=1;}
  var ab=document.getElementById('abilBtn');ab.textContent=ready?sk.name.toUpperCase():p.cd.toFixed(1);ab.style.opacity=ready?1:0.5;
  if(stick&&stick.on){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.ox,stick.oy,50,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.35)';var dx=stick.x-stick.ox,dy=stick.y-stick.oy,l=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);ctx.beginPath();ctx.arc(stick.ox+Math.cos(a)*l,stick.oy+Math.sin(a)*l,22,0,7);ctx.fill();}}
// ===================== flow =====================
function gameOver(){G.state='dead';if(G.score>hi){hi=G.score;store.set('hi',hi);}
  setTimeout(function(){document.getElementById('deadT').textContent='You fell on wave '+G.wave;document.getElementById('deadP').textContent='Score '+G.score+' · '+G.kills+' defeated'+(G.score>=hi?' · New best!':' · Best '+hi);
    var el=document.getElementById('path');el.innerHTML='';G.path.forEach(function(s,i){var sp=s.split(':')[0],t=s.split(':')[1];if(i)el.insertAdjacentHTML('beforeend','<i>→</i>');el.insertAdjacentHTML('beforeend','<span style="color:'+SP[sp].col+'">'+SP[sp].name+(t?' '+roman(+t):'')+'</span>');});
    document.getElementById('dead').hidden=false;document.getElementById('abilBtn').hidden=true;},900);}
var last=performance.now(),acc=0,STEP=1/60;
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;while(acc>=STEP){if(G&&G.state==='play')update(STEP);else if(G&&G.state==='dead'){G.fx.forEach(function(f){f.l-=STEP;});}acc-=STEP;}draw();requestAnimationFrame(frame);}
function start(){newGame();document.getElementById('title').hidden=true;document.getElementById('dead').hidden=true;document.getElementById('abilBtn').hidden=false;last=performance.now();}
// ===================== input =====================
addEventListener('keydown',function(e){keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==='Space'){if(G&&G.state==='play')skill();else if(!document.getElementById('title').hidden)start();}
  if(G&&G.state==='evolve'&&/^Digit[123]$/.test(e.code)){var b=document.querySelectorAll('#cards button')[+e.code.slice(5)-1];if(b)b.click();}
  if(e.code==='KeyP'&&G){G.state=G.state==='play'?'pause':G.state==='pause'?'play':G.state;}});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};});
cv.addEventListener('pointerdown',function(e){if(!G||G.state!=='play')return;if(e.clientX<W*0.6){stick={on:true,id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',function(e){if(stick&&stick.id===e.pointerId){stick.x=e.clientX;stick.y=e.clientY;}});
['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(e){if(stick&&stick.id===e.pointerId)stick=null;});});
document.getElementById('abilBtn').addEventListener('click',skill);
document.getElementById('start').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
document.getElementById('hi').textContent=hi?'Best score: '+hi:'';
requestAnimationFrame(frame);
</script>
</body>
