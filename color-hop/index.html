<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Color Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#181528;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,10,24,.6);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,90px);line-height:.9;font-weight:900;font-style:italic;letter-spacing:1px}
.over h1 span:nth-child(1){color:#ff3a7a}.over h1 span:nth-child(2){color:#3ad0ff}.over h1 span:nth-child(3){color:#ffd23a}.over h1 span:nth-child(4){color:#9a6aff}.over h1 span:nth-child(5){color:#ff3a7a}
.over h1 small{display:block;font-size:.66em;color:#fff}
.over p{margin:0;max-width:340px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ff6a9a,#e8306a);color:#fff;text-shadow:0 2px 0 #8a1a44;box-shadow:0 6px 0 #8a1a44;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1a44}
.btn.sub{font-size:17px;background:linear-gradient(#5ad8ff,#2a86e0);text-shadow:0 2px 0 #1a4a8a;box-shadow:0 5px 0 #1a4a8a}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1><span>C</span><span>O</span><span>L</span><span>O</span><span>R</span><small>HOP</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(64px,20vw,110px)">0</h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'タップでボールがぴょんと上へ。<br>ボールと<b>同じ色</b>のところだけ通りぬけられる。<br>虹色の玉にさわると色が変わるよ。星を集めよう！',play:'あそぶ',again:'もういちど',best:'ベスト',newb:'ベスト更新！',cont:'▶ 広告を見て続ける',na:'広告を読み込めませんでした',tap:'タップでスタート'}
 :{how:'Tap to make the ball hop up.<br>You can only pass through parts that match <b>your color</b>.<br>Touch a rainbow orb to change color. Grab the stars!',play:'PLAY',again:'AGAIN',best:'BEST',newb:'New best!',cont:'▶ Watch ad: continue',na:'Ad not available',tap:'TAP TO START'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('ch-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('ch-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var COL=['#ff3a7a','#3ad0ff','#ffd23a','#9a6aff'];
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,U;
var ball,obs=[],camY=0,state='title',score=0,t=0,FX=[],used=false,games=0,started=false,nextY=0,shake=0,flash=0;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;U=Math.min(W/390,H/720);}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
// ---- world (y grows upward, in U units) ----
function sy(y){return H*0.82-(y-camY)*U;}
function addObstacle(){var lv=obs.filter(function(o){return o.kind!=='orb';}).length,sp=(1.1+Math.min(1.6,lv*0.07))*(Math.random()<0.5?1:-1),kinds=lv<2?['ring']:lv<5?['ring','bar','cross']:['ring','bar','cross','double'],k=kinds[Math.floor(Math.random()*kinds.length)],o;
  if(k==='ring'){o={kind:'ring',y:nextY+120,r:105,th:18,a:Math.random()*6.283,sp:sp};nextY+=240;}
  else if(k==='double'){o={kind:'double',y:nextY+140,r:125,r2:92,th:16,a:Math.random()*6.283,sp:sp*0.9};nextY+=280;}
  else if(k==='cross'){var side=Math.random()<0.5?-1:1;o={kind:'cross',y:nextY+110,x:side*70,len:100,th:18,a:Math.random()*6.283,sp:sp*1.1};nextY+=220;}
  else{o={kind:'bar',y:nextY+30,th:22,off:Math.random()*400,sp:(110+Math.min(150,lv*8))*(Math.random()<0.5?1:-1)};nextY+=110;}
  o.star=true;obs.push(o);obs.push({kind:'orb',y:nextY+60,hit:false});nextY+=150;}
function reset(){ball={y:0,v:0,c:Math.floor(Math.random()*4),r:13};obs=[];camY=-120;nextY=230;for(var i=0;i<4;i++)addObstacle();score=0;FX=[];used=false;started=false;state='play';}
function jump(){if(state!=='play')return;started=true;ball.v=420;tone(620,0.05,'triangle',0.035,1.4);}
function die(){if(state!=='play')return;state='dead';games++;shake=0.3;flash=0.25;tone(160,0.35,'sawtooth',0.07,0.5);for(var i=0;i<26;i++){var a=Math.random()*6.283,s=120+Math.random()*320;FX.push({x:0,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.9,c:COL[i%4],s:6+Math.random()*5});}
  var nb=score>best;if(nb){best=score;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=score;$('endP').innerHTML=nb?TX.newb:TX.best+' '+best;$('cont').hidden=!(CG&&!used&&score>=5);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},850);}
$('play').onclick=function(){$('title').hidden=true;reset();};
$('again').onclick=function(){$('end').hidden=true;reset();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;// respawn just after last passed orb
  var o=null;for(var i=0;i<obs.length;i++){if(obs[i].kind==='orb'&&obs[i].y<ball.y+40)o=obs[i];}ball.y=o?o.y:0;ball.v=0;camY=ball.y-120;started=false;state='play';},function(){b.textContent=TX.na;});};
cv.addEventListener('pointerdown',function(e){e.preventDefault();jump();});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump();}});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- collision ----
function norm(a){a%=6.283185;if(a<0)a+=6.283185;return a;}
function hitRing(o,R,dir){var dy=ball.y-o.y,d=Math.abs(dy);if(Math.abs(d-R)<o.th/2+ball.r-2){var ang=dy>0?Math.PI/2:-Math.PI/2;var rot=dir<0?-o.a:o.a;var c=Math.floor(norm(ang-rot)/(Math.PI/2))%4;return c!==ball.c;}return false;}
function segDist(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,k=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l));return Math.hypot(px-ax-k*dx,py-ay-k*dy);}
function check(){for(var i=0;i<obs.length;i++){var o=obs[i];if(Math.abs(o.y-ball.y)>200)continue;
    if(o.kind==='ring'){if(hitRing(o,o.r,1))return die();}
    else if(o.kind==='double'){if(hitRing(o,o.r,1)||hitRing(o,o.r2,-1))return die();}
    else if(o.kind==='cross'){for(var k=0;k<4;k++){var a=o.a+k*Math.PI/2,ex=o.x+Math.cos(a)*o.len,ey=o.y-Math.sin(a)*o.len;// screen-like y flip consistent with drawing
        if(segDist(0,ball.y,o.x,o.y,ex,ey)<o.th/2+ball.r-2&&k!==ball.c)return die();}}
    else if(o.kind==='bar'){if(Math.abs(ball.y-o.y)<o.th/2+ball.r-2){var seg=Math.floor(norm2(o.off)/ (barW()/4));if(seg!==ball.c)return die();}}
    else if(o.kind==='orb'&&!o.hit&&Math.abs(ball.y-o.y)<ball.r+14){o.hit=true;var nc;do{nc=Math.floor(Math.random()*4);}while(nc===ball.c);ball.c=nc;tone(880,0.08,'square',0.04,1.5);for(var q=0;q<12;q++){var aa=q/12*6.283;FX.push({x:0,y:o.y,vx:Math.cos(aa)*160,vy:Math.sin(aa)*160,l:0.5,c:COL[q%4],s:5});}}
    if(o.star&&ball.y>o.y-6&&ball.y<o.y+20&&o.kind!=='bar'){o.star=false;score++;tone(1180,0.07,'square',0.035,1.3);FX.push({x:0,y:o.y+30,vx:0,vy:60,l:0.7,txt:'+1'});}
    if(o.star&&o.kind==='bar'&&ball.y>o.y+o.th){o.star=false;score++;tone(1180,0.07,'square',0.035,1.3);FX.push({x:0,y:o.y+40,vx:0,vy:60,l:0.7,txt:'+1'});}}}
function barW(){return 4*Math.max(110,W/U/4);}
function norm2(off){var bw=barW();return ((off%bw)+bw)%bw;}
// ---- draw ----
function star(x,y,r){g.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fillStyle='#fff';g.fill();}
function draw(){var sh=shake>0?(Math.random()-0.5)*shake*30:0;g.setTransform(DPR,0,0,DPR,sh*DPR,0);g.fillStyle='#181528';g.fillRect(-20,0,W+40,H);
  g.fillStyle='rgba(255,255,255,.07)';for(var s=0;s<50;s++){var px=(s*83.7)%W,py=((s*61.3+camY*U*0.3)%H+H)%H;g.fillRect(px,H-py,2,2);}
  var X=W/2;g.lineCap='butt';
  if(ball)obs.forEach(function(o){var y=sy(o.y);if(y<-200*U||y>H+200*U)return;
    if(o.kind==='ring'||o.kind==='double'){[[o.r,o.a]].concat(o.kind==='double'?[[o.r2,-o.a]]:[]).forEach(function(rr){for(var k=0;k<4;k++){g.strokeStyle=COL[k];g.lineWidth=o.th*U;g.beginPath();g.arc(X,y,rr[0]*U,-(rr[1]+(k+1)*Math.PI/2),-(rr[1]+k*Math.PI/2));g.stroke();}});}
    else if(o.kind==='cross'){g.lineCap='round';for(var k=0;k<4;k++){var a=o.a+k*Math.PI/2;g.strokeStyle=COL[k];g.lineWidth=o.th*U;g.beginPath();g.moveTo(X+o.x*U,y);g.lineTo(X+(o.x+Math.cos(a)*o.len)*U,y+Math.sin(a)*o.len*U);g.stroke();}g.lineCap='butt';g.fillStyle='#fff';g.beginPath();g.arc(X+o.x*U,y,7*U,0,7);g.fill();}
    else if(o.kind==='bar'){var bw=barW()*U,sw=bw/4,off=norm2(o.off)*U,x0=X-off;for(var r=-2;r<Math.ceil(W/bw)+3;r++)for(var k2=0;k2<4;k2++){var xx=x0+r*bw+k2*sw;if(xx>W||xx+sw<0)continue;g.fillStyle=COL[k2];g.fillRect(xx,y-o.th*U/2,sw-2,o.th*U);}}
    else if(o.kind==='orb'&&!o.hit){for(var q=0;q<4;q++){g.fillStyle=COL[q];g.beginPath();g.moveTo(X,y);g.arc(X,y,13*U,q*Math.PI/2+t*2,(q+1)*Math.PI/2+t*2);g.closePath();g.fill();}}
    if(o.star){var sy2=o.kind==='bar'?y-46*U:y;var pul=1+Math.sin(t*5)*0.08;star(X,sy2,15*U*pul);}});
  if(ball&&state!=='dead'){var by=sy(ball.y);g.fillStyle=COL[ball.c];g.beginPath();g.arc(X,by,ball.r*U,0,7);g.fill();g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(X-ball.r*U*0.35,by-ball.r*U*0.35,ball.r*U*0.3,0,7);g.fill();
    if(!started){g.font='900 '+Math.round(20*U)+'px Rubik,sans-serif';g.textAlign='center';g.fillStyle='rgba(255,255,255,.8)';g.fillText(TX.tap,X,by+50*U);}}
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);var fx=X+f.x*U,fy=sy(f.y);if(f.txt){g.font='900 '+Math.round(24*U)+'px Rubik,sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(f.txt,fx+40*U,fy);}else{g.fillStyle=f.c;g.beginPath();g.arc(fx,fy,f.s/2,0,7);g.fill();}});g.globalAlpha=1;
  g.setTransform(DPR,0,0,DPR,0,0);if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*1.5+')';g.fillRect(0,0,W,H);}
  if(state!=='title'&&ball){g.textAlign='left';g.font='900 '+Math.round(Math.min(50,W*0.12))+'px Rubik,sans-serif';g.fillStyle='#fff';g.fillText(String(score),18,Math.max(56,H*0.08));g.font='800 14px Rubik,sans-serif';g.fillStyle='rgba(255,255,255,.7)';g.fillText('★ '+TX.best+' '+best,20,Math.max(56,H*0.08)+22);}}
function tick(dt){t+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;});FX=FX.filter(function(f){return f.l>0;});
  obs.forEach(function(o){if(o.sp!==undefined&&o.kind!=='bar')o.a+=o.sp*dt;if(o.kind==='bar')o.off+=o.sp*dt;});
  if(state!=='play'||!ball)return;
  if(started){ball.v-=1250*dt;ball.y+=ball.v*dt;}
  if(ball.y<0&&camY<0){ball.y=0;ball.v=Math.max(0,ball.v);}
  camY=Math.max(camY,ball.y-120);
  if(sy(ball.y)>H+30)return die();
  check();
  while(nextY<camY+H/U+400)addObstacle();
  obs=obs.filter(function(o){return o.y>camY-400;});}
var last=performance.now();function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;tick(dt);draw();cgSync();requestAnimationFrame(frame);}
fit();reset();state='title';requestAnimationFrame(frame);
</script>
</body>
</html>
