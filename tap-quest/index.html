<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tap Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2a3a5a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,20,40,.72);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#ffd84a;text-shadow:0 5px 0 #8a4a10,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.8em;color:#7ae0ff;text-shadow:0 5px 0 #1a4a8a}
.over p{margin:0;max-width:350px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ffd84a,#ff9a2a);color:#fff;text-shadow:0 2px 0 #8a4a10;box-shadow:0 6px 0 #8a4a10;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4a10}
.btn.sub{font-size:17px;background:linear-gradient(#7ae05a,#2aa03a);text-shadow:0 2px 0 #1a5a1a;box-shadow:0 5px 0 #1a5a1a}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>TAP<small>QUEST</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(40px,11vw,66px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'モンスターを<b>タップしてこうげき！</b><br>ゴールドで剣をきたえたり、仲間をやとったりしよう。仲間は自動でたたかってくれる。<br>10体たおすとボス戦。30秒以内にたおせ！進みぐあいは自動で保存。',play:'あそぶ',cont:'つづきから',stage:'ステージ',boss:'ボス',tap:'タップ',retry:'ボスに挑戦',fail:'時間切れ…',x2:'▶ 広告でゴールド2倍（60秒）',na:'広告なし',dps:'秒間',lv:'Lv',hire:'やとう',again:'OK',away:'おかえり！ 留守のあいだに',gold:'ゴールド'}
 :{how:'<b>Tap the monster to attack!</b><br>Spend gold to sharpen your sword and hire helpers who fight on their own.<br>Beat 10 monsters to face the boss — 30 seconds to win! Progress saves automatically.',play:'PLAY',cont:'CONTINUE',stage:'Stage',boss:'BOSS',tap:'Tap',retry:'Fight boss',fail:'Out of time…',x2:'▶ Ad: 2× gold (60s)',na:'No ad',dps:'DPS',lv:'Lv',hire:'Hire',again:'OK',away:'Welcome back! While you were away:',gold:'gold'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('again').textContent=TX.again;
var store={get:function(k,f){try{var v=localStorage.getItem('tq-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('tq-'+k,JSON.stringify(v));}catch(e){}}};
var HEROES=[{k:'sword',ja:'勇者の剣',en:'Hero Sword',base:6,dps:0,tap:1,col:'#c8ccd8'},{k:'archer',ja:'ドングリ弓兵',en:'Acorn Archer',base:30,dps:4,col:'#a86a3a'},{k:'mage',ja:'シャボン魔導士',en:'Bubble Mage',base:400,dps:28,col:'#5ab8f0'},{k:'pup',ja:'てつわんワンコ',en:'Iron Pup',base:3500,dps:190,col:'#8a8aa8'},{k:'witch',ja:'ほしよみ魔女',en:'Star Witch',base:32000,dps:1300,col:'#b07aff'},{k:'giant',ja:'もりの巨人',en:'Grove Giant',base:300000,dps:9500,col:'#4ab84a'}];
var FOES=['carrot','jelly','lantern','snowman','turtle','plum'],BOSSES=['teapot','cloud'];
var save=store.get('save',null);
var S=save||{stage:1,kill:0,gold:0,lv:[1,0,0,0,0,0],t:Date.now()};
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR;
var state='title',t=0,mon=null,bossT=0,nums=[],FX=[],coinsFx=[],x2T=0,games=0,hitT=0,banner=0,bannerTxt='',saveT=0,away=0;
if(save){$('play').textContent=TX.cont;var sec=Math.min(3600,(Date.now()-save.t)/1000);away=Math.floor(dps()*sec*0.3);}else $('play').textContent=TX.play;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function fmt(n){n=Math.floor(n);if(n<1e4)return ''+n;var u=['K','M','B','T','Qa','Qi'],i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}return n.toFixed(n<10?2:n<100?1:0)+u[i];}
function tapDmg(){var l=Math.max(1,S.lv[0]);return Math.max(2,l*(1+Math.floor(l/25)))+dps()*0.04;}
function dps(){var d=0;for(var i=1;i<HEROES.length;i++){var l=S.lv[i];if(l>0)d+=HEROES[i].dps*l*Math.pow(2,Math.floor(l/25));}return d;}
function cost(i){return Math.ceil(HEROES[i].base*Math.pow(1.075,S.lv[i]));}
function monHP(s){return Math.ceil(4*Math.pow(1.43,s-1)+s);}
function spawn(){var boss=S.kill>=10,hp=monHP(S.stage)*(boss?5:1);mon={k:boss?BOSSES[(S.stage/1|0)%2]:FOES[(S.stage+S.kill)%FOES.length],hp:hp,max:hp,boss:boss,hit:0,spawn:0.12};if(boss){bossT=30;banner=1.2;bannerTxt=TX.boss+'!';}}
function goldFor(){return Math.ceil((monHP(S.stage)*0.8+2)*(mon.boss?5:1)*(x2T>0?2:1));}
function damage(d,tap,x,y){if(!mon||mon.spawn>0)return;mon.hp-=d;mon.hit=0.12;if(tap){nums.push({x:x+(Math.random()-0.5)*30,y:y,v:fmt(d),l:0.8,c:'#fff'});tone(500+Math.random()*200,0.04,'square',0.025,0.6);for(var k=0;k<4;k++)FX.push({x:x,y:y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,l:0.3});}
  if(mon.hp<=0){var gd=goldFor();S.gold+=gd;for(var c=0;c<Math.min(8,3+S.stage/5);c++)coinsFx.push({x:W/2,y:monY(),vx:(Math.random()-0.5)*260,vy:-200-Math.random()*200,l:0.9});nums.push({x:W/2,y:monY()-60,v:'+'+fmt(gd),l:1.1,c:'#ffd84a'});tone(mon.boss?300:700,0.1,'square',0.05,mon.boss?2:1.5);
    if(mon.boss){S.stage++;S.kill=0;banner=1.3;bannerTxt=TX.stage+' '+S.stage;tone(990,0.2,'square',0.05,1.3);}else S.kill++;spawn();}}
function monY(){return Math.min(H*0.3,(H-panelH())*0.55)+20;}
function panelH(){return Math.min(H*0.5,6*58+18);}
function rowRect(i){var ph=panelH(),pw=Math.min(W-16,480),x=(W-pw)/2,rh=(ph-18)/6;return {x:x,y:H-ph+8+i*rh,w:pw,h:rh-6};}
function buy(i){var c=cost(i);if(S.gold<c){tone(150,0.06,'square',0.03,0.8);return;}S.gold-=c;S.lv[i]++;tone(880,0.07,'triangle',0.05,1.4);persist();}
function persist(){S.t=Date.now();store.set('save',S);}
function update(dt){t+=dt;nums.forEach(function(n){n.l-=dt;n.y-=60*dt;});nums=nums.filter(function(n){return n.l>0;});FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;});FX=FX.filter(function(f){return f.l>0;});coinsFx.forEach(function(c){c.l-=dt;c.vy+=700*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;});coinsFx=coinsFx.filter(function(c){return c.l>0;});banner=Math.max(0,banner-dt);
  if(state!=='play'||!mon)return;x2T=Math.max(0,x2T-dt);mon.hit=Math.max(0,mon.hit-dt);mon.spawn=Math.max(0,mon.spawn-dt);var d=dps();if(d>0)damage(d*dt,false);
  if(mon&&mon.boss){bossT-=dt;if(bossT<=0){S.kill=9;banner=1.4;bannerTxt=TX.fail;tone(160,0.3,'sawtooth',0.05,0.5);games++;if(games%2===0)cgAd('midgame',function(){},function(){});spawn();}}
  saveT+=dt;if(saveT>5){saveT=0;persist();}}
$('play').onclick=function(){$('title').hidden=true;state='play';spawn();if(away>0){S.gold+=away;$('endT').textContent='💰 +'+fmt(away);$('endP').innerHTML=TX.away+'<br>'+fmt(away)+' '+TX.gold;$('cont').hidden=true;$('end').hidden=false;state='away';}};
$('again').onclick=function(){$('end').hidden=true;state='play';persist();};
$('cont').onclick=function(){};
function adRect(){return {x:W/2-130,y:H-panelH()-50,w:260,h:38};}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(state!=='play')return;var x=e.clientX,y=e.clientY;
  for(var i=0;i<HEROES.length;i++){var r=rowRect(i);if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h){buy(i);return;}}
  if(CG&&x2T<=0){var a=adRect();if(x>a.x&&x<a.x+a.w&&y>a.y&&y<a.y+a.h){cgAd('rewarded',function(){x2T=60;},function(){});return;}}
  if(y<H-panelH()-4){hitT=0.1;damage(tapDmg(),true,x,y);}});
addEventListener('keydown',function(e){if(state!=='play')return;if(e.key===' '){hitT=0.1;damage(tapDmg(),true,W/2,monY());e.preventDefault();}var n=parseInt(e.key,10);if(n>=1&&n<=6)buy(n-1);});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- art ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0.1,r),0,7);g.fill();}
function E(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function eyes(x,y,s,mad){C(x-s*0.3,y,s*0.15,'#fff');C(x+s*0.3,y,s*0.15,'#fff');C(x-s*0.28,y+s*0.02,s*0.08,'#1a1a2a');C(x+s*0.32,y+s*0.02,s*0.08,'#1a1a2a');if(mad){g.strokeStyle='#1a1a2a';g.lineWidth=s*0.06;g.beginPath();g.moveTo(x-s*0.45,y-s*0.2);g.lineTo(x-s*0.15,y-s*0.1);g.moveTo(x+s*0.45,y-s*0.2);g.lineTo(x+s*0.15,y-s*0.1);g.stroke();}}
function monster(k,x,y,s){var b=Math.sin(t*3)*s*0.03;y+=b;E(x,y+s*0.62,s*0.6,s*0.12,'rgba(0,0,0,.3)');
  if(k==='carrot'){g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(x-s*0.38,y-s*0.35);g.quadraticCurveTo(x,y-s*0.55,x+s*0.38,y-s*0.35);g.lineTo(x,y+s*0.6);g.closePath();g.fill();g.fillStyle='#4ab84a';for(var i=-1;i<=1;i++){g.beginPath();g.ellipse(x+i*s*0.14,y-s*0.6,s*0.07,s*0.22,i*0.4,0,7);g.fill();}g.fillStyle='#c8ccd8';g.fillRect(x+s*0.35,y-s*0.3,s*0.06,s*0.5);eyes(x,y-s*0.15,s*0.6,1);}
  else if(k==='jelly'){var sq=1+Math.sin(t*6)*0.06;g.fillStyle='rgba(255,120,170,.85)';g.beginPath();g.ellipse(x,y+s*0.1,s*0.55*sq,s*0.48/sq,0,0,7);g.fill();C(x-s*0.2,y-s*0.12,s*0.1,'rgba(255,255,255,.7)');eyes(x,y+s*0.05,s*0.6);g.fillStyle='#c83a6a';g.beginPath();g.arc(x,y+s*0.25,s*0.1,0,3.14);g.fill();}
  else if(k==='lantern'){g.strokeStyle='#5a3a2a';g.lineWidth=s*0.05;g.beginPath();g.moveTo(x,y-s*0.7);g.lineTo(x,y-s*0.5);g.stroke();rr(x-s*0.38,y-s*0.5,s*0.76,s*0.95,s*0.2);g.fillStyle='#e84a3a';g.fill();g.fillStyle='rgba(255,220,120,'+(0.6+Math.sin(t*8)*0.3)+')';rr(x-s*0.25,y-s*0.35,s*0.5,s*0.65,s*0.12);g.fill();eyes(x,y-s*0.05,s*0.55,1);g.fillStyle='#5a3a2a';g.fillRect(x-s*0.42,y-s*0.55,s*0.84,s*0.08);g.fillRect(x-s*0.42,y+s*0.42,s*0.84,s*0.08);}
  else if(k==='snowman'){C(x,y+s*0.25,s*0.42,'#f4f8ff');C(x,y-s*0.3,s*0.3,'#fff');eyes(x,y-s*0.35,s*0.45);g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(x,y-s*0.27);g.lineTo(x+s*0.22,y-s*0.22);g.lineTo(x,y-s*0.18);g.fill();g.fillStyle='#e84a4a';g.fillRect(x-s*0.32,y-s*0.08,s*0.64,s*0.1);g.fillStyle='#2a2a3a';g.fillRect(x-s*0.22,y-s*0.72,s*0.44,s*0.16);g.fillRect(x-s*0.3,y-s*0.58,s*0.6,s*0.05);}
  else if(k==='turtle'){E(x,y+s*0.15,s*0.6,s*0.42,'#7a8a6a');g.fillStyle='#5a6a4a';for(var a=0;a<5;a++){g.beginPath();g.arc(x-s*0.36+a*s*0.18,y,s*0.11,0,7);g.fill();}C(x+s*0.55,y+s*0.1,s*0.2,'#9ab87a');C(x+s*0.6,y+s*0.05,s*0.05,'#1a1a2a');E(x-s*0.35,y+s*0.52,s*0.14,s*0.08,'#9ab87a');E(x+s*0.35,y+s*0.52,s*0.14,s*0.08,'#9ab87a');}
  else if(k==='plum'){C(x,y+s*0.05,s*0.45,'#7a3a9a');C(x-s*0.15,y-s*0.1,s*0.1,'rgba(255,255,255,.4)');eyes(x,y,s*0.6,1);g.fillStyle='#3a1a5a';g.beginPath();g.moveTo(x-s*0.45,y-s*0.3);g.lineTo(x+s*0.45,y-s*0.3);g.lineTo(x+s*0.05,y-s*0.95);g.fill();C(x+s*0.05,y-s*0.95,s*0.06,'#ffd84a');g.strokeStyle='#8a5a2a';g.lineWidth=s*0.05;g.beginPath();g.moveTo(x+s*0.5,y-s*0.3);g.lineTo(x+s*0.55,y+s*0.5);g.stroke();C(x+s*0.5,y-s*0.34,s*0.08,'#7ae0ff');}
  else if(k==='teapot'){E(x,y+s*0.1,s*0.6,s*0.5,'#e8e0d8');g.fillStyle='#5a8ad8';g.fillRect(x-s*0.6,y+s*0.05,s*1.2,s*0.1);g.strokeStyle='#e8e0d8';g.lineWidth=s*0.12;g.beginPath();g.arc(x-s*0.65,y+s*0.05,s*0.2,1.6,4.7);g.stroke();g.fillStyle='#e8e0d8';g.beginPath();g.moveTo(x+s*0.5,y);g.lineTo(x+s*0.95,y-s*0.35);g.lineTo(x+s*0.9,y-s*0.25);g.lineTo(x+s*0.55,y+s*0.2);g.fill();E(x,y-s*0.42,s*0.3,s*0.1,'#c8c0b8');C(x,y-s*0.52,s*0.08,'#5a8ad8');eyes(x,y-s*0.1,s*0.7,1);for(var q=0;q<3;q++){var sy=y-s*0.5-((t*40+q*20)%60);g.fillStyle='rgba(255,255,255,'+(0.5-((t*40+q*20)%60)/120)+')';C(x+s*0.95+Math.sin(t*3+q)*6,sy,s*0.08,'rgba(255,255,255,.4)');}}
  else if(k==='cloud'){g.fillStyle='#5a6a8a';[[-0.35,0.05,0.35],[0,-0.15,0.42],[0.35,0.05,0.35],[0,0.2,0.4]].forEach(function(c){C(x+c[0]*s,y+c[1]*s,c[2]*s,'#6a7a9a');});eyes(x,y,s*0.7,1);if(Math.floor(t*3)%3===0){g.strokeStyle='#ffd84a';g.lineWidth=s*0.06;g.beginPath();g.moveTo(x-s*0.2,y+s*0.5);g.lineTo(x-s*0.05,y+s*0.75);g.lineTo(x-s*0.2,y+s*0.75);g.lineTo(x-s*0.02,y+s*1.0);g.stroke();}}}
function heroIcon(i,x,y,s){var h=HEROES[i];if(h.k==='sword'){g.save();g.translate(x,y);g.rotate(-0.7);g.fillStyle='#c8ccd8';g.fillRect(-s*0.08,-s*0.5,s*0.16,s*0.7);g.fillStyle='#ffd84a';g.fillRect(-s*0.25,s*0.15,s*0.5,s*0.1);g.fillStyle='#8a5a2a';g.fillRect(-s*0.06,s*0.25,s*0.12,s*0.25);g.restore();return;}
  C(x,y,s*0.42,h.col);
  if(h.k==='archer'){g.fillStyle='#6a3a1a';g.beginPath();g.arc(x,y-s*0.08,s*0.44,Math.PI,0);g.fill();C(x,y+s*0.08,s*0.28,'#f4d8b0');}
  else if(h.k==='mage'){C(x,y+s*0.05,s*0.28,'#f4d8b0');g.fillStyle='#2a6ab0';g.beginPath();g.moveTo(x-s*0.38,y-s*0.1);g.lineTo(x+s*0.38,y-s*0.1);g.lineTo(x,y-s*0.6);g.fill();C(x+s*0.4,y-s*0.35,s*0.12,'rgba(255,255,255,.7)');}
