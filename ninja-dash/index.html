<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ninja Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2a1a2a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,20,.6);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#fff;text-shadow:0 5px 0 #c8202a,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.72em;color:#ff4a5a;text-shadow:0 5px 0 #5a0a10}
.over p{margin:0;max-width:340px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ff5a5a,#c8202a);color:#fff;text-shadow:0 2px 0 #5a0a10;box-shadow:0 6px 0 #5a0a10;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5a0a10}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);text-shadow:0 2px 0 #9a5010;box-shadow:0 5px 0 #9a5010}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>NINJA<small>DASH</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(64px,20vw,110px)">0</h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'スワイプした方向へシュッとダッシュ斬り！（クリック・矢印キーでもOK）<br>一度にたくさん斬るとコンボ。<br>オニにさわられたり、手裏剣に当たるとハートが減るよ。',play:'あそぶ',again:'もういちど',best:'ベスト',newb:'ベスト更新！',cont:'▶ 広告を見てハート回復',na:'広告を読み込めませんでした',over:'やられた！',wave:'ウェーブ'}
 :{how:'Swipe to dash-slash in that direction! (click or arrow keys too)<br>Slice several at once for combos.<br>Touching an oni or getting hit by a shuriken costs a heart.',play:'PLAY',again:'AGAIN',best:'BEST',newb:'New best!',cont:'▶ Watch ad: refill hearts',na:'Ad not available',over:'DEFEATED!',wave:'WAVE'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('nd-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('nd-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,U;
var P,foes=[],stars=[],FX=[],trails=[],state='title',score=0,hearts=3,t=0,wave=1,spawnT=0,toSpawn=0,used=false,games=0,shake=0,inv=0,waveMsg=0,slow=0;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;U=Math.min(W/390,H/760);}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function reset(){P={x:W/2,y:H*0.55,dash:null,cd:0,face:1};foes=[];stars=[];FX=[];trails=[];score=0;hearts=3;wave=1;startWave();used=false;inv=0;state='play';}
function startWave(){toSpawn=4+wave*2;spawnT=0.6;waveMsg=1.4;}
function spawn(){var side=Math.floor(Math.random()*4),m=30*U,x,y;if(side===0){x=Math.random()*W;y=-m;}else if(side===1){x=W+m;y=Math.random()*H;}else if(side===2){x=Math.random()*W;y=H+m;}else{x=-m;y=Math.random()*H;}
  var r=Math.random(),type=wave>=2&&r<0.25?'thrower':wave>=4&&r<0.4?'big':'oni';foes.push({x:x,y:y,type:type,hp:type==='big'?2:1,r:(type==='big'?30:20)*U,sp:(type==='big'?45:type==='thrower'?40:60+wave*5)*U,cool:1.5+Math.random()*1.5,hit:0,ph:Math.random()*6});}
function dash(dx,dy){if(state!=='play'||P.dash||P.cd>0)return;var l=Math.hypot(dx,dy);if(l<1)return;var L=Math.min(W,H)*0.42,ex=P.x+dx/l*L,ey=P.y+dy/l*L;ex=Math.max(20*U,Math.min(W-20*U,ex));ey=Math.max(60*U,Math.min(H-20*U,ey));P.dash={sx:P.x,sy:P.y,ex:ex,ey:ey,k:0,kills:0};P.face=dx>=0?1:-1;tone(900,0.08,'sawtooth',0.03,0.4);}
function segD(px,py,ax,ay,bx,by){var vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy||1,k=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/l));return Math.hypot(px-ax-k*vx,py-ay-k*vy);}
function hurt(){if(inv>0||P.dash)return;hearts--;inv=1.2;shake=0.3;tone(150,0.25,'square',0.07,0.6);if(hearts<=0)over();}
function over(){if(state!=='play')return;state='dead';games++;var nb=score>best;if(nb){best=score;store.set('best',best);}
  setTimeout(function(){var show=function(){$('endT').textContent=score;$('endP').innerHTML=TX.over+'<br>'+TX.wave+' '+wave+' · '+(nb?TX.newb:TX.best+' '+best);$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},800);}
$('play').onclick=function(){$('title').hidden=true;reset();};
$('again').onclick=function(){$('end').hidden=true;reset();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;hearts=3;inv=2;foes=foes.filter(function(f){return Math.hypot(f.x-P.x,f.y-P.y)>150*U;});stars=[];$('end').hidden=true;state='play';},function(){b.textContent=TX.na;});};
var sx=null,sy=null,st=0;
cv.addEventListener('pointerdown',function(e){e.preventDefault();sx=e.clientX;sy=e.clientY;st=performance.now();});
addEventListener('pointermove',function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>40*U){dash(dx,dy);sx=null;}});
addEventListener('pointerup',function(e){if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.hypot(dx,dy)<12&&P)dash(e.clientX-P.x,e.clientY-P.y);else dash(dx,dy);});
addEventListener('keydown',function(e){var m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(m){e.preventDefault();dash(m[0],m[1]);}});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- draw ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function drawOni(f){var s=f.r,x=f.x,y=f.y+Math.sin(t*8+f.ph)*2*U,col=f.type==='big'?'#7a3ac8':f.type==='thrower'?'#3a8ac8':'#e83a3a';if(f.hit>0)col='#fff';
  C(x+3*U,y+s*0.9,s*0.7,'rgba(0,0,0,.25)');g.fillStyle='#f4e8c8';g.beginPath();g.moveTo(x-s*0.55,y-s*0.6);g.lineTo(x-s*0.4,y-s*1.15);g.lineTo(x-s*0.2,y-s*0.7);g.fill();g.beginPath();g.moveTo(x+s*0.55,y-s*0.6);g.lineTo(x+s*0.4,y-s*1.15);g.lineTo(x+s*0.2,y-s*0.7);g.fill();
  C(x,y,s,col);g.fillStyle='#2a1a1a';g.beginPath();g.arc(x,y-s*0.4,s*0.75,Math.PI*1.1,Math.PI*1.9);g.fill();
  g.fillStyle='#fff';g.beginPath();g.ellipse(x-s*0.35,y-s*0.1,s*0.22,s*0.16,0.3,0,7);g.ellipse(x+s*0.35,y-s*0.1,s*0.22,s*0.16,-0.3,0,7);g.fill();C(x-s*0.3,y-s*0.08,s*0.09,'#1a1a1a');C(x+s*0.3,y-s*0.08,s*0.09,'#1a1a1a');
  g.fillStyle='#fff';g.fillRect(x-s*0.35,y+s*0.35,s*0.14,s*0.18);g.fillRect(x+s*0.21,y+s*0.35,s*0.14,s*0.18);g.strokeStyle='#2a1a1a';g.lineWidth=2*U;g.beginPath();g.moveTo(x-s*0.45,y+s*0.35);g.lineTo(x+s*0.45,y+s*0.35);g.stroke();
  if(f.type==='big'&&f.hp>1){g.strokeStyle='#ffd84a';g.lineWidth=3*U;g.beginPath();g.arc(x,y,s*1.15,0,7);g.stroke();}}
function drawNinja(){var x=P.x,y=P.y,s=22*U,fl=P.face;var blink=inv>0&&Math.floor(t*20)%2;if(blink)return;
  // scarf
  var sw=Math.sin(t*12)*5*U;g.strokeStyle='#ff3a4a';g.lineWidth=6*U;g.lineCap='round';g.beginPath();g.moveTo(x-fl*s*0.5,y-s*0.2);g.quadraticCurveTo(x-fl*s*1.3,y-s*0.4+sw,x-fl*s*1.9,y-s*0.1-sw);g.stroke();
  C(x+3*U,y+s*0.9,s*0.7,'rgba(0,0,0,.25)');C(x,y,s,'#2a2a3a');g.fillStyle='#f4d8b8';g.beginPath();g.ellipse(x+fl*s*0.15,y-s*0.15,s*0.7,s*0.28,0,0,7);g.fill();
  g.fillStyle='#1a1a1a';g.beginPath();g.ellipse(x+fl*s*0.0,y-s*0.15,s*0.12,s*0.06,0,0,7);g.ellipse(x+fl*s*0.4,y-s*0.15,s*0.12,s*0.06,0,0,7);g.fill();
  g.fillStyle='#ff3a4a';g.fillRect(x-s*0.95,y-s*0.5,s*1.9,s*0.14);
  g.save();g.translate(x+fl*s*0.8,y+s*0.2);g.rotate(fl*(P.dash?1.4:0.6));g.fillStyle='#d8dce8';g.fillRect(-2*U,-s*1.1,4*U,s*1.1);g.fillStyle='#5a3a2a';g.fillRect(-3*U,0,6*U,s*0.35);g.restore();}
function draw(){var sh=shake>0?(Math.random()-0.5)*shake*30:0;g.setTransform(DPR,0,0,DPR,sh*DPR,sh*0.5*DPR);
  var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#3a2a3a');gr.addColorStop(1,'#1a1020');g.fillStyle=gr;g.fillRect(-20,-20,W+40,H+40);
  // dojo floor planks
  g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=2;for(var x=0;x<W;x+=60*U){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  g.fillStyle='rgba(255,200,120,.08)';g.beginPath();g.arc(W*0.8,H*0.15,70*U,0,7);g.fill();
  g.fillStyle='rgba(255,150,180,.25)';for(var p=0;p<16;p++){var px=((p*97+t*20)%(W+40))-20,py=((p*61+t*35)%(H+40))-20;g.beginPath();g.ellipse(px,py,4*U,2.5*U,t+p,0,7);g.fill();}
  if(!P)return;
  trails.forEach(function(tr){g.globalAlpha=Math.max(0,tr.l*2.5);g.strokeStyle='#fff';g.lineWidth=10*U*tr.l*2;g.lineCap='round';g.beginPath();g.moveTo(tr.sx,tr.sy);g.lineTo(tr.ex,tr.ey);g.stroke();g.strokeStyle='#ff4a5a';g.lineWidth=3*U;g.stroke();});g.globalAlpha=1;
  foes.forEach(drawOni);
  stars.forEach(function(s){g.save();g.translate(s.x,s.y);g.rotate(t*15);g.fillStyle='#c8ccd8';for(var k=0;k<4;k++){g.rotate(Math.PI/2);g.beginPath();g.moveTo(0,0);g.lineTo(3*U,-3*U);g.lineTo(0,-11*U);g.lineTo(-3*U,-3*U);g.fill();}C(0,0,2.5*U,'#555');g.restore();});
  drawNinja();
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*2);if(f.txt){g.font='900 '+Math.round(26*U)+'px Rubik,sans-serif';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#5a0a10';g.strokeText(f.txt,f.x,f.y);g.fillStyle='#ffd84a';g.fillText(f.txt,f.x,f.y);}else{g.fillStyle=f.c;g.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s);}});g.globalAlpha=1;
  g.setTransform(DPR,0,0,DPR,0,0);
  if(state!=='title'){g.textAlign='left';g.font='900 '+Math.round(Math.min(44,W*0.11))+'px Rubik,sans-serif';g.fillStyle='#fff';g.fillText(score,16,Math.max(50,H*0.07));for(var i=0;i<3;i++){var hx=W-26-i*30,hy=Math.max(36,H*0.05);g.fillStyle=i<hearts?'#ff4a5a':'rgba(255,255,255,.2)';g.beginPath();g.moveTo(hx,hy+10);g.bezierCurveTo(hx-16,hy-2,hx-8,hy-14,hx,hy-5);g.bezierCurveTo(hx+8,hy-14,hx+16,hy-2,hx,hy+10);g.fill();}
    g.font='800 14px Rubik,sans-serif';g.fillStyle='rgba(255,255,255,.75)';g.fillText(TX.wave+' '+wave+'   '+TX.best+' '+best,18,Math.max(50,H*0.07)+22);
    if(waveMsg>0){g.globalAlpha=Math.min(1,waveMsg*1.5);g.textAlign='center';g.font='900 italic '+Math.round(Math.min(64,W*0.15))+'px Rubik,sans-serif';g.lineWidth=8;g.strokeStyle='#5a0a10';g.strokeText(TX.wave+' '+wave,W/2,H*0.4);g.fillStyle='#fff';g.fillText(TX.wave+' '+wave,W/2,H*0.4);g.globalAlpha=1;}}}
function tick(rdt){t+=rdt;var dt=slow>0?rdt*0.35:rdt;slow=Math.max(0,slow-rdt);shake=Math.max(0,shake-rdt);inv=Math.max(0,inv-dt);waveMsg=Math.max(0,waveMsg-rdt);
  FX.forEach(function(f){f.l-=rdt;f.x+=(f.vx||0)*rdt;f.y+=(f.vy||0)*rdt;});FX=FX.filter(function(f){return f.l>0;});trails.forEach(function(tr){tr.l-=rdt;});trails=trails.filter(function(tr){return tr.l>0;});
  if(state!=='play'||!P)return;P.cd=Math.max(0,P.cd-dt);
  if(P.dash){var d=P.dash,px=P.x,py=P.y;d.k=Math.min(1,d.k+dt/0.11);P.x=d.sx+(d.ex-d.sx)*d.k;P.y=d.sy+(d.ey-d.sy)*d.k;
    foes.forEach(function(f){if(f.dead)return;if(segD(f.x,f.y,px,py,P.x,P.y)<f.r+16*U){f.hp--;f.hit=0.15;if(f.hp<=0){f.dead=true;d.kills++;for(var k=0;k<12;k++){var a=Math.random()*6.283;FX.push({x:f.x,y:f.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,l:0.45,c:k%2?'#fff':(f.type==='big'?'#7a3ac8':f.type==='thrower'?'#3a8ac8':'#e83a3a'),s:6*U});}tone(500+d.kills*120,0.06,'square',0.05,1.6);}}});
    stars=stars.filter(function(s){return segD(s.x,s.y,px,py,P.x,P.y)>18*U;});
    if(d.k>=1){if(d.kills>0){var gain=d.kills*d.kills;score+=gain;FX.push({x:P.x,y:P.y-40*U,vy:-60,l:0.8,txt:(d.kills>1?d.kills+' COMBO! ':'')+'+'+gain});if(d.kills>=3){slow=0.4;shake=0.2;}}trails.push({sx:d.sx,sy:d.sy,ex:d.ex,ey:d.ey,l:0.35});P.dash=null;P.cd=0.12;}}
  foes=foes.filter(function(f){return !f.dead;});
  if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawn();toSpawn--;spawnT=Math.max(0.35,1.2-wave*0.08);}}else if(!foes.length){wave++;startWave();tone(660,0.1,'square',0.05,1.5);}
  foes.forEach(function(f){f.hit=Math.max(0,f.hit-dt);var dx=P.x-f.x,dy=P.y-f.y,l=Math.hypot(dx,dy)||1;var want=f.type==='thrower'&&l<220*U?-0.3:1;f.x+=dx/l*f.sp*dt*want;f.y+=dy/l*f.sp*dt*want;
    if(f.type==='thrower'){f.cool-=dt;if(f.cool<=0&&f.x>0&&f.x<W&&f.y>0&&f.y<H){f.cool=2.2;stars.push({x:f.x,y:f.y,vx:dx/l*200*U,vy:dy/l*200*U});tone(1200,0.03,'square',0.02,0.8);}}
    if(l<f.r+16*U)hurt();});
  stars.forEach(function(s){s.x+=s.vx*dt;s.y+=s.vy*dt;if(Math.hypot(s.x-P.x,s.y-P.y)<16*U){s.dead=true;hurt();}});stars=stars.filter(function(s){return !s.dead&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30;});}
var last=performance.now();function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;tick(dt);draw();cgSync();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
</script>
</body>
</html>
