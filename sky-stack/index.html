<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sky Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2a3a6a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,30,.35);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(50px,15vw,84px);line-height:.92;font-weight:900;font-style:italic;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.35)}
.over h1 small{display:block;font-size:.6em}
.over p{margin:0;max-width:340px;line-height:1.6;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:14px 40px;background:rgba(255,255,255,.18);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;min-width:220px;backdrop-filter:blur(4px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>SKY<small>STACK</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(64px,20vw,110px)">0</h1><p id="endP"></p><button class="btn" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'画面をタップしてブロックを落とそう。<br>はみ出した部分は切り落とされる。<br>ぴったり重ねるとコンボ！どこまで高く積める？',play:'あそぶ',again:'もういちど',best:'ベスト',newb:'ベスト更新！',cont:'▶ 広告を見て続きから'}
 :{how:'Tap to drop the block.<br>Whatever hangs over gets sliced off.<br>Perfect drops build combos. How high can you go?',play:'PLAY',again:'AGAIN',best:'BEST',newb:'New best!',cont:'▶ Watch ad: continue'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('ss-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('ss-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,U;
var BASE=100,BH=20,stack=[],cur=null,falls=[],FX=[],TXT=[],state='title',t=0,camY=0,combo=0,used=false,hue0=0,lastGame=0,games=0;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;U=Math.min(W,H*0.75)/260;}
addEventListener('resize',fit);
var C30=Math.cos(Math.PI/6),S30=0.5;
function iso(x,y,z){return {x:W/2+(x-z)*C30*U,y:H*0.62+(x+z)*S30*U-(y-camY)*U};}
function col(level,l){var h=(hue0+level*4)%360;return 'hsl('+h+',62%,'+l+'%)';}
function box(b,alpha){var x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2,y0=b.y,y1=b.y+BH;g.globalAlpha=alpha==null?1:alpha;
  var A=iso(x0,y1,z0),B=iso(x1,y1,z0),C=iso(x1,y1,z1),D=iso(x0,y1,z1),E=iso(x1,y0,z0),F=iso(x1,y0,z1),G=iso(x0,y0,z1);
  g.fillStyle=col(b.lv,62);g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.lineTo(C.x,C.y);g.lineTo(D.x,D.y);g.closePath();g.fill();
  g.fillStyle=col(b.lv,48);g.beginPath();g.moveTo(B.x,B.y);g.lineTo(C.x,C.y);g.lineTo(F.x,F.y);g.lineTo(E.x,E.y);g.closePath();g.fill();
  g.fillStyle=col(b.lv,38);g.beginPath();g.moveTo(D.x,D.y);g.lineTo(C.x,C.y);g.lineTo(F.x,F.y);g.lineTo(G.x,G.y);g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.lineTo(C.x,C.y);g.lineTo(D.x,D.y);g.closePath();g.stroke();g.globalAlpha=1;}
// ---- audio ----
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.2),s+d);v.gain.setValueAtTime(vol||0.08,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
var NOTES=[523,587,659,698,784,880,988,1047];
// ---- game ----
function reset(){hue0=Math.floor(Math.random()*360);stack=[{x:0,z:0,w:BASE,d:BASE,y:-BH*6,lv:0,tall:6}];for(var i=0;i<0;i++);stack[0].y=0;stack[0].lv=0;camY=0;combo=0;falls=[];FX=[];TXT=[];used=false;spawn();state='play';}
function topb(){return stack[stack.length-1];}
function spawn(){var p=topb(),lv=stack.length,ax=lv%2?'x':'z',r=BASE*1.25,sp=Math.min(260,90+lv*3);cur={x:ax==='x'?-r:p.x,z:ax==='z'?-r:p.z,w:p.w,d:p.d,y:p.y+BH,lv:lv,ax:ax,dir:1,sp:sp,r:r,base:ax==='x'?p.x:p.z};}
function drop(){if(state!=='play'||!cur)return;var p=topb(),ax=cur.ax,sz=ax==='x'?'w':'d',delta=cur[ax]-p[ax],ov=p[sz]-Math.abs(delta);
  if(ov<=0){falls.push({b:cur,vy:0,rot:0});cur=null;tone(140,0.5,'sawtooth',0.08,0.5);gameOver();return;}
  if(Math.abs(delta)<3.5){cur[ax]=p[ax];combo++;var n=NOTES[Math.min(NOTES.length-1,combo-1)]*(combo>8?Math.pow(2,(combo-8)/12):1);tone(n,0.25,'triangle',0.1,1.01);
    FX.push({ring:1,b:{x:cur.x,z:cur.z,w:cur.w,d:cur.d,y:cur.y},l:0.5});if(combo>=3&&cur[sz]<BASE){cur[sz]=Math.min(BASE,cur[sz]+6);}
    TXT.push({t:combo>1?(JA?'ぴったり ×':'PERFECT x')+combo:(JA?'ぴったり！':'PERFECT!'),l:0.9,c:'#fff'});}
  else{combo=0;var keep={x:cur.x,z:cur.z,w:cur.w,d:cur.d,y:cur.y,lv:cur.lv},cut={x:cur.x,z:cur.z,w:cur.w,d:cur.d,y:cur.y,lv:cur.lv};keep[sz]=ov;keep[ax]=p[ax]+delta/2;cut[sz]=Math.abs(delta);cut[ax]=delta>0?p[ax]+p[sz]/2+cut[sz]/2:p[ax]-p[sz]/2-cut[sz]/2;
    cur.w=keep.w;cur.d=keep.d;cur.x=keep.x;cur.z=keep.z;falls.push({b:cut,vy:0,rot:0,dir:delta>0?1:-1,ax:ax});tone(300+Math.random()*40,0.12,'square',0.05,0.6);}
  stack.push({x:cur.x,z:cur.z,w:cur.w,d:cur.d,y:cur.y,lv:cur.lv,pop:1});cur=null;spawn();}
function gameOver(){state='dead';var score=stack.length-1,nb=score>best;if(nb){best=score;store.set('best',best);}games++;
  setTimeout(function(){var show=function(){$('endT').textContent=score;$('endP').innerHTML=nb?TX.newb:TX.best+' '+best;$('cont').hidden=!(CG&&!used&&score>=10);$('cont').disabled=false;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},900);}
$('play').onclick=function(){$('title').hidden=true;reset();};
$('again').onclick=function(){$('end').hidden=true;reset();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;$('end').hidden=true;state='play';spawn();},function(){b.textContent=JA?'広告を読み込めませんでした':'Ad not available';});};
cv.addEventListener('pointerdown',function(e){e.preventDefault();drop();});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state==='play')drop();}});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- loop ----
var CLOUD=[];for(var ci=0;ci<9;ci++)CLOUD.push({x:Math.random(),y:Math.random()*3,s:0.6+Math.random()*0.9,v:0.004+Math.random()*0.01});
function draw(){g.setTransform(DPR,0,0,DPR,0,0);var lv=stack.length;
  var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'hsl('+((hue0+lv*4+180)%360)+',45%,'+Math.max(12,40-lv*0.25)+'%)');gr.addColorStop(1,'hsl('+((hue0+lv*4+150)%360)+',55%,'+Math.max(22,62-lv*0.2)+'%)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // stars appear high up
  if(lv>40){g.globalAlpha=Math.min(0.8,(lv-40)/40);g.fillStyle='#fff';for(var si=0;si<60;si++){var sx=(si*97%100)/100*W,sy=(si*53%100)/100*H*0.7;g.fillRect(sx,sy,1.5,1.5);}g.globalAlpha=1;}
  CLOUD.forEach(function(c){c.x+=c.v/60;if(c.x>1.3)c.x=-0.3;var cy=((c.y*H+camY*U*0.3)%(H*1.4))-H*0.2;g.globalAlpha=0.35;g.fillStyle='#fff';var r=40*c.s*U/1.4;g.beginPath();g.ellipse(c.x*W,cy,r*1.8,r*0.6,0,0,7);g.ellipse(c.x*W+r*0.8,cy-r*0.3,r,r*0.55,0,0,7);g.fill();g.globalAlpha=1;});
  // stack (only near the top)
  for(var i=Math.max(0,stack.length-24);i<stack.length;i++){var b=stack[i];if(i===0){for(var k=6;k>=0;k--)box({x:b.x,z:b.z,w:b.w,d:b.d,y:b.y-k*BH,lv:0});}else{var s=b.pop||0;if(s){b.pop=Math.max(0,s-0.08);}box(b);}}
  FX.forEach(function(f){var k=f.l/0.5,b=f.b,gw=(1-k)*16;var A=iso(b.x-b.w/2-gw,b.y+BH,b.z-b.d/2-gw),B=iso(b.x+b.w/2+gw,b.y+BH,b.z-b.d/2-gw),C=iso(b.x+b.w/2+gw,b.y+BH,b.z+b.d/2+gw),D=iso(b.x-b.w/2-gw,b.y+BH,b.z+b.d/2+gw);g.strokeStyle='rgba(255,255,255,'+k+')';g.lineWidth=3;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.lineTo(C.x,C.y);g.lineTo(D.x,D.y);g.closePath();g.stroke();});
  if(cur)box(cur);
  falls.forEach(function(f){box(f.b,Math.max(0,1-f.t/1.4||1));});
  if(state==='play'||state==='dead'){g.textAlign='center';g.font='900 '+Math.round(Math.min(80,W*0.16))+'px Rubik,sans-serif';g.fillStyle='rgba(255,255,255,.92)';g.fillText(String(stack.length-1),W/2,Math.max(90,H*0.14));}
  TXT.forEach(function(o){var k=Math.min(1,o.l*2);g.globalAlpha=k;g.font='900 '+Math.round(Math.min(30,W*0.07))+'px Rubik,sans-serif';g.textAlign='center';g.fillStyle=o.c;g.fillText(o.t,W/2,Math.max(130,H*0.14+40)-(0.9-o.l)*30);g.globalAlpha=1;});}
function tick(dt){t+=dt;if(cur&&state==='play'){cur[cur.ax]+=cur.dir*cur.sp*dt;if(cur[cur.ax]>cur.base+cur.r){cur[cur.ax]=cur.base+cur.r;cur.dir=-1;}if(cur[cur.ax]<cur.base-cur.r){cur[cur.ax]=cur.base-cur.r;cur.dir=1;}}
  var ty=topb()?topb().y-60:0;camY+=(ty-camY)*Math.min(1,dt*4);
  falls.forEach(function(f){f.t=(f.t||0)+dt;f.vy+=600*dt;f.b.y-=f.vy*dt;if(f.ax)f.b[f.ax]+=f.dir*20*dt;});falls=falls.filter(function(f){return f.t<1.4;});
  FX.forEach(function(f){f.l-=dt;});FX=FX.filter(function(f){return f.l>0;});TXT.forEach(function(o){o.l-=dt;});TXT=TXT.filter(function(o){return o.l>0;});}
var last=performance.now();function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;tick(dt);draw();cgSync();requestAnimationFrame(frame);}
fit();reset();state='title';cur=null;requestAnimationFrame(frame);
</script>
</body>
</html>
