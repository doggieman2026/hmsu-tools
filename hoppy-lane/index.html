<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#7ad06a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,40,20,.42);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(50px,15vw,84px);line-height:.92;font-weight:900;font-style:italic;color:#fff;text-shadow:0 5px 0 #2a6a2a,0 8px 18px rgba(0,0,0,.35)}
.over h1 small{display:block;font-size:.62em;color:#ffe14a;text-shadow:0 5px 0 #a86a10,0 8px 18px rgba(0,0,0,.35)}
.over h2{margin:0;font-size:30px;font-weight:900;font-style:italic;text-shadow:0 3px 0 #2a6a2a}
.over p{margin:0;max-width:360px;line-height:1.6;font-size:15px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ffd04a,#ff9a2a);color:#fff;text-shadow:0 2px 0 #a8500a;box-shadow:0 6px 0 #a8500a;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8500a}
.btn.sub{font-size:17px;padding:10px 24px;background:linear-gradient(#5ac8ff,#2a86e0);text-shadow:0 2px 0 #1a4a8a;box-shadow:0 5px 0 #1a4a8a}
.btn:disabled{opacity:.6}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:20px;background:rgba(0,0,0,.3);padding:5px 14px;border-radius:999px}
.coins i{width:16px;height:16px;background:#ffd23a;border:2px solid #c88a10;border-radius:3px;display:inline-block}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;width:100%}
.ch{font:inherit;border:3px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.16);color:#fff;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.ch canvas{width:72px;height:72px}
.ch b{font-size:14px}.ch span{font-size:12px;font-weight:700;opacity:.9}
.ch.sel{border-color:#ffe14a;background:rgba(255,225,74,.25)}
.ch.lock canvas{filter:brightness(.25)}
.ch.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>HOPPY<small>LANE</small></h1><span class="coins"><i></i><b class="cn">0</b></span><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button><button class="btn sub" id="chars" type="button"></button></div>
<div class="over" id="shop" hidden><h2 id="shopT"></h2><span class="coins"><i></i><b class="cn">0</b></span><div id="grid"></div><button class="btn" id="shopOk" type="button">OK</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(64px,20vw,110px)">0</h1><p id="endP"></p><button class="btn" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button><button class="btn sub" id="chars2" type="button"></button></div>
<script>

 :{how:'Tap to hop forward! Swipe (or arrow keys) to go sideways or back.<br>Dodge cars and trains, cross rivers on logs and lily pads.<br>Collect coins to unlock new characters!',play:'PLAY',again:'AGAIN',best:'BEST',newb:'New best!',cont:'▶ Watch ad: continue',car:'SPLAT!',train:'HIT BY A TRAIN!',water:'SPLASH!',eagle:'THE EAGLE GOT YOU!',chars:'CHARACTERS',got:'Coins',sel:'Select',use:'In use',na:'Ad not available'};

var store={get:function(k,f){try{var v=localStorage.getItem('hl-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('hl-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0),coins=store.get('coins',0),owned=store.get('own',['chick']),sel=store.get('sel','chick');
var COLS=9,HALF=4,VH=6,cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,C;

function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;C=Math.min(W/COLS,H/11);VH=Math.ceil(W/C/2)+1;}
addEventListener('resize',fit);
function showCoins(){[].forEach.call(document.querySelectorAll('.cn'),function(e){e.textContent=coins;});}
// ---- audio ----
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
// ---- characters ----
var CH=[{id:'chick',ja:'ひよこ',en:'Chick',cost:0,b:'#ffffff',f:'#e2e2ea'},{id:'frog',ja:'カエル',en:'Frog',cost:40,b:'#6ad05a',f:'#3f9f40'},{id:'pig',ja:'ブタ',en:'Pig',cost:80,b:'#ffb8cc',f:'#ec8eaa'},
 {id:'panda',ja:'パンダ',en:'Panda',cost:120,b:'#ffffff',f:'#dcdce4'},{id:'cat',ja:'ネコ',en:'Cat',cost:160,b:'#ffaa50',f:'#e47e22'},{id:'robot',ja:'ロボ',en:'Robot',cost:250,b:'#b4c0d0',f:'#7f8b9e'}];
var CHM={};CH.forEach(function(c){CHM[c.id]=c;});if(!CHM[sel])sel='chick';
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function tri(a,b,c2,d,e,f,col){g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c2,d);g.lineTo(e,f);g.closePath();g.fill();}
function drawChar(id,x,y,s,dir,sq){var c=CHM[id]||CH[0],bw=s*0.7,bx=x+s*0.15,gy=y+s*0.8,h=s*0.5*sq,d=s*0.26,ty=gy-h-d,fy=gy-h;
  R(bx,fy,bw,h,c.f);R(bx,ty,bw,d,c.b);
  var ox=dir===1?bw*0.12:dir===3?-bw*0.12:0,e=s*0.08,ey=fy+h*0.16,ex1=bx+bw*0.2+ox,ex2=bx+bw*0.8-e+ox;
  function eyes(col){R(ex1,ey,e,e,col);R(ex2,ey,e,e,col);}
  switch(c.id){
  case 'chick':R(bx+bw*0.36,ty-s*0.1,bw*0.28,s*0.12,'#ff4d5e');eyes('#222');R(bx+bw*0.36+ox*1.4,fy+h*0.42,bw*0.28,s*0.1,'#ffa02a');break;
  case 'frog':R(bx,ty-s*0.13,bw*0.34,s*0.17,'#fff');R(bx+bw*0.66,ty-s*0.13,bw*0.34,s*0.17,'#fff');R(bx+bw*0.12+ox*0.5,ty-s*0.09,s*0.08,s*0.08,'#222');R(bx+bw*0.78+ox*0.5,ty-s*0.09,s*0.08,s*0.08,'#222');R(bx+bw*0.18+ox,fy+h*0.4,bw*0.64,s*0.05,'#c83a4a');R(bx+bw*0.1,fy+h*0.2,bw*0.1,s*0.06,'#ff8fa0');R(bx+bw*0.8,fy+h*0.2,bw*0.1,s*0.06,'#ff8fa0');break;
  case 'pig':R(bx,ty-s*0.08,bw*0.24,s*0.11,'#ec8eaa');R(bx+bw*0.76,ty-s*0.08,bw*0.24,s*0.11,'#ec8eaa');eyes('#222');R(bx+bw*0.3+ox*1.3,fy+h*0.38,bw*0.4,s*0.16,'#ff92b4');R(bx+bw*0.38+ox*1.3,fy+h*0.46,s*0.05,s*0.06,'#a04060');R(bx+bw*0.56+ox*1.3,fy+h*0.46,s*0.05,s*0.06,'#a04060');break;
  case 'panda':R(bx-s*0.02,ty-s*0.09,bw*0.26,s*0.13,'#222');R(bx+bw*0.78,ty-s*0.09,bw*0.26,s*0.13,'#222');R(ex1-s*0.04,ey-s*0.03,s*0.16,s*0.15,'#222');R(ex2-s*0.04,ey-s*0.03,s*0.16,s*0.15,'#222');R(ex1+s*0.02,ey+s*0.01,s*0.05,s*0.05,'#fff');R(ex2+s*0.02,ey+s*0.01,s*0.05,s*0.05,'#fff');R(bx+bw*0.44+ox,fy+h*0.5,s*0.08,s*0.06,'#222');R(bx,fy+h*0.75,bw,h*0.25,'#333');break;
  case 'cat':tri(bx,ty+1,bx+bw*0.3,ty+1,bx+bw*0.08,ty-s*0.16,c.f);tri(bx+bw,ty+1,bx+bw*0.7,ty+1,bx+bw*0.92,ty-s*0.16,c.f);R(bx+bw*0.3,ty,s*0.06,d,'#e47e22');R(bx+bw*0.6,ty,s*0.06,d,'#e47e22');eyes('#2a7a3a');R(bx+bw*0.45+ox,fy+h*0.4,s*0.07,s*0.05,'#ff7a9a');R(bx+bw*0.05,fy+h*0.48,bw*0.18,s*0.025,'#fff');R(bx+bw*0.77,fy+h*0.48,bw*0.18,s*0.025,'#fff');break;
  case 'robot':R(bx+bw*0.48,ty-s*0.22,s*0.04,s*0.22,'#555');R(bx+bw*0.43,ty-s*0.29,s*0.12,s*0.1,(Math.floor(t*3)%2)?'#ff4d5e':'#ff9aa8');R(bx+bw*0.1+ox,ey-s*0.03,bw*0.8,s*0.15,'#222');R(ex1,ey,e,e*0.8,'#4af0ff');R(ex2,ey,e,e*0.8,'#4af0ff');R(bx+bw*0.25,fy+h*0.55,bw*0.5,s*0.05,'#556');break;}}
// ---- lanes ----
var CARC=['#ff4d5e','#3a8cff','#ffd23a','#b05cff','#ff8a2a','#f2f2f2','#2ac4a0'];
function span(){return 2*VH+6;}
function makeRow(r){if(rows[r])return rows[r];var row,prev=rows[r-1];
  if(r<3){row={type:'grass',trees:r<0?allTrees():edgeTrees()};}
  else{var roll=Math.random(),diff=Math.min(1,r/150),type;
    if(roll<0.3)type='grass';else if(roll<0.68)type='road';else if(roll<0.9||r<12)type='water';else type='rail';
    if(prev&&prev.type===type&&((type==='water'&&prev.run>=3)||(type==='road'&&prev.run>=4)||type==='rail'))type='grass';
    row={type:type,run:(prev&&prev.type===type?prev.run+1:1)};
    if(type==='grass'){row.trees=randTrees();if(prev&&prev.pads)prev.objs.forEach(function(o){delete row.trees[o.x];});if(Math.random()<0.28)row.coin=freeCol(row.trees);}
    if(type==='road'){var dir=Math.random()<0.5?1:-1,sp=(1.5+Math.random()*1.6+diff*2.4)*dir,w=Math.random()<0.22?2.1:1.2,n=Math.max(1,Math.round(2+Math.random()*1.5-(w>1.5?1:0))),gp=span()/n;row.speed=sp;row.objs=[];for(var i=0;i<n;i++)row.objs.push({x:-VH-3+i*gp+Math.random()*gp*0.4,w:w,col:CARC[Math.floor(Math.random()*CARC.length)]});if(Math.random()<0.15)row.coin=Math.floor(Math.random()*COLS)-HALF;}
    if(type==='water'){if(!(prev&&prev.pads)&&Math.random()<0.3){row.pads=true;row.speed=0;row.objs=[];var cs=[],m=3+Math.floor(Math.random()*3);while(cs.length<m){var c=Math.floor(Math.random()*COLS)-HALF;if(cs.indexOf(c)<0&&!(prev&&prev.trees&&prev.trees[c]&&cs.length<1))cs.push(c);}cs.forEach(function(c){row.objs.push({x:c,w:1,pad:true});});}
      else{var d2=prev&&prev.type==='water'&&prev.speed?-Math.sign(prev.speed):(Math.random()<0.5?1:-1),sp2=(0.9+Math.random()*1.1+diff*0.9)*d2,n2=Math.max(3,Math.round(span()/5))+Math.floor(Math.random()*2),gp2=span()/n2;row.speed=sp2;row.objs=[];for(var j=0;j<n2;j++)row.objs.push({x:-VH-3+j*gp2,w:2+Math.floor(Math.random()*2)});}}
    if(type==='rail'){row.dir=Math.random()<0.5?1:-1;row.tr={on:false,x:0,w:8};row.tt=1.5+Math.random()*4;}}
  rows[r]=row;return row;}
function allTrees(){var a={};for(var c=-HALF;c<=HALF;c++)a[c]=1;return a;}
function edgeTrees(){var a={};a[-HALF]=1;a[HALF]=1;return a;}
function randTrees(){var a={},n=Math.floor(Math.random()*4);for(var i=0;i<n;i++){var c=-HALF+Math.floor(Math.random()*COLS);if(c!==0||Math.random()<0.4)a[c]=1;}return a;}
function freeCol(tr){for(var k=0;k<20;k++){var c=Math.floor(Math.random()*COLS)-HALF;if(!tr[c])return c;}return undefined;}
// ---- game ----
function reset(){rows={};for(var r=-8;r<30;r++)makeRow(r);pl={c:0,r:0,x:0,y:0,fx:0,fy:0,hop:0,dir:0,dead:false,land:0};camRow=0;score=0;FX=[];used=false;eagleT=0;runCoins=0;queued=null;shake=0;state='play';}
function hop(dc,dr){if(state!=='play'||pl.dead)return;if(pl.hop>0){queued=[dc,dr];return;}var nc=pl.c+dc,nr=pl.r+dr;pl.dir=dc?(dc>0?1:3):(dr>0?0:2);if(dc&&(Math.round(nc)<-HALF||Math.round(nc)>HALF))return;var row=makeRow(nr);
  if(row.type==='grass'&&row.trees[Math.round(nc)]){tone(160,0.05,'square',0.03,0.8);pl.land=0.6;return;}
  if(makeRow(pl.r).type!=='water')nc=Math.round(nc);
  pl.fx=pl.x;pl.fy=pl.y;pl.c=nc;pl.r=nr;pl.hop=1;tone(dr>0?520:420,0.06,'square',0.035,1.5);if(nr>score)score=nr;for(var r=nr;r<nr+25;r++)makeRow(r);}
function landed(){var row=makeRow(pl.r);pl.land=1;if(row.type==='water'){if(objAt(row,pl.x)){tone(260,0.06,'sine',0.04,1.2);}}else{pl.x=Math.round(pl.x);pl.c=pl.x;for(var i=0;i<5;i++)FX.push({x:pl.x+(Math.random()-0.5)*0.6,y:pl.r-0.2,vx:(Math.random()-0.5)*1.5,vy:Math.random()*0.8,l:0.3,c:'rgba(255,255,255,.7)',s:4});}
  if(row.coin!==undefined&&row.coin===Math.round(pl.x)){row.coin=undefined;coins++;runCoins++;store.set('coins',coins);tone(990,0.08,'square',0.04,1.6);setTimeout(function(){tone(1320,0.1,'square',0.035,1.3);},70);FX.push({x:pl.x,y:pl.r+0.6,vx:0,vy:1.6,l:0.7,txt:'+1'});}
  if(queued){var q=queued;queued=null;hop(q[0],q[1]);}}
function die(kind){if(pl.dead)return;pl.dead=true;deathKind=kind;state='dead';games++;queued=null;
  if(kind==='car'||kind==='train'){shake=0.35;tone(120,0.3,'sawtooth',0.08,0.5);for(var i=0;i<18;i++){var a=Math.random()*6.283;FX.push({x:pl.x,y:pl.y,vx:Math.cos(a)*3.5,vy:Math.sin(a)*3.5,l:0.6,c:i%2?'#fff':(CHM[sel].f),s:6});}}
  else if(kind==='water'){tone(300,0.4,'sine',0.08,0.4);FX.push({x:pl.x,y:pl.r,ring:1,l:0.8});for(var j=0;j<14;j++){var b=Math.random()*6.283;FX.push({x:pl.x,y:pl.r,vx:Math.cos(b)*2,vy:Math.abs(Math.sin(b))*3,l:0.6,c:'#dff4ff',s:5});}}else{tone(880,0.5,'sawtooth',0.06,0.5);}
  var nb=score>best;if(nb){best=score;store.set('best',best);}
  setTimeout(function(){var show=function(){showCoins();$('endT').textContent=score;$('endP').innerHTML=TX[kind]+'<br>'+(nb?TX.newb:TX.best+' '+best)+(runCoins?'<br>'+TX.got+' +'+runCoins:'');$('cont').hidden=!(CG&&!used&&score>=15);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},950);}
$('play').onclick=function(){$('title').hidden=true;reset();};
$('again').onclick=function(){$('end').hidden=true;reset();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;var r=pl.r;while(makeRow(r).type!=='grass')r--;var tr=makeRow(r).trees,c=0;if(tr[c]){c=freeCol(tr)||0;}pl={c:c,r:r,x:c,y:r,fx:c,fy:r,hop:0,dir:0,dead:false,land:0};camRow=Math.min(camRow,r-1);eagleT=0;state='play';$('end').hidden=true;},function(){b.textContent=TX.na;});};
// ---- shop ----
var shopFrom='title';
function openShop(from){shopFrom=from;$(from).hidden=true;buildShop();$('shop').hidden=false;}
function buildShop(){showCoins();var gr=$('grid');gr.innerHTML='';CH.forEach(function(c){var own=owned.indexOf(c.id)>=0,b=document.createElement('button');b.type='button';b.className='ch'+(sel===c.id?' sel':'')+(own?'':' lock');
  var cvs=document.createElement('canvas');cvs.width=144;cvs.height=144;var o=g;g=cvs.getContext('2d');g.setTransform(1,0,0,1,0,0);drawChar(c.id,12,22,120,0,1);g=o;
  b.appendChild(cvs);var nm=document.createElement('b');nm.textContent=JA?c.ja:c.en;b.appendChild(nm);var sp=document.createElement('span');sp.textContent=own?(sel===c.id?TX.use:TX.sel):('● '+c.cost);b.appendChild(sp);
  b.onclick=function(){if(own){sel=c.id;store.set('sel',sel);tone(660,0.06,'square',0.03,1.3);buildShop();return;}if(coins>=c.cost){coins-=c.cost;owned.push(c.id);sel=c.id;store.set('coins',coins);store.set('own',owned);store.set('sel',sel);tone(880,0.1,'square',0.04,1.5);setTimeout(function(){tone(1320,0.15,'square',0.04,1.2);},90);buildShop();}else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');tone(150,0.08,'square',0.03,0.8);}};gr.appendChild(b);});}
$('chars').onclick=function(){openShop('title');};$('chars2').onclick=function(){openShop('end');};
$('shopOk').onclick=function(){$('shop').hidden=true;$(shopFrom).hidden=false;showCoins();};

var sx,sy,down=false;
cv.addEventListener('pointerdown',function(e){e.preventDefault();down=true;sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointerup',function(e){if(!down)return;down=false;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24){hop(0,1);return;}if(Math.abs(dx)>Math.abs(dy))hop(dx>0?1:-1,0);else hop(0,dy<0?1:-1);});
