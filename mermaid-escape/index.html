const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;let scale=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);scale=s;const dpr=devicePixelRatio||1;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*dpr;cv.height=H*s*dpr;ctx.setTransform(s*dpr,0,0,s*dpr,0,0);}
addEventListener('resize',resize);resize();

let ac=null;
function snd(f,d=0.08,type='square',vol=0.05,slide=0){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function song(){[660,784,880,784,660].forEach((f,i)=>setTimeout(()=>snd(f,0.25,'sine',0.05),i*140));}

let colorIdx=0;
let best=0;try{best=+localStorage.getItem('mermaidBest')||0}catch(e){}

let state='title',t=0,P,mers,sirens,pearls,parts,bubbles,frame,score,pearlCount,msg='',msgT=0,shake=0,nextMer,nextSiren;
bubbles=[];for(let i=0;i<25;i++)bubbles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,s:Math.random()*0.6+0.2});
parts=[];
const weeds=[];for(let i=0;i<9;i++)weeds.push({x:i*45+Math.random()*20,h:40+Math.random()*50,c:Math.random()<0.5?'#2e8b57':'#3aa36a'});

function reset(){
  P={x:W/2,y:H/2+80,tx:W/2,ty:H/2+80,hp:3,inv:90,shield:0,dizzy:0,vx:0,dir:1};
  mers=[];sirens=[];pearls=[];parts=[];frame=0;score=0;pearlCount=0;shake=0;
  addMer();nextMer=60*15;nextSiren=60*12;
  for(let i=0;i<3;i++)addPearl();
  say('にんぎょから にげろ！');
}
function say(s){msg=s;msgT=110;}
function addMer(){
  const side=Math.floor(Math.random()*4);
  let x=side===0?-40:side===1?W+40:Math.random()*W,y=side===2?-40:side===3?H+40:Math.random()*H;
  const lv=mers.length;
  mers.push({x,y,vx:0,vy:0,sp:0.75+lv*0.12+Math.random()*0.2,k:Math.random()<0.5?'mer1':'mer2',t:Math.random()*6,dir:1});
  if(mers.length>1){say('にんぎょが ふえた！');snd(300,0.2,'triangle',0.05,200);}
}
function addPearl(){pearls.push({x:30+Math.random()*(W-60),y:90+Math.random()*(H-170),t:Math.random()*6});}
function burst(x,y,col,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*3+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30,col});}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

// input
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key==='Enter')tap(W/2,540);});
addEventListener('keyup',e=>{keys[e.key]=0});
let drag=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
cv.addEventListener('pointerdown',e=>{const p=pos(e);if(state!=='play'){tap(p.x,p.y);return;}drag={sx:p.x,sy:p.y,px:P.tx,py:P.ty};});
cv.addEventListener('pointermove',e=>{if(!drag||state!=='play')return;const p=pos(e);
  P.tx=clamp(drag.px+(p.x-drag.sx)*1.3,20,W-20);P.ty=clamp(drag.py+(p.y-drag.sy)*1.3,70,H-20);});
addEventListener('pointerup',()=>drag=null);
function tap(x,y){
  if(state==='title'){
    for(let i=0;i<4;i++){const bx=60+i*80,by=445;if(Math.hypot(x-bx,y-by)<32){colorIdx=i;snd(600+i*100,0.1,'triangle');return;}}
    if(y>490){reset();state='play';snd(500,0.15,'triangle',0.06,300);}
  }else if(state==='over'&&t>40){state='title';snd(400,0.1,'triangle');}
}

function update(){
  t++;
  bubbles.forEach(b=>{b.y-=b.s;b.x+=Math.sin((t+b.y)*0.02)*0.2;if(b.y<-5){b.y=H+5;b.x=Math.random()*W;}});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;return --p.l>0;});
  if(msgT>0)msgT--;if(shake>0)shake--;
  if(state!=='play')return;
  frame++;if(frame%6===0)score++;
  const ks=4;if(keys.ArrowLeft||keys.a)P.tx-=ks;if(keys.ArrowRight||keys.d)P.tx+=ks;if(keys.ArrowUp||keys.w)P.ty-=ks;if(keys.ArrowDown||keys.s)P.ty+=ks;
  P.tx=clamp(P.tx,20,W-20);P.ty=clamp(P.ty,70,H-20);
  // movement (slow when dizzy)
  const follow=P.dizzy>0?0.07:0.25;
  const ox=P.x;P.x+=(P.tx-P.x)*follow;P.y+=(P.ty-P.y)*follow;P.vx=P.x-ox;if(Math.abs(P.vx)>0.3)P.dir=P.vx>0?1:-1;
  if(P.inv>0)P.inv--;if(P.dizzy>0)P.dizzy--;
  // siren pull while dizzy
  if(P.dizzy>0&&sirens.length){const s=sirens[0];P.tx+=(s.x-P.tx)*0.008;P.ty+=(s.y-P.ty)*0.008;}

  // spawns
  if(--nextMer<=0&&mers.length<7){addMer();nextMer=60*15;}
  if(--nextSiren<=0){const left=Math.random()<0.5;
    sirens.push({x:left?-60:W+60,y:120+Math.random()*(H-300),tx:left?80:W-80,life:60*9,sing:90,rings:[],dir:left?1:-1});
    say('セイレーンが きた！ うたに ちゅうい！');snd(200,0.4,'sine',0.05,300);nextSiren=60*(13+Math.random()*5);}

  // mermaids chase
  mers.forEach(m=>{m.t+=0.05;
    const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||1;
    const sp=m.sp*(P.inv>0&&P.hp<3?0.6:1);
    m.vx+=(dx/d*sp-m.vx)*0.04;m.vy+=(dy/d*sp-m.vy)*0.04;
    m.x+=m.vx+Math.sin(m.t*1.5)*0.4;m.y+=m.vy+Math.cos(m.t*1.2)*0.3;
    if(Math.abs(m.vx)>0.1)m.dir=m.vx>0?1:-1;});
  // mermaids push apart
  for(let i=0;i<mers.length;i++)for(let j=i+1;j<mers.length;j++){const a=mers[i],b=mers[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<50&&d>0){const f=(50-d)/50*0.6;a.x-=dx/d*f;a.y-=dy/d*f;b.x+=dx/d*f;b.y+=dy/d*f;}}

  // sirens
  sirens.forEach(s=>{s.life--;
    if(s.life>60)s.x+=(s.tx-s.x)*0.03;else s.x+=s.dir*-3;
    s.y+=Math.sin(t*0.03)*0.5;
    if(s.life>60&&--s.sing<=0){s.sing=150;s.rings.push({r:10});song();}
    s.rings.forEach(r=>{r.r+=2.2;
      if(!r.hit&&P.inv===0&&Math.abs(Math.hypot(P.x-s.x,P.y-s.y)-r.r)<12){r.hit=1;
        if(P.shield){P.shield=0;burst(P.x,P.y,'#bff',14);say('バリアが まもった！');snd(900,0.2,'sine',0.05,-300);}
        else if(P.dizzy===0){P.dizzy=150;say('ぐるぐる〜！');snd(500,0.5,'sine',0.05,-350);}}});
    s.rings=s.rings.filter(r=>r.r<260);});
  sirens=sirens.filter(s=>s.x>-100&&s.x<W+100||s.life>60);

  // pearls
  pearls.forEach(p=>p.t+=0.08);
  pearls=pearls.filter(p=>{if(Math.hypot(p.x-P.x,p.y-P.y)<26){pearlCount++;score+=50;burst(p.x,p.y,'#fff8e0',10);snd(1100,0.08,'triangle',0.05,400);
    if(pearlCount%5===0){P.shield=1;say('バリア ゲット！');snd(700,0.3,'triangle',0.06,600);}
    if(pearlCount%12===0&&P.hp<5){P.hp++;say('ハート ふえた！');}
    setTimeout(addPearl,400);return false;}return true;});

  // collisions
  if(P.inv===0){for(const m of mers){if(Math.hypot(m.x-P.x,m.y-P.y)<36){
    if(P.shield){P.shield=0;P.inv=60;burst(P.x,P.y,'#bff',16);snd(400,0.2,'sine',0.06,-200);}
    else{P.hp--;P.inv=120;shake=12;burst(P.x,P.y,COLORS[colorIdx].c,20);snd(150,0.3,'sawtooth',0.07,-80);say('つかまった！');
      if(P.hp<=0){state='over';t=0;if(score>best){best=score;try{localStorage.setItem('mermaidBest',best)}catch(e){}}}}
    mers.forEach(o=>{const dx=o.x-P.x,dy=o.y-P.y,d=Math.hypot(dx,dy)||1;o.vx=dx/d*4;o.vy=dy/d*4;});
    break;}}}
}

// drawing
function slime(x,y,r,col,dark,dizzy){
  ctx.save();ctx.translate(x,y);const sq=Math.sin(t*0.15)*0.04;ctx.scale(1+sq,1-sq);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-r,r*0.6);
  ctx.quadraticCurveTo(-r*1.05,-r*0.3,0,-r*1.05);ctx.quadraticCurveTo(r*1.05,-r*0.3,r,r*0.6);ctx.quadraticCurveTo(0,r*0.85,-r,r*0.6);ctx.fill();
  ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.ellipse(-r*0.45,-r*0.45,r*0.18,r*0.28,-0.5,0,6.28);ctx.fill();
  if(dizzy){ctx.strokeStyle='#d2203a';ctx.lineWidth=1.8;[-1,1].forEach(sx=>{ctx.beginPath();for(let a=0;a<12;a+=0.3){const rr=a*0.75*r/24;ctx.lineTo(sx*r*0.32+Math.cos(a+t*0.3)*rr,Math.sin(a+t*0.3)*rr);}ctx.stroke();});
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,r*0.3,r*0.12,r*0.09,0,0,6.28);ctx.stroke();}
  else{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-r*0.32,0,r*0.13,0,6.28);ctx.arc(r*0.32,0,r*0.13,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.28,-r*0.05,r*0.05,0,6.28);ctx.arc(r*0.36,-r*0.05,r*0.05,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*0.15,r*0.15,0.2,Math.PI-0.2);ctx.stroke();}
  ctx.fillStyle='rgba(255,120,150,0.6)';ctx.beginPath();ctx.ellipse(-r*0.6,r*0.2,r*0.13,r*0.08,0,0,6.28);ctx.ellipse(r*0.6,r*0.2,r*0.13,r*0.08,0,0,6.28);ctx.fill();
  ctx.restore();
}
function sprite(k,x,y,w,flip,rot=0){const im=img[k];if(!im.complete||!im.naturalWidth)return;const h=w*im.naturalHeight/im.naturalWidth;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();}
function heart(x,y,s){ctx.fillStyle='#ff5d8f';ctx.beginPath();ctx.moveTo(x,y+s*0.35);
  ctx.bezierCurveTo(x-s,y-s*0.3,x-s*0.4,y-s,x,y-s*0.4);ctx.bezierCurveTo(x+s*0.4,y-s,x+s,y-s*0.3,x,y+s*0.35);ctx.fill();}
function text(s,x,y,size,col='#fff',align='center'){ctx.font='bold '+size+'px "Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=size/5;ctx.strokeStyle='#0b2a4d';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function sea(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4fb3e8');g.addColorStop(0.5,'#1f74b8');g.addColorStop(1,'#0d3a66');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(255,255,255,0.07)';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(40+i*90+Math.sin(t*0.01+i)*20,0);ctx.lineTo(80+i*90+Math.sin(t*0.01+i)*20,0);ctx.lineTo(20+i*90,H*0.7);ctx.lineTo(-10+i*90,H*0.7);ctx.fill();}
  ctx.fillStyle='#e8d29a';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-30);for(let x=0;x<=W;x+=30)ctx.lineTo(x,H-30+Math.sin(x*0.05)*6);ctx.lineTo(W,H);ctx.fill();
  weeds.forEach(w=>{ctx.strokeStyle=w.c;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w.x,H-25);
    for(let i=1;i<=6;i++)ctx.lineTo(w.x+Math.sin(t*0.03+i*0.8+w.x)*6*i/6,H-25-w.h*i/6);ctx.stroke();});
  bubbles.forEach(b=>{ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.stroke();});
}

function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  sea();const C=COLORS[colorIdx];
  if(state==='title'){
    text('にげろ！',W/2,80,44,'#ffe36a');text('うみの スライム',W/2,135,32);
    sprite('mer1',70,250+Math.sin(t*0.05)*8,100,false,Math.sin(t*0.04)*0.1);
    sprite('siren',W/2+5,215+Math.sin(t*0.04)*6,120,false,Math.sin(t*0.03)*0.08);
    sprite('mer2',W-70,260+Math.sin(t*0.05+2)*8,96,true,Math.sin(t*0.04+1)*0.1);
    slime(W/2,345+Math.sin(t*0.08)*5,30,C.c,C.d,false);
    text('にんぎょと セイレーンから にげよう',W/2,395,15,'#fff');
    COLORS.forEach((cc,i)=>{const bx=60+i*80,by=445;
      if(i===colorIdx){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,28,0,6.28);ctx.stroke();}
      slime(bx,by+4,18,cc.c,cc.d,false);});
    ctx.fillStyle='#ff8a3d';roundRect(W/2-110,500,220,64,32);ctx.fill();text('スタート！',W/2,532,28);
    text('しんじゅを あつめると バリアが でるよ',W/2,585,13,'#e6f4ff');
    if(best)text('さいこう '+best+' てん',W/2,610,14,'#ffd84a');
  }else{
    pearls.forEach(p=>{const bob=Math.sin(p.t)*3;
      ctx.fillStyle='#f2a0b8';ctx.beginPath();ctx.ellipse(p.x,p.y+bob+6,14,6,0,0,6.28);ctx.fill();
      const g=ctx.createRadialGradient(p.x-3,p.y+bob-3,1,p.x,p.y+bob,9);g.addColorStop(0,'#fff');g.addColorStop(1,'#e8e0f0');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y+bob,8,0,6.28);ctx.fill();});
    sirens.forEach(s=>{s.rings.forEach(r=>{ctx.strokeStyle='rgba(255,110,170,'+Math.max(0,0.8-r.r/320)+')';ctx.lineWidth=5;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(s.x,s.y,r.r,0,6.28);ctx.stroke();ctx.setLineDash([]);
        for(let i=0;i<6;i++){const a=i/6*6.28+r.r*0.01;text('♪',s.x+Math.cos(a)*r.r,s.y+Math.sin(a)*r.r,16,'#ffb0d4');}});
      sprite('siren',s.x,s.y,100,s.dir>0,Math.sin(t*0.05)*0.1);});
    mers.forEach(m=>sprite(m.k,m.x,m.y,70,m.dir>0,Math.sin(m.t*2)*0.12));
    if(!(P.inv>0&&Math.floor(P.inv/5)%2))slime(P.x,P.y,22,C.c,C.d,P.dizzy>0);
    if(P.shield){ctx.strokeStyle='rgba(180,255,255,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x,P.y,32+Math.sin(t*0.2)*2,0,6.28);ctx.stroke();
      ctx.fillStyle='rgba(180,255,255,0.15)';ctx.fill();}
    parts.forEach(p=>{ctx.globalAlpha=p.l/30;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill();});ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,30,60,0.35)';ctx.fillRect(0,0,W,48);
    for(let i=0;i<P.hp;i++)heart(22+i*26,25,12);
    text(score+' てん',W-12,18,17,'#fff','right');
    text('しんじゅ '+pearlCount,W-12,38,12,'#fff3d6','right');
    if(msgT>0){ctx.globalAlpha=Math.min(1,msgT/20);text(msg,W/2,H/2-120,22,'#ffe36a');ctx.globalAlpha=1;}
    if(state==='over'){ctx.fillStyle='rgba(5,20,50,0.7)';ctx.fillRect(0,0,W,H);
      text('つかまっちゃった！',W/2,H/2-90,30);text(score+' てん',W/2,H/2-30,34,'#ffd84a');
      text(Math.floor(frame/60)+' びょう にげた！',W/2,H/2+15,20);text('しんじゅ '+pearlCount+' こ',W/2,H/2+45,18);
      if(score>=best&&score>0)text('しんきろく！',W/2,H/2+85,24,'#ff8ad0');
      if(t>40)text('タップで もどる',W/2,H/2+135,18,'#ddd');}
  }
  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
