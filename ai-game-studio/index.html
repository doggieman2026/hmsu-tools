<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AI Game Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1d2e;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:0 0 auto;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:14px;background:#242840;gap:8px}
#gbtn{font:inherit;font-size:12px;font-weight:900;border:2px solid #ffd84a;color:#ffd84a;background:transparent;border-radius:12px;padding:4px 10px;cursor:pointer}
#mission{flex:0 0 auto;padding:8px 12px;background:#2e3354;font-size:13px;line-height:1.5}
#mission b{color:#ffd84a}
#stage{position:relative;flex:0 0 auto;height:44vh;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#chat{flex:1 1 auto;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.msg{max-width:85%;padding:8px 11px;border-radius:14px;line-height:1.45;white-space:pre-wrap}
.me{align-self:flex-end;background:#3a7ae0;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#2e3354;border-bottom-left-radius:4px}
.code{align-self:flex-start;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0e1020;color:#7ae0a0;padding:8px 11px;border-radius:10px;border-left:3px solid #7ae0a0;max-width:92%;white-space:pre-wrap}
#chips{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#20243a}
.chip{flex:0 0 auto;font:inherit;font-size:13px;font-weight:800;border:2px solid #5a6aa8;background:#2e3354;color:#fff;border-radius:16px;padding:6px 11px;cursor:pointer}
.chip.hint{border-color:#ffd84a}
#bar{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#20243a}
#inp{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:2px solid #5a6aa8;background:#14172a;color:#fff;min-width:0}
.btn2{font:inherit;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:10px 14px;color:#fff;cursor:pointer}
#send{background:#3a7ae0}#test{background:#2aa03a}
#app.testing #stage{height:calc(100% - 150px)}#app.testing #chat,#app.testing #chips,#app.testing #mission{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,74,.9)}50%{box-shadow:0 0 0 7px rgba(255,216,74,0)}}.pulse{animation:pulse 1.1s infinite}
#mybtn{font:inherit;font-size:12px;font-weight:900;border:2px solid #7ae0ff;color:#7ae0ff;background:transparent;border-radius:12px;padding:4px 10px;cursor:pointer}
#glist2{display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}.mg{display:flex;align-items:center;gap:8px;background:#2e3354;border-radius:14px;padding:10px;text-align:left}.mg b{flex:1;font-size:14px}.mg button{font:inherit;font-size:12px;font-weight:900;border:none;border-radius:10px;padding:7px 10px;color:#fff;cursor:pointer}
#rank{font-size:12px;color:#ffd84a}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,15,30,.88);text-align:center;padding:24px;z-index:5;overflow-y:auto}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(46px,13vw,80px);line-height:.95;font-weight:900;font-style:italic;color:#7ae0ff;text-shadow:0 5px 0 #1a4a8a}
.over h1 small{display:block;font-size:.62em;color:#ffd84a;text-shadow:0 4px 0 #8a5010}
.over h2{margin:0;font-size:24px;color:#ffd84a}
.over p{margin:0;max-width:360px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#5ad8ff,#2a7ae0);color:#fff;box-shadow:0 6px 0 #1a3a8a;cursor:pointer;min-width:230px}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);box-shadow:0 5px 0 #9a5010}
#glist{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:min(460px,92vw)}
.gcard{font:inherit;text-align:left;border:3px solid #5a6aa8;background:#2e3354;color:#fff;border-radius:16px;padding:12px;cursor:pointer}
.gcard b{display:block;font-size:17px;margin:4px 0}
.gcard span{font-size:12px;opacity:.8;line-height:1.4}
.gcard i{font-style:normal;font-size:30px}
</style>
</head>

  if(w.key&&!w.key.got){var kx=X(w.key.x)+cs*0.4,ky=Y(w.key.y)+cs*0.5;C(kx,ky,cs*0.14,'#ffd84a');g.fillStyle='#ffd84a';g.fillRect(kx,ky-cs*0.04,cs*0.3,cs*0.08);}
  if(w.goal){var gx=X(w.goal.x),gy=Y(w.goal.y);if(w.key&&!pl.hasKey){g.fillStyle='#8a5a32';g.fillRect(gx+cs*0.15,gy+cs*0.1,cs*0.7,cs*0.8);g.font=Math.round(cs*0.4)+'px sans-serif';g.textAlign='center';g.fillText('🔒',gx+cs/2,gy+cs*0.65);}else{g.fillStyle='rgba(58,200,90,.7)';g.fillRect(gx+cs*0.1,gy+cs*0.1,cs*0.8,cs*0.8);g.fillStyle='#fff';g.font='900 '+Math.round(cs*0.3)+'px Rubik';g.textAlign='center';g.fillText('EXIT',gx+cs/2,gy+cs*0.6);}}
  w.chasers.forEach(function(gh){var x=X(gh.x),y=Y(gh.y),r=cs*0.32;g.fillStyle='rgba(230,230,255,.92)';g.beginPath();g.arc(x,y-r*0.2,r,Math.PI,0);g.lineTo(x+r,y+r*0.7);for(var k=0;k<4;k++)g.lineTo(x+r-(k+0.5)*r/2,y+r*(k%2?0.7:0.4));g.lineTo(x-r,y+r*0.7);g.fill();C(x-r*0.35,y-r*0.2,r*0.18,'#1a1a2a');C(x+r*0.35,y-r*0.2,r*0.18,'#1a1a2a');});
  if(pl.inv<=0||Math.floor(t*20)%2)heroArt(X(pl.x),Y(pl.y)+cs*0.35,cs/40,pl.face);
  if(spec.dark){var lx=X(pl.x),ly=Y(pl.y),rad=cs*1.9;var gr=g.createRadialGradient(lx,ly,rad*0.4,lx,ly,rad);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.97)');g.fillStyle=gr;g.fillRect(0,0,W,H);}}
function drawRun(){var w=world,HZ=H*0.28,Z0=4,CAMH=2.6,F=Math.min((H*0.9-HZ)*Z0/CAMH,W*0.95*Z0/(spec.lanes*2.2+1)),LW=2.2,mid=(spec.lanes-1)/2;sc=1;function P(x,y,z){var k=F/(z+Z0);return {x:W/2+x*k,y:HZ+(CAMH-y)*k,k:k};}
  var far=60,a=P(-(mid+0.6)*LW,0,far),b=P((mid+0.6)*LW,0,far),c=P((mid+0.6)*LW,0,-2),d=P(-(mid+0.6)*LW,0,-2);g.fillStyle='#4a4a5a';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c.x,c.y);g.lineTo(d.x,d.y);g.fill();
  for(var l=0;l<spec.lanes-1;l++){var lx=(l+0.5-mid)*LW;for(var z=far-(w.dist%4);z>-2;z-=4){var p0=P(lx,0,z),p1=P(lx,0,z+2);g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=Math.max(1,p0.k*0.08);g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p1.x,p1.y);g.stroke();}}
  var items=[];w.obs.forEach(function(o){items.push({z:o.z,o:o});});w.coins.forEach(function(cn){items.push({z:cn.z,c:cn});});w.items.forEach(function(i){items.push({z:i.z,i:i});});items.sort(function(p,q){return q.z-p.z;});
  items.forEach(function(it){if(it.z>far)return;if(it.o){var o=it.o,p=P((o.lane-mid)*LW,0,Math.max(-1.5,o.z)),s=p.k;if(o.k==='cone'){g.fillStyle='#ff7a2a';g.beginPath();g.moveTo(p.x,p.y-1.1*s);g.lineTo(p.x+0.45*s,p.y);g.lineTo(p.x-0.45*s,p.y);g.fill();g.fillStyle='#fff';g.fillRect(p.x-0.25*s,p.y-0.55*s,0.5*s,0.15*s);}else{g.fillStyle=o.c;rr(p.x-0.8*s,p.y-1.1*s,1.6*s,1.1*s,0.2*s);g.fill();g.fillStyle='rgba(180,220,255,.9)';g.fillRect(p.x-0.6*s,p.y-0.95*s,1.2*s,0.4*s);}}
    else if(it.c){var q=P((it.c.lane-mid)*LW,0.8,it.c.z);C(q.x,q.y,q.k*0.3,'#ffd84a');}else{var q2=P((it.i.lane-mid)*LW,0.8,it.i.z);C(q2.x,q2.y,q2.k*0.35,'#5ad8ff');}});
  var pp=P((pl.lx-mid)*LW,0,0.3);if(pl.inv<=0||Math.floor(t*20)%2)heroArt(pp.x,pp.y,pp.k/34,1);}
function drawBrick(){var w=world,f=boxFit(BW,BH),s=f.s,X=function(x){return f.ox+x*s;},Y=function(y){return f.oy+y*s;};g.strokeStyle='rgba(255,255,255,.2)';g.strokeRect(f.ox,f.oy,BW*s,BH*s);
  var bw=BW/8,bh=16,top=40,cols=['#ff6a6a','#ffb02a','#ffe04a','#7ae05a','#5ad8ff','#7a8aff','#c87aff','#ff7ad8','#c8ccd8'];
  w.bricks.forEach(function(k){if(k.hp<=0)return;g.fillStyle=k.hard?(k.hp>1?'#8a8aa8':'#b8b8d0'):cols[k.r%9];rr(X(k.c*bw)+1.5,Y(top+k.r*bh)+1.5,bw*s-3,bh*s-3,3);g.fill();if(k.item){g.fillStyle='#fff';g.font='900 '+Math.round(9*s)+'px Rubik';g.textAlign='center';g.fillText(k.item==='multi'?'●●':'↔',X(k.c*bw+bw/2),Y(top+k.r*bh+11));}});
  w.drops.forEach(function(d){C(X(d.x),Y(d.y),8*s,d.k==='multi'?'#ff9a2a':'#5ad8ff');});
  w.balls.forEach(function(b){C(X(b.x),Y(b.y),6*s,'#fff');});
  g.fillStyle=TH[spec.theme][2];rr(X(pl.x-w.paddleW/2),Y(BH-30),w.paddleW*s,10*s,5*s);g.fill();heroArt(X(pl.x),Y(BH-30),s*0.7,1);
  if(mode2==='test'&&w.balls.some(function(b){return b.stuck;})){g.fillStyle='rgba(255,255,255,.8)';g.textAlign='center';g.font="800 13px Rubik,'M PLUS Rounded 1c'";g.fillText(L('タップで発射','Tap to launch'),W/2,Y(BH-60));}}
function render(){var sk=shakeT>0?(Math.random()-0.5)*shakeT*30:0;g.setTransform(DPR,0,0,DPR,sk*DPR,0);bg();
  if(!world||!pl){g.fillStyle='rgba(255,255,255,.55)';g.textAlign='center';g.font="800 15px Rubik,'M PLUS Rounded 1c'";g.fillText(L('ここにゲームができあがるよ','Your game appears here'),W/2,H/2);drawMsg();return;}
  ({act:drawAct,shoot:drawShoot,maze:drawMaze,run:drawRun,brick:drawBrick})[spec.genre]();
  FX.forEach(function(f){g.globalAlpha=Math.min(1,f.l*3);var X=f.x,Y=f.y;if(f.scr){}else if(spec.genre==='shoot'||spec.genre==='brick'){var b=boxFit(spec.genre==='shoot'?300:BW,400);X=b.ox+f.x*b.s;Y=b.oy+f.y*b.s;}else if(spec.genre==='act'&&actCam){X=actCam.X(f.x);Y=actCam.Y(f.y);}else if(f.txt===undefined&&spec.genre!=='act'){}if(f.txt){g.font='900 16px Rubik';g.textAlign='center';g.fillStyle=f.c;g.fillText(f.txt,X,Y);}else C(X,Y,f.scr?5:3,f.c);});g.globalAlpha=1;
  if(mode2==='test'||mode2==='result'){g.fillStyle='rgba(0,0,0,.42)';rr(6,6,W-12,26,13);g.fill();g.fillStyle='#fff';g.font='800 13px Rubik';g.textAlign='left';var info='❤'.repeat(Math.max(0,pl.lives));var gn=spec.genre;
    if((gn==='act'||gn==='run')&&spec.coin)info+='  🪙'+pl.got+'/'+(gn==='act'?spec.coin:'');if(gn==='maze'&&spec.coin)info+='  💰'+world.coins.filter(function(c){return c.got;}).length+'/'+spec.coin;if(gn==='shoot')info+='  👾'+pl.got+'/'+spec.enemy;if(gn==='brick')info+='  🧱'+world.bricks.filter(function(k){return k.hp<=0;}).length+'/'+world.bricks.length;if(pl.hasKey)info+='  🔑';
    g.fillText(info,16,24);g.textAlign='right';if(spec.timer)g.fillText('⏱ '+Math.max(0,Math.ceil(spec.timer-pl.time))+'s',W-16,24);else if(gn==='run')g.fillText(Math.floor(world.dist)+'m'+(spec.dist?' / '+spec.dist+'m':''),W-16,24);}
  else{g.fillStyle='rgba(0,0,0,.38)';rr(6,6,Math.min(W-12,240),22,11);g.fill();g.fillStyle='#fff';g.font="800 11px Rubik,'M PLUS Rounded 1c'";g.textAlign='left';g.fillText(GEN[spec.genre].i+' '+GEN[spec.genre].name+L('（▶テストで遊ぶ）',' (▶ Test to play)'),14,21);}
  drawMsg();}
function drawMsg(){if(msgT>0){g.textAlign='center';g.font="900 32px Rubik,'M PLUS Rounded 1c'";g.lineWidth=6;g.strokeStyle='rgba(0,0,0,.5)';g.strokeText(msgTxt,W/2,H*0.45);g.fillStyle=msgTxt===TX.win?'#ffd84a':msgTxt===TX.lose?'#ff8a8a':'#fff';g.fillText(msgTxt,W/2,H*0.45);}}
var last=performance.now();function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();cgSync();requestAnimationFrame(frame);}
fit();requestAnimationFrame(frame);
</script>
