<script>
"use strict";

var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function start(){P={x:180,y:500,hp:100,max:100,dmg:10,rate:2.2,multi:1,side:0,pierce:0,bounce:0,spd:190,cd:0,inv:0,face:-1.57,moving:false};room=1;used=false;loadRoom();state='play';}
function loadRoom(){foes=[];arrows=[];shots=[];door=false;P.x=180;P.y=500;banner=1.4;var boss=room%5===0,n=boss?0:Math.min(9,2+Math.floor(room*0.8)),sc=1+room*0.14;

function fire(){var f=nearest();if(!f)return;var a=Math.atan2(f.y-P.y,f.x-P.x);P.face=a;var list=[];for(var m=0;m<P.multi;m++)list.push({a:a,o:(m-(P.multi-1)/2)*9});if(P.side){list.push({a:a-0.6,o:0});list.push({a:a+0.6,o:0});}

function update(dt){t+=dt;shake=Math.max(0,shake-dt);banner=Math.max(0,banner-dt);nums.forEach(function(n){n.l-=dt;});nums=nums.filter(function(n){return n.l>0;});FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.92;f.vy*=0.92;});FX=FX.filter(function(f){return f.l>0;});

    foes.forEach(function(f){if(a.l<=0||a.hit.indexOf(f)>=0)return;if(Math.hypot(f.x-a.x,f.y-a.y)<f.r+4){f.hp-=P.dmg;f.hit=0.12;a.hit.push(f);nums.push({v:Math.round(P.dmg),x:f.x,y:f.y-f.r,l:0.6,c:'#fff'});tone(300+Math.random()*100,0.04,'square',0.03,0.7);if(a.p>0)a.p--;else a.l=0;}});});

    else if(f.k==='boss'){f.x+=Math.cos(f.ph*0.8)*60*dt;f.y=150+Math.sin(f.ph*0.6)*50;if(f.cd<=0){f.cd=1.5;var pat=Math.floor(f.ph)%3;if(pat===0){for(var j=0;j<12;j++){var a3=j/12*6.283+f.ph;shots.push({x:f.x,y:f.y,vx:Math.cos(a3)*130,vy:Math.sin(a3)*130,r:7,c:'#ff7a3a'});}}else{for(var q=-2;q<=2;q++){var a4=Math.atan2(dy,dx)+q*0.18;shots.push({x:f.x,y:f.y,vx:Math.cos(a4)*200,vy:Math.sin(a4)*200,r:7,c:'#ff7a3a'});}}tone(220,0.1,'sawtooth',0.03,0.7);}}
    f.x=Math.max(f.r,Math.min(360-f.r,f.x));f.y=Math.max(f.r,Math.min(560-f.r,f.y));

function openSkills(){var o=SK.slice().sort(function(){return Math.random()-0.5;}).slice(0,3);skills=o;state='skill';tone(700,0.1,'triangle',0.05,1.5);}
function pickSkill(i){if(state!=='skill')return;var k=skills[i].k;if(k==='dmg')P.dmg*=1.3;if(k==='rate')P.rate*=1.25;if(k==='multi')P.multi++;if(k==='side')P.side=1;if(k==='pierce')P.pierce++;if(k==='hp'){P.max+=25;P.hp=Math.min(P.max,P.hp+45);}if(k==='bounce')P.bounce+=2;if(k==='speed')P.spd*=1.15;skills=null;loadRoom();state='play';tone(990,0.12,'square',0.05,1.3);}

// input
var keys={};function kmap(e,v){var m={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'}[e.key];if(m){keys[m]=v;e.preventDefault();}}
addEventListener('keydown',function(e){kmap(e,1);if(state==='skill'){var n=parseInt(e.key,10);if(n>=1&&n<=3)pickSkill(n-1);}});addEventListener('keyup',function(e){kmap(e,0);});
function skillRects(){var w=Math.min(110,(W-48)/3),h=w*1.3,x0=(W-w*3-24)/2;return [0,1,2].map(function(i){return {x:x0+i*(w+12),y:H*0.4,w:w,h:h};});}
cv.addEventListener('pointerdown',function(e){e.preventDefault();var x=e.clientX,y=e.clientY;if(state==='skill'){skillRects().forEach(function(r,i){if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)pickSkill(i);});return;}drag={on:true,sx:x,sy:y,x:x,y:y};try{cv.setPointerCapture(e.pointerId);}catch(_){}});

(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';

// ---- draw ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}

function hero(x,y){var bob=P.moving?Math.abs(Math.sin(t*14))*3:0;E(x,y+14,13,5,'rgba(0,0,0,.3)');y-=bob;
  // cape
  g.fillStyle='#e8503a';g.beginPath();g.moveTo(x-10,y-4);g.lineTo(x+10,y-4);g.lineTo(x+13,y+14);g.lineTo(x-13,y+14);g.fill();
  C(x,y+2,11,'#3a8ae8');C(x,y-10,10,'#ffd8b0');g.fillStyle='#2a8a3a';g.beginPath();g.moveTo(x-12,y-12);g.quadraticCurveTo(x,y-30,x+13,y-12);g.lineTo(x+18,y-20);g.lineTo(x+10,y-9);g.closePath();g.fill();
  C(x-3.5,y-9,1.8,'#1a1a2a');C(x+3.5,y-9,1.8,'#1a1a2a');

function foeArt(f){var x=f.x,y=f.y,r=f.r;E(x,y+r*0.9,r*0.9,r*0.3,'rgba(0,0,0,.3)');g.save();if(f.hit>0)g.globalAlpha=0.6;
  if(f.k==='beetle'){var w=Math.sin(f.ph*16)*0.4;g.strokeStyle='#1a2a4a';g.lineWidth=2;for(var i=-1;i<=1;i++){g.beginPath();g.moveTo(x-r*0.8,y+i*r*0.4);g.lineTo(x-r*1.2,y+i*r*0.5+w*4);g.moveTo(x+r*0.8,y+i*r*0.4);g.lineTo(x+r*1.2,y+i*r*0.5-w*4);g.stroke();}E(x,y,r,r*0.85,'#3a6ac8');E(x,y,r*0.85,r*0.7,'#5aa0e8');g.fillStyle='#1a2a4a';g.fillRect(x-1,y-r*0.7,2,r*1.4);C(x-r*0.35,y-r*0.55,r*0.18,'#fff');C(x+r*0.35,y-r*0.55,r*0.18,'#fff');C(x-r*0.35,y-r*0.55,r*0.09,'#1a1a2a');C(x+r*0.35,y-r*0.55,r*0.09,'#1a1a2a');}
  else if(f.k==='cactus'){rr(x-r*0.55,y-r,r*1.1,r*2,r*0.5);g.fillStyle='#3aa04a';g.fill();rr(x-r*1.2,y-r*0.4,r*0.5,r*0.9,r*0.25);g.fill();rr(x+r*0.7,y-r*0.7,r*0.5,r*0.9,r*0.25);g.fill();g.fillStyle='#fff';[[-0.2,-0.6],[0.25,-0.2],[-0.2,0.3],[0.2,0.7]].forEach(function(p){g.fillRect(x+p[0]*r,y+p[1]*r,2,2);});C(x-r*0.22,y-r*0.3,r*0.12,'#1a1a2a');C(x+r*0.22,y-r*0.3,r*0.12,'#1a1a2a');C(x,y-r*1.05,r*0.25,'#ff6aa0');}
