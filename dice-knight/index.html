<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dice Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#3a2a4a;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,30,.75);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#fff;text-shadow:0 5px 0 #6a3ab0,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.8em;color:#ff7a8a;text-shadow:0 5px 0 #7a1a3a}
.over p{margin:0;max-width:350px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#b07aff,#6a3ad8);color:#fff;text-shadow:0 2px 0 #3a1a7a;box-shadow:0 6px 0 #3a1a7a;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a1a7a}
.btn.sub{font-size:17px;background:linear-gradient(#ffd84a,#ff9a2a);text-shadow:0 2px 0 #9a5010;box-shadow:0 5px 0 #9a5010}

</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>DICE<small>KNIGHT</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(40px,11vw,66px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'毎ターンさいころを振って、<b>さいころをタップ → 装備をタップ</b>で使おう。<br>装備ごとに使える目が決まっているよ（3以下、偶数など）。<br>勝つと新しい装備が手に入る。12階のボスをたおせ！',play:'あそぶ',again:'もういちど',end:'ターン終了',floor:'フロア',pick:'新しい装備をえらぶ',dead:'やられた…',win:'ダンジョン制覇！',cont:'▶ 広告を見て 復活',na:'広告を読み込めませんでした',best:'さいこう',heal:'HP+10 回復',slots:'装備はいっぱい：入れかえる装備をタップ'}
 :{how:'Roll dice every turn, then <b>tap a die → tap a piece of gear</b> to use it.<br>Each item only takes certain numbers (≤3, even…).<br>Win to earn new gear. Defeat the boss on floor 12!',play:'PLAY',again:'TRY AGAIN',end:'END TURN',floor:'Floor',pick:'Choose new gear',dead:'Defeated…',win:'Dungeon cleared!',cont:'▶ Watch ad: revive',na:'Ad not available',best:'Best',heal:'Heal +10 HP',slots:'Gear full: tap an item to replace'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('dk-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('dk-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
// gear: req(v) -> bool, act(v)
var GEAR={
 sword:{ja:'ロングソード',en:'Longsword',rq:'any',d:'v',col:'#c84a4a',txt:{ja:'目の数ダメージ',en:'Deal ⚀'}},
 shield:{ja:'まるい盾',en:'Round Shield',rq:'any',b:'v',col:'#3a7ac8',txt:{ja:'目の数ブロック',en:'Block ⚀'}},
 dagger:{ja:'ふたごの短剣',en:'Twin Daggers',rq:'le3',d:'2v',col:'#c84a7a',txt:{ja:'3以下：目×2ダメージ',en:'≤3: deal ⚀×2'}},
 axe:{ja:'大斧',en:'Great Axe',rq:'ge4',d:'v+3',col:'#a83a2a',txt:{ja:'4以上：目+3ダメージ',en:'≥4: deal ⚀+3'}},
 bow:{ja:'狩人の弓',en:'Hunter Bow',rq:'even',d:'v+2',col:'#5a8a3a',txt:{ja:'偶数：目+2ダメージ',en:'Even: deal ⚀+2'}},
 wand:{ja:'毒の杖',en:'Venom Wand',rq:'odd',psn:'v',col:'#6a3ab0',txt:{ja:'奇数：目の数だけ毒',en:'Odd: poison ⚀'}},
 potion:{ja:'回復薬',en:'Potion',rq:'any',heal:'2v',once:1,col:'#2aa06a',txt:{ja:'目×2回復（1戦1回）',en:'Heal ⚀×2 (1/fight)'}},
 bump:{ja:'まほうの小槌',en:'Magic Mallet',rq:'lt6',bump:1,col:'#c8a02a',txt:{ja:'目を+1してもどす',en:'Die +1, return it'}},
 split:{ja:'ふたつわり',en:'Splitter',rq:'ge2',split:1,col:'#2a8aa8',txt:{ja:'目を2つにわる',en:'Split die in two'}},
 spear:{ja:'天の槍',en:'Sky Spear',rq:'six',d:'14',col:'#e8b02a',txt:{ja:'6のみ：14ダメージ',en:'6 only: deal 14'}},
 hammer:{ja:'雷ハンマー',en:'Thunder Hammer',rq:'any',d:'v',stun:1,once:1,col:'#7a7ae8',txt:{ja:'目ダメージ＋敵の攻撃を0に（1戦1回）',en:'Deal ⚀ + cancel attack (1/fight)'}},
 reroll:{ja:'ふりなおし',en:'Reroll',rq:'any',reroll:1,col:'#8a8a9a',txt:{ja:'さいころを振りなおす',en:'Reroll a die'}}};
var POOL=['dagger','axe','bow','wand','potion','bump','split','spear','hammer','reroll','shield','sword'];
var FOES=[{k:'newt',ja:'ほのおイモリ',en:'Fire Newt',hp:18,a:[3,6]},{k:'moth',ja:'こおりガ',en:'Frost Moth',hp:20,a:[2,7],sh:3},{k:'rat',ja:'ゼンマイネズミ',en:'Clockwork Rat',hp:26,a:[4,7]},{k:'scorp',ja:'すなサソリ',en:'Sand Scorpion',hp:30,a:[4,9]},{k:'gum',ja:'グミゴーレム',en:'Gumdrop Golem',hp:38,a:[5,9],sh:5}];
var BOSS=[{k:'crow',ja:'ディーラーガラス',en:'Croupier Crow',hp:60,a:[6,11]},{k:'dragon',ja:'サイコロ竜',en:'Dice Dragon',hp:110,a:[8,14],sh:6}];
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR;
var state='title',t=0,P,foe,dice=[],gear=[],used={},sel=-1,floorN=1,nums=[],FX=[],shake=0,reward=null,swapPick=null,usedAd=false,games=0,rollT=0,busy=0;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function nm(o){return JA?o.ja:o.en;}
function ok(rq,v){return rq==='any'||(rq==='le3'&&v<=3)||(rq==='ge4'&&v>=4)||(rq==='even'&&v%2===0)||(rq==='odd'&&v%2===1)||(rq==='lt6'&&v<6)||(rq==='ge2'&&v>=2)||(rq==='six'&&v===6);}
function rqLabel(rq){return {any:'1-6',le3:'≤3',ge4:'≥4',even:JA?'偶数':'EVEN',odd:JA?'奇数':'ODD',lt6:'≤5',ge2:'≥2',six:'6'}[rq];}
function start(){P={hp:40,max:40,block:0,nd:3};gear=['sword','shield','dagger'];floorN=1;usedAd=false;startFight();state='play';}
function startFight(){var b=floorN===12?BOSS[1]:floorN===6?BOSS[0]:FOES[Math.min(FOES.length-1,Math.floor((floorN-1)/2.2)+(Math.random()<0.3?1:0))],sc=(floorN===6||floorN===12)?1:1+(floorN-1)*0.09;
  foe={b:b,hp:Math.round(b.hp*sc),max:Math.round(b.hp*sc),block:0,psn:0,stun:0,hit:0,sc:sc};once={};newIntent();startTurn();}
var once={};
function newIntent(){var a=foe.b.a,v=Math.round((a[0]+Math.floor(Math.random()*(a[1]-a[0]+1)))*(foe.b.hp>=60?1:1+(floorN-1)*0.04));foe.int={atk:v,sh:foe.b.sh&&Math.random()<0.35?foe.b.sh:0};}
function startTurn(){P.block=0;used={};sel=-1;dice=[];for(var i=0;i<P.nd;i++)dice.push({v:1+Math.floor(Math.random()*6),r:Math.random()*6});rollT=0.4;tone(300,0.08,'triangle',0.03,1.6);}
function dmgFoe(d){var b=Math.min(foe.block,d);foe.block-=b;d-=b;foe.hp-=d;foe.hit=0.25;nums.push({x:W/2+(Math.random()-0.5)*40,y:foeY(),v:'-'+d,c:'#ffd84a',l:1});shake=0.12;for(var k=0;k<8;k++)FX.push({x:W/2,y:foeY(),vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,l:0.4,c:'#fff'});tone(420+Math.random()*120,0.07,'square',0.05,0.6);}
function apply(gi,di){var id=gear[gi],G=GEAR[id],v=dice[di].v;if(used[gi]&&!G.reroll){tone(150,0.06,'square',0.03,0.8);return false;}if(G.once&&once[gi]){tone(150,0.06,'square',0.03,0.8);return false;}if(!ok(G.rq,v)){tone(150,0.06,'square',0.03,0.8);return false;}
  var val=function(expr){return expr==='v'?v:expr==='2v'?2*v:expr==='v+3'?v+3:expr==='v+2'?v+2:parseInt(expr,10);};
  if(G.reroll){if((used[gi]||0)>=2)return false;used[gi]=(used[gi]||0)+1;dice[di].v=1+Math.floor(Math.random()*6);dice[di].r=Math.random()*6;tone(500,0.06,'triangle',0.04,1.5);sel=-1;return true;}
  if(G.bump){dice[di].v=v+1;used[gi]=1;tone(700,0.06,'triangle',0.04,1.4);sel=-1;return true;}
  if(G.split){dice[di].v=Math.floor(v/2);dice.push({v:Math.ceil(v/2),r:Math.random()*6});used[gi]=1;tone(600,0.06,'triangle',0.04,1.2);sel=-1;return true;}
  used[gi]=1;if(G.once)once[gi]=1;dice.splice(di,1);sel=-1;
  if(G.d)dmgFoe(val(G.d));if(G.b){P.block+=val(G.b);tone(300,0.08,'triangle',0.04,1.5);}if(G.psn){foe.psn+=val(G.psn);tone(240,0.1,'sine',0.04,1.5);}if(G.heal){var h=val(G.heal);P.hp=Math.min(P.max,P.hp+h);nums.push({x:W*0.25,y:H*0.43,v:'+'+h,c:'#7aff9a',l:1});tone(880,0.1,'triangle',0.04,1.5);}if(G.stun){foe.stun=1;}
  if(foe.hp<=0){busy=0.8;setTimeout(winFight,600);}return true;}
function endTurn(){if(state!=='play'||busy>0)return;busy=1;sel=-1;setTimeout(function(){if(state!=='play')return;
    if(foe.psn>0){foe.hp-=foe.psn;nums.push({x:W/2,y:foeY()-20,v:'☠'+foe.psn,c:'#c87aff',l:1});foe.psn--;if(foe.hp<=0){setTimeout(winFight,400);return;}}
    foe.block=0;if(foe.stun){foe.stun=0;nums.push({x:W/2,y:foeY()-30,v:'⚡STUN',c:'#aaf',l:1});}else{var d=foe.int.atk,b=Math.min(P.block,d);d-=b;P.hp-=d;if(d>0){shake=0.3;nums.push({x:W*0.25,y:H*0.43,v:'-'+d,c:'#ff5a5a',l:1});tone(160,0.18,'square',0.07,0.6);}else tone(300,0.08,'triangle',0.04,1.5);foe.block=foe.int.sh;}
    if(P.hp<=0){P.hp=0;setTimeout(die,500);return;}newIntent();startTurn();busy=0;},400);}
function winFight(){if(state!=='play')return;busy=0;tone(660,0.1,'square',0.05,1.5);setTimeout(function(){tone(990,0.15,'square',0.05,1.3);},110);if(floorN>best){best=floorN;store.set('best',best);}
  if(floorN===12){state='won';games++;setTimeout(function(){$('endT').textContent=TX.win;$('endP').innerHTML=TX.floor+' 12';$('cont').hidden=true;$('end').hidden=false;},600);return;}
  P.hp=Math.min(P.max,P.hp+6);if(floorN===4||floorN===8)P.nd=Math.min(5,P.nd+1);var opts=POOL.filter(function(k){return gear.indexOf(k)<0;}).sort(function(){return Math.random()-0.5;}).slice(0,2);opts.push('heal');reward={opts:opts};swapPick=null;state='reward';}
function pickReward(i){if(state!=='reward')return;var o=reward.opts[i];if(o==='heal'){P.max+=4;P.hp=Math.min(P.max,P.hp+10);nextFloor();return;}if(gear.length<6){gear.push(o);nextFloor();return;}swapPick=o;}
function nextFloor(){reward=null;swapPick=null;floorN++;startFight();state='play';tone(800,0.08,'square',0.04,1.3);}
function die(){if(state!=='play')return;state='dead';games++;setTimeout(function(){var show=function(){$('endT').textContent=TX.dead;$('endP').innerHTML=TX.floor+' '+floorN+' · '+TX.best+' '+best;$('cont').hidden=!(CG&&!usedAd);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},500);}
$('play').onclick=function(){$('title').hidden=true;start();};
$('again').onclick=function(){$('end').hidden=true;start();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){usedAd=true;P.hp=P.max;$('end').hidden=true;state='play';busy=0;newIntent();startTurn();},function(){b.textContent=TX.na;});};
// layout
function foeY(){return Math.max(H*0.22,150);}
function diceRects(){var n=dice.length,s=Math.min(60,(W-40)/Math.max(3,n)-12),tot=n*s+(n-1)*12,x0=(W-tot)/2,y=H*0.47;return dice.map(function(_,i){return {x:x0+i*(s+12),y:y,w:s,h:s};});}
function gearRects(){var cols=W>560?3:2,gw=Math.min(200,(W-30-(cols-1)*10)/cols),gh=Math.min(92,(H*0.38)/Math.ceil(gear.length/cols)-10),tw=cols*gw+(cols-1)*10,x0=(W-tw)/2,y0=H*0.47+80;return gear.map(function(_,i){return {x:x0+(i%cols)*(gw+10),y:y0+Math.floor(i/cols)*(gh+10),w:gw,h:gh};});}
function endRect(){return {x:W-122,y:H*0.47-60,w:110,h:40};}
function rewardRects(){var w=Math.min(110,(W-40)/3),h=150,x0=(W-w*3-20)/2;return [0,1,2].map(function(i){return {x:x0+i*(w+10),y:H*0.36,w:w,h:h};});}
function inR(r,x,y){return x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;}
cv.addEventListener('pointerdown',function(e){e.preventDefault();var x=e.clientX,y=e.clientY;
  if(state==='reward'){if(swapPick){var gr=gearRects();for(var j=0;j<gr.length;j++)if(inR(gr[j],x,y)){gear[j]=swapPick;nextFloor();return;}return;}var rr2=rewardRects();for(var i=0;i<3;i++)if(inR(rr2[i],x,y)){pickReward(i);return;}return;}
  if(state!=='play'||busy>0)return;if(inR(endRect(),x,y)){endTurn();return;}
  var dr=diceRects();for(var d=0;d<dr.length;d++)if(inR(dr[d],x,y)){sel=sel===d?-1:d;tone(600,0.03,'triangle',0.03,1.2);return;}
  if(sel>=0){var gr2=gearRects();for(var k=0;k<gr2.length;k++)if(inR(gr2[k],x,y)){apply(k,sel);return;}}});
addEventListener('keydown',function(e){if(state==='play'&&(e.key==='e'||e.key==='Enter'))endTurn();});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play'||state==='reward';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok2){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok2){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- art ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0.1,r),0,7);g.fill();}
function E(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function eyes(x,y,s,c){C(x-s*0.28,y,s*0.14,'#fff');C(x+s*0.28,y,s*0.14,'#fff');C(x-s*0.26,y+s*0.02,s*0.07,c||'#1a1a2a');C(x+s*0.3,y+s*0.02,s*0.07,c||'#1a1a2a');}
function foeArt(k,x,y,s){var b=Math.sin(t*3)*s*0.04;y+=b;E(x,y+s*0.55,s*0.55,s*0.1,'rgba(0,0,0,.3)');
  if(k==='newt'){E(x,y+s*0.15,s*0.6,s*0.3,'#ff6a3a');C(x+s*0.45,y,s*0.28,'#ff7a4a');g.fillStyle='#ffd84a';for(var i=0;i<4;i++){g.beginPath();g.moveTo(x-s*0.4+i*s*0.22,y-s*0.08);g.lineTo(x-s*0.3+i*s*0.22,y-s*0.35-Math.sin(t*10+i)*s*0.06);g.lineTo(x-s*0.2+i*s*0.22,y-s*0.08);g.fill();}eyes(x+s*0.48,y-s*0.05,s*0.5);g.strokeStyle='#ff6a3a';g.lineWidth=s*0.12;g.beginPath();g.moveTo(x-s*0.55,y+s*0.2);g.quadraticCurveTo(x-s*0.9,y+s*0.1,x-s*0.85,y-s*0.2);g.stroke();}
