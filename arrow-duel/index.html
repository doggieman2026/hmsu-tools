<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arrow Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,700;0,900;1,900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#ffd8a0;color:#fff;font-family:"Rubik","M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(50,25,20,.7);text-align:center;padding:24px}
.over[hidden]{display:none}
.over h1{margin:0;font-size:clamp(56px,16vw,92px);line-height:.9;font-weight:900;font-style:italic;color:#ff8a3a;text-shadow:0 5px 0 #7a2a10,0 9px 20px rgba(0,0,0,.5)}
.over h1 small{display:block;font-size:.8em;color:#fff;text-shadow:0 5px 0 #7a2a10}
.over p{margin:0;max-width:350px;line-height:1.6;font-size:15px}
.btn{font:inherit;font-weight:900;font-size:22px;letter-spacing:1px;border:3px solid #fff;border-radius:18px;padding:13px 36px;background:linear-gradient(#ff9a4a,#e0502a);color:#fff;text-shadow:0 2px 0 #7a2a10;box-shadow:0 6px 0 #7a2a10;cursor:pointer;min-width:230px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a2a10}
.btn.sub{font-size:17px;background:linear-gradient(#7ae05a,#2aa03a);text-shadow:0 2px 0 #1a5a1a;box-shadow:0 5px 0 #1a5a1a}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="over" id="title"><h1>ARROW<small>DUEL</small></h1><p id="howto"></p><button class="btn" id="play" type="button">PLAY</button></div>
<div class="over" id="end" hidden><h1 id="endT" style="font-size:clamp(44px,12vw,72px)"></h1><p id="endP"></p><button class="btn sub" id="cont" type="button" hidden></button><button class="btn" id="again" type="button"></button></div>
<script>
"use strict";
var JA=(navigator.language||'').slice(0,2)==='ja';
var TX=JA?{how:'画面をドラッグして<b>うしろに引っぱり、はなすと矢を発射！</b><br>引く長さで強さ、向きで角度が決まるよ。<br>頭に当てると大ダメージ。風に気をつけて、何人勝ちぬけるかな？',play:'あそぶ',again:'もういちど',dead:'やられた！',cont:'▶ 広告を見て 復活',na:'広告を読み込めませんでした',best:'さいこう',wins:'勝ち',you:'あなた',turn:'あなたの番',foe:'相手の番',head:'ヘッドショット！',win:'勝利！',wind:'風'}
 :{how:'Drag on the screen to <b>pull back, release to shoot!</b><br>Pull length sets the power, direction sets the angle.<br>Headshots hit hard. Mind the wind — how many duels can you win?',play:'PLAY',again:'TRY AGAIN',dead:'Defeated!',cont:'▶ Watch ad: revive',na:'Ad not available',best:'Best',wins:'Wins',you:'You',turn:'Your turn',foe:'Enemy turn',head:'HEADSHOT!',win:'VICTORY!',wind:'Wind'};
var $=function(i){return document.getElementById(i);};
$('howto').innerHTML=TX.how;$('play').textContent=TX.play;$('again').textContent=TX.again;$('cont').textContent=TX.cont;
var store={get:function(k,f){try{var v=localStorage.getItem('ad-'+k);return v==null?f:JSON.parse(v);}catch(e){return f;}},set:function(k,v){try{localStorage.setItem('ad-'+k,JSON.stringify(v));}catch(e){}}};
var best=store.get('best',0);
var FOES=[{k:'bear',ja:'クマきこり',en:'Lumber Bear',body:'#c8503a'},{k:'penguin',ja:'ペンギン騎士',en:'Sir Penguin',body:'#3a5ac8'},{k:'raccoon',ja:'アライ盗賊',en:'Bandit Raccoon',body:'#5a5a6a'},{k:'panda',ja:'パンダ師範',en:'Panda Master',body:'#e8a03a'},{k:'wolf',ja:'オオカミ隊長',en:'Wolf Captain',body:'#7a3ab0'}];
var cv=$('cv'),g=cv.getContext('2d'),W,H,DPR,S;
var state='title',t=0,me,foe,arrows=[],stuck=[],FX=[],nums=[],turn='me',wins=0,level=0,wind=0,camX=0,camT=0,drag=null,used=false,games=0,banner=0,bannerTxt='',G2=600,waitT=0,shake=0,aiT=0;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(H/560,W/330);if(foe)S=Math.min(H/600,W/(foe.x-me.x+150));}
addEventListener('resize',fit);
var AC=null,MUTED=false;function tone(f,d,type,vol,slide){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain(),s=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(slide||1.4),s+d);v.gain.setValueAtTime(vol||0.04,s);v.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(v);v.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
function start(){wins=0;level=0;used=false;me={x:0,y:60+Math.random()*40,hp:100,max:100,ang:-0.5,face:1,hit:0};newFoe();state='play';}
function newFoe(){var f=FOES[level%FOES.length],D=440+Math.min(320,level*40)+Math.random()*80;foe={d:f,x:D,y:40+Math.random()*120,hp:100+level*10,max:100+level*10,ang:Math.PI+0.5,face:-1,hit:0,dead:0};arrows=[];stuck=[];wind=level<1?0:(Math.random()-0.5)*Math.min(200,40+level*25);turn='me';camT=0;camX=(me.x+foe.x)/2;fit();waitT=0;banner=1.4;bannerTxt=(JA?f.ja:f.en);}
function wx(x){return W*0.5+(x-camX)*S;}function wy(y){return H*0.8-y*S;}
function heads(c){return {x:c.x,y:c.y+68,r:14};}
function shoot(c,ang,pow,who){var v=260+pow*640;arrows.push({x:c.x+Math.cos(ang)*18,y:c.y+48+Math.sin(-ang)*0,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,who:who,l:6});c.ang=ang;tone(700,0.08,'triangle',0.05,0.5);}
function aiShoot(){var tx=me.x-foe.x,ty=(me.y+50)-(foe.y+48),v=260+0.8*640,gg=G2;
  // solve angle for velocity v, horizontal distance |tx| (to the left), height ty, ignoring wind then correct a little
  var dx=Math.abs(tx),disc=v*v*v*v-gg*(gg*dx*dx+2*ty*v*v),ang;if(disc<0){ang=Math.PI/4;v=Math.sqrt(gg*dx)*1.1;}else{ang=Math.atan((v*v-Math.sqrt(disc))/(gg*dx));}
  var err=Math.max(0.03,0.17-level*0.013);ang+=(Math.random()-0.5)*2*err;var a=Math.PI-ang;// shooting left
  var pow=(v-260)/640;pow*=1+(Math.random()-0.5)*err*0.8;shoot(foe,a,Math.max(0.1,Math.min(1,pow)),'foe');}
function update(dt){t+=dt;shake=Math.max(0,shake-dt);banner=Math.max(0,banner-dt);FX.forEach(function(f){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy-=500*dt;});FX=FX.filter(function(f){return f.l>0;});nums.forEach(function(n){n.l-=dt;n.y+=40*dt;});nums=nums.filter(function(n){return n.l>0;});
  if(!me)return;me.hit=Math.max(0,me.hit-dt);foe.hit=Math.max(0,foe.hit-dt);
  arrows.forEach(function(a){a.vx+=wind*dt;a.vy-=G2*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.l-=dt;var tgt=a.who==='me'?foe:me;
    var hd=heads(tgt);if(!tgt.dead&&Math.hypot(a.x-hd.x,a.y-hd.y)<hd.r+3){hit(tgt,a,true);return;}
    if(!tgt.dead&&Math.abs(a.x-tgt.x)<15&&a.y>tgt.y&&a.y<tgt.y+56){hit(tgt,a,false);return;}
    // pillars
    [me,foe].forEach(function(c){if(a.l>0&&Math.abs(a.x-c.x)<32&&a.y<c.y&&a.y>-40){a.l=0;stuck.push({x:a.x,y:a.y,ang:Math.atan2(a.vy,a.vx)});tone(220,0.05,'square',0.03,0.6);}});
    if(a.y<-20){a.l=0;stuck.push({x:a.x,y:-18,ang:Math.atan2(a.vy,a.vx)});tone(200,0.05,'square',0.03,0.6);}});
  var flying=arrows.filter(function(a){return a.l>0;});arrows=flying;
  // camera
  camX=(me.x+foe.x)/2;
  if(state!=='play')return;
  if(!flying.length&&waitT>0){waitT-=dt;if(waitT<=0){turn=turn==='me'?'foe':'me';aiT=turn==='foe'?0.9:0;}}
  if(turn==='foe'&&!flying.length&&waitT<=0){aiT-=dt;if(aiT<=0){aiShoot();waitT=0.7;aiT=99;}}}
function hit(c,a,head){a.l=0;var dmg=head?55:25+Math.round(Math.hypot(a.vx,a.vy)/90);if(a.who==='foe')dmg=Math.round(dmg*Math.min(1,0.55+level*0.05));c.hp-=dmg;c.hit=0.3;shake=head?0.3:0.15;stuck.push({x:a.x,y:a.y,ang:Math.atan2(a.vy,a.vx),on:c,ox:a.x-c.x,oy:a.y-c.y});
  nums.push({x:a.x,y:a.y+20,v:(head?TX.head+' ':'')+'-'+dmg,c:head?'#ffd84a':'#fff',l:1.2});for(var k=0;k<10;k++)FX.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*260,vy:Math.random()*220,l:0.5,c:'#e84a4a'});
  tone(head?900:400,0.12,'square',0.06,head?1.6:0.6);
  if(c.hp<=0){c.hp=0;c.dead=1;if(c===foe){state='won';wins++;if(wins>best){best=wins;store.set('best',best);}banner=1.5;bannerTxt=TX.win;tone(660,0.1,'square',0.05,1.5);setTimeout(function(){tone(990,0.15,'square',0.05,1.3);},120);
      setTimeout(function(){if(state!=='won')return;level++;me.hp=Math.min(me.max,me.hp+35);newFoe();state='play';},1900);}
    else{die();}}}
function die(){state='dead';games++;setTimeout(function(){var show=function(){$('endT').textContent=TX.dead;$('endP').innerHTML=TX.wins+' '+wins+' · '+TX.best+' '+best;$('cont').hidden=!(CG&&!used);$('cont').disabled=false;$('cont').textContent=TX.cont;$('end').hidden=false;};if(games%2===0)cgAd('midgame',show,show);else show();},1000);}
$('play').onclick=function(){$('title').hidden=true;start();};
$('again').onclick=function(){$('end').hidden=true;start();};
$('cont').onclick=function(){var b=this;b.disabled=true;cgAd('rewarded',function(){used=true;me.hp=me.max;me.dead=0;$('end').hidden=true;turn='me';waitT=0;state='play';},function(){b.textContent=TX.na;});};
function aimFrom(d){var dx=d.sx-d.x,dy=d.sy-d.y,len=Math.hypot(dx,dy);var ang=Math.atan2(-dy,dx);ang=Math.max(-1.2,Math.min(1.45,ang));return {ang:ang,pow:Math.max(0.05,Math.min(1,len/(170)))};}
function canAim(){return state==='play'&&turn==='me'&&!arrows.length&&waitT<=0;}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(!canAim())return;drag={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(drag){drag.x=e.clientX;drag.y=e.clientY;var a=aimFrom(drag);me.ang=a.ang;}});
cv.addEventListener('pointerup',function(e){if(!drag)return;var a=aimFrom(drag);drag=null;if(a.pow<0.12||!canAim())return;shoot(me,a.ang,a.pow,'me');waitT=0.7;});
cv.addEventListener('pointercancel',function(){drag=null;});
// ---- CrazyGames SDK ----
var CG=null,cgOn=null;
(function(){var h=location.hostname,q=location.search;if(!/crazygames/.test(h)&&q.indexOf('cg=1')<0&&q.indexOf('crazygames_sandbox')<0)return;var sc=document.createElement('script');sc.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';
  sc.onload=function(){var S0=window.CrazyGames&&window.CrazyGames.SDK;if(!S0)return;Promise.resolve(S0.init()).then(function(){CG=S0;cgOn=null;}).catch(function(){});};document.head.appendChild(sc);})();
function cgSync(){var on=state==='play'||state==='won';if(!CG||on===cgOn)return;cgOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function cgAd(kind,done,fail){if(!CG){if(fail)fail();return;}var st0=state,end=function(ok){MUTED=false;try{if(AC)AC.resume();}catch(e){}if(state==='ad')state=st0;if(ok){if(done)done();}else if(fail)fail();};
  try{CG.ad.requestAd(kind,{adStarted:function(){MUTED=true;try{if(AC)AC.suspend();}catch(e){}state='ad';},adFinished:function(){end(true);},adError:function(){end(false);}});}catch(e){end(false);}}
// ---- draw ----
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(0.1,r),0,7);g.fill();}
function E(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function headArt(k,x,y,s,f){// s = head radius px, f = facing
  var e=function(ex,col){C(x+ex*s,y-s*0.1,s*0.2,'#fff');C(x+(ex+0.06*f)*s,y-s*0.08,s*0.1,col||'#1a1a2a');};
  if(k==='fox'){g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(x-s*0.8,y-s*0.3);g.lineTo(x-s*0.6,y-s*1.25);g.lineTo(x-s*0.1,y-s*0.7);g.fill();g.beginPath();g.moveTo(x+s*0.8,y-s*0.3);g.lineTo(x+s*0.6,y-s*1.25);g.lineTo(x+s*0.1,y-s*0.7);g.fill();C(x,y,s,'#ff8a2a');E(x+f*s*0.35,y+s*0.35,s*0.55,s*0.4,'#fff4e0');C(x+f*s*0.85,y+s*0.25,s*0.13,'#2a1a1a');e(-0.32);e(0.32);}
  else if(k==='bear'){C(x-s*0.7,y-s*0.7,s*0.35,'#8a5a32');C(x+s*0.7,y-s*0.7,s*0.35,'#8a5a32');C(x,y,s,'#a86a3a');E(x+f*s*0.2,y+s*0.35,s*0.45,s*0.32,'#e8c898');C(x+f*s*0.3,y+s*0.22,s*0.12,'#2a1a1a');e(-0.35);e(0.35);g.fillStyle='#c8503a';g.fillRect(x-s,y-s*0.9,s*2,s*0.3);}
  else if(k==='penguin'){C(x,y,s,'#2a2a3a');E(x,y+s*0.15,s*0.7,s*0.7,'#fff');g.fillStyle='#ffb02a';g.beginPath();g.moveTo(x+f*s*0.2,y+s*0.1);g.lineTo(x+f*s*0.75,y+s*0.25);g.lineTo(x+f*s*0.2,y+s*0.38);g.fill();e(-0.3);e(0.3);g.fillStyle='#c8ccd8';g.beginPath();g.arc(x,y-s*0.2,s*1.02,Math.PI,0);g.fill();g.fillStyle='#e84a4a';g.fillRect(x-s*0.1,y-s*1.5,s*0.2,s*0.35);}
  else if(k==='raccoon'){C(x-s*0.65,y-s*0.75,s*0.3,'#5a5a6a');C(x+s*0.65,y-s*0.75,s*0.3,'#5a5a6a');C(x,y,s,'#8a8a9a');g.fillStyle='#2a2a3a';g.fillRect(x-s*0.8,y-s*0.3,s*1.6,s*0.4);E(x+f*s*0.2,y+s*0.45,s*0.4,s*0.28,'#e8e8f0');C(x+f*s*0.35,y+s*0.38,s*0.1,'#1a1a2a');C(x-s*0.32,y-s*0.1,s*0.15,'#fff');C(x+s*0.32,y-s*0.1,s*0.15,'#fff');}
  else if(k==='panda'){C(x-s*0.7,y-s*0.72,s*0.32,'#1a1a2a');C(x+s*0.7,y-s*0.72,s*0.32,'#1a1a2a');C(x,y,s,'#fff');E(x-s*0.35,y-s*0.08,s*0.25,s*0.3,'#1a1a2a');E(x+s*0.35,y-s*0.08,s*0.25,s*0.3,'#1a1a2a');C(x-s*0.32,y-s*0.1,s*0.1,'#fff');C(x+s*0.38,y-s*0.1,s*0.1,'#fff');C(x+f*s*0.1,y+s*0.35,s*0.12,'#1a1a2a');g.fillStyle='#e84a4a';g.fillRect(x-s,y-s*0.6,s*2,s*0.16);}
  else if(k==='wolf'){g.fillStyle='#6a6a8a';g.beginPath();g.moveTo(x-s*0.85,y-s*0.2);g.lineTo(x-s*0.55,y-s*1.3);g.lineTo(x-s*0.05,y-s*0.7);g.fill();g.beginPath();g.moveTo(x+s*0.85,y-s*0.2);g.lineTo(x+s*0.55,y-s*1.3);g.lineTo(x+s*0.05,y-s*0.7);g.fill();C(x,y,s,'#8a8aa8');E(x+f*s*0.4,y+s*0.3,s*0.55,s*0.32,'#c8c8d8');C(x+f*s*0.9,y+s*0.22,s*0.13,'#1a1a2a');e(-0.32,'#e8a01a');e(0.32,'#e8a01a');g.fillStyle='#2a2a4a';g.beginPath();g.moveTo(x-s*1.1,y-s*0.55);g.lineTo(x+s*1.1,y-s*0.55);g.lineTo(x+s*0.6,y-s*1.0);g.lineTo(x-s*0.6,y-s*1.0);g.fill();}}
function archer(c,kind,body){var x=wx(c.x),y=wy(c.y),s=S,f=c.face,dead=c.dead;g.save();if(dead){g.translate(x,y);g.rotate(-f*1.4);g.translate(-x,-y);}if(c.hit>0)g.translate((Math.random()-0.5)*6,0);
  // legs & body
  g.fillStyle='#3a2a2a';g.fillRect(x-9*s,y-22*s,7*s,22*s);g.fillRect(x+2*s,y-22*s,7*s,22*s);rr(x-15*s,y-56*s,30*s,38*s,10*s);g.fillStyle=body;g.fill();g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x-15*s,y-30*s,30*s,5*s);
  headArt(kind,x,y-70*s,15*s,f);
  // bow arm
  var a=c.ang,bx=x+Math.cos(a)*18*s,by=y-46*s-Math.sin(a)*18*s;g.strokeStyle=body;g.lineWidth=6*s;g.lineCap='round';g.beginPath();g.moveTo(x,y-46*s);g.lineTo(bx,by);g.stroke();
  g.save();g.translate(bx,by);g.rotate(-a);g.strokeStyle='#8a5a2a';g.lineWidth=3.5*s;g.beginPath();g.arc(-4*s,0,16*s,-1.25,1.25);g.stroke();var pull=c===me&&drag?aimFrom(drag).pow*12*s:0;g.strokeStyle='#fff';g.lineWidth=1.2*s;g.beginPath();g.moveTo(-4*s+16*s*Math.cos(-1.25),16*s*Math.sin(-1.25));g.lineTo(-4*s-pull,0);g.lineTo(-4*s+16*s*Math.cos(1.25),16*s*Math.sin(1.25));g.stroke();g.restore();
  g.restore();}
function pillar(c){var x=wx(c.x),top=wy(c.y),bot=wy(-60);g.fillStyle='#8a7a6a';g.fillRect(x-32*S,top,64*S,bot-top);g.fillStyle='#a8988a';g.fillRect(x-32*S,top,64*S,8*S);g.fillStyle='rgba(0,0,0,.12)';for(var yy=top+24*S;yy<bot;yy+=24*S)g.fillRect(x-32*S,yy,64*S,3*S);}
function arrowArt(x,y,ang){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle='#8a5a2a';g.fillRect(-26*S,-1.3*S,28*S,2.6*S);g.fillStyle='#c8ccd8';g.beginPath();g.moveTo(8*S,0);g.lineTo(1*S,-4*S);g.lineTo(1*S,4*S);g.fill();g.fillStyle='#e84a4a';g.beginPath();g.moveTo(-26*S,0);g.lineTo(-32*S,-5*S);g.lineTo(-20*S,0);g.lineTo(-32*S,5*S);g.fill();g.restore();}
function bar(x,y,w,v,max,col,name){g.fillStyle='rgba(0,0,0,.4)';rr(x,y,w,18,9);g.fill();g.fillStyle=col;rr(x,y,Math.max(18,w*Math.max(0,v)/max),18,9);g.fill();g.fillStyle='#fff';g.font="800 12px Rubik,'M PLUS Rounded 1c'";g.textAlign='center';g.fillText(name+'  '+Math.max(0,Math.ceil(v)),x+w/2,y+13);}
